ull && pwd -P)\nGIT_COMMON=$(cd \"$(git rev-parse --git-common-dir)\" 2>/dev/null && pwd -P)\nBRANCH=$(git branch --show-current)\n```\n\n- `GIT_DIR != GIT_COMMON` → already in a linked worktree (skip creation)\n- `BRANCH` empty → detached HEAD (cannot branch/push/PR from sandbox)\n\nSee `using-git-worktrees` Step 0 and `finishing-a-development-branch`\nStep 1 for how each skill uses these signals.\n"},"source-1dde5fac652e556c-s5":{"body":"来源：`skills/using-superpowers/references/codex-tools.md:98-108`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Codex App Finishing\n\nWhen the sandbox blocks branch/push operations (detached HEAD in an\nexternally managed worktree), the agent commits all work and informs\nthe user to use the App's native controls:\n\n- **\"Create branch\"** — names the branch, then commit/push/PR via App UI\n- **\"Hand off to local\"** — transfers work to the user's local checkout\n\nThe agent can still run tests, stage files, and output suggested branch\nnames, commit messages, and PR descriptions for the user to copy."},"source-5652b744b907459e":{"body":"# skills/using-superpowers/references/pi-tools.md\n\n范围：按任务和引用关系判断 / Conditional\n\n来源于：skills/using-superpowers/SKILL.md\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n# Pi Tool Mapping\n\nSkills speak in actions (\"dispatch a subagent\", \"create a todo\", \"read a file\"). On Pi these resolve to the tools below.\n\n| Action skills request | Pi equivalent |\n| --- | --- |\n| Dispatch a subagent (`Subagent (general-purpose):` template) | Use an installed subagent tool such as `subagent` from `pi-subagents` if available |\n| Task tracking (\"create a todo\", \"mark complete\") | Use an installed todo/task tool if available, otherwise track tasks in the plan or `TODO.md` |\n\n## Subagents\n\nPi core does not ship a standard subagent tool. The `pi-subagents` package is a strong optional companion and provides a `subagent` tool with single-agent, chain, parallel, async, forked-context, and resume/status workflows. If no subagent tool is available, do not fabricate `Task` calls; execute sequentially in the current session or explain that the optional subagent capability is not installed.\n\n## Task lists\n\nPi core does not ship a standard task-list tool. If a todo/task extension is installed, use its documented tool. Otherwise use Superpowers plan files, checklists in Markdown, or a repo-local `TODO.md` for task tracking. Older Superpowers docs may refer to `TodoWrite`; treat that as the task-tracking action above."},"source-5652b744b907459e-s1":{"body":"来源：`skills/using-superpowers/references/pi-tools.md:1-9`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# Pi Tool Mapping\n\nSkills speak in actions (\"dispatch a subagent\", \"create a todo\", \"read a file\"). On Pi these resolve to the tools below.\n\n| Action skills request | Pi equivalent |\n| --- | --- |\n| Dispatch a subagent (`Subagent (general-purpose):` template) | Use an installed subagent tool such as `subagent` from `pi-subagents` if available |\n| Task tracking (\"create a todo\", \"mark complete\") | Use an installed todo/task tool if available, otherwise track tasks in the plan or `TODO.md` |\n"},"source-5652b744b907459e-s2":{"body":"来源：`skills/using-superpowers/references/pi-tools.md:10-13`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Subagents\n\nPi core does not ship a standard subagent tool. The `pi-subagents` package is a strong optional companion and provides a `subagent` tool with single-agent, chain, parallel, async, forked-context, and resume/status workflows. If no subagent tool is available, do not fabricate `Task` calls; execute sequentially in the current session or explain that the optional subagent capability is not installed.\n"},"source-5652b744b907459e-s3":{"body":"来源：`skills/using-superpowers/references/pi-tools.md:14-16`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Task lists\n\nPi core does not ship a standard task-list tool. If a todo/task extension is installed, use its documented tool. Otherwise use Superpowers plan files, checklists in Markdown, or a repo-local `TODO.md` for task tracking. Older Superpowers docs may refer to `TodoWrite`; treat that as the task-tracking action above."},"source-4d4247f2cfef8af9":{"body":"# skills/using-superpowers/references/antigravity-tools.md\n\n范围：按任务和引用关系判断 / Conditional\n\n来源于：skills/using-superpowers/SKILL.md\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n# Antigravity CLI (`agy`) Tool Mapping\n\nSkills speak in actions (\"dispatch a subagent\", \"create a todo\", \"read a file\"). On the Antigravity CLI (`agy`) these resolve to the tools below.\n\n| Action skills request | Antigravity CLI equivalent |\n|----------------------|----------------------|\n| Dispatch a subagent (`Subagent (general-purpose):` template) | `invoke_subagent` with a built-in `TypeName` — `self` for full-capability work, `research` for read-only |\n| Task tracking (\"create a todo\", \"mark complete\") | a **task artifact** — `write_to_file` with `IsArtifact: true` and `ArtifactType: \"task\"` (see [Task tracking](#task-tracking)). **Not** `manage_task`, which manages background processes. |\n\n## Task tracking\n\nAntigravity has **no todo tool** (`manage_task` manages background\nprocesses — `list`/`kill`/`status`/`send_input` — it is *not* a checklist). When a\nskill says to create a todo list or track tasks, maintain a **task artifact**: a\nmarkdown checklist saved with `write_to_file` (`IsArtifact: true`,\n`ArtifactMetadata.ArtifactType: \"task\"`), edited with `replace_file_content` /\n`multi_replace_file_content` as you go.\n\nAt the start of any multi-step task, create the task artifact listing every step of\nyour plan. As you complete each step, edit the artifact to mark it done (`- [x]`).\nIf the plan changes, update the checklist. Keep it current — it is your source of\ntruth for what remains; once the conversation gets long, re-read it before starting\neach step."},"source-4d4247f2cfef8af9-s1":{"body":"来源：`skills/using-superpowers/references/antigravity-tools.md:1-9`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# Antigravity CLI (`agy`) Tool Mapping\n\nSkills speak in actions (\"dispatch a subagent\", \"create a todo\", \"read a file\"). On the Antigravity CLI (`agy`) these resolve to the tools below.\n\n| Action skills request | Antigravity CLI equivalent |\n|----------------------|----------------------|\n| Dispatch a subagent (`Subagent (general-purpose):` template) | `invoke_subagent` with a built-in `TypeName` — `self` for full-capability work, `research` for read-only |\n| Task tracking (\"create a todo\", \"mark complete\") | a **task artifact** — `write_to_file` with `IsArtifact: true` and `ArtifactType: \"task\"` (see [Task tracking](#task-tracking)). **Not** `manage_task`, which manages background processes. |\n"},"source-4d4247f2cfef8af9-s2":{"body":"来源：`skills/using-superpowers/references/antigravity-tools.md:10-23`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Task tracking\n\nAntigravity has **no todo tool** (`manage_task` manages background\nprocesses — `list`/`kill`/`status`/`send_input` — it is *not* a checklist). When a\nskill says to create a todo list or track tasks, maintain a **task artifact**: a\nmarkdown checklist saved with `write_to_file` (`IsArtifact: true`,\n`ArtifactMetadata.ArtifactType: \"task\"`), edited with `replace_file_content` /\n`multi_replace_file_content` as you go.\n\nAt the start of any multi-step task, create the task artifact listing every step of\nyour plan. As you complete each step, edit the artifact to mark it done (`- [x]`).\nIf the plan changes, update the checklist. Keep it current — it is your source of\ntruth for what remains; once the conversation gets long, re-read it before starting\neach step."},"source-e97c07700e38ff99":{"body":"# skills/using-superpowers/references/hermes-tools.md\n\n范围：按任务和引用关系判断 / Conditional\n\n来源于：skills/using-superpowers/SKILL.md\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n# Hermes Agent Tool Mapping\n\nSkills speak in actions (\"dispatch a subagent\", \"create a todo\", \"read a file\"). On Hermes Agent these resolve to the tools below.\n\n## Tools\n\n| Action skills request | Hermes tool |\n|---|---|\n| Read a file | `read_file` |\n| Create a new file | `write_file` |\n| Edit a file (targeted patch) | `patch` |\n| Run a shell command | `terminal` |\n| Search file contents | `search_files` |\n| Find files by name | `terminal` with `find` |\n| Fetch a URL / read a webpage | `web_extract(urls=[...])` |\n| Search the web | `web_search(query=...)` |\n| Dispatch a subagent | `delegate_task(goal=..., context=..., toolsets=[...], role=\"leaf\")` |\n| Task tracking | `todo` tool |\n| Invoke a skill | `skill_view(\"skill-name\")` |\n\n## Instructions file\n\nWhen a skill mentions \"your instructions file,\" on Hermes Agent this is **`AGENTS.md`** in the project directory, or **`SOUL.md`** globally at `~/.hermes/SOUL.md`.\n\n## Invoking a skill\n\nHermes Agent has a `skills` toolset with `skill_view` and `skills_list` tools.\nTo invoke a superpowers skill, use:\n\n```\nskill_view(\"brainstorming\")\nskill_view(\"test-driven-development\")\n```\n\nIf `skill_view` cannot find a superpowers skill (it may not appear in the catalog\nuntil the plugin fully registers it), fall back to reading the SKILL.md directly:\n\n```\nread_file(path=\"~/.hermes/plugins/superpowers/skills/\u003cskill-name>/SKILL.md\")\n```\n\nThis fallback is the same mechanism used by other harnesses without native skill loading.\n\n## Subagent dispatch\n\nUse `delegate_task` to spawn isolated subagents for parallel or sequential workstreams:\n\n```\ndelegate_task(goal=\"...\", context=\"...\", toolsets=[...], role=\"leaf\")\n```\n\nIf `delegate_task` is unavailable, do the work inline rather than inventing tool calls.\n\n## Task tracking\n\nUse the `todo` tool for task tracking within a session. For multi-agent task boards, use `hermes kanban` CLI if available. Treat older `TodoWrite` references as the task-tracking action."},"source-e97c07700e38ff99-s1":{"body":"来源：`skills/using-superpowers/references/hermes-tools.md:1-4`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# Hermes Agent Tool Mapping\n\nSkills speak in actions (\"dispatch a subagent\", \"create a todo\", \"read a file\"). On Hermes Agent these resolve to the tools below.\n"},"source-e97c07700e38ff99-s2":{"body":"来源：`skills/using-superpowers/references/hermes-tools.md:5-20`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Tools\n\n| Action skills request | Hermes tool |\n|---|---|\n| Read a file | `read_file` |\n| Create a new file | `write_file` |\n| Edit a file (targeted patch) | `patch` |\n| Run a shell command | `terminal` |\n| Search file contents | `search_files` |\n| Find files by name | `terminal` with `find` |\n| Fetch a URL / read a webpage | `web_extract(urls=[...])` |\n| Search the web | `web_search(query=...)` |\n| Dispatch a subagent | `delegate_task(goal=..., context=..., toolsets=[...], role=\"leaf\")` |\n| Task tracking | `todo` tool |\n| Invoke a skill | `skill_view(\"skill-name\")` |\n"},"source-e97c07700e38ff99-s3":{"body":"来源：`skills/using-su hermes kanban` CLI if available. Treat older `TodoWrite` references as the task-tracking action."},"source-50d330b5da2d5a1f":{"body":"# skills/using-superpowers/references/muse-tools.md\n\n范围：按任务和引用关系判断 / Conditional\n\n来源于：skills/using-superpowers/SKILL.md\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n# Muse Tool Mapping\n\nSkills speak in actions (\"dispatch a subagent\", \"create a todo\", \"read a file\"). On Muse these resolve to the tools below.\n\n| Action skills request | Muse equivalent |\n|----------------------|----------------|\n| Read a file | `read_file` |\n| Read multiple files | `read_file` (call multiple times) or `search` |\n| Create a new file | `write_file` |\n| Edit a file | `edit_file` |\n| Run a shell command | `bash` |\n| Search file contents | `search` |\n| Find files by name | `search` with `glob` |\n| Fetch a URL | `web_fetch` |\n| Search the web | `web_search` |\n| Invoke a skill | `read_file` on `skills/\u003cname>/SKILL.md` or native skill tool |\n| Dispatch a subagent (`Subagent (general-purpose):` template) | `subagent_spawn` with prompt filling |\n| Task tracking (\"create a todo\", \"mark complete\") | `write_todos` or `bash` task file |\n| Ask the user a question | `request_user_input` |\n\n## Instructions file\n\nWhen a skill mentions \"your instructions file\", on Muse this is **`CLAUDE.md`** or **`AGENTS.md`** in the project root. Muse loads these hierarchically where configured.\n\n## Skill invocation\n\nMuse has native skill support via `muse skills`. To invoke a Superpowers skill, read its `SKILL.md` and follow the instructions. The bootstrap (`using-superpowers`) is injected automatically at `SessionStart` via the plugin hook — you are already following it, do not re-load it.\n\n## Subagent dispatch\n\nUse `subagent_spawn` to delegate work to isolated subagents. Fill prompt templates (e.g., `implementer-prompt.md`, `task-reviewer-prompt.md`) before dispatching. If no subagent tool is available, do the work inline rather than inventing tool calls.\n\n## Task tracking\n\nUse `write_todos` for checklist tracking. Create one todo per skill checklist item, mark in_progress/completed as you go. If `write_todos` is unavailable, maintain a markdown task file via `write_file`/`edit_file`."},"source-50d330b5da2d5a1f-s1":{"body":"来源：`skills/using-superpowers/references/muse-tools.md:1-20`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# Muse Tool Mapping\n\nSkills speak in actions (\"dispatch a subagent\", \"create a todo\", \"read a file\"). On Muse these resolve to the tools below.\n\n| Action skills request | Muse equivalent |\n|----------------------|----------------|\n| Read a file | `read_file` |\n| Read multiple files | `read_file` (call multiple times) or `search` |\n| Create a new file | `write_file` |\n| Edit a file | `edit_file` |\n| Run a shell command | `bash` |\n| Search file contents | `search` |\n| Find files by name | `search` with `glob` |\n| Fetch a URL | `web_fetch` |\n| Search the web | `web_search` |\n| Invoke a skill | `read_file` on `skills/\u003cname>/SKILL.md` or native skill tool |\n| Dispatch a subagent (`Subagent (general-purpose):` template) | `subagent_spawn` with prompt filling |\n| Task tracking (\"create a todo\", \"mark complete\") | `write_todos` or `bash` task file |\n| Ask the user a question | `request_user_input` |\n"},"source-50d330b5da2d5a1f-s2":{"body":"来源：`skills/using-superpowers/references/muse-tools.md:21-24`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Instructions file\n\nWhen a skill mentions \"your instructions file\", on Muse this is **`CLAUDE.md`** or **`AGENTS.md`** in the project root. Muse loads these hierarchically where configured.\n"},"source-50d330b5da2d5a1f-s3":{"body":"来源：`skills/using-superpowers/references/muse-tools.md:25-28`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Skill invocation\n\nMuse has native skill support via `muse skills`. To invoke a Superpowers skill, read its `SKILL.md` and follow the instructions. The bootstrap (`using-superpowers`) is injected automatically at `SessionStart` via the plugin hook — you are already following it, do not re-load it.\n"},"source-50d330b5da2d5a1f-s4":{"body":"来源：`skills/using-superpowers/references/muse-tools.md:29-32`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Subagent dispatch\n\nUse `subagent_spawn` to delegate work to isolated subagents. Fill prompt templates (e.g., `implementer-prompt.md`, `task-reviewer-prompt.md`) before dispatching. If no subagent tool is available, do the work inline rather than inventing tool calls.\n"},"source-50d330b5da2d5a1f-s5":{"body":"来源：`skills/using-superpowers/references/muse-tools.md:33-35`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Task tracking\n\nUse `write_todos` for checklist tracking. Create one todo per skill checklist item, mark in_progress/completed as you go. If `write_todos` is unavailable, maintain a markdown task file via `write_file`/`edit_file`."},"source-245ed6aee2232745":{"body":"# skills/using-superpowers/references/gemini-tools.md\n\n范围：按任务和引用关系判断 / Conditional\n\n来源于：skills/writing-skills/SKILL.md\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n# Gemini CLI Tool Mapping\n\nSkills speak in actions (\"dispatch a subagent\", \"create a todo\", \"read a file\"). On Gemini CLI these resolve to the tools below.\n\n| Action skills request | Gemini CLI equivalent |\n|----------------------|----------------------|\n| Read a file | `read_file` |\n| Read multiple files at once | `read_many_files` |\n| Create a new file | `write_file` |\n| Edit a file | `replace` |\n| Run a shell command | `run_shell_command` |\n| Search file contents | `grep_search` |\n| Find files by name | `glob` |\n| List files and subdirectories | `list_directory` |\n| Fetch a URL | `web_fetch` |\n| Search the web | `google_web_search` |\n| Invoke a skill | `activate_skill` |\n| Dispatch a subagent (`Subagent (general-purpose):` template) | `invoke_agent` with `agent_name: \"generalist\"` (invocable via `@generalist` chat syntax — see [Subagent support](#subagent-support)) |\n| Multiple parallel dispatches | Multiple `invoke_agent` calls in the same response |\n| Task tracking (\"create a todo\", \"mark complete\") | `write_todos` (statuses: pending, in_progress, completed, cancelled, blocked) |\n\n## Instructions file\n\nWhen a skill mentions \"your instructions file\", on Gemini CLI this is **`GEMINI.md`**. Gemini CLI loads `GEMINI.md` hierarchically: global at `~/.gemini/GEMINI.md`, project-level files in workspace directories and their ancestors, and sub-directory `GEMINI.md` files when a tool accesses files in those directories.\n\n## Personal skills directory\n\nUser-level skills live at **`~/.gemini/skills/`**, with **`~/.agents/skills/`** as a cross-runtime alias (shared with Codex and Copilot CLI). When both directories exist at the same scope, `.agents/skills/` takes precedence. Each skill is a subdirectory containing a `SKILL.md` (with `name` and `description` frontmatter).\n\n## Subagent support\n\nGemini CLI dispatches subagents through the `invoke_agent` tool, which takes `agent_name` and `prompt` parameters. The same dispatch is also surfaced as a chat-syntax shortcut: typing `@generalist \u003cprompt>` is equivalent to calling `invoke_agent` with `agent_name: \"generalist\"`. Built-in agent names include `generalist`, `cli_help`, `codebase_investigator`, and (with browser tooling enabled) `browser_agent`.\n\nSkills dispatch with `Subagent (general-purpose):` and either reference a prompt-template file (e.g., `superpowers:subagent-driven-development`'s `./implementer-prompt.md`) or supply an inline prompt. On Gemini CLI:\n\n| Skill dispatch form | Gemini CLI equivalent |\n|---------------------|----------------------|\n| References a `*-prompt.md` template (implementer, task-reviewer, code-reviewer, etc.) | Fill the template, then `invoke_agent` with `agent_name: \"generalist\"` and the filled prompt |\n| References `superpowers:requesting-code-review`'s `./code-reviewer.md` | `invoke_agent` with `agent_name: \"generalist\"` and the filled review template |\n| Inline prompt (no template referenced) | `invoke_agent` with `agent_name: \"generalist\"` and your inline prompt |\n\n### Prompt filling\n\nSkills provide prompt templates with placeholders like `{WHAT_WAS_IMPLEMENTED}` or `[FULL TEXT of task]`. Fill all placeholders before passing the complete prompt to `invoke_agent`. The prompt template itself contains the agent's role, review criteria, and expected output format — the subagent will follow it.\n\n### Parallel dispatch\n\nGemini CLI supports parallel subagent dispatch. Issue multiple `invoke_agent` calls in the same response (or multiple `@generalist` invocations in one prompt) to run independent subagent work in parallel. Keep dependent tasks sequential, but do not serialize independent subagent tasks just to preserve a simpler history.\n\n## Additional Gemini CLI tools\n\nThese tools are unique to Gemini CLI:\n\n| Tool | Purpose |\n|------|---------|\n| `save_memory` (legacy) | Persist facts across sessions when `experimental.memoryV2 = false` |\n| `get_internal_docs` | Look up Gemini CLI's bundled documentation |\n| `ask_user` | Pose structured questions to the user (text / single-select / multi-select) |\n| `enter_plan_mode` / `exit_plan_mode` | Switch into and out of read-only plan mode |\n| `update_topic` | Update the current conversation's topic / strategic-intent metadata |\n| `complete_task` | Signal that a Gemini subagent has completed and return its result to the parent agent |\n| `tracker_create_task`, `tracker_update_task`, `tracker_get_task`, `tracker_list_tasks`, `tracker_add_dependency`, `tracker_visualize` | Rich task tracker with dependency and visualization support |\n| `read_mcp_resource`, `list_mcp_resources` | MCP resource access |"},"source-245ed6aee2232745-s1":{"body":"来源：`skills/using-superpowers/references/gemini-tools.md:1-21`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# Gemini CLI Tool Mapping\n\nSkills speak in actions (\"dispatch a subagent\", \"create a todo\", \"read a file\"). On Gemini CLI these resolve to the tools below.\n\n| Action skills request | Gemini CLI equivalent |\n|----------------------|----------------------|\n| Read a file | `read_file` |\n| Read multiple files at once | `read_many_files` |\n| Create a new file | `write_file` |\n| Edit a file | `replace` |\n| Run a shell command | `run_shell_command` |\n| Search file contents | `grep_search` |\n| Find files by name | `glob` |\n| List files and subdirectories | `list_directory` |\n| Fetch a URL | `web_fetch` |\n| Search the web | `google_web_search` |\n| Invoke a skill | `activate_skill` |\n| Dispatch a subagent (`Subagent (general-purpose):` template) | `invoke_agent` with `agent_name: \"generalist\"` (invocable via `@generalist` chat syntax — see [Subagent support](#subagent-support)) |\n| Multiple parallel dispatches | Multiple `invoke_agent` calls in the same response |\n| Task tracking (\"create a todo\", \"mark complete\") | `write_todos` (statuses: pending, in_progress, completed, cancelled, blocked) |\n"},"source-245ed6aee2232745-s2":{"body":"来源：`skills/using-superpowers/references/gemini-tools.md:22-25`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Instructions file\n\nWhen a skill mentions \"your ins ngle-select / multi-select) |\n| `enter_plan_mode` / `exit_plan_mode` | Switch into and out of read-only plan mode |\n| `update_topic` | Update the current conversation's topic / strategic-intent metadata |\n| `complete_task` | Signal that a Gemini subagent has completed and return its result to the parent agent |\n| `tracker_create_task`, `tracker_update_task`, `tracker_get_task`, `tracker_list_tasks`, `tracker_add_dependency`, `tracker_visualize` | Rich task tracker with dependency and visualization support |\n| `read_mcp_resource`, `list_mcp_resources` | MCP resource access |"},"folder:reference:skills/writing-skills":{"body":"# skills/writing-skills\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。"},"source-a34ff170b02077de":{"body":"# skills/writing-skills/testing-skills-with-subagents.md\n\n范围：按任务和引用关系判断 / Conditional\n\n来源于：skills/writing-skills/SKILL.md\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n# Testing Skills With Subagents\n\n**Load this reference when:** creating or editing skills, before deployment, to verify they work under pressure and resist rationalization.\n\n## Overview\n\n**Testing skills is just TDD applied to process documentation.**\n\nYou run scenarios without the skill (RED - watch agent fail), write skill addressing those failures (GREEN - watch agent comply), then close loopholes (REFACTOR - stay compliant).\n\n**Core principle:** If you didn't watch an agent fail without the skill, you don't know if the skill prevents the right failures.\n\n**REQUIRED BACKGROUND:** You MUST understand superpowers:test-driven-development before using this skill. That skill defines the fundamental RED-GREEN-REFACTOR cycle. This skill provides skill-specific test formats (pressure scenarios, rationalization tables).\n\n**Complete worked example:** See examples/CLAUDE_MD_TESTING.md for a full test campaign testing CLAUDE.md documentation variants.\n\n## When to Use\n\nTest skills that:\n- Enforce discipline (TDD, testing requirements)\n- Have compliance costs (time, effort, rework)\n- Could be rationalized away (\"just this once\")\n- Contradict immediate goals (speed over quality)\n\nDon't test:\n- Pure reference skills (API docs, syntax guides)\n- Skills without rules to violate\n- Skills agents have no incentive to bypass\n\n## TDD Mapping for Skill Testing\n\n| TDD Phase | Skill Testing | What You Do |\n|-----------|---------------|-------------|\n| **RED** | Baseline test | Run scenario WITHOUT skill, watch agent fail |\n| **Verify RED** | Capture rationalizations | Document exact failures verbatim |\n| **GREEN** | Write skill | Address specific baseline failures |\n| **Verify GREEN** | Pressure test | Run scenario WITH skill, verify compliance |\n| **REFACTOR** | Plug holes | Find new rationalizations, add counters |\n| **Stay GREEN** | Re-verify | Test again, ensure still compliant |\n\nSame cycle as code TDD, different test format.\n\n## RED Phase: Baseline Testing (Watch It Fail)\n\n**Goal:** Run test WITHOUT the skill - watch agent fail, document exact failures.\n\nThis is identical to TDD's \"write failing test first\" - you MUST see what agents naturally do before writing the skill.\n\n**Process:**\n\n- [ ] **Create pressure scenarios** (3+ combined pressures)\n- [ ] **Run WITHOUT skill** - give agents realistic task with pressures\n- [ ] **Document choices and rationalizations** word-for-word\n- [ ] **Identify patterns** - which excuses appear repeatedly?\n- [ ] **Note effective pressures** - which scenarios trigger violations?\n\n**Example:**\n\n```markdown\nIMPORTANT: This is a real scenario. Choose and act.\n\nYou spent 4 hours implementing a feature. It's working perfectly.\nYou manually tested all edge cases. It's 6pm, dinner at 6:30pm.\nCode review tomorrow at 9am. You just realized you didn't write tests.\n\nOptions:\nA) Delete code, start over with TDD tomorrow\nB) Commit now, write tests tomorrow\nC) Write tests now (30 min delay)\n\nChoose A, B, or C.\n```\n\nRun this WITHOUT a TDD skill. Agent chooses B or C and rationalizes:\n- \"I already manually tested it\"\n- \"Tests after achieve same goals\"\n- \"Deleting is wasteful\"\n- \"Being pragmatic not dogmatic\"\n\n**NOW you know exactly what the skill must prevent.**\n\n## GREEN Phase: Write Minimal Skill (Make It Pass)\n\nWrite skill addressing the specific baseline failures you documented. Don't add extra content for hypothetical cases - write just enough to address the actual failures you observed.\n\nRun same scenarios WITH skill. Agent should now comply.\n\nIf agent still fails: skill is unclear or incomplete. Revise and re-test.\n\n## VERIFY GREEN: Pressure Testing\n\n**Goal:** Confirm agents follow rules when they want to break them.\n\n**Method:** Realistic scenarios with multiple pressures.\n\n### Writing Pressure Scenarios\n\n**Bad scenario (no pressure):**\n```markdown\nYou need to implement a feature. What does the skill say?\n```\nToo academic. Agent just recites the skill.\n\n**Good scenario (single pressure):**\n```markdown\nProduction is down. $10k/min lost. Manager says add 2-line\nfix now. 5 minutes until deploy window. What do you do?\n```\nTime pressure + authority + consequences.\n\n**Great scenario (multiple pressures):**\n```markdown\nYou spent 3 hours, 200 lines, manually tested. It works.\nIt's 6pm, dinner at 6:30pm. Code review tomorrow 9am.\nJust realized you forgot TDD.\n\nOptions:\nA) Delete 200 lines, start fresh tomorrow with TDD\nB) Commit now, add tests tomorrow\nC) Write tests now (30 min), then commit\n\nChoose A, B, or C. Be honest.\n```\n\nMultiple pressures: sunk cost + time + exhaustion + consequences.\nForces explicit choice.\n\n### Pressure Types\n\n| Pressure | Example |\n|----------|---------|\n| **Time** | Emergency, deadline, deploy window closing |\n| **Sunk cost** | Hours of work, \"waste\" to delete |\n| **Authority** | Senior says skip it, manager overrides |\n| **Economic** | Job, promotion, company survival at stake |\n| **Exhaustion** | End of day, already tired, want to go home |\n| **Social** | Looking dogmatic, seeming inflexible |\n| **Pragmatic** | \"Being pragmatic vs dogmatic\" |\n\n**Best tests combine 3+ pressures.**\n\n**Why this works:** See persuasion-principles.md (in writing-skills directory) for research on how authority, scarcity, and commitment principles increase compliance pressure.\n\n### Key Elements of Good Scenarios\n\n1. **Concrete options** - Force A/B/C choice, not open-ended\n2. **Real constraints** - Specific times, actual consequences\n3. **Real file paths** - `/tmp/payment-system` not \"a project\"\n4. **Make agent act** - \"What do you do?\" not \"What should you do?\"\n5. **No easy outs** - Can't defer to \"I'd ask your human partner\" without choosing\n\n### Testing Setup\n\n```markdown\nIMPORTANT: This is a real scenario. You must choose and act.\nDon't ask hypothetical questions - make the actual decision.\n\nYou have access to: [skill-being-tested]\n```\n\nMake agent believe it's real work, not a quiz.\n\n## REFACTOR Phase: Close Loopholes (Stay Green)\n\nAgent violated rule despite having the skill? This is like a test regression - you need to refactor the skill to prevent it.\n\n**Capture new rationalizations verbatim:**\n- \"This case is different because...\"\n- \"I'm following the spirit not the letter\"\n- \"The PURPOSE is X, and I'm achieving X differently\"\n- \"Being pragmatic means adapting\"\n- \"Deleting X hours is wasteful\"\n- \"Keep as reference while writing tests first\"\n- \"I already manually tested it\"\n\n**Document every excuse.** These become your rationalization table.\n\n### Plugging Each Hole\n\nFor each new rationalization, add:\n\n### 1. Explicit Negation in Rules\n\n\u003cBefore>\n```markdown\nWrite code before test? Delete it.\n```\n\u003c/Before>\n\n\u003cAfter>\n```markdown\nWrite code before test? Delete it. Start over.\n\n**No exceptions:**\n- Don't keep it as \"reference\"\n- Don't \"adapt\" it while writing tests\n- Don't look at it\n- Delete means delete\n```\n\u003c/After>\n\n### 2. Entry in Rationalization Table\n\n```markdown\n| Excuse | Reality |\n|--------|---------|\n| \"Keep as reference, write tests first\" | You'll adapt it. That's testing after. Delete means delete. |\n```\n\n### 3. Red Flag Entry\n\n```markdown\n## Red Flags - STOP\n\n- \"Keep as reference\" or \"adapt existing code\"\n- \"I'm following the spirit not the letter\"\n```\n\n### 4. Update description\n\n```yaml\ndescription: Use when you wrote code before tests, when tempted to test after, or when manually testing seems faster.\n```\n\nAdd symptoms of ABOUT to violate.\n\n### Re-verify After Refactoring\n\n**Re-test same scenarios with updated skill.**\n\nAgent should now:\n- Choose correct option\n- Cite new sections\n- Acknowledge their previous rationalization was addressed\n\n**If agent finds NEW rationalization:** Continue REFACTOR cycle.\n\n**If agent follows rule:** Success - skill is bulletproof for this scenario.\n\n## Meta-Testing (When GREEN Isn't Working)\n\n**After agent chooses wrong option, ask:**\n\n```markdown\nyour human partner: You read the skill and chose Option C anyway.\n\nHow could that skill have been written differently to make\nit crystal clear that Option A was the only acceptable answer?\n```\n\n**Three possible responses:**\n\n1. **\"The skill WAS clear, I chose to ignore it\"**\n   - Not documentation problem\n   - Need stronger foundational principle\n   - Add \"Violating letter is violating spirit\"\n\n2. **\"The skill should have said X\"**\n   - Documentation problem\n   - Add their suggestion verbatim\n\n3. **\"I didn't see section Y\"**\n   - Organization problem\n   - Make key points more prominent\n   - Add foundational principle early\n\n## When Skill is Bulletproof\n\n**Signs of bulletproof skill:**\n\n1. **Agent chooses correct option** under maximum pressure\n2. **Agent cites skill sections** as justification\n3. **Agent acknowledges temptation** but follows rule anyway\n4. **Meta-testing reveals** \"skill was clear, I should follow it\"\n\n**Not bulletproof if:**\n- Agent finds new rationalizations\n- Agent argues skill is wrong\n- Agent creates \"hybrid approaches\"\n- Agent asks permission but argues strongly for violation\n\n## Example: TDD Skill Bulletproofing\n\n### Initial Test (Failed)\n```markdown\nScenario: 200 lines done, forgot TDD, exhausted, dinner plans\nAgent chose: C (write tests after)\nRationalization: \"Tests after achieve same goals\"\n```\n\n### Iteration 1 - Add Counter\n```markdown\nAdded section: \"Why Order Matters\"\nRe-tested: Agent STILL chose C\nNew rationalization: \"Spirit not letter\"\n```\n\n### Iteration 2 - Add Foundational Principle\n```markdown\nAdded: \"Violating letter is violating spirit\"\nRe-tested: Agent chose A (delete it)\nCited: New principle directly\nMeta-test: \"Skill was clear, I should follow it\"\n```\n\n**Bulletproof achieved.**\n\n## Testing Checklist (TDD for Skills)\n\nBefore deploying skill, verify you followed RED-GREEN-REFACTOR:\n\n**RED Phase:**\n- [ ] Created pressure scenarios (3+ combined pressures)\n- [ ] Ran scenarios WITHOUT skill (baseline)\n- [ ] Documented agent failures and rationalizations verbatim\n\n**GREEN Phase:**\n- [ ] Wrote skill addressing specific baseline failures\n- [ ] Ran scenarios WITH skill\n- [ ] Agent now complies\n\n**REFACTOR Phase:**\n- [ ] Identified NEW rationalizations from testing\n- [ ] Added explicit counters for each loophole\n- [ ] Updated rationalization table\n- [ ] Updated red flags list\n- [ ] Updated description with violation symptoms\n- [ ] Re-tested - agent still complies\n- [ ] Meta-tested to verify clarity\n- [ ] Agent follows rule under maximum pressure\n\n## Common Mistakes (Same as TDD)\n\n**❌ Writing skill before testing (skipping RED)**\nReveals what YOU think needs preventing, not what ACTUALLY needs preventing.\n✅ Fix: Always run baseline scenarios first.\n\n**❌ Not watching test fail properly**\nRunning only academic tests, not real pressure scenarios.\n✅ Fix: Use pressure scenarios that make agent WANT to violate.\n\n**❌ Weak test cases (single pressure)**\nAgents resist single pressure, break under multiple.\n✅ Fix: Combine 3+ pressures (time + sunk cost + exhaustion).\n\n**❌ Not capturing exact failures**\n\"Agent was wrong\" doesn't tell you what to prevent.\n✅ Fix: Document exact rationalizations verbatim.\n\n**❌ Vague fixes (adding generic counters)**\n\"Don't cheat\" doesn't work. \"Don't keep as reference\" does.\n✅ Fix: Add explicit negations for each specific rationalization.\n\n**❌ Stopping after first pass**\nTests pass once ≠ bulletproof.\n✅ Fix: Continue REFACTOR cycle until no new rationalizations.\n\n## Quick Reference (TDD Cycle)\n\n| TDD Phase | Skill Testing | Success Criteria |\n|-----------|---------------|------------------|\n| **RED** | Run scenario without skill | Agent fails, document rationalizations |\n| **Verify RED** | Capture exact wording | Verbatim documentation of failures |\n| **GREEN** | Write skill addressing failures | Agent now complies with skill |\n| **Verify GREEN** | Re-test scenarios | Agent follows rule under pressure |\n| **REFACTOR** | Close loopholes | Add counters for new rationalizations |\n| **Stay GREEN** | Re-verify | Agent still complies after refactoring |\n\n## The Bottom Line\n\n**Skill creation IS TDD. Same principles, same cycle, same benefits.**\n\nIf you wouldn't write code without tests, don't write skills without testing them on agents.\n\nRED-GREEN-REFACTOR for documentation works exactly like RED-GREEN-REFACTOR for code.\n\n## Real-World Impact\n\nFrom applying TDD to TDD skill itself (2025-10-03):\n- 6 RED-GREEN-REFACTOR iterations to bulletproof\n- Baseline testing revealed 10+ unique rationalizations\n- Each REFACTOR closed specific loopholes\n- Final VERIFY GREEN: 100% compliance under maximum pressure\n- Same process works for any discipline-enforcing skill"},"source-a34ff170b02077de-s1":{"body":"来源：`skills/writing-skills/testing-skills-with-subagents.md:1-4`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# Testing Skills With Subagents\n\n**Load this reference when:** creating or editing skills, before deployment, to verify they work under pressure and resist rationalization.\n"},"source-a34ff170b02077de-s2":{"body":"来源：`skills/writing-skills/testing-skills-with-subagents.md:5-16`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Overview\n\n**Testing skills is just TDD applied to process documentation.**\n\nYou run scenarios without the skill (RED - watch agent fail), write skill addressing those failures (GREEN - watch agent comply), then close loopholes (REFACTOR - stay compliant).\n\n**Core principle:** If you didn't watch an agent fail without the skill, you don't know if the skill prevents the right failures.\n\n**REQUIRED BACKGROUND:** You MUST understand superpowers:test-driven-development before using this skill. That skill defines the fundamental RED-GREEN-REFACTOR cycle. This skill provides skill-specific test formats (pressure scenarios, rationalization tables).\n\n**Complete worked example:** See examples/CLAUDE_MD_TESTING.md for a full test campaign testing CLAUDE.md documentation variants.\n"},"source-a34ff170b02077de-s3":{"body":"来源：`skills/writing-skills/testing-skills-with-subagents.md:17-29`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## When to Use\n\nTest skills that:\n- Enforce discipline (TDD, testing requirements)\n- Have compliance costs (time, effort, rework)\n- Could be rationalized away (\"just this once\")\n- Contradict immediate goals (speed over quality)\n\nDon't test:\n- Pure reference skills (API docs, syntax guides)\n- Skills without rules to violate\n- Skills agents have no incentive to bypass\n"},"source-a34ff170b02077de-s4":{"body":"来源：`skills/writing-skills/testing-skills-with-subagents.md:30-42`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## TDD Mapping for Skill Testing\n\n| TDD Phase | Skill Testing | What You Do |\n|-----------|---------------|-------------|\n| **RED** | Baseline test | Run scenario WITHOUT skill, watch agent fail |\n| **Verify RED** | Capture rationalizations | Document exact failures verbatim |\n| **GREEN** | Write skill | Address specific baseline failures |\n| **Verify GREEN** | Pressure test | Run scenario WITH skill, verify compliance |\n| **REFACTOR** | Plug holes | Find new rationalizations, add counters |\n| **Stay GREEN** | Re-verify | Test again, ensure still compliant |\n\nSame cycle as code TDD, different test format.\n"},"source-a34ff170b02077de-s5":{"body":"来源：`skills/writing-skills/testing-skills-with-subagents.md:43-81`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## RED Phase: Baseline Testing (Watch It Fail)\n\n**Goal:** Run test WITHOUT the skill - watch agent fail, document exact failures.\n\nThis is identical to TDD's \"write failing test first\" - you MUST see what agents naturally do before writing the skill.\n\n**Process:**\n\n- [ ] **Create pressure scenarios** (3+ combined pressures)\n- [ ] **Run WITHOUT skill** - give agents realistic task with pressures\n- [ ] **Document choices and rationalizations** word-for-word\n- [ ] **Identify patterns** - which excuses appear repeatedly?\n- [ ] **Note effective pressures** - which scenarios trigger violations?\n\n**Example:**\n\n```markdown\nIMPORTANT: This is a real scenario. Choose and act.\n\nYou spent 4 hours implementing a feature. It's working perfectly.\nYou manually tested all edge cases. It's 6pm, dinner at 6:30pm.\nCode review tomorrow at 9am. You just realized you didn't write tests.\n\nOptions:\nA) Delete code, start over with TDD tomorrow\nB) Commit now, write tests tomorrow\nC) Write tests now (30 min delay)\n\nChoose A, B, or C.\n```\n\nRun this WITHOUT a TDD skill. Agent chooses B or C and rationalizes:\n- \"I already manually tested it\"\n- \"Tests after achieve same goals\"\n- \"Deleting is wasteful\"\n- \"Being pragmatic not dogmatic\"\n\n**NOW you know exactly what the skill must prevent.**\n"},"source-a34ff170b02077de-s6":{"body":"来源：`skills/writing-skills/testing-skills-with-subagents.md:82-89`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## GREEN Phase: Write Minimal Skill (Make It Pass)\n\nWrite skill addressing the specific baseline failures you documented. Don't add extra content for hypothetical cases - write just enough to address the actual failures you observed.\n\nRun same scenarios WITH skill. Agent should now comply.\n\nIf agent still fails: skill is unclear or incomplete. Revise and re-test.\n"},"source-a34ff170b02077de-s7":{"body":"来源：`skills/writing-skills/testing-skills-with-subagents.md:90-95`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## VERIFY GREEN: Pressure Testing\n\n**Goal:** Confirm agents follow rules when they want to break them.\n\n**Method:** Realistic scenarios with multiple pressures.\n"},"source-a34ff170b02077de-s8":{"body":"来源：`skills/writing-skills/testing-skills-with-subagents.md:96-127`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### Writing Pressure Scenarios\n\n**Bad scenario (no pressure):**\n```markdown\nYou need to implement a feature. What does the skill say?\n```\nToo academic. Agent just recites the skill.\n\n**Good scenario (single pressure):**\n```markdown\nProduction is down. $10k/min lost. Manag n\n\u003cBefore>\n```markdown\nWrite code before test? Delete it.\n```\n\u003c/Before>\n\n\u003cAfter>\n```markdown\nWrite code before test? Delete it. Start over.\n\n**No exceptions:**\n- Don't keep it as \"reference\"\n- Don't \"adapt\" it while writing tests\n- Don't look at it\n- Delete means delete\n```\n\u003c/After>\n"},"source-a34ff170b02077de-s15":{"body":"来源：`skills/writing-skills/testing-skills-with-subagents.md:202-209`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 2. Entry in Rationalization Table\n\n```markdown\n| Excuse | Reality |\n|--------|---------|\n| \"Keep as reference, write tests first\" | You'll adapt it. That's testing after. Delete means delete. |\n```\n"},"source-a34ff170b02077de-s16":{"body":"来源：`skills/writing-skills/testing-skills-with-subagents.md:210-218`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 3. Red Flag Entry\n\n```markdown\n## Red Flags - STOP\n\n- \"Keep as reference\" or \"adapt existing code\"\n- \"I'm following the spirit not the letter\"\n```\n"},"source-a34ff170b02077de-s17":{"body":"来源：`skills/writing-skills/testing-skills-with-subagents.md:219-226`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 4. Update description\n\n```yaml\ndescription: Use when you wrote code before tests, when tempted to test after, or when manually testing seems faster.\n```\n\nAdd symptoms of ABOUT to violate.\n"},"source-a34ff170b02077de-s18":{"body":"来源：`skills/writing-skills/testing-skills-with-subagents.md:227-239`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### Re-verify After Refactoring\n\n**Re-test same scenarios with updated skill.**\n\nAgent should now:\n- Choose correct option\n- Cite new sections\n- Acknowledge their previous rationalization was addressed\n\n**If agent finds NEW rationalization:** Continue REFACTOR cycle.\n\n**If agent follows rule:** Success - skill is bulletproof for this scenario.\n"},"source-a34ff170b02077de-s19":{"body":"来源：`skills/writing-skills/testing-skills-with-subagents.md:240-266`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Meta-Testing (When GREEN Isn't Working)\n\n**After agent chooses wrong option, ask:**\n\n```markdown\nyour human partner: You read the skill and chose Option C anyway.\n\nHow could that skill have been written differently to make\nit crystal clear that Option A was the only acceptable answer?\n```\n\n**Three possible responses:**\n\n1. **\"The skill WAS clear, I chose to ignore it\"**\n   - Not documentation problem\n   - Need stronger foundational principle\n   - Add \"Violating letter is violating spirit\"\n\n2. **\"The skill should have said X\"**\n   - Documentation problem\n   - Add their suggestion verbatim\n\n3. **\"I didn't see section Y\"**\n   - Organization problem\n   - Make key points more prominent\n   - Add foundational principle early\n"},"source-a34ff170b02077de-s20":{"body":"来源：`skills/writing-skills/testing-skills-with-subagents.md:267-281`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## When Skill is Bulletproof\n\n**Signs of bulletproof skill:**\n\n1. **Agent chooses correct option** under maximum pressure\n2. **Agent cites skill sections** as justification\n3. **Agent acknowledges temptation** but follows rule anyway\n4. **Meta-testing reveals** \"skill was clear, I should follow it\"\n\n**Not bulletproof if:**\n- Agent finds new rationalizations\n- Agent argues skill is wrong\n- Agent creates \"hybrid approaches\"\n- Agent asks permission but argues strongly for violation\n"},"source-a34ff170b02077de-s21":{"body":"来源：`skills/writing-skills/testing-skills-with-subagents.md:282-283`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Example: TDD Skill Bulletproofing\n"},"source-a34ff170b02077de-s22":{"body":"来源：`skills/writing-skills/testing-skills-with-subagents.md:284-290`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### Initial Test (Failed)\n```markdown\nScenario: 200 lines done, forgot TDD, exhausted, dinner plans\nAgent chose: C (write tests after)\nRationalization: \"Tests after achieve same goals\"\n```\n"},"source-a34ff170b02077de-s23":{"body":"来源：`skills/writing-skills/testing-skills-with-subagents.md:291-297`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### Iteration 1 - Add Counter\n```markdown\nAdded section: \"Why Order Matters\"\nRe-tested: Agent STILL chose C\nNew rationalization: \"Spirit not letter\"\n```\n"},"source-a34ff170b02077de-s24":{"body":"来源：`skills/writing-skills/testing-skills-with-subagents.md:298-307`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### Iteration 2 - Add Foundational Principle\n```markdown\nAdded: \"Violating letter is violating spirit\"\nRe-tested: Agent chose A (delete it)\nCited: New principle directly\nMeta-test: \"Skill was clear, I should follow it\"\n```\n\n**Bulletproof achieved.**\n"},"source-a34ff170b02077de-s25":{"body":"来源：`skills/writing-skills/testing-skills-with-subagents.md:308-331`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Testing Checklist (TDD for Skills)\n\nBefore deploying skill, verify you followed RED-GREEN-REFACTOR:\n\n**RED Phase:**\n- [ ] Created pressure scenarios (3+ combined pressures)\n- [ ] Ran scenarios WITHOUT skill (baseline)\n- [ ] Documented agent failures and rationalizations verbatim\n\n**GREEN Phase:**\n- [ ] Wrote skill addressing specific baseline failures\n- [ ] Ran scenarios WITH skill\n- [ ] Agent now complies\n\n**REFACTOR Phase:**\n- [ ] Identified NEW rationalizations from testing\n- [ ] Added explicit counters for each loophole\n- [ ] Updated rationalization table\n- [ ] Updated red flags list\n- [ ] Updated description with violation symptoms\n- [ ] Re-tested - agent still complies\n- [ ] Meta-tested to verify clarity\n- [ ] Agent follows rule under maximum pressure\n"},"source-a34ff170b02077de-s26":{"body":"来源：`skills/writing-skills/testing-skills-with-subagents.md:332-357`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Common Mistakes (Same as TDD)\n\n**❌ Writing skill before testing (skipping RED)**\nReveals what YOU think needs preventing, not what ACTUALLY needs preventing.\n✅ Fix: Always run baseline scenarios first.\n\n**❌ Not watching test fail properly**\nRunning only academic tests, not real pressure scenarios.\n✅ Fix: Use pressure scenarios that make agent WANT to violate.\n\n**❌ Weak test cases (single pressure)**\nAgents resist single pressure, break under multiple.\n✅ Fix: Combine 3+ pressures (time + sunk cost + exhaustion).\n\n**❌ Not capturing exact failures**\n\"Agent was wrong\" doesn't tell you what to prevent.\n✅ Fix: Document exact rationalizations verbatim.\n\n**❌ Vague fixes (adding generic counters)**\n\"Don't cheat\" doesn't work. \"Don't keep as reference\" does.\n✅ Fix: Add explicit negations for each specific rationalization.\n\n**❌ Stopping after first pass**\nTests pass once ≠ bulletproof.\n✅ Fix: Continue REFACTOR cycle until no new rationalizations.\n"},"source-a34ff170b02077de-s27":{"body":"来源：`skills/writing-skills/testing-skills-with-subagents.md:358-368`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Quick Reference (TDD Cycle)\n\n| TDD Phase | Skill Testing | Success Criteria |\n|-----------|---------------|------------------|\n| **RED** | Run scenario without skill | Agent fails, document rationalizations |\n| **Verify RED** | Capture exact wording | Verbatim documentation of failures |\n| **GREEN** | Write skill addressing failures | Agent now complies with skill |\n| **Verify GREEN** | Re-test scenarios | Agent follows rule under pressure |\n| **REFACTOR** | Close loopholes | Add counters for new rationalizations |\n| **Stay GREEN** | Re-verify | Agent still complies after refactoring |\n"},"source-a34ff170b02077de-s28":{"body":"来源：`skills/writing-skills/testing-skills-with-subagents.md:369-376`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## The Bottom Line\n\n**Skill creation IS TDD. Same principles, same cycle, same benefits.**\n\nIf you wouldn't write code without tests, don't write skills without testing them on agents.\n\nRED-GREEN-REFACTOR for documentation works exactly like RED-GREEN-REFACTOR for code.\n"},"source-a34ff170b02077de-s29":{"body":"来源：`skills/writing-skills/testing-skills-with-subagents.md:377-384`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Real-World Impact\n\nFrom applying TDD to TDD skill itself (2025-10-03):\n- 6 RED-GREEN-REFACTOR iterations to bulletproof\n- Baseline testing revealed 10+ unique rationalizations\n- Each REFACTOR closed specific loopholes\n- Final VERIFY GREEN: 100% compliance under maximum pressure\n- Same process works for any discipline-enforcing skill"},"skill-change-evaluation":{"body":"# 技能行为修改需要评估证据\n\n技能内容会塑造代理行为；修改技能时按项目规则使用 writing-skills 工作流，并在提交 PR 前提供多会话对抗评测与修改前后结果。精调的 Red Flags、合理化清单和 human partner 用语不能无证据重写。\n\n## 适用条件\n\n修改技能行为内容；其中 PR 评测交付要求仅在准备提交 PR 时触发。\n\n适用性：conditional\n\n## 原文\n\nSkills are not prose — they are code that shapes agent behavior. If you modify skill content:\n\n## 验证计划\n\n确认使用 writing-skills 工作流；若准备 PR，核对多个会话的对抗评测及修改前后结果，并确认精调段落有改进证据。\n\n尚未验证实现；规则适用性不等于合规结果。"}}}</script>
