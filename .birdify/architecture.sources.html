u catch yourself thinking \"an independent review\n    would strengthen my report\" — that review is already scheduled.\n    Report instead.\n\n    ## Code Organization\n\n    You reason best about code you can hold in context at once, and your edits are more\n    reliable when files are focused. Keep this in mind:\n    - Follow the file structure defined in the plan\n    - Each file should have one clear responsibility with a well-defined interface\n    - If a file you're creating is growing beyond the plan's intent, stop and report\n      it as DONE_WITH_CONCERNS — don't split files on your own without plan guidance\n    - If an existing file you're modifying is already large or tangled, work carefully\n      and note it as a concern in your report\n    - In existing codebases, follow established patterns. Improve code you're touching\n      the way a good developer would, but don't restructure things outside your task.\n\n    ## When You're in Over Your Head\n\n    It is always OK to stop and say \"this is too hard for me.\" Bad work is worse than\n    no work. You will not be penalized for escalating.\n\n    **STOP and escalate when:**\n    - The task requires architectural decisions with multiple valid approaches\n    - You need to understand code beyond what was provided and can't find clarity\n    - You feel uncertain about whether your approach is correct\n    - The task involves restructuring existing code in ways the plan didn't anticipate\n    - You've been reading file after file trying to understand the system without progress\n\n    **How to escalate:** Report back with status BLOCKED or NEEDS_CONTEXT. Describe\n    specifically what you're stuck on, what you've tried, and what kind of help you need.\n    The controller can provide more context, re-dispatch with a more capable model,\n    or break the task into smaller pieces.\n\n    ## Before Reporting Back: Self-Review\n\n    Review your work with fresh eyes. Ask yourself:\n\n    **Completeness:**\n    - Did I fully implement everything in the spec?\n    - Did I miss any requirements?\n    - Are there edge cases I didn't handle?\n\n    **Quality:**\n    - Is this my best work?\n    - Are names clear and accurate (match what things do, not how they work)?\n    - Is the code clean and maintainable?\n\n    **Discipline:**\n    - Did I avoid overbuilding (YAGNI)?\n    - Did I only build what was requested?\n    - Did I follow existing patterns in the codebase?\n\n    **Testing:**\n    - Do tests actually verify behavior (not just mock behavior)?\n    - Did I follow TDD if required?\n    - Are tests comprehensive?\n    - Is the test output pristine (no stray warnings or noise)?\n\n    If you find issues during self-review, fix them now before reporting.\n\n    ## After Review Findings\n\n    If the task review finds issues, you will be resumed with the findings.\n    Fix them, re-run the tests that cover the amended code, and append a fix\n    report to your report file: what you changed, the covering tests you\n    ran, the command, and the output. Reviewers will not re-run tests for\n    you — your report is the test evidence. Then reply with the same short\n    status contract as your first report.\n\n    ## Report Format\n\n    Write your full report to [REPORT_FILE]:\n    - What you implemented (or what you attempted, if blocked)\n    - What you tested and test results\n    - **TDD Evidence** (if TDD was required for this task):\n      - RED: command run, relevant failing output before implementation, and why the failure was expected\n      - GREEN: command run and relevant passing output after implementation\n    - Files changed\n    - Self-review findings (if any)\n    - Any issues or concerns\n\n    Then report back with ONLY (under 15 lines — the detail lives in the\n    report file):\n    - **Status:** DONE | DONE_WITH_CONCERNS | BLOCKED | NEEDS_CONTEXT\n    - Commits created (short SHA + subject)\n    - One-line test summary (e.g. \"14/14 passing, output pristine\")\n    - Your concerns, if any\n    - The report file path\n\n    If BLOCKED or NEEDS_CONTEXT, put the specifics in the final message\n    itself — the controller acts on it directly.\n\n    Use DONE_WITH_CONCERNS if you completed the work but have doubts about correctness.\n    Use BLOCKED if you cannot complete the task. Use NEEDS_CONTEXT if you need\n    information that wasn't provided. Never silently produce work you're unsure about.\n```"},"source-db4f72773bf7a066":{"body":"# skills/subagent-driven-development/task-reviewer-prompt.md\n\n范围：按任务和引用关系判断 / Conditional\n\n来源于：skills/subagent-driven-development/SKILL.md\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n# Task Reviewer Prompt Template\n\nUse this template when dispatching a task reviewer subagent. The reviewer\nreads the task's diff once and returns two verdicts: spec compliance and\ncode quality.\n\n**Purpose:** Verify one task's implementation matches its requirements (nothing\nmore, nothing less) and is well-built (clean, tested, maintainable)\n\n```\nSubagent (general-purpose):\n  description: \"Review Task N (spec + quality)\"\n  model: [MODEL — REQUIRED: choose per SKILL.md Model Selection; an omitted\n         model silently inherits the session's most expensive one]\n  prompt: |\n    You are reviewing one task's implementation: first whether it matches its\n    requirements, then whether it is well-built. This is a task-scoped gate,\n    not a merge review — a broad whole-branch review happens separately after\n    all tasks are complete.\n\n    ## What Was Requested\n\n    Read the task brief: [BRIEF_FILE]\n\n    Global constraints from the spec/design that bind this task:\n    [GLOBAL_CONSTRAINTS]\n\n    ## What the Implementer Claims They Built\n\n    Read the implementer's report: [REPORT_FILE]\n\n    ## Diff Under Review\n\n    **Base:** [BASE_SHA]\n    **Head:** [HEAD_SHA]\n    **Diff file:** [DIFF_FILE]\n\n    Read the diff file once — it contains the commit list, a stat summary,\n    and the full diff with surrounding context, and it is your view of the\n    change. The diff's context lines ARE the changed files: do not Read a\n    changed file separately unless a hunk you must judge is cut off\n    mid-function — and say so in your report. Do not re-run git commands.\n    If the diff file is missing, fetch the diff yourself:\n    `git diff --stat [BASE_SHA]..[HEAD_SHA]` and `git diff [BASE_SHA]..[HEAD_SHA]`.\n    Do not crawl the broader codebase. Inspect code outside the diff only\n    to evaluate a concrete risk you can name — one focused check per named\n    risk, and name both the risk and what you checked in your report.\n    Cross-cutting changes are legitimate named risks: if the diff changes\n    lock ordering, a function or API contract, or shared mutable state,\n    checking the call sites is the right method.\n\n    Your review is read-only on this checkout. Do not mutate the working\n    tree, the index, HEAD, or branch state in any way.\n\n    ## You Do Not Dispatch Subagents\n\n    Do all of this review yourself. Never spawn a subagent to review part\n    of the diff, and never spawn another reviewer for a second opinion.\n    This process already provides every review seat the work gets; a\n    reviewer you spawn duplicates one of them at full cost, and its\n    verdict counts for nothing. If the diff feels too large for one\n    pass, review it in passes yourself and say so in your report.\n\n    ## Do Not Trust the Report\n\n    Treat the implementer's report as unverified claims about the code. It\n    may be incomplete, inaccurate, or optimistic. Verify the claims against\n    the diff. Design rationales in the report are claims too: \"left it per\n    YAGNI,\" \"kept it simple deliberately,\" or any other justification is the\n    implementer grading their own work. Judge the code on its merits — a\n    stated rationale never downgrades a finding's severity.\n\n    ## Tests\n\n    The implementer already ran the tests and reported results with TDD\n    evidence for exactly this code. Do not re-run the suite to confirm their\n    report. Run a test only when reading the code raises a specific doubt\n    that no existing run answers — and then a focused test, never a\n    package-wide suite, race detector run, or repeated/high-count loop. If\n    heavy validation seems warranted, recommend it in your report instead of\n    running it. If you cannot run commands in this environment, name the\n    test you would run.\n\n    Warnings or other noise in the implementer's reported test output are\n    findings — test output should be pristine.\n\n    Evidence you cannot see is not evidence that doesn't exist. If the\n    report or its test evidence looks truncated, or you cannot locate the\n    results it claims, re-read the file at its stated path — and if it is\n    genuinely missing or garbled, report that as a gap for the controller.\n    Re-running the suite to regenerate what you failed to read is not\n    verification; illegibility of the evidence is not invalidation of it.\n\n    ## Part 1: Spec Compliance\n\n    Compare the diff against What Was Requested:\n\n    - **Missing:** requirements they skipped, missed, or claimed without\n      implementing\n    - **Extra:** features that weren't requested, over-engineering, unneeded\n      \"nice to haves\"\n    - **Misunderstood:** right feature built the wrong way, wrong problem\n      solved\n\n    If the brief lists several files each with its own change (a batched\n    dispatch), check the diff against that list file by file: every listed\n    file must have its corresponding hunk. A listed file the diff never\n    touches is a Missing finding, no matter how clean the rest of the\n    batch looks.\n\n    If a requirement cannot be verified from this diff alone (it lives in\n    unchanged code or spans tasks), report it as a ⚠️ item instead of\n    broadening your search.\n\n    ## Part 2: Code Quality\n\n    **Code quality:**\n    - Clean separation of concerns?\n    - Proper error handling?\n    - DRY without premature abstraction?\n    - Edge cases handled?\n\n    **Tests:**\n    - Do the new and changed tests verify real behavior, not mocks?\n    - Are the task's edge cases covered?\n\n    **Structure:**\n    - Does each file have one clear responsibility with a well-defined interface?\n    - Are units decomposed so they can be understood and tested independently?\n    - Is the implementation following the file structure from the plan?\n    - Did this change create new files that are already large, or\n      significantly grow existing files? (Don't flag pre-existing file\n      sizes — focus on what this change contributed.)\n\n    Your report should point at evidence: file:line references for every\n    finding and for any check you would otherwise answer with a bare\n    \"yes.\" A tight report that cites lines gives the controller everything\n    it needs.\n\n    Your final message is the report itself: begin directly with the\n    spec-compliance verdict. Every line is a verdict, a finding with\n    file:line, or a check you ran — no preamble, no process narration,\n    no closing summary.\n\n    ## Calibration\n\n    Categorize issues by actual severity. Not everything is Critical.\n    Important means this task cannot be trusted until it is fixed: incorrect\n    or fragile behavior, a missed requirement, or maintainability damage you\n    would block a merge over — verbatim duplication of a logic block,\n    swallowed errors, tests that assert nothing. \"Coverage could be broader\"\n    and polish suggestions are Minor.\n    If the plan or brief explicitly mandates something this rubric calls a\n    defect (a test that asserts nothing, verbatim duplication of a logic\n    block), that IS a finding — report it as Important, labeled\n    plan-mandated. The plan's authorship does not grade its own work; the\n    human decides.\n    Acknowledge what was done well before listing issues — accurate praise\n    helps the implementer trust the rest of the feedback.\n\n    ## Output Format\n\n    ### Spec Compliance\n\n    - ✅ Spec compliant | ❌ Issues found: [what's missing/extra/misunderstood,\n      with file:line references]\n    - ⚠️ Cannot verify from diff: [requirements you could not verify from the\n      diff alone, and what the controller should check — report alongside the\n      ✅/❌ verdict for everything you could verify]\n\n    ### Strengths\n    [What's well done? Be specific.]\n\n    ### Issues\n\n    #### Critical (Must Fix)\n    #### Important (Should Fix)\n    #### Minor (Nice to Have)\n\n    For each issue: file:line, what's wrong, why it matters, how to fix\n    (if not obvious).\n\n    ### Assessment\n\n    **Task quality:** [Approved | Needs fixes]\n\n    **Reasoning:** [1-2 sentence technical assessment]\n```\n\n**Placeholders:**\n- `[MODEL]` — REQUIRED: reviewer model per SKILL.md Model Selection\n- `[BRIEF_FILE]` — REQUIRED: the task brief file (`bash scripts/task-brief PLAN N`\n  prints the path; same file the implementer worked from)\n- `[GLOBAL_CONSTRAINTS]` — the binding requirements copied verbatim from\n  the plan's Global Constraints section or the spec: exact values, formats,\n  and stated relationships between components (not process rules — those\n  are already in this template)\n- `[REPORT_FILE]` — REQUIRED: the file the implementer wrote its detailed\n  report to\n- `[BASE_SHA]` — commit before this task\n- `[HEAD_SHA]` — current commit\n- `[DIFF_FILE]` — REQUIRED: the path the controller wrote the review\n  package to (`bash scripts/review-package PLAN_FILE BASE HEAD` prints the unique\n  path it wrote; the package never enters the controller's context)\n\n**Reviewer returns:** Spec Compliance verdict (✅/❌/⚠️), Strengths, Issues\n(Critical/Important/Minor), Task quality verdict"},"source-db4f72773bf7a066-s1":{"body":"来源：`skills/subagent-driven-development/task-reviewer-prompt.md:1-207`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# Task Reviewer Prompt Template\n\nUse this template when dispatching a task reviewer subagent. The reviewer\nreads the task's diff once and returns two verdicts: spec compliance and\ncode quality.\n\n**Purpose:** Verify one task's implementation matches its requirements (nothing\nmore, nothing less) and is well-built (clean, tested, maintainable)\n\n```\nSubagent (general-purpose):\n  description: \"Review Task N (spec + quality)\"\n  model: [MODEL — REQUIRED: choose per SKILL.md Model Selection; an omitted\n         model silently inherits the session's most expensive one]\n  prompt: |\n    You are reviewing one task's implementation: first whether it matches its\n    requirements, then whether it is well-built. This is a task-scoped gate,\n    not a merge review — a broad whole-branch review happens separately after\n    all tasks are complete.\n\n    ## What Was Requested\n\n    Read the task brief: [BRIEF_FILE]\n\n    Global constraints from the spec/design that bind this task:\n    [GLOBAL_CONSTRAINTS]\n\n    ## What the Implementer Claims They Built\n\n    Read the implementer's report: [REPORT_FILE]\n\n    ## Diff Under Review\n\n    **Base:** [BASE_SHA]\n    **Head:** [HEAD_SHA]\n    **Diff file:** [DIFF_FILE]\n\n    Read the diff file once — it contains the commit list, a stat summary,\n    and the full diff with surrounding context, and it is your view of the\n    change. The diff's context lines ARE the changed files: do not Read a\n    changed file separately unless a hunk you must judge is cut off\n    mid-function — and say so in your report. Do not re-run git commands.\n    If the diff file is missing, fetch the diff yourself:\n    `git diff --stat [BASE_SHA]..[HEAD_SHA]` and `git diff [BASE_SHA]..[HEAD_SHA]`.\n    Do not crawl the broader codebase. Inspect code outside the diff only\n    to evaluate a concrete risk you can name — one focused check per named\n    risk, and name both the risk and what you checked in your report.\n    Cross-cutting changes are legitimate named risks: if the diff changes\n    lock ordering, a function or API contract, or shared mutable state,\n    checking the call sites is the right method.\n\n    Your review is read-only on this checkout. Do not mutate the working\n    tree, the index, HEAD, or branch state in any way.\n\n    ## You Do Not Dispatch Subagents\n\n    Do all of this review yourself. Never spawn a subagent to review part\n    of the diff, and never spawn another reviewer for a second opinion.\n    This process already provides every review seat the work gets; a\n    reviewer you spawn duplicates one of them at full cost, and its\n    verdict counts for nothing. If the diff feels too large for one\n    pass, review it in passes yourself and say so in your report.\n\n    ## Do Not Trust the Report\n\n    Treat the implementer's report as unverified claims about the code. It\n    may be incomplete, inaccurate, or optimistic. Verify the claims against\n    the diff. Design rationales in the report are claims too: \"left it per\n    YAGNI,\" \"kept it simple deliberately,\" or any other justification is the\n    implementer grading their own work. Judge the code on its merits — a\n    stated rationale never downgrades a finding's severity.\n\n    ## Tests\n\n    The implementer already ran the tests and reported results with TDD\n    evidence for exactly this code. Do not re-run the suite to confirm their\n    report. Run a test only when reading the code raises a specific doubt\n    that no existing run answers — and then a focused test, never a\n    package-wide suite, race detector run, or repeated/high-count loop. If\n    heavy validation seems warranted, recommend it in your report instead of\n    running it. If you cannot run commands in this environment, name the\n    test you would run.\n\n    Warnings or other noise in the implementer's reported test output are\n    findings — test output should be pristine.\n\n    Evidence you cannot see is not evidence that doesn't exist. If the\n    report or its test evidence looks truncated, or you cannot locate the\n    results it claims, re-read the file at its stated path — and if it is\n    genuinely missing or garbled, report that as a gap for the controller.\n    Re-running the suite to regenerate what you failed to read is not\n    verification; illegibility of the evidence is not invalidation of it.\n\n    ## Part 1: Spec Compliance\n\n    Compare the diff against What Was Requested:\n\n    - **Missing:** requirements they skipped, missed, or claimed without\n      implementing\n    - **Extra:** features that weren't requested, over-engineering, unneeded\n      \"nice to haves\"\n    - **Misunderstood:** right feature built the wrong way, wrong problem\n      solved\n\n    If the brief lists several files each with its own change (a batched\n    dispatch), check the diff against that list file by file: every listed\n    file must have its corresponding hunk. A listed file the diff never\n    touches is a Missing finding, no matter how clean the rest of the\n    batch looks.\n\n    If a requirement cannot be verified from this diff alone (it lives in\n    unchanged code or spans tasks), report it as a ⚠️ item instead of\n    broadening your search.\n\n    ## Part 2: Code Quality\n\n    **Code quality:**\n    - Clean separation of concerns?\n    - Proper error handling?\n    - DRY without premature abstraction?\n    - Edge cases handled?\n\n    **Tests:**\n    - Do the new and changed tests verify real behavior, not mocks?\n    - Are the task's edge cases covered?\n\n    **Structure:**\n    - Does each file have one clear responsibility with a well-defined interface?\n    - Are units decomposed so they can be understood and tested independently?\n    - Is the implementation following the file structure from the plan?\n    - Did this change create new files that are already large, or\n      significantly grow existing files? (Don't flag pre-existing file\n      sizes — focus on what this change contributed.)\n\n    Your report should point at evidence: file:line references for every\n    finding and for any check you would otherwise answer with a bare\n    \"yes.\" A tight report that cites lines gives the controller everything\n    it needs.\n\n    Your final message is the report itself: begin directly with the\n    spec-compliance verdict. Every line is a verdict, a finding with\n    file:line, or a check you ran — no preamble, no process narration,\n    no closing summary.\n\n    ## Calibration\n\n    Categorize issues by actual severity. Not everything is Critical.\n    Important means this task cannot be trusted until it is fixed: incorrect\n    or fragile behavior, a missed requirement, or maintainability damage you\n    would block a merge over — verbatim duplication of a logic block,\n    swallowed errors, tests that assert nothing. \"Coverage could be broader\"\n    and polish suggestions are Minor.\n    If the plan or brief explicitly mandates something this rubric calls a\n    defect (a test that asserts nothing, verbatim duplication of a logic\n    block), that IS a finding — report it as Important, labeled\n    plan-mandated. The plan's authorship does not grade its own work; the\n    human decides.\n    Acknowledge what was done well before listing issues — accurate praise\n    helps the implementer trust the rest of the feedback.\n\n    ## Output Format\n\n    ### Spec Compliance\n\n    - ✅ Spec compliant | ❌ Issues found: [what's missing/extra/misunderstood,\n      with file:line references]\n    - ⚠️ Cannot verify from diff: [requirements you could not verify from the\n      diff alone, and what the controller should check — report alongside the\n      ✅/❌ verdict for everything you could verify]\n\n    ### Strengths\n    [What's well done? Be specific.]\n\n    ### Issues\n\n    #### Critical (Must Fix)\n    #### Important (Should Fix)\n    #### Minor (Nice to Have)\n\n    For each issue: file:line, what's wrong, why it matters, how to fix\n    (if not obvious).\n\n    ### Assessment\n\n    **Task quality:** [Approved | Needs fixes]\n\n    **Reasoning:** [1-2 sentence technical assessment]\n```\n\n**Placeholders:**\n- `[MODEL]` — REQUIRED: reviewer model per SKILL.md Model Selection\n- `[BRIEF_FILE]` — REQUIRED: the task brief file (`bash scripts/task-brief PLAN N`\n  prints the path; same file the implementer worked from)\n- `[GLOBAL_CONSTRAINTS]` — the binding requirements copied verbatim from\n  the plan's Global Constraints section or the spec: exact values, formats,\n  and stated relationships between components (not process rules — those\n  are already in this template)\n- `[REPORT_FILE]` — REQUIRED: the file the implementer wrote its detailed\n  report to\n- `[BASE_SHA]` — commit before this task\n- `[HEAD_SHA]` — current commit\n- `[DIFF_FILE]` — REQUIRED: the path the controller wrote the review\n  package to (`bash scripts/review-package PLAN_FILE BASE HEAD` prints the unique\n  path it wrote; the package never enters the controller's context)\n\n**Reviewer returns:** Spec Compliance verdict (✅/❌/⚠️), Strengths, Issues\n(Critical/Important/Minor), Task quality verdict"},"source-78150e3cda936e87":{"body":"# skills/subagent-driven-development/re-review-prompt.md\n\n范围：按任务和引用关系判断 / Conditional\n\n来源于：skills/subagent-driven-development/SKILL.md\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n# Scoped Re-Review Prompt Template\n\nUse this template when dispatching a re-review after a fix round. The\nre-reviewer verifies the findings were addressed and checks the fix diff for\nnew breakage. It is not a fresh review — the full review already happened.\n\n**Purpose:** Verify each finding from the previous review was addressed, and\nthat the fix itself broke nothing.\n\n```\nSubagent (general-purpose):\n  description: \"Re-review Task N fix round R\"\n  model: [MODEL — REQUIRED: choose per SKILL.md Model Selection; an omitted\n         model silently inherits the session's most expensive one]\n  prompt: |\n    You are re-reviewing one task's fix round. A previous review produced\n    findings; an implementer has attempted to fix them. Your job is to\n    verdict each finding and inspect the fix diff — nothing else.\n\n    ## The Task\n\n    Read the task brief: [BRIEF_FILE]\n\n    ## The Findings Under Verification\n\n    [FINDINGS]\n\n    ## The Fix\n\n    Read the implementer's report (fix reports are appended at the end):\n    [REPORT_FILE]\n\n    **Fix base:** [FIX_BASE_SHA] (the head the previous review saw)\n    **Head:** [HEAD_SHA]\n    **Diff file:** [DIFF_FILE]\n\n    Read the diff file once — it contains the fix commits, a stat summary,\n    and the fix diff with surrounding context. Do not re-run git commands.\n    If the diff file is missing, fetch the diff yourself:\n    `git diff --stat [FIX_BASE_SHA]..[HEAD_SHA]` and\n    `git diff [FIX_BASE_SHA]..[HEAD_SHA]`.\n\n    Your review is read-only on this checkout. Do not mutate the working\n    tree, the index, HEAD, or branch state in any way.\n\n    ## You Do Not Dispatch Subagents\n\n    Do all of this review yourself. Never spawn a subagent to review part\n    of the diff, and never spawn another reviewer for a second opinion.\n    This process already provides every review seat the work gets; a\n    reviewer you spawn duplicates one of them at full cost, and its\n    verdict counts for nothing. If the diff feels too large for one\n    pass, review it in passes yourself and say so in your report.\n\n    ## Scope\n\n    Your scope is the findings list and the fix diff. Verdict every finding.\n    Inspect the fix diff for new problems the fix itself introduced. Do NOT\n    re-review code the fix did not touch: if you notice an issue entirely\n    outside the fix diff, report it under Out-of-Scope Observations — it\n    does not block this task and does not extend the loop. A broad\n    whole-branch review happens after all tasks are complete.\n\n    ## Tests\n\n    The implementer re-ran the tests covering the amended code and appended\n    the results to the report file. Treat the report as unverified claims:\n    confirm the fix report names the covering tests and shows their output,\n    and verify the claims against the diff. Do not re-run the suite to\n    confirm their report. Run a test only when reading the code raises a\n    specific doubt that no existing run answers — and then a focused test,\n    never a package-wide suite.\n\n    ## Output Format\n\n    Your final message is the report itself: begin directly with the first\n    finding's verdict. Every line is a verdict, a finding with file:line,\n    or a check you ran — no preamble, no process narration.\n\n    ### Finding Verdicts\n\n    For each finding in The Findings Under Verification, in order:\n    - **[finding one-liner]** — ADDRESSED | NOT ADDRESSED, with file:line\n      evidence. \"Attempted\" is not addressed: the specific defect must no\n      longer exist.\n\n    ### New Breakage in the Fix Diff\n\n    Anything the fix itself broke or introduced, with severity\n    (Critical/Important/Minor) and file:line. \"None\" if clean.\n\n    ### Out-of-Scope Observations\n\n    Issues you noticed entirely outside the fix diff. Non-blocking; the\n    controller ledgers these for the final review. \"None\" if none.\n\n    ### Verdict\n\n    **Fix round:** [All findings addressed, no new Critical/Important\n    breakage | Findings remain open] — list the open ones.\n```\n\n**Placeholders:**\n- `[MODEL]` — REQUIRED: reviewer model per SKILL.md Model Selection; scoped\n  re-reviews of small fix diffs take a cheap-to-mid tier\n- `[BRIEF_FILE]` — the task brief file (same file the implementer worked from)\n- `[FINDINGS]` — the Critical/Important findings and spec gaps from the\n  previous review, copied verbatim, one per bullet\n- `[REPORT_FILE]` — the implementer's report file (fix reports appended)\n- `[FIX_BASE_SHA]` — the head the previous review saw\n- `[HEAD_SHA]` — current commit\n- `[DIFF_FILE]` — the path `bash scripts/review-package PLAN_FILE FIX_BASE HEAD` printed\n\n**Re-reviewer returns:** per-finding verdicts (ADDRESSED / NOT ADDRESSED),\nnew breakage in the fix diff, out-of-scope observations, and a round verdict."},"source-78150e3cda936e87-s1":{"body":"来源：`skills/subagent-driven-development/re-review-prompt.md:1-115`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# Scoped Re-Review Prompt Template\n\nUse this template when dispatching a re-review after a fix round. The\nre-reviewer verifies the findings were addressed and checks the fix diff for\nnew breakage. It is not a fresh review — the full review already happened.\n\n**Purpose:** Verify each finding from the previous review was addressed, and\nthat the fix itself broke nothing.\n\n```\nSubagent (general-purpose):\n  description: \"Re-review Task N fix round R\"\n  model: [MODEL — REQUIRED: choose per SKILL.md Model Selection; an omitted\n         model silently inherits the session's most expensive one]\n  prompt: |\n    You are re-reviewing one task's fix round. A previous review produced\n    findings; an implementer has attempted to fix them. Your job is to\n    verdict each finding and inspect the fix diff — nothing else.\n\n    ## The Task\n\n    Read the task brief: [BRIEF_FILE]\n\n    ## The Findings Under Verification\n\n    [FINDINGS]\n\n    ## The Fix\n\n    Read the implementer's report (fix reports are appended at the end):\n    [REPORT_FILE]\n\n    **Fix base:** [FIX_BASE_SHA] (the head the previous review saw)\n    **Head:** [HEAD_SHA]\n    **Diff file:** [DIFF_FILE]\n\n    Read the diff file once — it contains the fix commits  ran — no preamble, no process narration.\n\n    ### Finding Verdicts\n\n    For each finding in The Findings Under Verification, in order:\n    - **[finding one-liner]** — ADDRESSED | NOT ADDRESSED, with file:line\n      evidence. \"Attempted\" is not addressed: the specific defect must no\n      longer exist.\n\n    ### New Breakage in the Fix Diff\n\n    Anything the fix itself broke or introduced, with severity\n    (Critical/Important/Minor) and file:line. \"None\" if clean.\n\n    ### Out-of-Scope Observations\n\n    Issues you noticed entirely outside the fix diff. Non-blocking; the\n    controller ledgers these for the final review. \"None\" if none.\n\n    ### Verdict\n\n    **Fix round:** [All findings addressed, no new Critical/Important\n    breakage | Findings remain open] — list the open ones.\n```\n\n**Placeholders:**\n- `[MODEL]` — REQUIRED: reviewer model per SKILL.md Model Selection; scoped\n  re-reviews of small fix diffs take a cheap-to-mid tier\n- `[BRIEF_FILE]` — the task brief file (same file the implementer worked from)\n- `[FINDINGS]` — the Critical/Important findings and spec gaps from the\n  previous review, copied verbatim, one per bullet\n- `[REPORT_FILE]` — the implementer's report file (fix reports appended)\n- `[FIX_BASE_SHA]` — the head the previous review saw\n- `[HEAD_SHA]` — current commit\n- `[DIFF_FILE]` — the path `bash scripts/review-package PLAN_FILE FIX_BASE HEAD` printed\n\n**Re-reviewer returns:** per-finding verdicts (ADDRESSED / NOT ADDRESSED),\nnew breakage in the fix diff, out-of-scope observations, and a round verdict."},"folder:reference:skills/systematic-debugging":{"body":"# skills/systematic-debugging\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。"},"source-d752064c43f43737":{"body":"# skills/systematic-debugging/root-cause-tracing.md\n\n范围：按任务和引用关系判断 / Conditional\n\n来源于：skills/systematic-debugging/SKILL.md\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n# Root Cause Tracing\n\n## Overview\n\nBugs often manifest deep in the call stack (git init in wrong directory, file created in wrong location, database opened with wrong path). Your instinct is to fix where the error appears, but that's treating a symptom.\n\n**Core principle:** Trace backward through the call chain until you find the original trigger, then fix at the source.\n\n## When to Use\n\n```dot\ndigraph when_to_use {\n    \"Bug appears deep in stack?\" [shape=diamond];\n    \"Can trace backwards?\" [shape=diamond];\n    \"Fix at symptom point\" [shape=box];\n    \"Trace to original trigger\" [shape=box];\n    \"BETTER: Also add defense-in-depth\" [shape=box];\n\n    \"Bug appears deep in stack?\" -> \"Can trace backwards?\" [label=\"yes\"];\n    \"Can trace backwards?\" -> \"Trace to original trigger\" [label=\"yes\"];\n    \"Can trace backwards?\" -> \"Fix at symptom point\" [label=\"no - dead end\"];\n    \"Trace to original trigger\" -> \"BETTER: Also add defense-in-depth\";\n}\n```\n\n**Use when:**\n- Error happens deep in execution (not at entry point)\n- Stack trace shows long call chain\n- Unclear where invalid data originated\n- Need to find which test/code triggers the problem\n\n## The Tracing Process\n\n### 1. Observe the Symptom\n```\nError: git init failed in ~/project/packages/core\n```\n\n### 2. Find Immediate Cause\n**What code directly causes this?**\n```typescript\nawait execFileAsync('git', ['init'], { cwd: projectDir });\n```\n\n### 3. Ask: What Called This?\n```typescript\nWorktreeManager.createSessionWorktree(projectDir, sessionId)\n  → called by Session.initializeWorkspace()\n  → called by Session.create()\n  → called by test at Project.create()\n```\n\n### 4. Keep Tracing Up\n**What value was passed?**\n- `projectDir = ''` (empty string!)\n- Empty string as `cwd` resolves to `process.cwd()`\n- That's the source code directory!\n\n### 5. Find Original Trigger\n**Where did empty string come from?**\n```typescript\nconst context = setupCoreTest(); // Returns { tempDir: '' }\nProject.create('name', context.tempDir); // Accessed before beforeEach!\n```\n\n## Adding Stack Traces\n\nWhen you can't trace manually, add instrumentation:\n\n```typescript\n// Before the problematic operation\nasync function gitInit(directory: string) {\n  const stack = new Error().stack;\n  console.error('DEBUG git init:', {\n    directory,\n    cwd: process.cwd(),\n    nodeEnv: process.env.NODE_ENV,\n    stack,\n  });\n\n  await execFileAsync('git', ['init'], { cwd: directory });\n}\n```\n\n**Critical:** Use `console.error()` in tests (not logger - may not show)\n\n**Run and capture:**\n```bash\nnpm test 2>&1 | grep 'DEBUG git init'\n```\n\n**Analyze stack traces:**\n- Look for test file names\n- Find the line number triggering the call\n- Identify the pattern (same test? same parameter?)\n\n## Finding Which Test Causes Pollution\n\nIf something appears during tests but you don't know which test:\n\nUse the bisection script `find-polluter.sh` in this directory:\n\n```bash\nbash ./find-polluter.sh '.git' 'src/**/*.test.ts'\n```\n\nRuns tests one-by-one, stops at first polluter. See script for usage.\n\n## Real Example: Empty projectDir\n\n**Symptom:** `.git` created in `packages/core/` (source code)\n\n**Trace chain:**\n1. `git init` runs in `process.cwd()` ← empty cwd parameter\n2. WorktreeManager called with empty projectDir\n3. Session.create() passed empty string\n4. Test accessed `context.tempDir` before beforeEach\n5. setupCoreTest() returns `{ tempDir: '' }` initially\n\n**Root cause:** Top-level variable initialization accessing empty value\n\n**Fix:** Made tempDir a getter that throws if accessed before beforeEach\n\n**Also added defense-in-depth:**\n- Layer 1: Project.create() validates directory\n- Layer 2: WorkspaceManager validates not empty\n- Layer 3: NODE_ENV guard refuses git init outside tmpdir\n- Layer 4: Stack trace logging before git init\n\n## Key Principle\n\n```dot\ndigraph principle {\n    \"Found immediate cause\" [shape=ellipse];\n    \"Can trace one level up?\" [shape=diamond];\n    \"Trace backwards\" [shape=box];\n    \"Is this the source?\" [shape=diamond];\n    \"Fix at source\" [shape=box];\n    \"Add validation at each layer\" [shape=box];\n    \"Bug impossible\" [shape=doublecircle];\n    \"NEVER fix just the symptom\" [shape=octagon, style=filled, fillcolor=red, fontcolor=white];\n\n    \"Found immediate cause\" -> \"Can trace one level up?\";\n    \"Can trace one level up?\" -> \"Trace backwards\" [label=\"yes\"];\n    \"Can trace one level up?\" -> \"NEVER fix just the symptom\" [label=\"no\"];\n    \"Trace backwards\" -> \"Is this the source?\";\n    \"Is this the source?\" -> \"Trace backwards\" [label=\"no - keeps going\"];\n    \"Is this the source?\" -> \"Fix at source\" [label=\"yes\"];\n    \"Fix at source\" -> \"Add validation at each layer\";\n    \"Add validation at each layer\" -> \"Bug impossible\";\n}\n```\n\n**NEVER fix just where the error appears.** Trace back to find the original trigger.\n\n## Stack Trace Tips\n\n**In tests:** Use `console.error()` not logger - logger may be suppressed\n**Before operation:** Log before the dangerous operation, not after it fails\n**Include context:** Directory, cwd, environment variables, timestamps\n**Capture stack:** `new Error().stack` shows complete call chain\n\n## Real-World Impact\n\nFrom debugging session (2025-10-03):\n- Found root cause through 5-level trace\n- Fixed at source (getter validation)\n- Added 4 layers of defense\n- 1847 tests passed, zero pollution"},"source-d752064c43f43737-s1":{"body":"来源：`skills/systematic-debugging/root-cause-tracing.md:1-2`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# Root Cause Tracing\n"},"source-d752064c43f43737-s2":{"body":"来源：`skills/systematic-debugging/root-cause-tracing.md:3-8 s\n**Capture stack:** `new Error().stack` shows complete call chain\n"},"source-d752064c43f43737-s15":{"body":"来源：`skills/systematic-debugging/root-cause-tracing.md:163-169`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Real-World Impact\n\nFrom debugging session (2025-10-03):\n- Found root cause through 5-level trace\n- Fixed at source (getter validation)\n- Added 4 layers of defense\n- 1847 tests passed, zero pollution"},"source-b40dc14955825bfd":{"body":"# skills/systematic-debugging/defense-in-depth.md\n\n范围：按任务和引用关系判断 / Conditional\n\n来源于：skills/systematic-debugging/SKILL.md\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n# Defense-in-Depth Validation\n\n## Overview\n\nWhen you fix a bug caused by invalid data, adding validation at one place feels sufficient. But that single check can be bypassed by different code paths, refactoring, or mocks.\n\n**Core principle:** Validate at EVERY layer data passes through. Make the bug structurally impossible.\n\n## Why Multiple Layers\n\nSingle validation: \"We fixed the bug\"\nMultiple layers: \"We made the bug impossible\"\n\nDifferent layers catch different cases:\n- Entry validation catches most bugs\n- Business logic catches edge cases\n- Environment guards prevent context-specific dangers\n- Debug logging helps when other layers fail\n\n## The Four Layers\n\n### Layer 1: Entry Point Validation\n**Purpose:** Reject obviously invalid input at API boundary\n\n```typescript\nfunction createProject(name: string, workingDirectory: string) {\n  if (!workingDirectory || workingDirectory.trim() === '') {\n    throw new Error('workingDirectory cannot be empty');\n  }\n  if (!existsSync(workingDirectory)) {\n    throw new Error(`workingDirectory does not exist: ${workingDirectory}`);\n  }\n  if (!statSync(workingDirectory).isDirectory()) {\n    throw new Error(`workingDirectory is not a directory: ${workingDirectory}`);\n  }\n  // ... proceed\n}\n```\n\n### Layer 2: Business Logic Validation\n**Purpose:** Ensure data makes sense for this operation\n\n```typescript\nfunction initializeWorkspace(projectDir: string, sessionId: string) {\n  if (!projectDir) {\n    throw new Error('projectDir required for workspace initialization');\n  }\n  // ... proceed\n}\n```\n\n### Layer 3: Environment Guards\n**Purpose:** Prevent dangerous operations in specific contexts\n\n```typescript\nasync function gitInit(directory: string) {\n  // In tests, refuse git init outside temp directories\n  if (process.env.NODE_ENV === 'test') {\n    const normalized = normalize(resolve(directory));\n    const tmpDir = normalize(resolve(tmpdir()));\n\n    if (!normalized.startsWith(tmpDir)) {\n      throw new Error(\n        `Refusing git init outside temp dir during tests: ${directory}`\n      );\n    }\n  }\n  // ... proceed\n}\n```\n\n### Layer 4: Debug Instrumentation\n**Purpose:** Capture context for forensics\n\n```typescript\nasync function gitInit(directory: string) {\n  const stack = new Error().stack;\n  logger.debug('About to git init', {\n    directory,\n    cwd: process.cwd(),\n    stack,\n  });\n  // ... proceed\n}\n```\n\n## Applying the Pattern\n\nWhen you find a bug:\n\n1. **Trace the data flow** - Where does bad value originate? Where used?\n2. **Map all checkpoints** - List every point data passes through\n3. **Add validation at each layer** - Entry, business, environment, debug\n4. **Test each layer** - Try to bypass layer 1, verify layer 2 catches it\n\n## Example from Session\n\nBug: Empty `projectDir` caused `git init` in source code\n\n**Data flow:**\n1. Test setup → empty string\n2. `Project.create(name, '')`\n3. `WorkspaceManager.createWorkspace('')`\n4. `git init` runs in `process.cwd()`\n\n**Four layers added:**\n- Layer 1: `Project.create()` validates not empty/exists/writable\n- Layer 2: `WorkspaceManager` validates projectDir not empty\n- Layer 3: `WorktreeManager` refuses git init outside tmpdir in tests\n- Layer 4: Stack trace logging before git init\n\n**Result:** All 1847 tests passed, bug impossible to reproduce\n\n## Key Insight\n\nAll four layers were necessary. During testing, each layer caught bugs the others missed:\n- Different code paths bypassed entry validation\n- Mocks bypassed business logic checks\n- Edge cases on different platforms needed environment guards\n- Debug logging identified structural misuse\n\n**Don't stop at one validation point.** Add checks at every layer."},"source-b40dc14955825bfd-s1":{"body":"来源：`skills/systematic-debugging/defense-in-depth.md:1-2`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# Defense-in-Depth Validation\n"},"source-b40dc14955825bfd-s2":{"body":"来源：`skills/systematic-debugging/defense-in-depth.md:3-8`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Overview\n\nWhen you fix a bug caused by invalid data, adding validation at one place feels sufficient. But that single check can be bypassed by different code paths, refactoring, or mocks.\n\n**Core principle:** Validate at EVERY layer data passes through. Make the bug structurally impossible.\n"},"source-b40dc14955825bfd-s3":{"body":"来源：`skills/systematic-debugging/defense-in-depth.md:9-19`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Why Multiple Layers\n\nSingle validation: \"We fixed the bug\"\nMultiple layers: \"We made the bug impossible\"\n\nDifferent layers catch different cases:\n- Entry validation catches most bugs\n- Business logic catches edge cases\n- Environment guards prevent context-specific dangers\n- Debug logging helps when other layers fail\n"},"source-b40dc14955825bfd-s4":{"body":"来源：`skills/systematic-debugging/defense-in-depth.md:20-21`\n\n约束来源图 / Constrain ayer 4: Stack trace logging before git init\n\n**Result:** All 1847 tests passed, bug impossible to reproduce\n"},"source-b40dc14955825bfd-s11":{"body":"来源：`skills/systematic-debugging/defense-in-depth.md:114-122`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Key Insight\n\nAll four layers were necessary. During testing, each layer caught bugs the others missed:\n- Different code paths bypassed entry validation\n- Mocks bypassed business logic checks\n- Edge cases on different platforms needed environment guards\n- Debug logging identified structural misuse\n\n**Don't stop at one validation point.** Add checks at every layer."},"source-d2174c3d147e85ba":{"body":"# skills/systematic-debugging/condition-based-waiting.md\n\n范围：按任务和引用关系判断 / Conditional\n\n来源于：skills/systematic-debugging/SKILL.md\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n# Condition-Based Waiting\n\n## Overview\n\nFlaky tests often guess at timing with arbitrary delays. This creates race conditions where tests pass on fast machines but fail under load or in CI.\n\n**Core principle:** Wait for the actual condition you care about, not a guess about how long it takes.\n\n## When to Use\n\n```dot\ndigraph when_to_use {\n    \"Test uses setTimeout/sleep?\" [shape=diamond];\n    \"Testing timing behavior?\" [shape=diamond];\n    \"Document WHY timeout needed\" [shape=box];\n    \"Use condition-based waiting\" [shape=box];\n\n    \"Test uses setTimeout/sleep?\" -> \"Testing timing behavior?\" [label=\"yes\"];\n    \"Testing timing behavior?\" -> \"Document WHY timeout needed\" [label=\"yes\"];\n    \"Testing timing behavior?\" -> \"Use condition-based waiting\" [label=\"no\"];\n}\n```\n\n**Use when:**\n- Tests have arbitrary delays (`setTimeout`, `sleep`, `time.sleep()`)\n- Tests are flaky (pass sometimes, fail under load)\n- Tests timeout when run in parallel\n- Waiting for async operations to complete\n\n**Don't use when:**\n- Testing actual timing behavior (debounce, throttle intervals)\n- Always document WHY if using arbitrary timeout\n\n## Core Pattern\n\n```typescript\n// ❌ BEFORE: Guessing at timing\nawait new Promise(r => setTimeout(r, 50));\nconst result = getResult();\nexpect(result).toBeDefined();\n\n// ✅ AFTER: Waiting for condition\nawait waitFor(() => getResult() !== undefined);\nconst result = getResult();\nexpect(result).toBeDefined();\n```\n\n## Quick Patterns\n\n| Scenario | Pattern |\n|----------|---------|\n| Wait for event | `waitFor(() => events.find(e => e.type === 'DONE'))` |\n| Wait for state | `waitFor(() => machine.state === 'ready')` |\n| Wait for count | `waitFor(() => items.length >= 5)` |\n| Wait for file | `waitFor(() => fs.existsSync(path))` |\n| Complex condition | `waitFor(() => obj.ready && obj.value > 10)` |\n\n## Implementation\n\nGeneric polling function:\n```typescript\nasync function waitFor\u003cT>(\n  condition: () => T | undefined | null | false,\n  description: string,\n  timeoutMs = 5000\n): Promise\u003cT> {\n  const startTime = Date.now();\n\n  while (true) {\n    const result = condition();\n    if (result) return result;\n\n    if (Date.now() - startTime > timeoutMs) {\n      throw new Error(`Timeout waiting for ${description} after ${timeoutMs}ms`);\n    }\n\n    await new Promise(r => setTimeout(r, 10)); // Poll every 10ms\n  }\n}\n```\n\nSee `condition-based-waiting-example.ts` in this directory for complete implementation with domain-specific helpers (`waitForEvent`, `waitForEventCount`, `waitForEventMatch`) from actual debugging session.\n\n## Common Mistakes\n\n**❌ Polling too fast:** `setTimeout(check, 1)` - wastes CPU\n**✅ Fix:** Poll every 10ms\n\n**❌ No timeout:** Loop forever if condition never met\n**✅ Fix:** Always include timeout with clear error\n\n**❌ Stale data:** Cache state before loop\n**✅ Fix:** Call getter inside loop for fresh data\n\n## When Arbitrary Timeout IS Correct\n\n```typescript\n// Tool ticks every 100ms - need 2 ticks to verify partial output\nawait waitForEvent(manager, 'TOOL_STARTED'); // First: wait for condition\nawait new Promise(r => setTimeout(r, 200));   // Then: wait for timed behavior\n// 200ms = 2 ticks at 100ms intervals - documented and justified\n```\n\n**Requirements:**\n1. First wait for triggering condition\n2. Based on known timing (not guessing)\n3. Comment explaining WHY\n\n## Real-World Impact\n\nFrom debugging session (2025-10-03):\n- Fixed 15 flaky tests across 3 files\n- Pass rate: 60% → 100%\n- Execution time: 40% faster\n- No more race conditions"},"source-d2174c3d147e85ba-s1":{"body":"来源：`skills/systematic-debugging/condition-based-waiting.md:1-2`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# Condition-Based Waiting\n"},"source-d2174c3d147e85ba-s2":{"body":"来源：`skills/systematic-debugging/condition-based-waiting.md:3-8`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Overview\n\nFlaky tests often guess at timing with arbitrary delays. This creates race conditions where tests pass on fast machines but fail under load or in CI.\n\n**Core principle:** Wait for the actual condition you care about, not a guess about how long it takes.\n"},"source-d2174c3d147e85ba-s3":{"body":"来源：`skills/systematic-debugging/condition-based-waiting.md:9-33`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## When to Use\n\n```dot\ndigraph when_to_use {\n    \"Test uses setTimeout/sleep?\" [shape=diamond];\n    \"Testing timing behavior?\" [shape=diamond];\n    \"Document WHY timeout needed\" [shape=box];\n    \"Use condition-based waiting\" [shape=box];\n\n    \"Test uses setTimeout/sleep?\" -> \"Testing timing behavior?\" [label=\"yes\"];\n    \"Testing timing behavior?\" -> \"Document WHY timeout needed\" [label=\"yes\"];\n    \"Testing timing behavior?\" -> \"Use condition-based waiting\" [label=\"no\"];\n}\n```\n\n**Use when:**\n- Tests have arbitrary delays (`setTimeout`, `sleep`, `time.sleep()`)\n- Tests are flaky (pass sometimes, fail under load)\n- Tests timeout when run in parallel\n- Waiting for async operations to complete\n\n**Don't use when:**\n- Testing actual timing behavior (debounce, throttle intervals)\n- Always document WHY if using arbitrary timeout\n"},"source-d2174c3d147e85ba-s4":{"body":"来源：`skills/systematic-debugging/condition-based-waiting.md:34-47`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Core Pattern\n\n```typescript\n// ❌ BEFORE: Guessing at timing\nawait new Promise(r => setTimeout(r, 50));\nconst result = getResult();\nexpect(result).toBeDefined();\n\n// ✅ AFTER: Waiting for condition\nawait waitFor(() => getResult() !== undefined);\nconst result = getResult();\nexpect(result).toBeDefined();\n```\n"},"source-d2174c3d147e85ba-s5":{"body":"来源：`skills/systematic-debugging/condition-based-waiting.md:48-57`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Quick Patterns\n\n| Scenario | Pattern |\n|----------|---------|\n| Wait for event | `waitFor(() => events.find(e => e.type === 'DONE'))` |\n| Wait for state | `waitFor(() => machine.state === 'ready')` |\n| Wait for count | `waitFor(() => items.length >= 5)` |\n| Wait for file | `waitFor(() => fs.existsSync(path))` |\n| Complex condition | `waitFor(() => obj.ready && obj.value > 10)` |\n"},"source-d2174c3d147e85ba-s6":{"body":"来源：`skills/systematic-debugging/condition-based-waiting.md:58-83`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Implementation\n\nGeneric polling function:\n```typescript\nasync function waitFor\u003cT>(\n  condition: () => T | undefined | null | false,\n  description: string,\n  timeoutMs = 5000\n): Promise\u003cT> {\n  const startTime = Date.now();\n\n  while (true) {\n    const result = condition();\n    if (result) return result;\n\n    if (Date.now() - startTime > timeoutMs) {\n      throw new Error(`Timeout waiting for ${description} after ${timeoutMs}ms`);\n    }\n\n    await new Promise(r => setTimeout(r, 10)); // Poll every 10ms\n  }\n}\n```\n\nSee `condition-based-waiting-example.ts` in this directory for complete implementation with domain-specific helpers (`waitForEvent`, `waitForEventCount`, `waitForEventMatch`) from actual debugging session.\n"},"source-d2174c3d147e85ba-s7":{"body":"来源：`skills/systematic-debugging/condition-based-waiting.md:84-94`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Common Mistakes\n\n**❌ Polling too fast:** `setTimeout(check, 1)` - wastes CPU\n**✅ Fix:** Poll every 10ms\n\n**❌ No timeout:** Loop forever if condition never met\n**✅ Fix:** Always include timeout with clear error\n\n**❌ Stale data:** Cache state before loop\n**✅ Fix:** Call getter inside loop for fresh data\n"},"source-d2174c3d147e85ba-s8":{"body":"来源：`skills/systematic-debugging/condition-based-waiting.md:95-108`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## When Arbitrary Timeout IS Correct\n\n```typescript\n// Tool ticks every 100ms - need 2 ticks to verify partial output\nawait waitForEvent(manager, 'TOOL_STARTED'); // First: wait for condition\nawait new Promise(r => setTimeout(r, 200));   // Then: wait for timed behavior\n// 200ms = 2 ticks at 100ms intervals - documented and justified\n```\n\n**Requirements:**\n1. First wait for triggering condition\n2. Based on known timing (not guessing)\n3. Comment explaining WHY\n"},"source-d2174c3d147e85ba-s9":{"body":"来源：`skills/systematic-debugging/condition-based-waiting.md:109-115`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Real-World Impact\n\nFrom debugging session (2025-10-03):\n- Fixed 15 flaky tests across 3 files\n- Pass rate: 60% → 100%\n- Execution time: 40% faster\n- No more race conditions"},"folder:reference:skills/test-driven-development":{"body":"# skills/test-driven-development\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。"},"source-217238a2eb136c10":{"body":"# skills/test-driven-development/writing-good-tests.md\n\n范围：按任务和引用关系判断 / Conditional\n\n来源于：skills/test-driven-development/SKILL.md\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n# Writing Good Tests\n\n**Load this reference when:** writing or changing tests, adding mocks, or\nadding cleanup/helper methods for tests.\n\n## Overview\n\nA test exists to catch a specific break. Two principles govern everything\nhere:\n\n```\n1. Every test names the break it catches\n2. Every test exercises the real thing\n```\n\nStrict TDD produces both naturally: a test written first and watched\nfailing against real code has already proven it can fail, and only earns\na mock when the real dependency proves slow or external.\n\n## Principle 1: Name the Break\n\nBefore writing the test body, answer: **what production change should\nmake this test fail — and is that change a bug or a decision?** A test\nearns its place by catching a wrong branch, missing side effect, wrong\nargument, boundary case, or broken contract.\n\n**Derive expectations independently.** Use literals and hand-checked\nfixtures; table-driven tests with literal `want` values are the preferred\nshape. An expectation computed by the code under test — or its helpers —\npasses no matter what that code does:\n\n```typescript\n// ❌ Mirror assertion: the same builder computes both sides — always true\nconst expected = buildSearchQuery({ tag: 'urgent' });\nexpect(buildSearchQuery({ tag: 'urgent' })).toBe(expected);\n\n// ✅ Hand-derived literal\nexpect(buildSearchQuery({ tag: 'urgent' })).toBe('tag:\"urgent\"');\n```\n\n**No change detectors.** If only intentional decisions can fail a test —\na constant's value, exact message wording, private structure — it fires\non redesign and sleeps through bugs. Test the behavior that depends on\nthe decision: not `expect(MAX_RETRIES).toBe(5)` but \"a failing call is\nretried 5 times and the 6th attempt never happens.\"\n\n**Behavior, not text.** Asserting that a script, skill, or config\ncontains an exact line proves only that the source is the source. Run\nscripts against controlled inputs and assert outputs, side effects, or\nexit codes. Documents that instruct agents are tested by the consuming\nagent's behavior (superpowers:writing-skills); prose for humans earns no\ntest at all.\n\n**Your code, not the framework.** Test the contract your code makes at\nits boundaries — the route you register, the query you emit, the payload\nyou produce. Upstream mechanics are their maintainers' tests to write\n(the classic: asserting your router invokes a registered handler — that\nis the framework's test, not yours). When upstream behavior genuinely\nsurprised you, write one narrow characterization test naming the\nassumption. The same boundary applies inside your code: constructors,\ngetters, constants, and trivial forwarding earn tests only when they\nvalidate, normalize, default, derive, enforce, or cause side effects —\notherwise assert the first consumer-visible result that depends on them.\n\n### Gate Function\n\n```\nBEFORE writing the test body:\n  Name the production change that would make this test fail.\n\n  Cannot name one            → redesign around an observable behavior\n  \"The source text changed\"  → run the artifact and assert its effects\n  Only intentional decisions → change detector; test the behavior\n                               that depends on the decision\n\n  Confirm the expected value is derived without the code under test.\n  IF it reuses the code's logic or helpers:\n    Replace it with a literal or hand-checked fixture\n```\n\n## Principle 2: Exercise the Real Thing\n\n**The mock earns no assertions.** A mock assertion passes when the mock\nis present and fails when it is absent — it says nothing about the\ncomponent. Assert the real component's behavior; if the mock is what you\nare checking, unmock it or delete the assertion.\n\n```typescript\n// ✅ Real behavior\nexpect(screen.getByRole('navigation')).toBeInTheDocument();\n\n// ❌ Mock existence\nexpect(screen.getByTestId('sidebar-mock')).toBeInTheDocument();\n```\n\n**your human partner's correction:** \"Are we testing the behavior of a\nmock?\"\n\n**Mock at the right level.** Learn every side effect of the real method\nbefore replacing it; mock the slow or external operation and keep what\nthe test depends on real. When unsure, run the test against the real\nimplementation first and observe what actually needs to happen.\n\n```typescript\n// ❌ The mock swallows the config write that duplicate detection reads\nvi.mock('ToolCatalog', () => ({\n  discoverAndCacheTools: vi.fn().mockResolvedValue(undefined)\n}));\n\n// ✅ Mock only the slow server startup; the config write stays real\nvi.mock('MCPServerManager');\n```\n\n**Make doubles specific.** When arguments, call counts, or ordering are\npart of the contract, assert them — a fake that accepts anything verifies\nnothing. Give each branch (success, error, malformed) its own fixture or\nspy, so the wrong branch cannot satisfy the expectation.\n\n**Mirror real data completely.** Mock the complete structure as it exists\nin reality — all documented fields — not just the ones your test reads.\nPartial mocks fail silently when downstream code reads an omitted field:\nthe test passes while integration breaks.\n\n**Production classes carry production methods only.** Cleanup that only\ntests need lives in test utilities, never as a `destroy()` on the\nproduction class. Ask: is this method called only from tests? Does this\nclass own this resource's lifecycle? Wrong answers → test utility.\n\n**Prefer real components over complex mocks.** When mock setup outgrows\nthe test logic, mocks miss methods the real components have, or tests\nbreak when the mock changes, switch to an integration test with real\ncomponents. **your human partner's question:** \"Do we need to be using a\nmock here?\"\n\n### Gate Function\n\n```\nBEFORE adding a mock or test helper:\n  List the real method's side effects; keep the ones the test\n  depends on real — mock the slow/external level below them.\n\n  Mock responses mirror the complete real structure.\n\n  A method only tests call lives in test utilities, not production.\n\n  About to assert on the mock itself?\n    Unmock it or delete the assertion.\n```\n\n## Tests Ship With the Implementation\n\nThe TDD cycle — failing test, minimal implementation, refactor — is what\n\"complete\" means. Ship the tests the behavior needs and only those:\ntrivial code and human prose earn none, and a test written to satisfy\nprocess costs maintenance forever.\n\n## The Mutation Check\n\nBefore finishing, mentally mutate the production code; at least one test\nshould fail for each realistic mutation:\n\n- Wrong constant or argument\n- Wrong branch handler\n- Missing state change or side effect\n- Empty or default return\n- Missing validation for zero, empty, nil, unauthorized, or malformed input\n\nA mutation nothing catches marks the behavior as unprotected — or the\ntest as tautological.\n\n## Quick Reference\n\n| When you... | Do |\n|-------------|-----|\n| Write any test | Name the break it catches — a bug, not a decision |\n| Build an expected value | Derive it by hand; never with the code under test |\n| Test a script or document | Run it / pressure-test its consumer; never grep its text |\n| Reach for a dependency test | Test your boundary contract, not their documented mechanics |\n| Want to assert on a mocked element | Test the real component, or unmock it |\n| Are about to mock a method | Learn its side effects; mock the slow/external level |\n| Build a mock response | Mirror the real structure completely |\n| Need cleanup only tests use | Put it in test utilities |\n| Watch mock setup balloon | Switch to an integration test with real components |\n| Finish a test file | Run the mutation check |\n\n## Warning Signs\n\n- Setup and assertion share the same object, guaranteeing equality\n- The test can fail only through a panic, crash, or missing selector\n- The test fails on every intentional change, never on accidental breakage\n- Expected values are hidden behind loops, builders, or helpers\n- The test greps source text, or asserts a removed symbol stays removed\n- The test would still matter if only the framework remained\n- The test exists for coverage, checking no side effect or outcome\n- An assertion checks a `*-mock` test ID, or fails if you remove the mock\n- A method is called only from test files\n- Mock setup is more than half the test, or you can't explain why the mock is needed\n- Mocking \"just to be safe\""},"source-217238a2eb136c10-s1":{"body":"来源：`skills/test-driven-development/writing-good-tests.md:1-5`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# Writing Good Tests\n\n**Load this reference when:** writing or changing tests, adding mocks, or\nadding cleanup/helper methods for tests.\n"},"source-217238a2eb136c10-s2":{"body":"来源：`skills/test-driven-development/writing-good-tests.md:6-19`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Overview\n\nA test exists to catch a specific break. Two principles govern everything\nhere:\n\n```\n1. Every test names the break it catches\n2. Every test exercises the real s question:** \"Do we need to be using a\nmock here?\"\n"},"source-217238a2eb136c10-s6":{"body":"来源：`skills/test-driven-development/writing-good-tests.md:135-149`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### Gate Function\n\n```\nBEFORE adding a mock or test helper:\n  List the real method's side effects; keep the ones the test\n  depends on real — mock the slow/external level below them.\n\n  Mock responses mirror the complete real structure.\n\n  A method only tests call lives in test utilities, not production.\n\n  About to assert on the mock itself?\n    Unmock it or delete the assertion.\n```\n"},"source-217238a2eb136c10-s7":{"body":"来源：`skills/test-driven-development/writing-good-tests.md:150-156`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Tests Ship With the Implementation\n\nThe TDD cycle — failing test, minimal implementation, refactor — is what\n\"complete\" means. Ship the tests the behavior needs and only those:\ntrivial code and human prose earn none, and a test written to satisfy\nprocess costs maintenance forever.\n"},"source-217238a2eb136c10-s8":{"body":"来源：`skills/test-driven-development/writing-good-tests.md:157-170`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## The Mutation Check\n\nBefore finishing, mentally mutate the production code; at least one test\nshould fail for each realistic mutation:\n\n- Wrong constant or argument\n- Wrong branch handler\n- Missing state change or side effect\n- Empty or default return\n- Missing validation for zero, empty, nil, unauthorized, or malformed input\n\nA mutation nothing catches marks the behavior as unprotected — or the\ntest as tautological.\n"},"source-217238a2eb136c10-s9":{"body":"来源：`skills/test-driven-development/writing-good-tests.md:171-185`\n\n约束来源图 / Constraint source graph 审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。"},"folder:reference:skills/using-superpowers/references":{"body":"# skills/using-superpowers/references\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。"},"source-57b160970f2d1839":{"body":"# skills/using-superpowers/references/claude-code-tools.md\n\n范围：按任务和引用关系判断 / Conditional\n\n来源于：skills/using-superpowers/SKILL.md\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n# Claude Code Tool Notes\n\nClaude Code is the reference harness: skills speak its vocabulary\n(`Agent` for a subagent dispatch, todos, `Skill`). These notes cover the\none place Claude Code can run a plan cheaper than the skills' default\nshape. It is opt-in by your human partner and changes nothing the skills\nrequire.\n\n## Cheaper orchestration for subagent-driven development\n\nThe controller session is the most expensive seat in a\nsuperpowers:subagent-driven-development run: it reads every dispatch\nresult and every report, and it usually runs on the session's most\ncapable model. Claude Code supports nested subagents (three layers below\nthe main conversation by default; `CLAUDE_CODE_MAX_SUBAGENT_SPAWN_DEPTH`\nadjusts it), so the whole loop can run one layer down.\n\nWhen your human partner asks for it — or has said the session model is\ntoo expensive to spend on coordination — dispatch ONE orchestrator\nsubagent on a mid-tier model with the plan path and the instruction to\nuse superpowers:subagent-driven-development end to end. The orchestrator\ndispatches its own implementers and reviewers per that skill's Model\nSelection; the workspace and ledger live on disk, so nothing is lost to\nthe extra layer. Its final message must carry the \"Rulings I made\" list\nverbatim — that list is how the decisions reach your human partner, and\nyou relay it, not summarize it.\n\nDo this only for a whole plan. Nesting a single task's dispatch buys\nnothing and adds a seat."},"source-57b160970f2d1839-s1":{"body":"来源：`skills/using-superpowers/references/claude-code-tools.md:1-8`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# Claude Code Tool Notes\n\nClaude Code is the reference harness: skills speak its vocabulary\n(`Agent` for a subagent dispatch, todos, `Skill`). These notes cover the\none place Claude Code can run a plan cheaper than the skills' default\nshape. It is opt-in by your human partner and changes nothing the skills\nrequire.\n"},"source-57b160970f2d1839-s2":{"body":"来源：`skills/using-superpowers/references/claude-code-tools.md:9-29`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Cheaper orchestration for subagent-driven development\n\nThe controller session is the most expensive seat in a\nsuperpowers:subagent-driven-development run: it reads every dispatch\nresult and every report, and it usually runs on the session's most\ncapable model. Claude Code supports nested subagents (three layers below\nthe main conversation by default; `CLAUDE_CODE_MAX_SUBAGENT_SPAWN_DEPTH`\nadjusts it), so the whole loop can run one layer down.\n\nWhen your human partner asks for it — or has said the session model is\ntoo expensive to spend on coordination — dispatch ONE orchestrator\nsubagent on a mid-tier model with the plan path and the instruction to\nuse superpowers:subagent-driven-development end to end. The orchestrator\ndispatches its own implementers and reviewers per that skill's Model\nSelection; the workspace and ledger live on disk, so nothing is lost to\nthe extra layer. Its final message must carry the \"Rulings I made\" list\nverbatim — that list is how the decisions reach your human partner, and\nyou relay it, not summarize it.\n\nDo this only for a whole plan. Nesting a single task's dispatch buys\nnothing and adds a seat."},"source-1dde5fac652e556c":{"body":"# skills/using-superpowers/references/codex-tools.md\n\n范围：按任务和引用关系判断 / Conditional\n\n来源于：skills/using-superpowers/SKILL.md\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n## Subagent dispatch requires multi-agent support\n\nAdd to your Codex config (`~/.codex/config.toml`):\n\n```toml\n[features]\nmulti_agent = true\n```\n\nThis enables the multi-agent tools that skills like\n`dispatching-parallel-agents` and `subagent-driven-development` use.\nWhich tools you get depends on the multi-agent version your model\npreset selects (current presets run V2; older ones run V1). Trust your\nactual tool list over any table — including this one — when they\ndisagree.\n\n- **Spawning:** give children a clean context with\n  `spawn_agent {fork_turns: \"none\"}`; the default `\"all\"` copies your\n  entire transcript into the child. On Codex 0.145+, role files under\n  `~/.codex/agents/` attach to isolated forks via `agent_type`.\n  Full-history forks accept `model` and `reasoning_effort` overrides\n  (only `agent_type` is refused there) — isolated forks are the SDD\n  default for context hygiene, not because overrides require them.\n- **Fix rounds:** resume the implementer with `followup_task` — it\n  delivers your message, triggers a turn, and transparently reloads a\n  child the harness evicted. Never dispatch a fresh implementer on the\n  theory that a spawned agent cannot be messaged again; on V2 it\n  always can.\n- **Lifecycle:** V2 has no `close_agent`. Finished children are\n  evicted automatically when slots are needed; leaving them unclosed\n  costs nothing. Only V1 sessions have `close_agent` — there, close\n  reviewers when their review returns, and close each implementer\n  after its task's review passes.\n- **Model names:** never copy a model name from a skill, table, or old\n  session into `spawn_agent` without checking it against your current\n  spawn allowlist — V2 accepts only V2-capable presets and hard-errors\n  on the rest.\n\n## Waiting on children\n\n`wait_agent` is an event subscription, not a poll: a long wait wakes\nthe moment a child produces mailbox activity, with the same latency as\na short one. Short-timeout polling buys nothing and costs a tool call —\nand a context rebill — per poll. In measured sessions, roughly\ntwo-thirds of all wait calls were short polls that timed out.\n\n- While you still have local work, do not wait at all. A completed\n  child's final answer is pushed into your mailbox and arrives with\n  your next turn.\n- When you are genuinely idle with children outstanding, wait in\n  bounded stretches: `wait_agent` with `timeout_ms` 300000-600000\n  (5-10 minutes). After each stretch — wake or timeout — post one\n  status line, run `list_agents`, and chase any child that finished\n  without reporting. Never stack polls shorter than five minutes; the\n  event subscription wakes a bounded stretch just as fast as a short\n  one.\n- Completion mail cannot wake an idle controller (it is delivered\n  without triggering a turn); covering that idle window is\n  `wait_agent`'s only job. A stretch that times out with no activity\n  is your cue to reconcile, not to shorten the next stretch.\n\n## Model routing on spawns\n\nEvery `spawn_agent` you issue — including when you are yourself a\nspawned child running a fan-out — sets `model` AND `reasoning_effort`\nexplicitly, per the Model Selection rules of the skill you are\nexecuting. Setting `model` alone is a trap: the child's effort\nsilently resets to that model's default, not to yours.\n\nAsk your human partner to add a machine-level backstop to\n`~/.codex/config.toml` so any spawn that slips through still routes to\na deliberate tier instead of silently inheriting the session's most\nexpensive model:\n\n```toml\n[agents]\ndefault_subagent_model = \"\u003ca mid-tier model from your spawn allowlist>\"\ndefault_subagent_reasoning_effort = \"medium\"\n```\n\n## Environment Detection\n\nSkills that create worktrees or finish branches should detect their\nenvironment with read-only git commands before proceeding:\n\n```bash\nGIT_DIR=$(cd \"$(git rev-parse --git-dir)\" 2>/dev/null && pwd -P)\nGIT_COMMON=$(cd \"$(git rev-parse --git-common-dir)\" 2>/dev/null && pwd -P)\nBRANCH=$(git branch --show-current)\n```\n\n- `GIT_DIR != GIT_COMMON` → already in a linked worktree (skip creation)\n- `BRANCH` empty → detached HEAD (cannot branch/push/PR from sandbox)\n\nSee `using-git-worktrees` Step 0 and `finishing-a-development-branch`\nStep 1 for how each skill uses these signals.\n\n## Codex App Finishing\n\nWhen the sandbox blocks branch/push operations (detached HEAD in an\nexternally managed worktree), the agent commits all work and informs\nthe user to use the App's native controls:\n\n- **\"Create branch\"** — names the branch, then commit/push/PR via App UI\n- **\"Hand off to local\"** — transfers work to the user's local checkout\n\nThe agent can still run tests, stage files, and output suggested branch\nnames, commit messages, and PR descriptions for the user to copy."},"source-1dde5fac652e556c-s1":{"body":"来源：`skills/using-superpowers/references/codex-tools.md:1-38`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Subagent dispatch requires multi-agent support\n\nAdd to your Codex config (`~/.codex/config.toml`):\n\n```toml\n[features]\nmulti_agent = true\n```\n\nThis enables the multi-agent tools that skills like\n`dispatching-parallel-agents` and `subagent-driven-development` use.\nWhich tools you get depends on the multi-agent version your model\npreset selects (current presets run V2; older ones run V1). Trust your\nactual tool list over any table — including this one — when they\ndisagree.\n\n- **Spawning:** give children a clean context with\n  `spawn_agent {fork_turns: \"none\"}`; the default `\"a
