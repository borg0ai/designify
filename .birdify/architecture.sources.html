 pre-flight review\" [shape=box];\n    \"More tasks remain?\" [shape=diamond];\n    \"Dispatch final code reviewer (../requesting-code-review/code-reviewer.md)\" [shape=box];\n    \"Final findings? ONE fix dispatch, one scoped re-review, adjudicate residuals\" [shape=box];\n    \"Final review clean: delete this plan's workspace\" [shape=box];\n    \"Use superpowers:finishing-a-development-branch\" [shape=box style=filled fillcolor=lightgreen];\n\n    \"Setup: worktree, ledger check, read plan, pre-flight review\" -> \"Dispatch implementer subagent (./implementer-prompt.md)\";\n    \"Dispatch implementer subagent (./implementer-prompt.md)\" -> \"Implementer asks questions?\";\n    \"Implementer asks questions?\" -> \"Answer questions, provide context\" [label=\"yes\"];\n    \"Answer questions, provide context\" -> \"Implementer implements, tests, commits, self-reviews\";\n    \"Implementer asks questions?\" -> \"Implementer implements, tests, commits, self-reviews\" [label=\"no\"];\n    \"Implementer implements, tests, commits, self-reviews\" -> \"Generate review package, dispatch task reviewer (./task-reviewer-prompt.md)\";\n    \"Generate review package, dispatch task reviewer (./task-reviewer-prompt.md)\" -> \"Spec ✅ and quality approved?\";\n    \"Spec ✅ and quality approved?\" -> \"Append completion to ledger, mark todo complete\" [label=\"yes\"];\n    \"Spec ✅ and quality approved?\" -> \"Finding conflicts with plan text?\" [label=\"no\"];\n    \"Finding conflicts with plan text?\" -> \"Rule on the conflict, ledger the ruling\" [label=\"yes\"];\n    \"Rule on the conflict, ledger the ruling\" -> \"Fix round R of 5: R≤3 resume implementer; R≥4 fresh implementer, more capable model\";\n    \"Finding conflicts with plan text?\" -> \"Fix round R of 5: R≤3 resume implementer; R≥4 fresh implementer, more capable model\" [label=\"no\"];\n    \"Fix round R of 5: R≤3 resume implementer; R≥4 fresh implementer, more capable model\" -> \"Dispatch scoped re-review (./re-review-prompt.md)\";\n    \"Dispatch scoped re-review (./re-review-prompt.md)\" -> \"All findings addressed?\";\n    \"All findings addressed?\" -> \"Append completion to ledger, mark todo complete\" [label=\"yes\"];\n    \"All findings addressed?\" -> \"R = 5?\" [label=\"no\"];\n    \"R = 5?\" -> \"Fix round R of 5: R≤3 resume implementer; R≥4 fresh implementer, more capable model\" [label=\"no - next round\"];\n    \"R = 5?\" -> \"Adjudicate each open finding\" [label=\"yes - breaker trips\"];\n    \"Adjudicate each open finding\" -> \"Any load-bearing finding?\";\n    \"Any load-bearing finding?\" -> \"Rule and continue; stop only if every path forward is a guess\" [label=\"yes\"];\n    \"Any load-bearing finding?\" -> \"Park findings in ledger with rulings\" [label=\"no\"];\n    \"Park findings in ledger with rulings\" -> \"Append completion to ledger, mark todo complete\";\n    \"Append completion to ledger, mark todo complete\" -> \"More tasks remain?\";\n    \"More tasks remain?\" -> \"Dispatch implementer subagent (./implementer-prompt.md)\" [label=\"yes\"];\n    \"More tasks remain?\" -> \"Dispatch final code reviewer (../requesting-code-review/code-reviewer.md)\" [label=\"no\"];\n    \"Dispatch final code reviewer (../requesting-code-review/code-reviewer.md)\" -> \"Final findings? ONE fix dispatch, one scoped re-review, adjudicate residuals\";\n    \"Final findings? ONE fix dispatch, one scoped re-review, adjudicate residuals\" -> \"Final review clean: delete this plan's workspace\";\n    \"Final review clean: delete this plan's workspace\" -> \"Use superpowers:finishing-a-development-branch\";\n}\n```\n\n## Setup\n\nEnsure the work happens in an isolated workspace: use\nsuperpowers:using-git-worktrees to create one or verify the existing one.\nNever start implementation on a main/master branch without your human\npartner's explicit consent.\n\nConversation memory does not survive compaction. In real sessions,\ncontrollers that lost their place have re-dispatched entire completed task\nsequences — the single most expensive failure observed. Track progress in\na ledger file, not only in todos.\n\n- Each plan owns a workspace: at skill start, run this skill's\n  `bash scripts/sdd-workspace PLAN_FILE` — it prints the plan's git-ignored\n  directory (under `\u003crepo-root>/.superpowers/sdd/`), home to\n  every artifact for THIS plan: ledger, briefs, reports, review packages.\n  Another plan's directory is never yours to read or write.\n- Check for this plan's ledger at `\u003cworkspace>/progress.md`. If its first\n  line names your plan file, tasks with a `Task \u003cN>: complete` line are DONE\n  — do not re-dispatch them; resume at the first task without one. A task\n  whose last line is a fix round is mid-loop: resume the loop at the next\n  round. A ledger whose first line names a different plan file — or a stray\n  ledger at the old flat path `.superpowers/sdd/progress.md` — is another\n  plan's progress: leave it in place and start your own, fresh.\n- Create the ledger with its identity as the first line:\n  `# SDD ledger — plan: \u003cplan file path>`.\n- The ledger is your recovery map: the commits it names exist in git even\n  when your context no longer remembers creating them. After compaction,\n  trust the ledger and `git log` over your own recollection.\n- `git clean -fdx` will destroy the workspace (it's git-ignored scratch); if\n  that happens, recover from `git log`.\n\nRead the plan once, note its context and Global Constraints, and create a\ntodo per task. If the plan names a Spec, read that too: the spec is the\nauthority the plan argues from, and conflicts inside the plan resolve\nagainst it. A plan with no reachable spec gets a ledger note saying so —\nrulings made without one are provisional.\n\nBefore dispatching Task 1, scan the plan once for conflicts, writing down\nwhat you checked as you check it:\n\n- tasks that contradict each other or the plan's Global Constraints\n- anything the plan explicitly mandates that the review rubric treats as a\n  defect (a test that asserts nothing, verbatim duplication of a logic block)\n\nThe scan's output is a table, not a verdict. One row for every pair of tasks\nthat share a file or an interface: the two tasks, what one produces against\nwhat the other consumes, and what you found. One row for every task: whether\nits own text agrees with itself — the tests it specifies against the code it\nspecifies, the files it creates against the files it later touches. \"The scan\nis clean\" without those rows is not a scan you ran.\n\nWrite the table to the ledger. Rule on everything you find before execution\nbegins — each finding against the plan text that mandates it — and record\neach ruling in the ledger. If the scan is clean, proceed without comment.\nRule on each conflict it surfaces — the spec is the binding authority, the\nplan is its argument — record the ruling beside its row, and dispatch\nTask 1. The review loop remains the net for conflicts that only emerge from\nimplementation.\n\n## Model Selection\n\nUse the least powerful model that can handle each role to conserve cost and increase speed.\n\n**Mechanical implementation tasks** (isolated functions, clear specs, 1-2 files): use a fast, cheap model. Most implementation tasks are mechanical when the plan is well-specified.\n\n**Integration and judgment tasks** (multi-file coordination, pattern matching, debugging): use a standard model.\n\n**Architecture and design tasks**: use the most capable available model.\nThe final whole-branch review is one of these — dispatch it on the most\ncapable available model, not the session default.\n\n**Review tasks**: choose the model with the same judgment, scaled to the\ndiff's size, complexity, and risk. A small mechanical diff does not need the\nmost capable model; a subtle concurrency change does. Scoped re-reviews of\nsmall fix diffs take a cheap-to-mid tier.\n\n**Fix-loop escalation (rounds 4-5)**: use a model at least one tier above\nthe implementer that got stuck.\n\n**Always specify the model explicitly when dispatching a subagent.** An\nomitted model inherits your session's model — often the most capable and\nmost expensive — which silently defeats this section.\n\n**Turn count beats token price.** Wall-clock and context cost scale with how\nmany turns a subagent takes, and the cheapest models routinely take 2-3× the\nturns on multi-step work — costing more overall. Use a mid-tier model as the\nfloor for reviewers and for implementers working from prose descriptions.\nWhen the task's plan text contains the complete code to write, the\nimplementation is transcription plus testing: use the cheapest tier for\nthat implementer. Single-file mechanical fixes also take the cheapest tier.\n\n**Task complexity signals (implementation tasks):**\n- Touches 1-2 files with a complete spec → cheap model\n- Touches multiple files with integration concerns → standard model\n- Requires design judgment or broad codebase understanding → most capable model\n\n## The Task Loop\n\n**Batch small same-shape work.** When the plan lists several tasks that are\neach a small, independent edit of the same kind — the same one-line fix,\nconstant change, or field addition repeated across files — do not dispatch\none subagent per task. Compose ONE dispatch brief listing every file and\nits change, send the whole batch to a single subagent, and review its diff\nas one unit. Reserve one-dispatch-per-task for work that needs its own\njudgment, its own tests, or its own review surface.\n\nEverything you paste into a dispatch prompt — and everything a subagent\nprints back — stays resident in your context for the rest of the session\nand is re-read on every later turn. Hand artifacts over as files.\n\n**Waiting on dispatched subagents:** never poll a wait interface with\nshort timeouts, and never sit in one silent, open-ended wait either.\nWhile you have local work — ledger updates, packaging the next review,\nreading reports — keep working; child results arrive on their own.\nWhen you are genuinely idle, wait in bounded stretches (five to ten\nminutes, where your platform allows), and between stretches post one\nline of status and reconcile your live children: list them, and chase\nany that finished without reporting. A bounded stretch keeps nearly\nall of a long wait's efficiency while guaranteeing a stuck or lost\nchild is noticed within minutes, not at the end of the session.\n\n### 1. Dispatch the implementer\n\nRecord BASE (`git rev-parse HEAD`) before dispatching — the review package\nand fix-round diffs need it.\n\n- **Task brief:** before dispatching an implementer, run this skill's\n  `bash scripts/task-brief PLAN_FILE N` — it extracts the task's full text to a\n  uniquely named file and prints the path. Compose the dispatch so the\n  brief stays the single source of\n  requirements. Your dispatch should contain: (1) one line on where this\n  task fits in the project; (2) the brief path, introduced as \"read this\n  first — it is your requirements, with the exact values to use verbatim\";\n  (3) interfaces and decisions from earlier tasks that the brief cannot\n  know; (4) your resolution of any ambiguity you noticed in the brief;\n  (5) the report-file path and report contract. Exact values (numbers,\n  magic strings, signatures, test cases) appear only in the brief. Never\n  make a subagent read the whole plan file.\n- **Report file:** name the implementer's report file after the brief\n  (brief `…/task-N-brief.md` → report `…/task-N-report.md`) and put it in\n  the dispatch prompt. The implementer writes the full report there and\n  returns only status, commits, a one-line test summary, and concerns.\n- A dispatch prompt describes one task, not the session's history. Do not\n  paste accumulated prior-task summaries (\"state after Tasks 1-3\") into\n  later dispatches — a real session's dispatch hit 42k chars of which 99%\n  was pasted history. A fresh subagent needs its task, the interfaces it\n  touches, and the global constraints. Nothing else.\n- The dispatch carries the no-subagents contract (it is in the\n  implementer template): the implementer never dispatches subagents —\n  not helpers, and never a reviewer. Review arrives from you, after the\n  report. In real sessions, every reviewer a worker spawned duplicated\n  the task review the controller dispatched anyway — a full extra\n  review seat per task.\n- If an earlier task parked a finding in the area this task touches, carry\n  a pointer to that ledger entry in the dispatch.\n- Record the implementer's agent identity from the dispatch result —\n  fix-loop rounds 1-3 resume this agent.\n- Never dispatch multiple implementation subagents in parallel (conflicts).\n\nTemplate: [implementer-prompt.md](implementer-prompt.md)\n\n### 2. Handle the report\n\nImplementer subagents report one of four statuses. Handle each appropriately:\n\n**DONE:** Generate the review package (`bash scripts/review-package PLAN_FILE BASE HEAD`, from this skill's directory — it prints the unique file path it wrote; BASE is the commit you recorded before dispatching the implementer — never `HEAD~1`, which silently drops all but the last commit of a multi-commit task), then dispatch the task reviewer with the printed path.\n\n**DONE_WITH_CONCERNS:** The implementer completed the work but flagged doubts. Read the concerns before proceeding. If the concerns are about correctness or scope, address them before review. If they're observations (e.g., \"this file is getting large\"), note them and proceed to review.\n\n**NEEDS_CONTEXT:** The implementer needs information that wasn't provided. Provide the missing context and re-dispatch.\n\n**BLOCKED:** The implementer cannot complete the task. Assess the blocker:\n1. If it's a context problem, provide more context and re-dispatch with the same model\n2. If the task requires more reasoning, re-dispatch with a more capable model\n3. If the task is too large, break it into smaller pieces\n4. If the plan itself is wrong, rule on the correction, ledger it, and re-dispatch with the ruling carried in the dispatch\n\n**Never** ignore an escalation or force the same model to retry without changes. If the implementer said it's stuck, something needs to change.\n\nIf the implementer asks questions — before starting or mid-task — answer\nclearly and completely, provide additional context if needed, and don't\nrush it into implementation.\n\n### 3. Review the task\n\nPer-task reviews are task-scoped gates. The broad review happens once, at the\nfinal whole-branch review. Never skip the task review, and never accept a\nreport missing either verdict — spec compliance AND task quality are both\nrequired. Implementer self-review never replaces the task review; both are\nneeded.\n\n- Hand the reviewer its diff as a file: run this skill's\n  `bash scripts/review-package PLAN_FILE BASE HEAD` and pass the reviewer the file path\n  it prints (or, without bash: `git log --oneline`, `git diff --stat`,\n  and `git diff -U10` for the range, redirected to one uniquely named\n  file). The output never enters your own context, and the reviewer sees\n  the commit list, stat summary, and full diff with context in one Read\n  call. Use the BASE you recorded before dispatching the implementer —\n  never `HEAD~1`, which silently truncates multi-commit tasks. Never\n  dispatch a task reviewer without a diff file.\n- **Reviewer inputs:** the task reviewer gets three paths — the same brief\n  file, the report file, and the review package — plus the global\n  constraints that bind the task.\n- The global-constraints block you hand the reviewer is its attention\n  lens. Copy the binding requirements verbatim from the plan's Global\n  Constraints section or the spec: exact values, exact formats, and the\n  stated relationships between components (\"same layout as X\", \"matches\n  Y\"). The reviewer's template already carries the process rules (YAGNI,\n  test hygiene, review method) — the constraints block is for what THIS\n  project's spec demands.\n- Do not add open-ended directives like \"check all uses\" or \"run race tests\n  if useful\" without a concrete, task-specific reason\n- Do not ask a reviewer to re-run tests the implementer already ran on the\n  same code — the implementer's report carries the test evidence\n- Do not pre-judge findings for the reviewer — never instruct a reviewer to\n  ignore or not flag a specific issue. If you believe a finding would be a\n  false positive, let the reviewer raise it and adjudicate it in the review\n  loop. If the prompt you are writing contains \"do not flag,\" \"don't treat X\n  as a defect,\" \"at most Minor,\" or \"the plan chose\" — stop: you are\n  pre-judging, usually to spare yourself a review loop.\nThe task reviewer may report \"⚠️ Cannot verify from diff\" items — requirements\nthat live in unchanged code or span tasks. These do not block the rest of the\nreview, but you must resolve each one yourself before marking the task\ncomplete: you hold the plan and cross-task context the reviewer\nlacks. If you confirm an item is a real gap, treat it as a failed spec\nreview — it enters the fix loop with the other findings.\n\nTemplate: [task-reviewer-prompt.md](task-reviewer-prompt.md)\n\n### 4. The fix loop\n\nThe loop triggers when the review reports spec ❌, any Critical or Important\nfinding, or a ⚠️ item you confirmed as a real gap.\n\nBefore the loop starts, two routes leave it immediately:\n\n- Record Minor findings in the progress ledger as you go\n  (`Task \u003cN>: minor (deferred): \u003cone-liner>`), and point the final\n  whole-branch review at that list so it can triage which must be fixed\n  before merge. A roll-up nobody reads is a silent discard. Minor findings\n  never enter the loop.\n- A finding labeled plan-mandated — or any finding that conflicts with\n  what the plan's text requires — is yours to rule on: weigh the finding\n  against the plan text, decide with the spec as the binding authority, and\n  ledger the ruling before you act on it. Do not dismiss the finding because\n  the plan mandates it, and do not dispatch a fix that contradicts the plan\n  without a recorded ruling.\nEverything else enters the loop. A fix round is one fix dispatch plus one\nscoped re-review. Five rounds maximum per task:\n\n**Rounds 1-3 — resume the original implementer.** Send it the open findings\nverbatim. Its context is intact: it knows the task, the code, and its own\nchoices. If your harness cannot send another message to a live subagent,\ndispatch a fresh implementer carrying the brief path, the report-file path,\nand the findings — the report file is the persistent memory either way.\n\n**Rounds 4-5 — dispatch a fresh implementer on a more capable model** (per\nModel Selection), with the brief path, the report-file path, the open\nfindings, and this framing: \"A prior implementer attempted this task\n[N] times; you own it now. Read the report file for what was tried.\" A loop\nthat survives three resumes usually means the implementer cannot see its\nown problem — fresh eyes and a capability bump in one move.\n\n**Every round, either way:** the implementer fixes, re-runs the tests\ncovering the amended code, appends its fix report to the same report file,\nand returns the short contract. Before re-dispatching the reviewer, confirm\nthe fix report contains the covering tests, the command run, and the\noutput; dispatch the re-review once all three are present. Name the\ncovering test files in the fix message — a one-line fix does not need the\nwhole suite.\n\n**The re-review is scoped.** Run `bash scripts/review-package PLAN_FILE FIX_BASE HEAD`\nwhere FIX_BASE is the head the previous review saw, and dispatch\n[re-review-prompt.md](re-review-prompt.md) with the findings list, the\nbrief, the report file, and the printed diff path. The re-reviewer verdicts\neach finding ADDRESSED or NOT ADDRESSED and flags new breakage in the fix\ndiff only. New Critical/Important breakage in the fix diff joins the open\nfindings list. Out-of-scope observations go to the ledger as deferred\nminors — they never extend the loop.\n\n**After each round,** append to the ledger:\n`Task \u003cN>: fix round \u003cR>/5 (\u003cX> addressed, \u003cY> open — \u003cfinding one-liners>; commits \u003ca7>..\u003cb7>)`\n\nNever fix findings yourself in the controller session — your context stays\nclean for coordination, and controller fixes skip review.\n\n**The breaker.** When round 5's re-review still leaves findings open, stop\ndispatching. Adjudicate each open finding yourself — you hold the plan and\nthe cross-task context the reviewer lacks:\n\n- **The reviewer is wrong, or the point is contestable:** park it —\n  `Task \u003cN>: parked — \u003cfinding> — Ruling: \u003cwhy the code stands>`. The final\n  review sees both sides.\n- **Real, but nothing downstream builds on it:** park it the same way, with\n  a ruling that says it's real and deferred.\n- **Real and load-bearing** — a later task builds on it, or it reveals a\n  plan defect: rule on the smallest change that unblocks the dependent work,\n  ledger it as `Task \u003cN>: Ruling: \u003cfinding> — \u003cwhat you decided and why>`,\n  and carry it into the next task's dispatch. Parking a structural failure\n  silently lets every dependent task build on it. Stop only when the defect\n  leaves every path forward a guess.\n\nAdjudicate only at the cap. Adjudicating earlier to end a loop is\npre-judging with a different name. Every adjudication is a ledger entry —\na silent discard is forbidden.\n\n### 5. Complete the task\n\nWhen the review comes back clean — or every open finding is parked with a\nruling at the cap — append the completion line to the ledger in the same\nmessage as your other bookkeeping:\n\n- `Task \u003cN>: complete (commits \u003cbase7>..\u003chead7>, review clean)`\n- `Task \u003cN>: complete (commits \u003cbase7>..\u003chead7>, \u003cK> parked)` after a\n  tripped breaker\n\nThen mark the todo complete and move on. Never move to the next task while\nthe review has open Critical/Important issues that are neither fixed nor\nparked-with-ruling at the cap.\n\n## Final Review\n\nThe final whole-branch review gets a package too: run\n`bash scripts/review-package PLAN_FILE MERGE_BASE HEAD` (MERGE_BASE = the commit the\nbranch started from, e.g. `git merge-base main HEAD`) and include the\nprinted path in the final review dispatch, so the final reviewer reads\none file instead of re-deriving the branch diff with git commands. Dispatch\non the most capable available model (see Model Selection), using\nsuperpowers:requesting-code-review's\n[code-reviewer.md](../requesting-code-review/code-reviewer.md). Point it at\nthe ledger's deferred-minor and parked lines so it can triage which must be\nfixed before merge.\n\nIf the final whole-branch review returns findings, dispatch ONE fix subagent\nwith the complete findings list — not one fixer per finding.\nPer-finding fixers each rebuild context and re-run suites; a real\nsession's final-review fix wave cost more than all its tasks combined.\nThen run exactly one scoped re-review of the fix wave\n(`bash scripts/review-package PLAN_FILE FIX_BASE HEAD` over the fix range,\n[re-review-prompt.md](re-review-prompt.md)).\nAdjudicate any residual findings as in the task loop's breaker: park with\nrulings, or rule on the load-bearing ones and ledger what you decided. Only\nthe four classes above stop you here. There is no second fix wave —\nresidual load-bearing findings surface to your human partner when\nfinishing-a-development-branch presents the options.\n\n## Finish\n\nBefore you delete anything, collect every ledger line containing `Ruling:` —\npreflight rulings, parked findings, breaker adjudications, all of them — into\nyour final message under \"Rulings I made\", in the order you made them, each\nwith what it costs if wrong. The list is exhaustive: if the ledger holds a\nruling, the list holds it. That list is the only place the decisions you\ntook on your human partner's behalf reach them — they read it and rework\nwhatever you got wrong. A ruling that dies with the workspace was a decision\nmade in secret.\n\nWhen the final whole-branch review is clean and its fixes are merged,\ndelete this plan's workspace (`rm -rf \u003cworkspace>`) — the git history is\nthe record now. Sibling directories belong to other plans; leave them\nalone.\n\nUse superpowers:finishing-a-development-branch.\n\n## Common Rationalizations\n\n| Excuse | Reality |\n|--------|---------|\n| \"Close enough on spec compliance\" | Reviewer found spec gaps = not done. Fix or hit the cap and adjudicate — those are the only exits. |\n| \"I'll fix it myself, dispatching is overhead\" | Controller fixes pollute your context and skip review. Resume the implementer. |\n| \"One more round will converge\" | Past the cap, rounds don't converge — the failure is structural. Adjudicate and route. |\n| \"The reviewer will just find something new anyway\" | Scoped re-reviews verify fixes; they cannot wander. New findings on untouched code go to the ledger, not the loop. |\n| \"This finding is obviously wrong, I'll drop it\" | You adjudicate only at the cap, and every ruling is a ledger entry. Silent discards are forbidden. |\n| \"The fix was small, skip the re-review\" | Unreviewed fixes are how regressions land. Every round ends with a scoped re-review. |\n| \"Reviews slow the loop down\" | The loop without reviews is just unverified churn. Reviews are the loop's brakes and steering. |\n| \"Ledger bookkeeping is overhead\" | The ledger is what survives compaction. Controllers without one have re-dispatched entire completed task sequences. |\n| \"The implementer spawned its own reviewer — free extra assurance\" | It's a duplicate seat reviewing the same diff; the task review is the gate. A worker-spawned reviewer is a defect to flag, not rigor. |\n\n## Example Workflow\n\n```\nYou: I'm using Subagent-Driven Development to execute this plan.\n\n[Setup: worktree verified]\n[Read plan file once: docs/superpowers/plans/feature-plan.md]\n[Resolve workspace: bash scripts/sdd-workspace docs/superpowers/plans/feature-plan.md — no ledger inside, fresh start]\n[Create todos for all tasks]\n\nTask 1: Hook installation script\n\n[Run task-brief for Task 1; dispatch implementer with brief + report paths + context]\n\nImplementer: \"Before I begin - should the hook be installed at user or system level?\"\n\nYou: \"User level (~/.config/superpowers/hooks/)\"\n\nImplementer: [Later]\n  - Implemented install-hook command\n  - Added tests, 5/5 passing\n  - Self-review: Found I missed --force flag, added it\n  - Committed\n\n[Run review-package PLAN_FILE BASE HEAD; dispatch task reviewer with the printed path]\nTask reviewer: Spec ✅ - all requirements met, nothing extra.\n  Strengths: Good test coverage, clean. Issues: None. Task quality: Approved.\n\n[Ledger: Task 1: complete (commits a1b2c3d..d4e5f6a, review clean)]\n\nTask 2: Recovery modes\n\n[Run task-brief for Task 2; dispatch implementer with brief + report paths + context]\n\nImplementer: [No questions]\n  - Added verify/repair modes\n  - 8/8 tests passing\n  - Committed\n\n[Run review-package PLAN_FILE BASE HEAD; dispatch task reviewer with the printed path]\nTask reviewer: Spec ❌:\n  - Missing: Progress reporting (spec says \"report every 100 items\")\n  Issues (Important): Magic number (100)\n\n[Fix round 1: resume the implementer with both findings]\nImplementer: Added progress reporting, extracted PROGRESS_INTERVAL constant.\n  Re-ran test/recovery.test.js — 10/10 passing. Fix report appended.\n\n[Run review-package PLAN_FILE FIX_BASE HEAD; dispatch scoped re-review]\nRe-reviewer: Missing progress reporting — ADDRESSED (src/recovery.js:41).\n  Magic number — ADDRESSED (src/recovery.js:7). New breakage: none.\n  Verdict: all findings addressed.\n\n[Ledger: Task 2: fix round 1/5 (2 addressed, 0 open; commits d4e5f6a..b7c8d9e)]\n[Ledger: Task 2: complete (commits d4e5f6a..b7c8d9e, review clean)]\n\n...\n\n[After all tasks]\n[Run review-package PLAN_FILE MERGE_BASE HEAD; dispatch final code-reviewer, most capable model]\nFinal reviewer: All requirements met. Deferred minors triaged: none block merge.\n\n[Delete this plan's workspace — the record now lives in git]\n\nDone! Using superpowers:finishing-a-development-branch.\n```"},"source-14acf0c010f3ff0e-s1":{"body":"来源：`skills/subagent-driven-development/SKILL.md:6-32`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# Subagent-Driven Development\n\nExecute plan by dispatching a fresh implementer subagent per task, a task review (spec compliance + code quality) after each, and a broad whole-branch review at the end.\n\n**Why subagents:** You delegate tasks to specialized agents with isolated context. By precisely crafting their instructions and context, you ensure they stay focused and succeed at their task. They should never inherit your session's context or history — you construct exactly what they need. This also preserves your own context for coordination work.\n\n**Core principle:** Fresh subagent per task + task review (spec + quality) + broad final review = high quality, fast iteration\n\n**Narration:** between tool calls, narrate at most one short line — the\nledger and the tool results carry the record.\n\n**Continuous execution:** Do not pause to check in with your human partner between tasks. Execute all tasks from the plan without stopping. The only reasons to stop are the four named below, or all tasks complete. \"Should I continue?\" prompts and progress summaries waste their time — they asked you to execute the plan, so execute it.\n\n**Rulings, not stalls.** A running plan does not wait on a human. Conflicts,\nambiguities, plan defects, a cap you would have asked to exceed — decide\nthem. The spec is the binding authority, the plan is its argument, and your\njudgment settles what neither answers. Record every decision in the ledger as\n`Ruling: \u003cwhat you decided> — \u003cwhy> — \u003cwhat it costs if wrong>`, and keep\ngoing. A wrong ruling costs rework your human partner can see and undo; a\nsession parked on a question costs their whole day and buys nothing.\n\nFour things stop you, and only these: an irreversible or destructive\noperation; a security-sensitive action; a side effect outside this worktree\nthat norms say you ask about first (a merge, a push to a shared branch, a\npublish); and a plan so broken that every path forward is a guess. For those,\nstop and ask.\n"},"source-14acf0c010f3ff0e-s2":{"body":"来源：`skills/subagent-driven-development/SKILL.md:33-58`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## When to Use\n\n```dot\ndigraph when_to_use {\n    \"Have implementation plan?\" [shape=diamond];\n    \"Tasks mostly independent?\" [shape=diamond];\n    \"Partner chose inline, or no subagent tool?\" [shape=diamond];\n    \"subagent-driven-development\" [shape=box];\n    \"executing-plans\" [shape=box];\n    \"Manual execution or brainstorm first\" [shape=box];\n\n    \"Have implementation plan?\" -> \"Tasks mostly independent?\" [label=\"yes\"];\n    \"Have implementation plan?\" -> \"Manual execution or brainstorm first\" [label=\"no\"];\n    \"Tasks mostly independent?\" -> \"Partner chose inline, or no subagent tool?\" [label=\"yes\"];\n    \"Tasks mostly independent?\" -> \"Manual execution or brainstorm first\" [label=\"no - tightly coupled\"];\n    \"Partner chose inline, or no subagent tool?\" -> \"executing-plans\" [label=\"yes\"];\n    \"Partner chose inline, or no subagent tool?\" -> \"subagent-driven-development\" [label=\"no\"];\n}\n```\n\n**vs. Executing Plans (inline):**\n- Fresh subagent per task (no context pollution) instead of one context doing every task\n- Review after each task (spec compliance + code quality) instead of only at the end\n- Costs a fresh context per task and per review; inline costs one context plus one final reviewer\n- Both run in this session, share the same plan workspace and ledger, and never pause between tasks\n"},"source-14acf0c010f3ff0e-s3":{"body":"来源：`skills/subagent-driven-development/SKILL.md:59-123`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## The Process\n\n```dot\ndigraph process {\n    rankdir=TB;\n\n    subgraph cluster_per_task {\n        label=\"Per Task\";\n        \"Dispatch implementer subagent (./implementer-prompt.md)\" [shape=box];\n        \"Implementer asks questions?\" [shape=diamond];\n        \"Answer questions, provide context\" [shape=box];\n        \"Implementer implements, tests, commits, self-reviews\" [shape=box];\n        \"Generate review package, dispatch task reviewer (./task-reviewer-prompt.md)\" [shape=box];\n        \"Spec ✅ and quality approved?\" [shape=diamond];\n        \"Finding conflicts with plan text?\" [shape=diamond];\n        \"Rule on the conflict, ledger the ruling\" [shape=box];\n        \"Fix round R of 5: R≤3 resume implementer; R≥4 fresh implementer, more capable model\" [shape=box];\n        \"Dispatch scoped re-review (./re-review-prompt.md)\" [shape=box];\n        \"All findings addressed?\" [shape=diamond];\n        \"R = 5?\" [shape=diamond];\n        \"Adjudicate each open finding\" [shape=box];\n        \"Any load-bearing finding?\" [shape=diamond];\n        \"Rule and continue; stop only if every path forward is a guess\" [shape=box];\n        \"Park findings in ledger with rulings\" [shape=box];\n        \"Append completion to ledger, mark todo complete\" [shape=box];\n    }\n\n    \"Setup: worktree, ledger check, read plan, pre-flight review\" [shape=box];\n    \"More tasks remain?\" [shape=diamond];\n    \"Dispatch final code reviewer (../requesting-code-review/code-reviewer.md)\" [shape=box];\n    \"Final findings? ONE fix dispatch, one scoped re-review, adjudicate residuals\" [shape=box];\n    \"Final review clean: delete this plan's workspace\" [shape=box];\n    \"Use superpowers:finishing-a-development-branch\" [shape=box style=filled fillcolor=lightgreen];\n\n    \"Setup: worktree, ledger check, read plan, pre-flight review\" -> \"Dispatch implementer subagent (./implementer-prompt.md)\";\n    \"Dispatch implementer subagent (./implementer-prompt.md)\" -> \"Implementer asks questions?\";\n    \"Implementer asks questions?\" -> \"Answer questions, provide context\" [label=\"yes\"];\n    \"Answer questions, provide context\" -> \"Implementer implements, tests, commits, self-reviews\";\n    \"Implementer asks questions?\" -> \"Implementer implements, tests, commits, self-reviews\" [label=\"no\"];\n    \"Implementer implements, tests, commits, self-reviews\" -> \"Generate review package, dispatch task reviewer (./task-reviewer-prompt.md)\";\n    \"Generate review package, dispatch task reviewer (./task-reviewer-prompt.md)\" -> \"Spec ✅ and quality approved?\";\n    \"Spec ✅ and quality approved?\" -> \"Append completion to ledger, mark todo complete\" [label=\"yes\"];\n    \"Spec ✅ and quality approved?\" -> \"Finding conflicts with plan text?\" [label=\"no\"];\n    \"Finding conflicts with plan text?\" -> \"Rule on the conflict, ledger the ruling\" [label=\"yes\"];\n    \"Rule on the conflict, ledger the ruling\" -> \"Fix round R of 5: R≤3 resume implementer; R≥4 fresh implementer, more capable model\";\n    \"Finding conflicts with plan text?\" -> \"Fix round R of 5: R≤3 resume implementer; R≥4 fresh implementer, more capable model\" [label=\"no\"];\n    \"Fix round R of 5: R≤3 resume implementer; R≥4 fresh implementer, more capable model\" -> \"Dispatch scoped re-review (./re-review-prompt.md)\";\n    \"Dispatch scoped re-review (./re-review-prompt.md)\" -> \"All findings addressed?\";\n    \"All findings addressed?\" -> \"Append completion to ledger, mark todo complete\" [label=\"yes\"];\n    \"All findings addressed?\" -> \"R = 5?\" [label=\"no\"];\n    \"R = 5?\" -> \"Fix round R of 5: R≤3 resume implementer; R≥4 fresh implementer, more capable model\" [label=\"no - next round\"];\n    \"R = 5?\" -> \"Adjudicate each open finding\" [label=\"yes - breaker trips\"];\n    \"Adjudicate each open finding\" -> \"Any load-bearing finding?\";\n    \"Any load-bearing finding?\" -> \"Rule and continue; stop only if every path forward is a guess\" [label=\"yes\"];\n    \"Any load-bearing finding?\" -> \"Park findings in ledger with rulings\" [label=\"no\"];\n    \"Park findings in ledger with rulings\" -> \"Append completion to ledger, mark todo complete\";\n    \"Append completion to ledger, mark todo complete\" -> \"More tasks remain?\";\n    \"More tasks remain?\" -> \"Dispatch implementer subagent (./implementer-prompt.md)\" [label=\"yes\"];\n    \"More tasks remain?\" -> \"Dispatch final code reviewer (../requesting-code-review/code-reviewer.md)\" [label=\"no\"];\n    \"Dispatch final code reviewer (../requesting-code-review/code-reviewer.md)\" -> \"Final findings? ONE fix dispatch, one scoped re-review, adjudicate residuals\";\n    \"Final findings? ONE fix dispatch, one scoped re-review, adjudicate residuals\" -> \"Final review clean: delete this plan's workspace\";\n    \"Final review clean: delete this plan's workspace\" -> \"Use superpowers:finishing-a-development-branch\";\n}\n```\n"},"source-14acf0c010f3ff0e-s4":{"body":"来源：`skills/subagent-driven-development/SKILL.md:124-183`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Setup\n\nEnsure the work happens in an isolated workspace: use\nsuperpowers:using-git-worktrees to create one or verify the existing one.\nNever start implementation on a main/master branch without your human\npartner's explicit consent.\n\nConversation memory does not survive compaction. In real sessions,\ncontrollers that lost their place have re-dispatched entire completed task\nsequences — the single most expensive failure observed. Track progress in\na ledger file, not only in todos.\n\n- Each plan owns a workspace: at skill start, run this skill's\n  `bash scripts/sdd-workspace PLAN_FILE` — it prints the plan's git-ignored\n  directory (under `\u003crepo-root>/.superpowers/sdd/`), home to\n  every artifact for THIS plan: ledger, briefs, reports, review packages.\n  Another plan's directory is never yours to read or write.\n- Check for this plan's ledger at `\u003cworkspace>/progress.md`. If its first\n  line names your plan file, tasks with a `Task \u003cN>: complete` line are DONE\n  — do not re-dispatch them; resume at the first task without one. A task\n  whose last line is a fix round is mid-loop: resume the loop at the next\n  round. A ledger whose first line names a different plan file — or a stray\n  ledger at the old flat path `.superpowers/sdd/progress.md` — is another\n  plan's progress: leave it in place and start your own, fresh.\n- Create the ledger with its identity as the first line:\n  `# SDD ledger — plan: \u003cplan file path>`.\n- The ledger is your recovery map: the commits it names exist in git even\n  when your context no longer remembers creating them. After compaction,\n  trust the ledger and `git log` over your own recollection.\n- `git clean -fdx` will destroy the workspace (it's git-ignored scratch); if\n  that happens, recover from `git log`.\n\nRead the plan once, note its context and Global Constraints, and create a\ntodo per task. If the plan names a Spec, read that too: the spec is the\nauthority the plan argues from, and conflicts inside the plan resolve\nagainst it. A plan with no reachable spec gets a ledger note saying so —\nrulings made without one are provisional.\n\nBefore dispatching Task 1, scan the plan once for conflicts, writing down\nwhat you checked as you check it:\n\n- tasks that contradict each other or the plan's Global Constraints\n- anything the plan explicitly mandates that the review rubric treats as a\n  defect (a test that asserts nothing, verbatim duplication of a logic block)\n\nThe scan's output is a table, not a verdict. One row for every pair of tasks\nthat share a file or an interface: the two tasks, what one produces against\nwhat the other consumes, and what you found. One row for every task: whether\nits own text agrees with itself — the tests it specifies against the code it\nspecifies, the files it creates against the files it later touches. \"The scan\nis clean\" without those rows is not a scan you ran.\n\nWrite the table to the ledger. Rule on everything you find before execution\nbegins — each finding against the plan text that mandates it — and record\neach ruling in the ledger. If the scan is clean, proceed without comment.\nRule on each conflict it surfaces — the spec is the binding authority, the\nplan is its argument — record the ruling beside its row, and dispatch\nTask 1. The review loop remains the net for conflicts that only emerge from\nimplementation.\n"},"source-14acf0c010f3ff0e-s5":{"body":"来源：`skills/subagent-driven-development/SKILL.md:184-220`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Model Selection\n\nUse the least powerful model that can handle each role to conserve cost and increase speed.\n\n**Mechanical implementation tasks** (isolated functions, clear specs, 1-2 files): use a fast, cheap model. Most implementation tasks are mechanical when the plan is well-specified.\n\n**Integration and judgment tasks** (multi-file coordination, pattern matching, debugging): use a standard model.\n\n**Architecture and design tasks**: use the most capable available model.\nThe final whole-branch review is one of these — dispatch it on the most\ncapable available model, not the session default.\n\n**Review tasks**: choose the model with the same judgment, scaled to the\ndiff's size, complexity, and risk. A small mechanical diff does not need the\nmost capable model; a subtle concurrency change does. Scoped re-reviews of\nsmall fix diffs take a cheap-to-mid tier.\n\n**Fix-loop escalation (rounds 4-5)**: use a model at least one tier above\nthe implementer that got stuck.\n\n**Always specify the model explicitly when dispatching a subagent.** An\nomitted model inherits your session's model — often the most capable and\nmost expensive — which silently defeats this section.\n\n**Turn count beats token price.** Wall-clock and context cost scale with how\nmany turns a subagent takes, and the cheapest models routinely take 2-3× the\nturns on multi-step work — costing more overall. Use a mid-tier model as the\nfloor for reviewers and for implementers working from prose descriptions.\nWhen the task's plan text contains the complete code to write, the\nimplementation is transcription plus testing: use the cheapest tier for\nthat implementer. Single-file mechanical fixes also take the cheapest tier.\n\n**Task complexity signals (implementation tasks):**\n- Touches 1-2 files with a complete spec → cheap model\n- Touches multiple files with integration concerns → standard model\n- Requires design judgment or broad codebase understanding → most capable model\n"},"source-14acf0c010f3ff0e-s6":{"body":"来源：`skills/subagent-driven-development/SKILL.md:221-245`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## The Task Loop\n\n**Batch small same-shape work.** When the plan lists several tasks that are\neach a small, independent edit of the same kind — the same one-line fix,\nconstant change, or field addition repeated across files — do not dispatch\none subagent per task. Compose ONE dispatch brief listing every file and\nits change, send the whole batch to a single subagent, and review its diff\nas one unit. Reserve one-dispatch-per-task for work that needs its own\njudgment, its own tests, or its own review surface.\n\nEverything you paste into a dispatch prompt — and everything a subagent\nprints back — stays resident in your context for the rest of the session\nand is re-read on every later turn. Hand artifacts over as files.\n\n**Waiting on dispatched subagents:** never poll a wait interface with\nshort timeouts, and never sit in one silent, open-ended wait either.\nWhile you have local work — ledger updates, packaging the next review,\nreading reports — keep working; child results arrive on their own.\nWhen you are genuinely idle, wait in bounded stretches (five to ten\nminutes, where your platform allows), and between stretches post one\nline of status and reconcile your live children: list them, and chase\nany that finished without reporting. A bounded stretch keeps nearly\nall of a long wait's efficiency while guaranteeing a stuck or lost\nchild is noticed within minutes, not at the end of the session.\n"},"source-14acf0c010f3ff0e-s7":{"body":"来源：`skills/subagent-driven-development/SKILL.md:246-285`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 1. Dispatch the implementer\n\nRecord BASE (`git rev-parse HEAD`) before dispatching — the review package\nand fix-round diffs need it.\n\n- **Task brief:** before dispatching an implementer, run this skill's\n  `bash scripts/task-brief PLAN_FILE N` — it extracts the task's full text to a\n  uniquely named file and prints the path. Compose the dispatch so the\n  brief stays the single source of\n  requirements. Your dispatch should contain: (1) one line on where this\n  task fits in the project; (2) the brief path, introduced as \"read this\n  first — it is your requirements, with the exact values to use verbatim\";\n  (3) interfaces and decisions from earlier tasks that the brief cannot\n  know; (4) your resolution of any ambiguity you noticed in the brief;\n  (5) the report-file path and report contract. Exact values (numbers,\n  magic strings, signatures, test cases) appear only in the brief. Never\n  make a subagent read the whole plan file.\n- **Report file:** name the implementer's report file after the brief\n  (brief `…/task-N-brief.md` → report `…/task-N-report.md`) and put it in\n  the dispatch prompt. The implementer writes the full report there and\n  returns only status, commits, a one-line test summary, and concerns.\n- A dispatch prompt describes one task, not the session's history. Do not\n  paste accumulated prior-task summaries (\"state after Tasks 1-3\") into\n  later dispatches — a real session's dispatch hit 42k chars of which 99%\n  was pasted history. A fresh subagent needs its task, the interfaces it\n  touches, and the global constraints. Nothing else.\n- The dispatch carries the no-subagents contract (it is in the\n  implementer template): the implementer never dispatches subagents —\n  not helpers, and never a reviewer. Review arrives from you, after the\n  report. In real sessions, every reviewer a worker spawned duplicated\n  the task review the controller dispatched anyway — a full extra\n  review seat per task.\n- If an earlier task parked a finding in the area this task touches, carry\n  a pointer to that ledger entry in the dispatch.\n- Record the implementer's agent identity from the dispatch result —\n  fix-loop rounds 1-3 resume this agent.\n- Never dispatch multiple implementation subagents in parallel (conflicts).\n\nTemplate: [implementer-prompt.md](implementer-prompt.md)\n"},"source-14acf0c010f3ff0e-s8":{"body":"来源：`skills/subagent-driven-development/SKILL.md:286-307`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 2. Handle the report\n\nImplementer subagents report one of four statuses. Handle each appropriately:\n\n**DONE:** Generate the review package (`bash scripts/review-package PLAN_FILE BASE HEAD`, from this skill's directory — it prints the unique file path it wrote; BASE is the commit you recorded before dispatching the implementer — never `HEAD~1`, which silently drops all but the last commit of a multi-commit task), then dispatch the task reviewer with the printed path.\n\n**DONE_WITH_CONCERNS:** The implementer completed the work but flagged doubts. Read the concerns before proceeding. If the concerns are about correctness or scope, address them before review. If they're observations (e.g., \"this file is getting large\"), note them and proceed to review.\n\n**NEEDS_CONTEXT:** The implementer needs information that wasn't provided. Provide the missing context and re-dispatch.\n\n**BLOCKED:** The implementer cannot complete the task. Assess the blocker:\n1. If it's a context problem, provide more context and re-dispatch with the same model\n2. If the task requires more reasoning, re-dispatch with a more capable model\n3. If the task is too large, break it into smaller pieces\n4. If the plan itself is wrong, rule on the correction, ledger it, and re-dispatch with the ruling carried in the dispatch\n\n**Never** ignore an escalation or force the same model to retry without changes. If the implementer said it's stuck, something needs to change.\n\nIf the implementer asks questions — before starting or mid-task — answer\nclearly and completely, provide additional context if needed, and don't\nrush it into implementation.\n"},"source-14acf0c010f3ff0e-s9":{"body":"来源：`skills/subagent-driven-development/SKILL.md:308-353`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 3. Review the task\n\nPer-task reviews are task-scoped gates. The broad review happens once, at the\nfinal whole-branch review. Never skip the task review, and never accept a\nreport missing either verdict — spec compliance AND task quality are both\nrequired. Implementer self-review never replaces the task review; both are\nneeded.\n\n- Hand the reviewer its diff as a file: run this skill's\n  `bash scripts/review-package PLAN_FILE BASE HEAD` and pass the reviewer the file path\n  it prints (or, without bash: `git log --oneline`, `git diff --stat`,\n  and `git diff -U10` for the range, redirected to one uniquely named\n  file). The output never enters your own context, and the reviewer sees\n  the commit list, stat summary, and full diff with context in one Read\n  call. Use the BASE you recorded before dispatching the implementer —\n  never `HEAD~1`, which silently truncates multi-commit tasks. Never\n  dispatch a task reviewer without a diff file.\n- **Reviewer inputs:** the task reviewer gets three paths — the same brief\n  file, the report file, and the review package — plus the global\n  constraints that bind the task.\n- The global-constraints block you hand the reviewer is its attention\n  lens. Copy the binding requirements verbatim from the plan's Global\n  Constraints section or the spec: exact values, exact formats, and the\n  stated relationships between components (\"same layout as X\", \"matches\n  Y\"). The reviewer's template already carries the process rules (YAGNI,\n  test hygiene, review method) — the constraints block is for what THIS\n  project's spec demands.\n- Do not add open-ended directives like \"check all uses\" or \"run race tests\n  if useful\" without a concrete, task-specific reason\n- Do not ask a reviewer to re-run tests the implementer already ran on the\n  same code — the implementer's report carries the test evidence\n- Do not pre-judge findings for the reviewer — never instruct a reviewer to\n  ignore or not flag a specific issue. If you believe a finding would be a\n  false positive, let the reviewer raise it and adjudicate it in the review\n  loop. If the prompt you are writing contains \"do not flag,\" \"don't treat X\n  as a defect,\" \"at most Minor,\" or \"the plan chose\" — stop: you are\n  pre-judging, usually to spare yourself a review loop.\nThe task reviewer may report \"⚠️ Cannot verify from diff\" items — requirements\nthat live in unchanged code or span tasks. These do not block the rest of the\nreview, but you must resolve each one yourself before marking the task\ncomplete: you hold the plan and cross-task context the reviewer\nlacks. If you confirm an item is a real gap, treat it as a failed spec\nreview — it enters the fix loop with the other findings.\n\nTemplate: [task-reviewer-prompt.md](task-reviewer-prompt.md)\n"},"source-14acf0c010f3ff0e-s10":{"body":"来源：`skills/subagent-driven-development/SKILL.md:354-430`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 4. The fix loop\n\nThe loop triggers when the review reports spec ❌, any Critical or Important\nfinding, or a ⚠️ item you confirmed as a real gap.\n\nBefore the loop starts, two routes leave it immediately:\n\n- Record Minor findings in the progress ledger as you go\n  (`Task \u003cN>: minor (deferred): \u003cone-liner>`), and point the final\n  whole-branch review at that list so it can triage which must be fixed\n  before merge. A roll-up nobody reads is a silent discard. Minor findings\n  never enter the loop.\n- A finding labeled plan-mandated — or any finding that conflicts with\n  what the plan's text requires — is yours to rule on: weigh the finding\n  against the plan text, decide with the spec as the binding authority, and\n  ledger the ruling before you act on it. Do not dismiss the finding because\n  the plan mandates it, and do not dispatch a fix that contradicts the plan\n  without a recorded ruling.\nEverything else enters the loop. A fix round is one fix dispatch plus one\nscoped re-review. Five rounds maximum per task:\n\n**Rounds 1-3 — resume the original implementer.** Send it the open findings\nverbatim. Its context is intact: it knows the task, the code, and its own\nchoices. If your harness cannot send another message to a live subagent,\ndispatch a fresh implementer carrying the brief path, the report-file path,\nand the findings — the report file is the persistent memory either way.\n\n**Rounds 4-5 — dispatch a fresh implementer on a more capable model** (per\nModel Selection), with the brief path, the report-file path, the open\nfindings, and this framing: \"A prior implementer attempted this task\n[N] times; you own it now. Read the report file for what was tried.\" A loop\nthat survives three resumes usually means the implementer cannot see its\nown problem — fresh eyes and a capability bump in one move.\n\n**Every round, either way:** the implementer fixes, re-runs the tests\ncovering the amended code, appends its fix report to the same report file,\nand returns the short contract. Before re-dispatching the reviewer, confirm\nthe fix report contains the covering tests, the command run, and the\noutput; dispatch the re-review once all three are present. Name the\ncovering test files in the fix message — a one-line fix does not need the\nwhole suite.\n\n**The re-review is scoped.** Run `bash scripts/review-package PLAN_FILE FIX_BASE HEAD`\nwhere FIX_BASE is the head the previous review saw, and dispatch\n[re-review-prompt.md](re-review-prompt.md) with the findings list, the\nbrief, the report file, and the printed diff path. The re-reviewer verdicts\neach finding ADDRESSED or NOT ADDRESSED and flags new breakage in the fix\ndiff only. New Critical/Important breakage in the fix diff joins the open\nfindings list. Out-of-scope observations go to the ledger as deferred\nminors — they never extend the loop.\n\n**After each round,** append to the ledger:\n`Task \u003cN>: fix round \u003cR>/5 (\u003cX> addressed, \u003cY> open — \u003cfinding one-liners>; commits \u003ca7>..\u003cb7>)`\n\nNever fix findings yourself in the controller session — your context stays\nclean for coordination, and controller fixes skip review.\n\n**The breaker.** When round 5's re-review still leaves findings open, stop\ndispatching. Adjudicate each open finding yourself — you hold the plan and\nthe cross-task context the reviewer lacks:\n\n- **The reviewer is wrong, or the point is contestable:** park it —\n  `Task \u003cN>: parked — \u003cfinding> — Ruling: \u003cwhy the code stands>`. The final\n  review sees both sides.\n- **Real, but nothing downstream builds on it:** park it the same way, with\n  a ruling that says it's real and deferred.\n- **Real and load-bearing** — a later task builds on it, or it reveals a\n  plan defect: rule on the smallest change that unblocks the dependent work,\n  ledger it as `Task \u003cN>: Ruling: \u003cfinding> — \u003cwhat you decided and why>`,\n  and carry it into the next task's dispatch. Parking a structural failure\n  silently lets every dependent task build on it. Stop only when the defect\n  leaves every path forward a guess.\n\nAdjudicate only at the cap. Adjudicating earlier to end a loop is\npre-judging with a different name. Every adjudication is a ledger entry —\na silent discard is forbidden.\n"},"source-14acf0c010f3ff0e-s11":{"body":"来源：`skills/subagent-driven-development/SKILL.md:431-444`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 5. Complete the task\n\nWhen the review comes back clean — or every open finding is parked with a\nruling at the cap — append the completion line to the ledger in the same\nmessage as your other bookkeeping:\n\n- `Task \u003cN>: complete (commits \u003cbase7>..\u003chead7>, review clean)`\n- `Task \u003cN>: complete (commits \u003cbase7>..\u003chead7>, \u003cK> parked)` after a\n  tripped breaker\n\nThen mark the todo complete and move on. Never move to the next task while\nthe review has open Critical/Important issues that are neither fixed nor\nparked-with-ruling at the cap.\n"},"source-14acf0c010f3ff0e-s12":{"body":"来源：`skills/subagent-driven-development/SKILL.md:445-470`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Final Review\n\nThe final whole-branch review gets a package too: run\n`bash scripts/review-package PLAN_FILE MERGE_BASE HEAD` (MERGE_BASE = the commit the\nbranch started from, e.g. `git merge-base main HEAD`) and include the\nprinted path in the final review dispatch, so the final reviewer reads\none file instead of re-deriving the branch diff with git commands. Dispatch\non the most capable available model (see Model Selection), using\nsuperpowers:requesting-code-review's\n[code-reviewer.md](../requesting-code-review/code-reviewer.md). Point it at\nthe ledger's deferred-minor and parked lines so it can triage which must be\nfixed before merge.\n\nIf the final whole-branch review returns findings, dispatch ONE fix subagent\nwith the complete findings list — not one fixer per finding.\nPer-finding fixers each rebuild context and re-run suites; a real\nsession's final-review fix wave cost more than all its tasks combined.\nThen run exactly one scoped re-review of the fix wave\n(`bash scripts/review-package PLAN_FILE FIX_BASE HEAD` over the fix range,\n[re-review-prompt.md](re-review-prompt.md)).\nAdjudicate any residual findings as in the task loop's breaker: park with\nrulings, or rule on the load-bearing ones and ledger what you decided. Only\nthe four classes above stop you here. There is no second fix wave —\nresidual load-bearing findings surface to your human partner when\nfinishing-a-development-branch presents the options.\n"},"source-14acf0c010f3ff0e-s13":{"body":"来源：`skills/subagent-driven-development/SKILL.md:471-488`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Finish\n\nBefore you delete anything, collect every ledger line containing `Ruling:` —\npreflight rulings, parked findings, breaker adjudications, all of them — into\nyour final message under \"Rulings I made\", in the order you made them, each\nwith what it costs if wrong. The list is exhaustive: if the ledger holds a\nruling, the list holds it. That list is the only place the decisions you\ntook on your human partner's behalf reach them — they read it and rework\nwhatever you got wrong. A ruling that dies with the workspace was a decision\nmade in secret.\n\nWhen the final whole-branch review is clean and its fixes are merged,\ndelete this plan's workspace (`rm -rf \u003cworkspace>`) — the git history is\nthe record now. Sibling directories belong to other plans; leave them\nalone.\n\nUse superpowers:finishing-a-development-branch.\n"},"source-14acf0c010f3ff0e-s14":{"body":"来源：`skills/subagent-driven-development/SKILL.md:489-502`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Common Rationalizations\n\n| Excuse | Reality |\n|--------|---------|\n| \"Close enough on spec compliance\" | Reviewer found spec gaps = not done. Fix or hit the cap and adjudicate — those are the only exits. |\n| \"I'll fix it myself, dispatching is overhead\" | Controller fixes pollute your context and skip review. Resume the implementer. |\n| \"One more round will converge\" | Past the cap, rounds don't converge — the failure is structural. Adjudicate and route. |\n| \"The reviewer will just find something new anyway\" | Scoped re-reviews verify fixes; they cannot wander. New findings on untouched code go to the ledger, not the loop. |\n| \"This finding is obviously wrong, I'll drop it\" | You adjudicate only at the cap, and every ruling is a ledger entry. Silent discards are forbidden. |\n| \"The fix was small, skip the re-review\" | Unreviewed fixes are how regressions land. Every round ends with a scoped re-review. |\n| \"Reviews slow the loop down\" | The loop without reviews is just unverified churn. Reviews are the loop's brakes and steering. |\n| \"Ledger bookkeeping is overhead\" | The ledger is what survives compaction. Controllers without one have re-dispatched entire completed task sequences. |\n| \"The implementer spawned its own reviewer — free extra assurance\" | It's a duplicate seat reviewing the same diff; the task review is the gate. A worker-spawned reviewer is a defect to flag, not rigor. |\n"},"source-14acf0c010f3ff0e-s15":{"body":"来源：`skills/subagent-driven-development/SKILL.md:503-568`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Example Workflow\n\n```\nYou: I'm using Subagent-Driven Development to execute this plan.\n\n[Setup: worktree verified]\n[Read plan file once: docs/superpowers/plans/feature-plan.md]\n[Resolve workspace: bash scripts/sdd-workspace docs/superpowers/plans/feature-plan.md — no ledger inside, fresh start]\n[Create todos for all tasks]\n\nTask 1: Hook installation script\n\n[Run task-brief for Task 1; dispatch implementer with brief + report paths + context]\n\nImplementer: \"Before I begin - should the hook be installed at user or system level?\"\n\nYou: \"User level (~/.config/superpowers/hooks/)\"\n\nImplementer: [Later]\n  - Implemented install-hook command\n  - Added tests, 5/5 passing\n  - Self-review: Found I missed --force flag, added it\n  - Committed\n\n[Run review-package PLAN_FILE BASE HEAD; dispatch task reviewer with the printed path]\nTask reviewer: Spec ✅ - all requirements met, nothing extra.\n  Strengths: Good test coverage, clean. Issues: None. Task quality: Approved.\n\n[Ledger: Task 1: complete (commits a1b2c3d..d4e5f6a, review clean)]\n\nTask 2: Recovery modes\n\n[Run task-brief for Task 2; dispatch implementer with brief + report paths + context]\n\nImplementer: [No questions]\n  - Added verify/repair modes\n  - 8/8 tests passing\n  - Committed\n\n[Run review-package PLAN_FILE BASE HEAD; dispatch task reviewer with the printed path]\nTask reviewer: Spec ❌:\n  - Missing: Progress reporting (spec says \"report every 100 items\")\n  Issues (Important): Magic number (100)\n\n[Fix round 1: resume the implementer with both findings]\nImplementer: Added progress reporting, extracted PROGRESS_INTERVAL constant.\n  Re-ran test/recovery.test.js — 10/10 passing. Fix report appended.\n\n[Run review-package PLAN_FILE FIX_BASE HEAD; dispatch scoped re-review]\nRe-reviewer: Missing progress reporting — ADDRESSED (src/recovery.js:41).\n  Magic number — ADDRESSED (src/recovery.js:7). New breakage: none.\n  Verdict: all findings addressed.\n\n[Ledger: Task 2: fix round 1/5 (2 addressed, 0 open; commits d4e5f6a..b7c8d9e)]\n[Ledger: Task 2: complete (commits d4e5f6a..b7c8d9e, review clean)]\n\n...\n\n[After all tasks]\n[Run review-package PLAN_FILE MERGE_BASE HEAD; dispatch final code-reviewer, most capable model]\nFinal reviewer: All requirements met. Deferred minors triaged: none block merge.\n\n[Delete this plan's workspace — the record now lives in git]\n\nDone! Using superpowers:finishing-a-development-branch.\n```"},"folder:skill:skills/systematic-debugging":{"body":"# skills/systematic-debugging\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。"},"source-06c6e6199ffa7852":{"body":"# skills/systematic-debugging/SKILL.md\n\n范围：按任务和引用关系判断 / Conditional\n\n来源于：本地约束入口\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n---\nname: systematic-debugging\ndescription: Use when encountering any bug, test failure, or unexpected behavior, before proposing fixes\n---\n\n# Systematic Debugging\n\n## Overview\n\n**Core principle:** ALWAYS find root cause before attempting fixes. Symptom fixes are failure.\n\n**Violating the letter of this process is violating the spirit of debugging.**\n\n## The Iron Law\n\n```\nNO FIXES WITHOUT ROOT CAUSE INVESTIGATION FIRST\n```\n\nIf you haven't completed Phase 1, you cannot propose fixes.\n\n## When to Use\n\nUse for ANY technical issue:\n- Test failures\n- Bugs in production\n- Unexpected behavior\n- Performance problems\n- Build failures\n- Integration issues\n\n**Use this ESPECIALLY when:**\n- Under time pressure (emergencies make guessing tempting)\n- \"Just one quick fix\" seems obvious\n- You've already tried multiple fixes\n- Previous fix didn't work\n- You don't fully understand the issue\n\n**Don't skip when:**\n- Issue seems simple (simple bugs have root causes too)\n- You're in a hurry (rushing guarantees rework)\n- Manager wants it fixed NOW (systematic is faster than thrashing)\n\n## The Four Phases\n\nYou MUST complete each phase before proceeding to the next.\n\n### Phase 1: Root Cause Investigation\n\n**BEFORE attempting ANY fix:**\n\n1. **Read Error Messages Carefully**\n   - Don't skip past errors or warnings\n   - They often contain the exact solution\n   - Read stack traces completely\n   - Note line numbers, file paths, error codes\n\n2. **Reproduce Consistently**\n   - Can you trigger it reliably?\n   - What are the exact steps?\n   - Does it happen every time?\n   - If not reproducible → gather more data, don't guess\n\n3. **Check Recent Changes**\n   - What changed that could cause this?\n   - Git diff, recent commits\n   - New dependencies, config changes\n   - Environmental differences\n\n4. **Gather Evidence in Multi-Component Systems**\n\n   **WHEN system has multiple components (CI → build → signing, API → service → database):**\n\n   **BEFORE proposing fixes, add diagnostic instrumentation:**\n   ```\n   For EACH component boundary:\n     - Log what data enters component\n     - Log what data exits component\n     - Verify environment/config propagation\n     - Check state at each layer\n\n   Run once to gather evidence showing WHERE it breaks\n   THEN analyze evidence to identify failing component\n   THEN investigate that specific component\n   ```\n\n   **Example (multi-layer system):**\n   ```bash\n   # Layer 1: Workflow\n   echo \"=== Secrets available in workflow: ===\"\n   echo \"IDENTITY: ${IDENTITY:+SET}${IDENTITY:-UNSET}\"\n\n   # Layer 2: Build script\n   echo \"=== Env vars in build script: ===\"\n   env | grep IDENTITY || echo \"IDENTITY not in environment\"\n\n   # Layer 3: Signing script\n   echo \"=== Keychain state: ===\"\n   security list-keychains\n   security find-identity -v\n\n   # Layer 4: Actual signing\n   codesign --sign \"$IDENTITY\" --verbose=4 \"$APP\"\n   ```\n\n   **This reveals:** Which layer fails (secrets → workflow ✓, workflow → build ✗)\n\n5. **Trace Data Flow**\n\n   **WHEN error is deep in call stack:**\n\n   See `root-cause-tracing.md` in this directory for the complete backward tracing technique.\n\n   **Quick version:**\n   - Where does bad value originate?\n   - What called this with bad value?\n   - Keep tracing up until you find the source\n   - Fix at source, not at symptom\n\n### Phase 2: Pattern Analysis\n\n**Find the pattern before fixing:**\n\n1. **Find Working Examples**\n   - Locate similar working code in same codebase\n   - What works that's similar to what's broken?\n\n2. **Compare Against References**\n   - If implementing pattern, read reference implementation COMPLETELY\n   - Don't skim - read every line\n   - Understand the pattern fully before applying\n\n3. **Identify Differences**\n   - What's different between working and broken?\n   - List every difference, however small\n   - Don't assume \"that can't matter\"\n\n4. **Understand Dependencies**\n   - What other components does this need?\n   - What settings, config, environment?\n   - What assumptions does it make?\n\n### Phase 3: Hypothesis and Testing\n\n**Scientific method:**\n\n1. **Form Single Hypothesis**\n   - State clearly: \"I think X is the root cause because Y\"\n   - Write it down\n   - Be specific, not vague\n\n2. **Test Minimally**\n   - Make the SMALLEST possible change to test hypothesis\n   - One variable at a time\n   - Don't fix multiple things at once\n\n3. **Verify Before Continuing**\n   - Did it work? Yes → Phase 4\n   - Didn't work? Form NEW hypothesis\n   - DON'T add more fixes on top\n\n4. **When You Don't Know**\n   - Say \"I don't understand X\"\n   - Don't pretend to know\n   - Ask for help\n   - Research more\n\n### Phase 4: Implementation\n\n**Fix the root cause, not the symptom:**\n\n1. **Create Failing Test Case**\n   - Simplest possible reproduction\n   - Automated test if possible\n   - One-off test script if no framework\n   - MUST have before fixing\n   - Use the `superpowers:test-driven-development` skill for writing proper failing tests\n\n2. **Implement Single Fix**\n   - Address the root cause identified\n   - ONE change at a time\n   - No \"while I'm here\" improvements\n   - No bundled refactoring\n\n3. **Verify Fix**\n   - Test passes now?\n   - No other tests broken?\n   - Issue actually resolved?\n   - Use the `superpowers:verification-before-completion` skill before claiming success\n\n4. **If Fix Doesn't Work**\n   - STOP\n   - Count: How many fixes have you tried?\n   - If \u003c 3: Return to Phase 1, re-analyze with new information\n   - **If ≥ 3: STOP and question the architecture (step 5 below)**\n   - DON'T attempt Fix #4 without architectural discussion\n\n5. **If 3+ Fixes Failed: Question Architecture**\n\n   **Pattern indicating architectural problem:**\n   - Each fix reveals new shared state/coupling/problem in different place\n   - Fixes require \"massive refactoring\" to implement\n   - Each fix creates new symptoms elsewhere\n\n   **STOP and question fundamentals:**\n   - Is this pattern fundamentally sound?\n   - Are we \"sticking with it through sheer inertia\"?\n   - Should we refactor architecture vs. continue fixing symptoms?\n\n   **Discuss with your human partner before attempting more fixes**\n\n   This is NOT a failed hypothesis - this is a wrong architecture.\n\n## Red Flags - STOP and Follow Process\n\nIf you catch yourself thinking:\n- \"Quick fix for now, investigate later\"\n- \"Just try changing X and see if it works\"\n- \"Add multiple changes, run tests\"\n- \"Skip the test, I'll manually verify\"\n- \"It's probably X, let me fix that\"\n- \"I don't fully understand but this might work\"\n- \"Pattern says X but I'll adapt it differently\"\n- \"Here are the main problems: [lists fixes without investigation]\"\n- Proposing solutions before tracing data flow\n- **\"One more fix attempt\" (when already tried 2+)**\n- **Each fix reveals new problem in different place**\n\n**ALL of these mean: STOP. Return to Phase 1.**\n\n**If 3+ fixes failed:** Question the architecture (see Phase 4.5)\n\n## your human partner's Signals You're Doing It Wrong\n\n**Watch for these redirections:**\n- \"Is that not happening?\" - You assumed without verifying\n- \"Will it show us...?\" - You should have added evidence gathering\n- \"Stop guessing\" - You're proposing fixes without understanding\n- \"Ultra-think this\" - Question fundamentals, not just symptoms\n- \"We're stuck?\" (frustrated) - Your approach isn't working\n\n**When you see these:** STOP. Return to Phase 1.\n\n## Common Rationalizations\n\n| Excuse | Reality |\n|--------|---------|\n| \"Issue is simple, don't need process\" | Simple issues have root causes too. Process is fast for simple bugs. |\n| \"Emergency, no time for process\" | Systematic debugging is FASTER than guess-and-check thrashing. |\n| \"Just try this first, then investigate\" | First fix sets the pattern. Do it right from the start. |\n| \"I'll write test after confirming fix works\" | Untested fixes don't stick. Test first proves it. |\n| \"Multiple fixes at once saves time\" | Can't isolate what worked. Causes new bugs. |\n| \"Reference too long, I'll adapt the pattern\" | Partial understanding guarantees bugs. Read it completely. |\n| \"I see the problem, let me fix it\" | Seeing symptoms ≠ understanding root cause. |\n| \"One more fix attempt\" (after 2+ failures) | 3+ failures = architectural problem. Question pattern, don't fix again. |\n\n## Quick Reference\n\n| Phase | Key Activities | Success Criteria |\n|-------|---------------|------------------|\n| **1. Root Cause** | Read errors, reproduce, check changes, gather evidence | Understand WHAT and WHY |\n| **2. Pattern** | Find working examples, compare | Identify differences |\n| **3. Hypothesis** | Form theory, test minimally | Confirmed or new hypothesis |\n| **4. Implementation** | Create test, fix, verify | Bug resolved, tests pass |\n\n## When Process Reveals \"No Root Cause\"\n\nIf systematic investigation reveals issue is truly environmental, timing-dependent, or external:\n\n1. You've completed the process\n2. Document what you investigated\n3. Implement appropriate handling (retry, timeout, error message)\n4. Add monitoring/logging for future investigation\n\n**But:** 95% of \"no root cause\" cases are incomplete investigation.\n\n## Supporting Techniques\n\nThese techniques are part of systematic debugging and available in this directory:\n\n- **`root-cause-tracing.md`** - Trace bugs backward through call stack to find original trigger\n- **`defense-in-depth.md`** - Add validation at multiple layers after finding root cause\n- **`condition-based-waiting.md`** - Replace arbitrary timeouts with condition polling"},"source-06c6e6199ffa7852-s1":{"body":"来源：`skills/systematic-debugging/SKILL.md:6-7`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# Systematic Debugging\n"},"source-06c6e6199ffa7852-s2":{"body":"来源：`skills/systematic-debugging/SKILL.md:8-13`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Overview\n\n**Core principle:** ALWAYS find root cause before attempting fixes. Symptom fixes are failure.\n\n**Violating the letter of this process is violating the spirit of debugging.**\n"},"source-06c6e6199ffa7852-s3":{"body":"来源：`skills/systematic-debugging/SKILL.md:14-21`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## The Iron Law\n\n```\nNO FIXES WITHOUT ROOT CAUSE INVESTIGATION FIRST\n```\n\nIf you haven't completed Phase 1, you cannot propose fixes.\n"},"source-06c6e6199ffa7852-s4":{"body":"来源：`skills/systematic-debugging/SKILL.md:22-43`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## When to Use\n\nUse for ANY technical issue:\n- Test failures\n- Bugs in production\n- Unexpected behavior\n- Performance problems\n- Build failures\n- Integration issues\n\n**Use this ESPECIALLY when:**\n- Under time pressure (emergencies make guessing tempting)\n- \"Just one quick fix\" seems obvious\n- You've already tried multiple fixes\n- Previous fix didn't work\n- You don't fully understand the issue\n\n**Don't skip when:**\n- Issue seems simple (simple bugs have root causes too)\n- You're in a hurry (rushing guarantees rework)\n- Manager wants it fixed NOW (systematic is faster than thrashing)\n"},"source-06c6e6199ffa7852-s5":{"body":"来源：`skills/systematic-debugging/SKILL.md:44-47`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## The Four Phases\n\nYou MUST complete each phase before proceeding to the next.\n"},"source-06c6e6199ffa7852-s6":{"body":"来源：`skills/systematic-debugging/SKILL.md:48-119`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### Phase 1: Root Cause Investigation\n\n**BEFORE attempting ANY fix:**\n\n1. **Read Error Messages Carefully**\n   - Don't skip past errors or warnings\n   - They often contain the exact solution\n   - Read stack traces completely\n   - Note line numbers, file paths, error codes\n\n2. **Reproduce Consistently**\n   - Can you trigger it reliably?\n   - What are the exact steps?\n   - Does it happen every time?\n   - If not reproducible → gather more data, don't guess\n\n3. **Check Recent Changes**\n   - What changed that could cause this?\n   - Git diff, recent commits\n   - New dependencies, config changes\n   - Environmental differences\n\n4. **Gather Evidence in Multi-Component Systems**\n\n   **WHEN system has multiple components (CI → build → signing, API → service → database):**\n\n   **BEFORE proposing fixes, add diagnostic instrumentation:**\n   ```\n   For EACH component boundary:\n     - Log what data enters component\n     - Log what data exits component\n     - Verify environment/config propagation\n     - Check state at each layer\n\n   Run once to gather evidence showing WHERE it breaks\n   THEN analyze evidence to identify failing component\n   THEN investigate that specific component\n   ```\n\n   **Example (multi-layer system):**\n   ```bash\n   # Layer 1: Workflow\n   echo \"=== Secrets available in workflow: ===\"\n   echo \"IDENTITY: ${IDENTITY:+SET}${IDENTITY:-UNSET}\"\n\n   # Layer 2: Build script\n   echo \"=== Env vars in build script: ===\"\n   env | grep IDENTITY || echo \"IDENTITY not in environment\"\n\n   # Layer 3: Signing script\n   echo \"=== Keychain state: ===\"\n   security list-keychains\n   security find-identity -v\n\n   # Layer 4: Actual signing\n   codesign --sign \"$IDENTITY\" --verbose=4 \"$APP\"\n   ```\n\n   **This reveals:** Which layer fails (secrets → workflow ✓, workflow → build ✗)\n\n5. **Trace Data Flow**\n\n   **WHEN error is deep in call stack:**\n\n   See `root-cause-tracing.md` in this directory for the complete backward tracing technique.\n\n   **Quick version:**\n   - Where does bad value originate?\n   - What called this with bad value?\n   - Keep tracing up until you find the source\n   - Fix at source, not at symptom\n"},"source-06c6e6199ffa7852-s7":{"body":"来源：`skills/systematic-debugging/SKILL.md:120-142`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### Phase 2: Pattern Analysis\n\n**Find the pattern before fixing:**\n\n1. **Find Working Examples**\n   - Locate similar working code in same codebase\n   - What w
