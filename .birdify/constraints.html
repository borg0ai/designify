 start working (actions > words)\n> \n> ## Handling Unclear Feedback\n> \n> ```\n> IF any item is unclear:\n>   STOP - do not implement anything yet\n>   ASK for clarification on unclear items\n> \n> WHY: Items may be related. Partial understanding = wrong implementation.\n> ```\n> \n> **Example:**\n> ```\n> your human partner: \"Fix 1-6\"\n> You understand 1,2,3,6. Unclear on 4,5.\n> \n> ❌ WRONG: Implement 1,2,3,6 now, ask about 4,5 later\n> ✅ RIGHT: \"I understand items 1,2,3,6. Need clarification on 4 and 5 before proceeding.\"\n> ```\n> \n> ## Source-Specific Handling\n> \n> ### From your human partner\n> - **Trusted** - implement after understanding\n> - **Still ask** if scope unclear\n> - **No performative agreement**\n> - **Skip to action** or technical acknowledgment\n> \n> ### From External Reviewers\n> ```\n> BEFORE implementing:\n>   1. Check: Technically correct for THIS codebase?\n>   2. Check: Breaks existing functionality?\n>   3. Check: Reason for current implementation?\n>   4. Check: Works on all platforms/versions?\n>   5. Check: Does reviewer understand full context?\n> \n> IF suggestion seems wrong:\n>   Push back with technical reasoning\n> \n> IF can't easily verify:\n>   Say so: \"I can't verify this without [X]. Should I [investigate/ask/proceed]?\"\n> \n> IF conflicts with your human partner's prior decisions:\n>   Stop and discuss with your human partner first\n> ```\n> \n> **your human partner's rule:** \"External feedback - be skeptical, but check carefully\"\n> \n> ## YAGNI Check for \"Professional\" Features\n> \n> ```\n> IF reviewer suggests \"implementing properly\":\n>   grep codebase for actual usage\n> \n>   IF unused: \"This endpoint isn't called. Remove it (YAGNI)?\"\n>   IF used: Then implement properly\n> ```\n> \n> **your human partner's rule:** \"You and reviewer both report to me. If we don't need this feature, don't add it.\"\n> \n> ## Implementation Order\n> \n> ```\n> FOR multi-item feedback:\n>   1. Clarify anything unclear FIRST\n>   2. Then implement in this order:\n>      - Blocking issues (breaks, security)\n>      - Simple fixes (typos, imports)\n>      - Complex fixes (refactoring, logic)\n>   3. Test each fix individually\n>   4. Verify no regressions\n> ```\n> \n> ## When To Push Back\n> \n> Push back when:\n> - Suggestion breaks existing functionality\n> - Reviewer lacks full context\n> - Violates YAGNI (unused feature)\n> - Technically incorrect for this stack\n> - Legacy/compatibility reasons exist\n> - Conflicts with your human partner's architectural decisions\n> \n> **How to push back:**\n> - Use technical reasoning, not defensiveness\n> - Ask specific questions\n> - Reference working tests/code\n> - Involve your human partner if architectural\n> \n> **If you're uncomfortable pushing back out loud:** Name that tension, then tell your partner about the issue you've seen. They'll appreciate your honesty.\n> \n> ## Acknowledging Correct Feedback\n> \n> When feedback IS correct:\n> ```\n> ✅ \"Fixed. [Brief description of what changed]\"\n> ✅ \"Good catch - [specific issue]. Fixed in [location].\"\n> ✅ [Just fix it and show in the code]\n> \n> ❌ \"You're absolutely right!\"\n> ❌ \"Great point!\"\n> ❌ \"Thanks for catching that!\"\n> ❌ \"Thanks for [anything]\"\n> ❌ ANY gratitude expression\n> ```\n> \n> **Why no thanks:** Actions speak. Just fix it. The code itself shows you heard the feedback.\n> \n> **If you catch yourself about to write \"Thanks\":** DELETE IT. State the fix instead.\n> \n> ## Gracefully Correcting Your Pushback\n> \n> If you pushed back and were wrong:\n> ```\n> ✅ \"You were right - I checked [X] and it does [Y]. Implementing now.\"\n> ✅ \"Verified this and you're correct. My initial understanding was wrong because [reason]. Fixing.\"\n> \n> ❌ Long apology\n> ❌ Defending why you pushed back\n> ❌ Over-explaining\n> ```\n> \n> State the correction factually and move on.\n> \n> ## Common Mistakes\n> \n> | Mistake | Fix |\n> |---------|-----|\n> | Performative agreement | State requirement or just act |\n> | Blind implementation | Verify against codebase first |\n> | Batch without testing | One at a time, test each |\n> | Assuming reviewer is right | Check if breaks things |\n> | Avoiding pushback | Technical correctness > comfort |\n> | Partial implementation | Clarify all items first |\n> | Can't verify, proceed anyway | State limitation, ask for direction |\n> \n> ## Real Examples\n> \n> **Performative Agreement (Bad):**\n> ```\n> Reviewer: \"Remove legacy code\"\n> ❌ \"You're absolutely right! Let me remove that...\"\n> ```\n> \n> **Technical Verification (Good):**\n> ```\n> Reviewer: \"Remove legacy code\"\n> ✅ \"Checking... build target is 10.15+, this API needs 13+. Need legacy for backward compat. Current impl has wrong bundle ID - fix it or drop pre-13 support?\"\n> ```\n> \n> **YAGNI (Good):**\n> ```\n> Reviewer: \"Implement proper metrics tracking with database, date filters, CSV export\"\n> ✅ \"Grepped codebase - nothing calls this endpoint. Remove it (YAGNI)? Or is there usage I'm missing?\"\n> ```\n> \n> **Unclear Item (Good):**\n> ```\n> your human partner: \"Fix items 1-6\"\n> You understand 1,2,3,6. Unclear on 4,5.\n> ✅ \"Understand 1,2,3,6. Need clarification on 4 and 5 before implementing.\"\n> ```\n> \n> ## GitHub Thread Replies\n> \n> When replying to inline review comments on GitHub, reply in the comment thread (`gh api repos/{owner}/{repo}/pulls/{pr}/comments/{id}/replies`), not as a top-level PR comment."},"directory-8":{"body":"# skills/requesting-code-review\n\n## 本目录来源 / Local sources\n\n- skills/requesting-code-review/SKILL.md · 0 条已整理规则\n\n- skills/requesting-code-review/code-reviewer.md · 0 条已整理规则\n\n\n## 上级指令来源 / Ancestor instructions\n\n- AGENTS.md · 1 条已整理规则\n  技能行为修改需要评估证据：修改技能行为内容；其中 PR 评测交付要求仅在准备提交 PR 时触发。（conditional）\n- GEMINI.md · 0 条已整理规则\n\n\n## 生效边界 / Applicability boundary\n\n上级指令是继承审查的候选依据，不代表其中每条规则都无条件生效。结合当前工具、任务条件、显式覆盖和冲突审查判断。目录包含关系本身不证明覆盖。Skills 与引用文档按调用和引用关系判断，不以存放目录推断作用域。仅展示已采集来源；没有来源不等于没有约束。\n\n已整理 1 条规则，来自 1 份来源。仅审查当前 Designify skill refine 任务直接适用的 AGENTS.md 技能修改规则；未审查的工作流细则与其他贡献者要求保留为覆盖缺口。。其他来源尚未逐条提炼；这不是整个仓库的合规审计。"},"directory-source-8":{"body":"# skills/requesting-code-review/SKILL.md\n\n类型：skill\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> ---\n> name: requesting-code-review\n> description: Use when completing tasks, implementing major features, or before merging to verify work meets requirements\n> ---\n> \n> # Requesting Code Review\n> \n> Dispatch a code reviewer subagent to catch issues before they cascade. The reviewer gets precisely crafted context for evaluation — never your session's history.\n> \n> **Core principle:** Review early, review often.\n> \n> ## When to Request Review\n> \n> **Mandatory:**\n> - After each task in subagent-driven development\n> - After completing major feature\n> - Before merge to main\n> \n> **Optional but valuable:**\n> - When stuck (fresh perspective)\n> - Before refactoring (baseline check)\n> - After fixing complex bug\n> \n> ## How to Request\n> \n> **1. Get git SHAs:**\n> ```bash\n> BASE_SHA=$(git rev-parse HEAD~1)  # or: git merge-base origin/main HEAD\n> HEAD_SHA=$(git rev-parse HEAD)\n> ```\n> \n> **2. Dispatch code reviewer subagent:**\n> \n> Dispatch a `general-purpose` subagent, filling the template at [code-reviewer.md](code-reviewer.md)\n> \n> **Placeholders:**\n> - `{DESCRIPTION}` - Brief summary of what you built\n> - `{PLAN_OR_REQUIREMENTS}` - What it should do\n> - `{BASE_SHA}` - Starting commit\n> - `{HEAD_SHA}` - Ending commit\n> \n> **3. Act on feedback:**\n> - Fix Critical issues immediately\n> - Fix Important issues before proceeding\n> - Note Minor issues for later\n> - Push back if reviewer is wrong (with reasoning)\n> \n> ## Example\n> \n> ```\n> [Just completed Task 2: Add verification function]\n> \n> You: Let me request code review before proceeding.\n> \n> BASE_SHA=$(git log --oneline | grep \"Task 1\" | head -1 | awk '{print $1}')\n> HEAD_SHA=$(git rev-parse HEAD)\n> \n> [Dispatch code reviewer subagent]\n>   DESCRIPTION: Added verifyIndex() and repairIndex() with 4 issue types\n>   PLAN_OR_REQUIREMENTS: Task 2 from docs/superpowers/plans/deployment-plan.md\n>   BASE_SHA: a7981ec\n>   HEAD_SHA: 3df7661\n> \n> [Subagent returns]:\n>   Strengths: Clean architecture, real tests\n>   Issues:\n>     Important: Missing progress indicators\n>     Minor: Magic number (100) for reporting interval\n>   Assessment: Ready to proceed\n> \n> You: [Fix progress indicators]\n> [Continue to Task 3]\n> ```\n> \n> ## Common Rationalizations\n> \n> | Excuse | Reality |\n> |--------|---------|\n> | \"I'll just review the diff myself instead of dispatching a reviewer\" | You're the coordinator — reviewing the diff inline burns the context window you need to keep driving the work. Dispatch a reviewer subagent: the diff and the evaluation live in its context, and only the findings come back to you. |\n> | \"The reviewer needs my whole session history to understand the change\" | Hand it precisely crafted context, never your session's history. That keeps the reviewer on the work product, not your thought process. |\n> \n> ## Red Flags\n> \n> **Never:**\n> - Skip review because \"it's simple\"\n> - Ignore Critical issues\n> - Proceed with unfixed Important issues\n> - Argue with valid technical feedback\n> \n> **If reviewer wrong:**\n> - Push back with technical reasoning\n> - Show code/tests that prove it works\n> - Request clarification\n> \n> See template at: [code-reviewer.md](code-reviewer.md)"},"directory-9":{"body":"# skills/subagent-driven-development\n\n## 本目录来源 / Local sources\n\n- skills/subagent-driven-development/SKILL.md · 0 条已整理规则\n\n- skills/subagent-driven-development/implementer-prompt.md · 0 条已整理规则\n\n- skills/subagent-driven-development/task-reviewer-prompt.md · 0 条已整理规则\n\n- skills/subagent-driven-development/re-review-prompt.md · 0 条已整理规则\n\n\n## 上级指令来源 / Ancestor instructions\n\n- AGENTS.md · 1 条已整理规则\n  技能行为修改需要评估证据：修改技能行为内容；其中 PR 评测交付要求仅在准备提交 PR 时触发。（conditional）\n- GEMINI.md · 0 条已整理规则\n\n\n## 生效边界 / Applicability boundary\n\n上级指令是继承审查的候选依据，不代表其中每条规则都无条件生效。结合当前工具、任务条件、显式覆盖和冲突审查判断。目录包含关系本身不证明覆盖。Skills 与引用文档按调用和引用关系判断，不以存放目录推断作用域。仅展示已采集来源；没有来源不等于没有约束。\n\n已整理 1 条规则，来自 1 份来源。仅审查当前 Designify skill refine 任务直接适用的 AGENTS.md 技能修改规则；未审查的工作流细则与其他贡献者要求保留为覆盖缺口。。其他来源尚未逐条提炼；这不是整个仓库的合规审计。"},"directory-source-9":{"body":"# skills/subagent-driven-development/SKILL.md\n\n类型：skill\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> ---\n> name: subagent-driven-development\n> description: Use when executing implementation plans with independent tasks in the current session\n> ---\n> \n> # Subagent-Driven Development\n> \n> Execute plan by dispatching a fresh implementer subagent per task, a task review (spec compliance + code quality) after each, and a broad whole-branch review at the end.\n> \n> **Why subagents:** You delegate tasks to specialized agents with isolated context. By precisely crafting their instructions and context, you ensure they stay focused and succeed at their task. They should never inherit your session's context or history — you construct exactly what they need. This also preserves your own context for coordination work.\n> \n> **Core principle:** Fresh subagent per task + task review (spec + quality) + broad final review = high quality, fast iteration\n> \n> **Narration:** between tool calls, narrate at most one short line — the\n> ledger and the tool results carry the record.\n> \n> **Continuous execution:** Do not pause to check in with your human partner between tasks. Execute all tasks from the plan without stopping. The only reasons to stop are the four named below, or all tasks complete. \"Should I continue?\" prompts and progress summaries waste their time — they asked you to execute the plan, so execute it.\n> \n> **Rulings, not stalls.** A running plan does not wait on a human. Conflicts,\n> ambiguities, plan defects, a cap you would have asked to exceed — decide\n> them. The spec is the binding authority, the plan is its argument, and your\n> judgment settles what neither answers. Record every decision in the ledger as\n> `Ruling: \u003cwhat you decided> — \u003cwhy> — \u003cwhat it costs if wrong>`, and keep\n> going. A wrong ruling costs rework your human partner can see and undo; a\n> session parked on a question costs their whole day and buys nothing.\n> \n> Four things stop you, and only these: an irreversible or destructive\n> operation; a security-sensitive action; a side effect outside this worktree\n> that norms say you ask about first (a merge, a push to a shared branch, a\n> publish); and a plan so broken that every path forward is a guess. For those,\n> stop and ask.\n> \n> ## When to Use\n> \n> ```dot\n> digraph when_to_use {\n>     \"Have implementation plan?\" [shape=diamond];\n>     \"Tasks mostly independent?\" [shape=diamond];\n>     \"Partner chose inline, or no subagent tool?\" [shape=diamond];\n>     \"subagent-driven-development\" [shape=box];\n>     \"executing-plans\" [shape=box];\n>     \"Manual execution or brainstorm first\" [shape=box];\n> \n>     \"Have implementation plan?\" -> \"Tasks mostly independent?\" [label=\"yes\"];\n>     \"Have implementation plan?\" -> \"Manual execution or brainstorm first\" [label=\"no\"];\n>     \"Tasks mostly independent?\" -> \"Partner chose inline, or no subagent tool?\" [label=\"yes\"];\n>     \"Tasks mostly independent?\" -> \"Manual execution or brainstorm first\" [label=\"no - tightly coupled\"];\n>     \"Partner chose inline, or no subagent tool?\" -> \"executing-plans\" [label=\"yes\"];\n>     \"Partner chose inline, or no subagent tool?\" -> \"subagent-driven-development\" [label=\"no\"];\n> }\n> ```\n> \n> **vs. Executing Plans (inline):**\n> - Fresh subagent per task (no context pollution) instead of one context doing every task\n> - Review after each task (spec compliance + code quality) instead of only at the end\n> - Costs a fresh context per task and per review; inline costs one context plus one final reviewer\n> - Both run in this session, share the same plan workspace and ledger, and never pause between tasks\n> \n> ## The Process\n> \n> ```dot\n> digraph process {\n>     rankdir=TB;\n> \n>     subgraph cluster_per_task {\n>         label=\"Per Task\";\n>         \"Dispatch implementer subagent (./implementer-prompt.md)\" [shape=box];\n>         \"Implementer asks questions?\" [shape=diamond];\n>         \"Answer questions, provide context\" [shape=box];\n>         \"Implementer implements, tests, commits, self-reviews\" [shape=box];\n>         \"Generate review package, dispatch task reviewer (./task-reviewer-prompt.md)\" [shape=box];\n>         \"Spec ✅ and quality approved?\" [shape=diamond];\n>         \"Finding conflicts with plan text?\" [shape=diamond];\n>         \"Rule on the conflict, ledger the ruling\" [shape=box];\n>         \"Fix round R of 5: R≤3 resume implementer; R≥4 fresh implementer, more capable model\" [shape=box];\n>         \"Dispatch scoped re-review (./re-review-prompt.md)\" [shape=box];\n>         \"All findings addressed?\" [shape=diamond];\n>         \"R = 5?\" [shape=diamond];\n>         \"Adjudicate each open finding\" [shape=box];\n>         \"Any load-bearing finding?\" [shape=diamond];\n>         \"Rule and continue; stop only if every path forward is a guess\" [shape=box];\n>         \"Park findings in ledger with rulings\" [shape=box];\n>         \"Append completion to ledger, mark todo complete\" [shape=box];\n>     }\n> \n>     \"Setup: worktree, ledger check, read plan, pre-flight review\" [shape=box];\n>     \"More tasks remain?\" [shape=diamond];\n>     \"Dispatch final code reviewer (../requesting-code-review/code-reviewer.md)\" [shape=box];\n>     \"Final findings? ONE fix dispatch, one scoped re-review, adjudicate residuals\" [shape=box];\n>     \"Final review clean: delete this plan's workspace\" [shape=box];\n>     \"Use superpowers:finishing-a-development-branch\" [shape=box style=filled fillcolor=lightgreen];\n> \n>     \"Setup: worktree, ledger check, read plan, pre-flight review\" -> \"Dispatch implementer subagent (./implementer-prompt.md)\";\n>     \"Dispatch implementer subagent (./implementer-prompt.md)\" -> \"Implementer asks questions?\";\n>     \"Implementer asks questions?\" -> \"Answer questions, provide context\" [label=\"yes\"];\n>     \"Answer questions, provide context\" -> \"Implementer implements, tests, commits, self-reviews\";\n>     \"Implementer asks questions?\" -> \"Implementer implements, tests, commits, self-reviews\" [label=\"no\"];\n>     \"Implementer implements, tests, commits, self-reviews\" -> \"Generate review package, dispatch task reviewer (./task-reviewer-prompt.md)\";\n>     \"Generate review package, dispatch task reviewer (./task-reviewer-prompt.md)\" -> \"Spec ✅ and quality approved?\";\n>     \"Spec ✅ and quality approved?\" -> \"Append completion to ledger, mark todo complete\" [label=\"yes\"];\n>     \"Spec ✅ and quality approved?\" -> \"Finding conflicts with plan text?\" [label=\"no\"];\n>     \"Finding conflicts with plan text?\" -> \"Rule on the conflict, ledger the ruling\" [label=\"yes\"];\n>     \"Rule on the conflict, ledger the ruling\" -> \"Fix round R of 5: R≤3 resume implementer; R≥4 fresh implementer, more capable model\";\n>     \"Finding conflicts with plan text?\" -> \"Fix round R of 5: R≤3 resume implementer; R≥4 fresh implementer, more capable model\" [label=\"no\"];\n>     \"Fix round R of 5: R≤3 resume implementer; R≥4 fresh implementer, more capable model\" -> \"Dispatch scoped re-review (./re-review-prompt.md)\";\n>     \"Dispatch scoped re-review (./re-review-prompt.md)\" -> \"All findings addressed?\";\n>     \"All findings addressed?\" -> \"Append completion to ledger, mark todo complete\" [label=\"yes\"];\n>     \"All findings addressed?\" -> \"R = 5?\" [label=\"no\"];\n>     \"R = 5?\" -> \"Fix round R of 5: R≤3 resume implementer; R≥4 fresh implementer, more capable model\" [label=\"no - next round\"];\n>     \"R = 5?\" -> \"Adjudicate each open finding\" [label=\"yes - breaker trips\"];\n>     \"Adjudicate each open finding\" -> \"Any load-bearing finding?\";\n>     \"Any load-bearing finding?\" -> \"Rule and continue; stop only if every path forward is a guess\" [label=\"yes\"];\n>     \"Any load-bearing finding?\" -> \"Park findings in ledger with rulings\" [label=\"no\"];\n>     \"Park findings in ledger with rulings\" -> \"Append completion to ledger, mark todo complete\";\n>     \"Append completion to ledger, mark todo complete\" -> \"More tasks remain?\";\n>     \"More tasks remain?\" -> \"Dispatch implementer subagent (./implementer-prompt.md)\" [label=\"yes\"];\n>     \"More tasks remain?\" -> \"Dispatch final code reviewer (../requesting-code-review/code-reviewer.md)\" [label=\"no\"];\n>     \"Dispatch final code reviewer (../requesting-code-review/code-reviewer.md)\" -> \"Final findings? ONE fix dispatch, one scoped re-review, adjudicate residuals\";\n>     \"Final findings? ONE fix dispatch, one scoped re-review, adjudicate residuals\" -> \"Final review clean: delete this plan's workspace\";\n>     \"Final review clean: delete this plan's workspace\" -> \"Use superpowers:finishing-a-development-branch\";\n> }\n> ```\n> \n> ## Setup\n> \n> Ensure the work happens in an isolated workspace: use\n> superpowers:using-git-worktrees to create one or verify the existing one.\n> Never start implementation on a main/master branch without your human\n> partner's explicit consent.\n> \n> Conversation memory does not survive compaction. In real sessions,\n> controllers that lost their place have re-dispatched entire completed task\n> sequences — the single most expensive failure observed. Track progress in\n> a ledger file, not only in todos.\n> \n> - Each plan owns a workspace: at skill start, run this skill's\n>   `bash scripts/sdd-workspace PLAN_FILE` — it prints the plan's git-ignored\n>   directory (under `\u003crepo-root>/.superpowers/sdd/`), home to\n>   every artifact for THIS plan: ledger, briefs, reports, review packages.\n>   Another plan's directory is never yours to read or write.\n> - Check for this plan's ledger at `\u003cworkspace>/progress.md`. If its first\n>   line names your plan file, tasks with a `Task \u003cN>: complete` line are DONE\n>   — do not re-dispatch them; resume at the first task without one. A task\n>   whose last line is a fix round is mid-loop: resume the loop at the next\n>   round. A ledger whose first line names a different plan file — or a stray\n>   ledger at the old flat path `.superpowers/sdd/progress.md` — is another\n>   plan's progress: leave it in place and start your own, fresh.\n> - Create the ledger with its identity as the first line:\n>   `# SDD ledger — plan: \u003cplan file path>`.\n> - The ledger is your recovery map: the commits it names exist in git even\n>   when your context no longer remembers creating them. After compaction,\n>   trust the ledger and `git log` over your own recollection.\n> - `git clean -fdx` will destroy the workspace (it's git-ignored scratch); if\n>   that happens, recover from `git log`.\n> \n> Read the plan once, note its context and Global Constraints, and create a\n> todo per task. If the plan names a Spec, read that too: the spec is the\n> authority the plan argues from, and conflicts inside the plan resolve\n> against it. A plan with no reachable spec gets a ledger note saying so —\n> rulings made without one are provisional.\n> \n> Before dispatching Task 1, scan the plan once for conflicts, writing down\n> what you checked as you check it:\n> \n> - tasks that contradict each other or the plan's Global Constraints\n> - anything the plan explicitly mandates that the review rubric treats as a\n>   defect (a test that asserts nothing, verbatim duplication of a logic block)\n> \n> The scan's output is a table, not a verdict. One row for every pair of tasks\n> that share a file or an interface: the two tasks, what one produces against\n> what the other consumes, and what you found. One row for every task: whether\n> its own text agrees with itself — the tests it specifies against the code it\n> specifies, the files it creates against the files it later touches. \"The scan\n> is clean\" without those rows is not a scan you ran.\n> \n> Write the table to the ledger. Rule on everything you find before execution\n> begins — each finding against the plan text that mandates it — and record\n> each ruling in the ledger. If the scan is clean, proceed without comment.\n> Rule on each conflict it surfaces — the spec is the binding authority, the\n> plan is its argument — record the ruling beside its row, and dispatch\n> Task 1. The review loop remains the net for conflicts that only emerge from\n> implementation.\n> \n> ## Model Selection\n> \n> Use the least powerful model that can handle each role to conserve cost and increase speed.\n> \n> **Mechanical implementation tasks** (isolated functions, clear specs, 1-2 files): use a fast, cheap model. Most implementation tasks are mechanical when the plan is well-specified.\n> \n> **Integration and judgment tasks** (multi-file coordination, pattern matching, debugging): use a standard model.\n> \n> **Architecture and design tasks**: use the most capable available model.\n> The final whole-branch review is one of these — dispatch it on the most\n> capable available model, not the session default.\n> \n> **Review tasks**: choose the model with the same judgment, scaled to the\n> diff's size, complexity, and risk. A small mechanical diff does not need the\n> most capable model; a subtle concurrency change does. Scoped re-reviews of\n> small fix diffs take a cheap-to-mid tier.\n> \n> **Fix-loop escalation (rounds 4-5)**: use a model at least one tier above\n> the implementer that got stuck.\n> \n> **Always specify the model explicitly when dispatching a subagent.** An\n> omitted model inherits your session's model — often the most capable and\n> most expensive — which silently defeats this section.\n> \n> **Turn count beats token price.** Wall-clock and context cost scale with how\n> many turns a subagent takes, and the cheapest models routinely take 2-3× the\n> turns on multi-step work — costing more overall. Use a mid-tier model as the\n> floor for reviewers and for implementers working from prose descriptions.\n> When the task's plan text contains the complete code to write, the\n> implementation is transcription plus testing: use the cheapest tier for\n> that implementer. Single-file mechanical fixes also take the cheapest tier.\n> \n> **Task complexity signals (implementation tasks):**\n> - Touches 1-2 files with a complete spec → cheap model\n> - Touches multiple files with integration concerns → standard model\n> - Requires design judgment or broad codebase understanding → most capable model\n> \n> ## The Task Loop\n> \n> **Batch small same-shape work.** When the plan lists several tasks that are\n> each a small, independent edit of the same kind — the same one-line fix,\n> constant change, or field addition repeated across files — do not dispatch\n> one subagent per task. Compose ONE dispatch brief listing every file and\n> its change, send the whole batch to a single subagent, and review its diff\n> as one unit. Reserve one-dispatch-per-task for work that needs its own\n> judgment, its own tests, or its own review surface.\n> \n> Everything you paste into a dispatch prompt — and everything a subagent\n> prints back — stays resident in your context for the rest of the session\n> and is re-read on every later turn. Hand artifacts over as files.\n> \n> **Waiting on dispatched subagents:** never poll a wait interface with\n> short timeouts, and never sit in one silent, open-ended wait either.\n> While you have local work — ledger updates, packaging the next review,\n> reading reports — keep working; child results arrive on their own.\n> When you are genuinely idle, wait in bounded stretches (five to ten\n> minutes, where your platform allows), and between stretches post one\n> line of status and reconcile your live children: list them, and chase\n> any that finished without reporting. A bounded stretch keeps nearly\n> all of a long wait's efficiency while guaranteeing a stuck or lost\n> child is noticed within minutes, not at the end of the session.\n> \n> ### 1. Dispatch the implementer\n> \n> Record BASE (`git rev-parse HEAD`) before dispatching — the review package\n> and fix-round diffs need it.\n> \n> - **Task brief:** before dispatching an implementer, run this skill's\n>   `bash scripts/task-brief PLAN_FILE N` — it extracts the task's full text to a\n>   uniquely named file and prints the path. Compose the dispatch so the\n>   brief stays the single source of\n>   requirements. Your dispatch should contain: (1) one line on where this\n>   task fits in the project; (2) the brief path, introduced as \"read this\n>   first — it is your requirements, with the exact values to use verbatim\";\n>   (3) interfaces and decisions from earlier tasks that the brief cannot\n>   know; (4) your resolution of any ambiguity you noticed in the brief;\n>   (5) the report-file path and report contract. Exact values (numbers,\n>   magic strings, signatures, test cases) appear only in the brief. Never\n>   make a subagent read the whole plan file.\n> - **Report file:** name the implementer's report file after the brief\n>   (brief `…/task-N-brief.md` → report `…/task-N-report.md`) and put it in\n>   the dispatch prompt. The implementer writes the full report there and\n>   returns only status, commits, a one-line test summary, and concerns.\n> - A dispatch prompt describes one task, not the session's history. Do not\n>   paste accumulated prior-task summaries (\"state after Tasks 1-3\") into\n>   later dispatches — a real session's dispatch hit 42k chars of which 99%\n>   was pasted history. A fresh subagent needs its task, the interfaces it\n>   touches, and the global constraints. Nothing else.\n> - The dispatch carries the no-subagents contract (it is in the\n>   implementer template): the implementer never dispatches subagents —\n>   not helpers, and never a reviewer. Review arrives from you, after the\n>   report. In real sessions, every reviewer a worker spawned duplicated\n>   the task review the controller dispatched anyway — a full extra\n>   review seat per task.\n> - If an earlier task parked a finding in the area this task touches, carry\n>   a pointer to that ledger entry in the dispatch.\n> - Record the implementer's agent identity from the dispatch result —\n>   fix-loop rounds 1-3 resume this agent.\n> - Never dispatch multiple implementation subagents in parallel (conflicts).\n> \n> Template: [implementer-prompt.md](implementer-prompt.md)\n> \n> ### 2. Handle the report\n> \n> Implementer subagents report one of four statuses. Handle each appropriately:\n> \n> **DONE:** Generate the review package (`bash scripts/review-package PLAN_FILE BASE HEAD`, from this skill's directory — it prints the unique file path it wrote; BASE is the commit you recorded before dispatching the implementer — never `HEAD~1`, which silently drops all but the last commit of a multi-commit task), then dispatch the task reviewer with the printed path.\n> \n> **DONE_WITH_CONCERNS:** The implementer completed the work but flagged doubts. Read the concerns before proceeding. If the concerns are about correctness or scope, address them before review. If they're observations (e.g., \"this file is getting large\"), note them and proceed to review.\n> \n> **NEEDS_CONTEXT:** The implementer needs information that wasn't provided. Provide the missing context and re-dispatch.\n> \n> **BLOCKED:** The implementer cannot complete the task. Assess the blocker:\n> 1. If it's a context problem, provide more context and re-dispatch with the same model\n> 2. If the task requires more reasoning, re-dispatch with a more capable model\n> 3. If the task is too large, break it into smaller pieces\n> 4. If the plan itself is wrong, rule on the correction, ledger it, and re-dispatch with the ruling carried in the dispatch\n> \n> **Never** ignore an escalation or force the same model to retry without changes. If the implementer said it's stuck, something needs to change.\n> \n> If the implementer asks questions — before starting or mid-task — answer\n> clearly and completely, provide additional context if needed, and don't\n> rush it into implementation.\n> \n> ### 3. Review the task\n> \n> Per-task reviews are task-scoped gates. The broad review happens once, at the\n> final whole-branch review. Never skip the task review, and never accept a\n> report missing either verdict — spec compliance AND task quality are both\n> required. Implementer self-review never replaces the task review; both are\n> needed.\n> \n> - Hand the reviewer its diff as a file: run this skill's\n>   `bash scripts/review-package PLAN_FILE BASE HEAD` and pass the reviewer the file path\n>   it prints (or, without bash: `git log --oneline`, `git diff --stat`,\n>   and `git diff -U10` for the range, redirected to one uniquely named\n>   file). The output never enters your own context, and the reviewer sees\n>   the commit list, stat summary, and full diff with context in one Read\n>   call. Use the BASE you recorded before dispatching the implementer —\n>   never `HEAD~1`, which silently truncates multi-commit tasks. Never\n>   dispatch a task reviewer without a diff file.\n> - **Reviewer inputs:** the task reviewer gets three paths — the same brief\n>   file, the report file, and the review package — plus the global\n>   constraints that bind the task.\n> - The global-constraints block you hand the reviewer is its attention\n>   lens. Copy the binding requirements verbatim from the plan's Global\n>   Constraints section or the spec: exact values, exact formats, and the\n>   stated relationships between components (\"same layout as X\", \"matches\n>   Y\"). The reviewer's template already carries the process rules (YAGNI,\n>   test hygiene, review method) — the constraints block is for what THIS\n>   project's spec demands.\n> - Do not add open-ended directives like \"check all uses\" or \"run race tests\n>   if useful\" without a concrete, task-specific reason\n> - Do not ask a reviewer to re-run tests the implementer already ran on the\n>   same code — the implementer's report carries the test evidence\n> - Do not pre-judge findings for the reviewer — never instruct a reviewer to\n>   ignore or not flag a specific issue. If you believe a finding would be a\n>   false positive, let the reviewer raise it and adjudicate it in the review\n>   loop. If the prompt you are writing contains \"do not flag,\" \"don't treat X\n>   as a defect,\" \"at most Minor,\" or \"the plan chose\" — stop: you are\n>   pre-judging, usually to spare yourself a review loop.\n> The task reviewer may report \"⚠️ Cannot verify from diff\" items — requirements\n> that live in unchanged code or span tasks. These do not block the rest of the\n> review, but you must resolve each one yourself before marking the task\n> complete: you hold the plan and cross-task context the reviewer\n> lacks. If you confirm an item is a real gap, treat it as a failed spec\n> review — it enters the fix loop with the other findings.\n> \n> Template: [task-reviewer-prompt.md](task-reviewer-prompt.md)\n> \n> ### 4. The fix loop\n> \n> The loop triggers when the review reports spec ❌, any Critical or Important\n> finding, or a ⚠️ item you confirmed as a real gap.\n> \n> Before the loop starts, two routes leave it immediately:\n> \n> - Record Minor findings in the progress ledger as you go\n>   (`Task \u003cN>: minor (deferred): \u003cone-liner>`), and point the final\n>   whole-branch review at that list so it can triage which must be fixed\n>   before merge. A roll-up nobody reads is a silent discard. Minor findings\n>   never enter the loop.\n> - A finding labeled plan-mandated — or any finding that conflicts with\n>   what the plan's text requires — is yours to rule on: weigh the finding\n>   against the plan text, decide with the spec as the binding authority, and\n>   ledger the ruling before you act on it. Do not dismiss the finding because\n>   the plan mandates it, and do not dispatch a fix that contradicts the plan\n>   without a recorded ruling.\n> Everything else enters the loop. A fix round is one fix dispatch plus one\n> scoped re-review. Five rounds maximum per task:\n> \n> **Rounds 1-3 — resume the original implementer.** Send it the open findings\n> verbatim. Its context is intact: it knows the task, the code, and its own\n> choices. If your harness cannot send another message to a live subagent,\n> dispatch a fresh implementer carrying the brief path, the report-file path,\n> and the findings — the report file is the persistent memory either way.\n> \n> **Rounds 4-5 — dispatch a fresh implementer on a more capable model** (per\n> Model Selection), with the brief path, the report-file path, the open\n> findings, and this framing: \"A prior implementer attempted this task\n> [N] times; you own it now. Read the report file for what was tried.\" A loop\n> that survives three resumes usually means the implementer cannot see its\n> own problem — fresh eyes and a capability bump in one move.\n> \n> **Every round, either way:** the implementer fixes, re-runs the tests\n> covering the amended code, appends its fix report to the same report file,\n> and returns the short contract. Before re-dispatching the reviewer, confirm\n> the fix report contains the covering tests, the command run, and the\n> output; dispatch the re-review once all three are present. Name the\n> covering test files in the fix message — a one-line fix does not need the\n> whole suite.\n> \n> **The re-review is scoped.** Run `bash scripts/review-package PLAN_FILE FIX_BASE HEAD`\n> where FIX_BASE is the head the previous review saw, and dispatch\n> [re-review-prompt.md](re-review-prompt.md) with the findings list, the\n> brief, the report file, and the printed diff path. The re-reviewer verdicts\n> each finding ADDRESSED or NOT ADDRESSED and flags new breakage in the fix\n> diff only. New Critical/Important breakage in the fix diff joins the open\n> findings list. Out-of-scope observations go to the ledger as deferred\n> minors — they never extend the loop.\n> \n> **After each round,** append to the ledger:\n> `Task \u003cN>: fix round \u003cR>/5 (\u003cX> addressed, \u003cY> open — \u003cfinding one-liners>; commits \u003ca7>..\u003cb7>)`\n> \n> Never fix findings yourself in the controller session — your context stays\n> clean for coordination, and controller fixes skip review.\n> \n> **The breaker.** When round 5's re-review still leaves findings open, stop\n> dispatching. Adjudicate each open finding yourself — you hold the plan and\n> the cross-task context the reviewer lacks:\n> \n> - **The reviewer is wrong, or the point is contestable:** park it —\n>   `Task \u003cN>: parked — \u003cfinding> — Ruling: \u003cwhy the code stands>`. The final\n>   review sees both sides.\n> - **Real, but nothing downstream builds on it:** park it the same way, with\n>   a ruling that says it's real and deferred.\n> - **Real and load-bearing** — a later task builds on it, or it reveals a\n>   plan defect: rule on the smallest change that unblocks the dependent work,\n>   ledger it as `Task \u003cN>: Ruling: \u003cfinding> — \u003cwhat you decided and why>`,\n>   and carry it into the next task's dispatch. Parking a structural failure\n>   silently lets every dependent task build on it. Stop only when the defect\n>   leaves every path forward a guess.\n> \n> Adjudicate only at the cap. Adjudicating earlier to end a loop is\n> pre-judging with a different name. Every adjudication is a ledger entry —\n> a silent discard is forbidden.\n> \n> ### 5. Complete the task\n> \n> When the review comes back clean — or every open finding is parked with a\n> ruling at the cap — append the completion line to the ledger in the same\n> message as your other bookkeeping:\n> \n> - `Task \u003cN>: complete (commits \u003cbase7>..\u003chead7>, review clean)`\n> - `Task \u003cN>: complete (commits \u003cbase7>..\u003chead7>, \u003cK> parked)` after a\n>   tripped breaker\n> \n> Then mark the todo complete and move on. Never move to the next task while\n> the review has open Critical/Important issues that are neither fixed nor\n> parked-with-ruling at the cap.\n> \n> ## Final Review\n> \n> The final whole-branch review gets a package too: run\n> `bash scripts/review-package PLAN_FILE MERGE_BASE HEAD` (MERGE_BASE = the commit the\n> branch started from, e.g. `git merge-base main HEAD`) and include the\n> printed path in the final review dispatch, so the final reviewer reads\n> one file instead of re-deriving the branch diff with git commands. Dispatch\n> on the most capable available model (see Model Selection), using\n> superpowers:requesting-code-review's\n> [code-reviewer.md](../requesting-code-review/code-reviewer.md). Point it at\n> the ledger's deferred-minor and parked lines so it can triage which must be\n> fixed before merge.\n> \n> If the final whole-branch review returns findings, dispatch ONE fix subagent\n> with the complete findings list — not one fixer per finding.\n> Per-finding fixers each rebuild context and re-run suites; a real\n> session's final-review fix wave cost more than all its tasks combined.\n> Then run exactly one scoped re-review of the fix wave\n> (`bash scripts/review-package PLAN_FILE FIX_BASE HEAD` over the fix range,\n> [re-review-prompt.md](re-review-prompt.md)).\n> Adjudicate any residual findings as in the task loop's breaker: park with\n> rulings, or rule on the load-bearing ones and ledger what you decided. Only\n> the four classes above stop you here. There is no second fix wave —\n> residual load-bearing findings surface to your human partner when\n> finishing-a-development-branch presents the options.\n> \n> ## Finish\n> \n> Before you delete anything, collect every ledger line containing `Ruling:` —\n> preflight rulings, parked findings, breaker adjudications, all of them — into\n> your final message under \"Rulings I made\", in the order you made them, each\n> with what it costs if wrong. The list is exhaustive: if the ledger holds a\n> ruling, the list holds it. That list is the only place the decisions you\n> took on your human partner's behalf reach them — they read it and rework\n> whatever you got wrong. A ruling that dies with the workspace was a decision\n> made in secret.\n> \n> When the final whole-branch review is clean and its fixes are merged,\n> delete this plan's workspace (`rm -rf \u003cworkspace>`) — the git history is\n> the record now. Sibling directories belong to other plans; leave them\n> alone.\n> \n> Use superpowers:finishing-a-development-branch.\n> \n> ## Common Rationalizations\n> \n> | Excuse | Reality |\n> |--------|---------|\n> | \"Close enough on spec compliance\" | Reviewer found spec gaps = not done. Fix or hit the cap and adjudicate — those are the only exits. |\n> | \"I'll fix it myself, dispatching is overhead\" | Controller fixes pollute your context and skip review. Resume the implementer. |\n> | \"One more round will converge\" | Past the cap, rounds don't converge — the failure is structural. Adjudicate and route. |\n> | \"The reviewer will just find something new anyway\" | Scoped re-reviews verify fixes; they cannot wander. New findings on untouched code go to the ledger, not the loop. |\n> | \"This finding is obviously wrong, I'll drop it\" | You adjudicate only at the cap, and every ruling is a ledger entry. Silent discards are forbidden. |\n> | \"The fix was small, skip the re-review\" | Unreviewed fixes are how regressions land. Every round ends with a scoped re-review. |\n> | \"Reviews slow the loop down\" | The loop without reviews is just unverified churn. Reviews are the loop's brakes and steering. |\n> | \"Ledger bookkeeping is overhead\" | The ledger is what survives compaction. Controllers without one have re-dispatched entire completed task sequences. |\n> | \"The implementer spawned its own reviewer — free extra assurance\" | It's a duplicate seat reviewing the same diff; the task review is the gate. A worker-spawned reviewer is a defect to flag, not rigor. |\n> \n> ## Example Workflow\n> \n> ```\n> You: I'm using Subagent-Driven Development to execute this plan.\n> \n> [Setup: worktree verified]\n> [Read plan file once: docs/superpowers/plans/feature-plan.md]\n> [Resolve workspace: bash scripts/sdd-workspace docs/superpowers/plans/feature-plan.md — no ledger inside, fresh start]\n> [Create todos for all tasks]\n> \n> Task 1: Hook installation script\n> \n> [Run task-brief for Task 1; dispatch implementer with brief + report paths + context]\n> \n> Implementer: \"Before I begin - should the hook be installed at user or system level?\"\n> \n> You: \"User level (~/.config/superpowers/hooks/)\"\n> \n> Implementer: [Later]\n>   - Implemented install-hook command\n>   - Added tests, 5/5 passing\n>   - Self-review: Found I missed --force flag, added it\n>   - Committed\n> \n> [Run review-package PLAN_FILE BASE HEAD; dispatch task reviewer with the printed path]\n> Task reviewer: Spec ✅ - all requirements met, nothing extra.\n>   Strengths: Good test coverage, clean. Issues: None. Task quality: Approved.\n> \n> [Ledger: Task 1: complete (commits a1b2c3d..d4e5f6a, review clean)]\n> \n> Task 2: Recovery modes\n> \n> [Run task-brief for Task 2; dispatch implementer with brief + report paths + context]\n> \n> Implementer: [No questions]\n>   - Added verify/repair modes\n>   - 8/8 tests passing\n>   - Committed\n> \n> [Run review-package PLAN_FILE BASE HEAD; dispatch task reviewer with the printed path]\n> Task reviewer: Spec ❌:\n>   - Missing: Progress reporting (spec says \"report every 100 items\")\n>   Issues (Important): Magic number (100)\n> \n> [Fix round 1: resume the implementer with both findings]\n> Implementer: Added progress reporting, extracted PROGRESS_INTERVAL constant.\n>   Re-ran test/recovery.test.js — 10/10 passing. Fix report appended.\n> \n> [Run review-package PLAN_FILE FIX_BASE HEAD; dispatch scoped re-review]\n> Re-reviewer: Missing progress reporting — ADDRESSED (src/recovery.js:41).\n>   Magic number — ADDRESSED (src/recovery.js:7). New breakage: none.\n>   Verdict: all findings addressed.\n> \n> [Ledger: Task 2: fix round 1/5 (2 addressed, 0 open; commits d4e5f6a..b7c8d9e)]\n> [Ledger: Task 2: complete (commits d4e5f6a..b7c8d9e, review clean)]\n> \n> ...\n> \n> [After all tasks]\n> [Run review-package PLAN_FILE MERGE_BASE HEAD; dispatch final code-reviewer, most capable model]\n> Final reviewer: All requirements met. Deferred minors triaged: none block merge.\n> \n> [Delete this plan's workspace — the record now lives in git]\n> \n> Done! Using superpowers:finishing-a-development-branch.\n> ```"},"directory-10":{"body":"# skills/systematic-debugging\n\n## 本目录来源 / Local sources\n\n- skills/systematic-debugging/SKILL.md · 0 条已整理规则\n\n- skills/systematic-debugging/root-cause-tracing.md · 0 条已整理规则\n\n- skills/systematic-debugging/defense-in-depth.md · 0 条已整理规则\n\n- skills/systematic-debugging/condition-based-waiting.md · 0 条已整理规则\n\n\n## 上级指令来源 / Ancestor instructions\n\n- AGENTS.md · 1 条已整理规则\n  技能行为修改需要评估证据：修改技能行为内容；其中 PR 评测交付要求仅在准备提交 PR 时触发。（conditional）\n- GEMINI.md · 0 条已整理规则\n\n\n## 生效边界 / Applicability boundary\n\n上级指令是继承审查的候选依据，不代表其中每条规则都无条件生效。结合当前工具、任务条件、显式覆盖和冲突审查判断。目录包含关系本身不证明覆盖。Skills 与引用文档按调用和引用关系判断，不以存放目录推断作用域。仅展示已采集来源；没有来源不等于没有约束。\n\n已整理 1 条规则，来自 1 份来源。仅审查当前 Designify skill refine 任务直接适用的 AGENTS.md 技能修改规则；未审查的工作流细则与其他贡献者要求保留为覆盖缺口。。其他来源尚未逐条提炼；这不是整个仓库的合规审计。"},"directory-source-10":{"body":"# skills/systematic-debugging/SKILL.md\n\n类型：skill\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> ---\n> name: systematic-debugging\n> description: Use when encountering any bug, test failure, or unexpected behavior, before proposing fixes\n> ---\n> \n> # Systematic Debugging\n> \n> ## Overview\n> \n> **Core principle:** ALWAYS find root cause before attempting fixes. Symptom fixes are failure.\n> \n> **Violating the letter of this process is violating the spirit of debugging.**\n> \n> ## The Iron Law\n> \n> ```\n> NO FIXES WITHOUT ROOT CAUSE INVESTIGATION FIRST\n> ```\n> \n> If you haven't completed Phase 1, you cannot propose fixes.\n> \n> ## When to Use\n> \n> Use for ANY technical issue:\n> - Test failures\n> - Bugs in production\n> - Unexpected behavior\n> - Performance problems\n> - Build failures\n> - Integration issues\n> \n> **Use this ESPECIALLY when:**\n> - Under time pressure (emergencies make guessing tempting)\n> - \"Just one quick fix\" seems obvious\n> - You've already tried multiple fixes\n> - Previous fix didn't work\n> - You don't fully understand the issue\n> \n> **Don't skip when:**\n> - Issue seems simple (simple bugs have root causes too)\n> - You're in a hurry (rushing guarantees rework)\n> - Manager wants it fixed NOW (systematic is faster than thrashing)\n> \n> ## The Four Phases\n> \n> You MUST complete each phase before proceeding to the next.\n> \n> ### Phase 1: Root Cause Investigation\n> \n> **BEFORE attempting ANY fix:**\n> \n> 1. **Read Error Messages Carefully**\n>    - Don't skip past errors or warnings\n>    - They often contain the exact solution\n>    - Read stack traces completely\n>    - Note line numbers, file paths, error codes\n> \n> 2. **Reproduce Consistently**\n>    - Can you trigger it reliably?\n>    - What are the exact steps?\n>    - Does it happen every time?\n>    - If not reproducible → gather more data, don't guess\n> \n> 3. **Check Recent Changes**\n>    - What changed that could cause this?\n>    - Git diff, recent commits\n>    - New dependencies, config changes\n>    - Environmental differences\n> \n> 4. **Gather Evidence in Multi-Component Systems**\n> \n>    **WHEN system has multiple components (CI → build → signing, API → service → database):**\n> \n>    **BEFORE proposing fixes, add diagnostic instrumentation:**\n>    ```\n>    For EACH component boundary:\n>      - Log what data enters component\n>      - Log what data exits component\n>      - Verify environment/config propagation\n>      - Check state at each layer\n> \n>    Run once to gather evidence showing WHERE it breaks\n>    THEN analyze evidence to identify failing component\n>    THEN investigate that specific component\n>    ```\n> \n>    **Example (multi-layer system):**\n>    ```bash\n>    # Layer 1: Workflow\n>    echo \"=== Secrets available in workflow: ===\"\n>    echo \"IDENTITY: ${IDENTITY:+SET}${IDENTITY:-UNSET}\"\n> \n>    # Layer 2: Build script\n>    echo \"=== Env vars in build script: ===\"\n>    env | grep IDENTITY || echo \"IDENTITY not in environment\"\n> \n>    # Layer 3: Signing script\n>    echo \"=== Keychain state: ===\"\n>    security list-keychains\n>    security find-identity -v\n> \n>    # Layer 4: Actual signing\n>    codesign --sign \"$IDENTITY\" --verbose=4 \"$APP\"\n>    ```\n> \n>    **This reveals:** Which layer fails (secrets → workflow ✓, workflow → build ✗)\n> \n> 5. **Trace Data Flow**\n> \n>    **WHEN error is deep in call stack:**\n> \n>    See `root-cause-tracing.md` in this directory for the complete backward tracing technique.\n> \n>    **Quick version:**\n>    - Where does bad value originate?\n>    - What called this with bad value?\n>    - Keep tracing up until you find the source\n>    - Fix at source, not at symptom\n> \n> ### Phase 2: Pattern Analysis\n> \n> **Find the pattern before fixing:**\n> \n> 1. **Find Working Examples**\n>    - Locate similar working code in same codebase\n>    - What works that's similar to what's broken?\n> \n> 2. **Compare Against References**\n>    - If implementing pattern, read reference implementation COMPLETELY\n>    - Don't skim - read every line\n>    - Understand the pattern fully before applying\n> \n> 3. **Identify Differences**\n>    - What's different between working and broken?\n>    - List every difference, however small\n>    - Don't assume \"that can't matter\"\n> \n> 4. **Understand Dependencies**\n>    - What other components does this need?\n>    - What settings, config, environment?\n>    - What assumptions does it make?\n> \n> ### Phase 3: Hypothesis and Testing\n> \n> **Scientific method:**\n> \n> 1. **Form Single Hypothesis**\n>    - State clearly: \"I think X is the root cause because Y\"\n>    - Write it down\n>    - Be specific, not vague\n> \n> 2. **Test Minimally**\n>    - Make the SMALLEST possible change to test hypothesis\n>    - One variable at a time\n>    - Don't fix multiple things at once\n> \n> 3. **Verify Before Continuing**\n>    - Did it work? Yes → Phase 4\n>    - Didn't work? Form NEW hypothesis\n>    - DON'T add more fixes on top\n> \n> 4. **When You Don't Know**\n>    - Say \"I don't understand X\"\n>    - Don't pretend to know\n>    - Ask for help\n>    - Research more\n> \n> ### Phase 4: Implementation\n> \n> **Fix the root cause, not the symptom:**\n> \n> 1. **Create Failing Test Case**\n>    - Simplest possible reproduction\n>    - Automated test if possible\n>    - One-off test script if no framework\n>    - MUST have before fixing\n>    - Use the `superpowers:test-driven-development` skill for writing proper failing tests\n> \n> 2. **Implement Single Fix**\n>    - Address the root cause identified\n>    - ONE change at a time\n>    - No \"while I'm here\" improvements\n>    - No bundled refactoring\n> \n> 3. **Verify Fix**\n>    - Test passes now?\n>    - No other tests broken?\n>    - Issue actually resolved?\n>    - Use the `superpowers:verification-before-completion` skill before claiming success\n> \n> 4. **If Fix Doesn't Work**\n>    - STOP\n>    - Count: How many fixes have you tried?\n>    - If \u003c 3: Return to Phase 1, re-analyze with new information\n>    - **If ≥ 3: STOP and question the architecture (step 5 below)**\n>    - DON'T attempt Fix #4 without architectural discussion\n> \n> 5. **If 3+ Fixes Failed: Question Architecture**\n> \n>    **Pattern indicating architectural problem:**\n>    - Each fix reveals new shared state/coupling/problem in different place\n>    - Fixes require \"massive refactoring\" to implement\n>    - Each fix creates new symptoms elsewhere\n> \n>    **STOP and question fundamentals:**\n>    - Is this pattern fundamentally sound?\n>    - Are we \"sticking with it through sheer inertia\"?\n>    - Should we refactor architecture vs. continue fixing symptoms?\n> \n>    **Discuss with your human partner before attempting more fixes**\n> \n>    This is NOT a failed hypothesis - this is a wrong architecture.\n> \n> ## Red Flags - STOP and Follow Process\n> \n> If you catch yourself thinking:\n> - \"Quick fix for now, investigate later\"\n> - \"Just try changing X and see if it works\"\n> - \"Add multiple changes, run tests\"\n> - \"Skip the test, I'll manually verify\"\n> - \"It's probably X, let me fix that\"\n> - \"I don't fully understand but this might work\"\n> - \"Pattern says X but I'll adapt it differently\"\n> - \"Here are the main problems: [lists fixes without investigation]\"\n> - Proposing solutions before tracing data flow\n> - **\"One more fix attempt\" (when already tried 2+)**\n> - **Each fix reveals new problem in different place**\n> \n> **ALL of these mean: STOP. Return to Phase 1.**\n> \n> **If 3+ fixes failed:** Question the architecture (see Phase 4.5)\n> \n> ## your human partner's Signals You're Doing It Wrong\n> \n> **Watch for these redirections:**\n> - \"Is that not happening?\" - You assumed without verifying\n> - \"Will it show us...?\" - You should have added evidence gathering\n> - \"Stop guessing\" - You're proposing fixes without understanding\n> - \"Ultra-think this\" - Question fundamentals, not just symptoms\n> - \"We're stuck?\" (frustrated) - Your approach isn't working\n> \n> **When you see these:** STOP. Return to Phase 1.\n> \n> ## Common Rationalizations\n> \n> | Excuse | Reality |\n> |--------|---------|\n> | \"Issue is simple, don't need process\" | Simple issues have root causes too. Process is fast for simple bugs. |\n> | \"Emergency, no time for process\" | Systematic debugging is FASTER than guess-and-check thrashing. |\n> | \"Just try this first, then investigate\" | First fix sets the pattern. Do it right from the start. |\n> | \"I'll write test after confirming fix works\" | Untested fixes don't stick. Test first proves it. |\n> | \"Multiple fixes at once saves time\" | Can't isolate what worked. Causes new bugs. |\n> | \"Reference too long, I'll adapt the pattern\" | Partial understanding guarantees bugs. Read it completely. |\n> | \"I see the problem, let me fix it\" | Seeing symptoms ≠ understanding root cause. |\n> | \"One more fix attempt\" (after 2+ failures) | 3+ failures = architectural problem. Question pattern, don't fix again. |\n> \n> ## Quick Reference\n> \n> | Phase | Key Activities | Success Criteria |\n> |-------|---------------|------------------|\n> | **1. Root Cause** | Read errors, reproduce, check changes, gather evidence | Understand WHAT and WHY |\n> | **2. Pattern** | Find working examples, compare | Identify differences |\n> | **3. Hypothesis** | Form theory, test minimally | Confirmed or new hypothesis |\n> | **4. Implementation** | Create test, fix, verify | Bug resolved, tests pass |\n> \n> ## When Process Reveals \"No Root Cause\"\n> \n> If systematic investigation reveals issue is truly environmental, timing-dependent, or external:\n> \n> 1. You've completed the process\n> 2. Document what you investigated\n> 3. Implement appropriate handling (retry, timeout, error message)\n> 4. Add monitoring/logging for future investigation\n> \n> **But:** 95% of \"no root cause\" cases are incomplete investigation.\n> \n> ## Supporting Techniques\n> \n> These techniques are part of systematic debugging and available in this directory:\n> \n> - **`root-cause-tracing.md`** - Trace bugs backward through call stack to find original trigger\n> - **`defense-in-depth.md`** - Add validation at multiple layers after finding root cause\n> - **`condition-based-waiting.md`** - Replace arbitrary timeouts with condition polling"},"directory-11":{"body":"# skills/test-driven-development\n\n## 本目录来源 / Local sources\n\n- skills/test-driven-development/SKILL.md · 0 条已整理规则\n\n- skills/test-driven-development/writing-good-tests.md · 0 条已整理规则\n\n\n## 上级指令来源 / Ancestor instructions\n\n- AGENTS.md · 1 条已整理规则\n  技能行为修改需要评估证据：修改技能行为内容；其中 PR 评测交付要求仅在准备提交 PR 时触发。（conditional）\n- GEMINI.md · 0 条已整理规则\n\n\n## 生效边界 / Applicability boundary\n\n上级指令是继承审查的候选依据，不代表其中每条规则都无条件生效。结合当前工具、任务条件、显式覆盖和冲突审查判断。目录包含关系本身不证明覆盖。Skills 与引用文档按调用和引用关系判断，不以存放目录推断作用域。仅展示已采集来源；没有来源不等于没有约束。\n\n已整理 1 条规则，来自 1 份来源。仅审查当前 Designify skill refine 任务直接适用的 AGENTS.md 技能修改规则；未审查的工作流细则与其他贡献者要求保留为覆盖缺口。。其他来源尚未逐条提炼；这不是整个仓库的合规审计。"},"directory-source-11":{"body":"# skills/test-driven-development/SKILL.md\n\n类型：skill\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> ---\n> name: test-driven-development\n> description: Use when implementing any feature or bugfix, before writing implementation code\n> ---\n> \n> # Test-Driven Development (TDD)\n> \n> ## Overview\n> \n> Write the test first. Watch it fail. Write minimal code to pass.\n> \n> **Core principle:** If you didn't watch the test fail, you don't know if it tests the right thing.\n> \n> **Violating the letter of the rules is violating the spirit of the rules.**\n> \n> ## When to Use\n> \n> **Always:**\n> - New features\n> - Bug fixes\n> - Refactoring\n> - Behavior changes\n> \n> **Exceptions (ask your human partner):**\n> - Throwaway prototypes\n> - Generated code\n> - Configuration files\n> \n> Thinking \"skip TDD just this once\"? Stop. That's rationalization.\n> \n> ## The Iron Law\n> \n> ```\n> NO PRODUCTION CODE WITHOUT A FAILING TEST FIRST\n> ```\n> \n> Write code before the test? Delete it. Start over.\n> \n> **No exceptions:**\n> - Don't keep it as \"reference\"\n> - Don't \"adapt\" it while writing tests\n> - Don't look at it\n> - Delete means delete\n> \n> Implement fresh from tests. Period.\n> \n> ## Red-Green-Refactor\n> \n> ```dot\n> digraph tdd_cycle {\n>     rankdir=LR;\n>     red [label=\"RED\\nWrite failing test\", shape=box, style=filled, fillcolor=\"#ffcccc\"];\n>     verify_red [label=\"Verify fails\\ncorrectly\", shape=diamond];\n>     green [label=\"GREEN\\nMinimal code\", shape=box, style=filled, fillcolor=\"#ccffcc\"];\n>     verify_green [label=\"Verify passes\\nAll green\", shape=diamond];\n>     refactor [label=\"REFACTOR\\nClean up\", shape=box, style=filled, fillcolor=\"#ccccff\"];\n>     next [label=\"Next\", shape=ellipse];\n> \n>     red -> verify_red;\n>     verify_red -> green [label=\"yes\"];\n>     verify_red -> red [label=\"wrong\\nfailure\"];\n>     green -> verify_green;\n>     verify_green -> refactor [label=\"yes\"];\n>     verify_green -> green [label=\"no\"];\n>     refactor -> verify_green [label=\"stay\\ngreen\"];\n>     verify_green -> next;\n>     next -> red;\n> }\n> ```\n> \n> ### RED - Write Failing Test\n> \n> Write one minimal test showing what should happen.\n> \n> \u003cGood>\n> ```typescript\n> test('retries failed operations 3 times', async () => {\n>   let attempts = 0;\n>   const operation = () => {\n>     attempts++;\n>     if (attempts \u003c 3) throw new Error('fail');\n>     return 'success';\n>   };\n> \n>   const result = await retryOperation(operation);\n> \n>   expect(result).toBe('success');\n>   expect(attempts).toBe(3);\n> });\n> ```\n> Clear name, tests real behavior, one thing\n> \u003c/Good>\n> \n> \u003cBad>\n> ```typescript\n> test('retry works', async () => {\n>   const mock = jest.fn()\n>     .mockRejectedValueOnce(new Error())\n>     .mockRejectedValueOnce(new Error())\n>     .mockResolvedValueOnce('success');\n>   await retryOperation(mock);\n>   expect(mock).toHaveBeenCalledTimes(3);\n> });\n> ```\n> Vague name, tests mock not code\n> \u003c/Bad>\n> \n> **Requirements:**\n> - One behavior\n> - Clear name\n> - Real code (no mocks unless unavoidable)\n> \n> ### Verify RED - Watch It Fail\n> \n> **MANDATORY. Never skip.**\n> \n> ```bash\n> npm test path/to/test.test.ts\n> ```\n> \n> Confirm:\n> - Test fails (not errors)\n> - Failure message is expected\n> - Fails because feature missing (not typos)\n> \n> **Test passes?** You're testing existing behavior. Fix test.\n> \n> **Test errors?** Fix error, re-run until it fails correctly.\n> \n> ### GREEN - Minimal Code\n> \n> Write simplest code to pass the test.\n> \n> \u003cGood>\n> ```typescript\n> async function retryOperation\u003cT>(fn: () => Promise\u003cT>): Promise\u003cT> {\n>   for (let i = 0; i \u003c 3; i++) {\n>     try {\n>       return await fn();\n>     } catch (e) {\n>       if (i === 2) throw e;\n>     }\n>   }\n>   throw new Error('unreachable');\n> }\n> ```\n> Just enough to pass\n> \u003c/Good>\n> \n> \u003cBad>\n> ```typescript\n> async function retryOperation\u003cT>(\n>   fn: () => Promise\u003cT>,\n>   options?: {\n>     maxRetries?: number;\n>     backoff?: 'linear' | 'exponential';\n>     onRetry?: (attempt: number) => void;\n>   }\n> ): Promise\u003cT> {\n>   // YAGNI\n> }\n> ```\n> Over-engineered\n> \u003c/Bad>\n> \n> Don't add features, refactor other code, or \"improve\" beyond the test.\n> \n> ### Verify GREEN - Watch It Pass\n> \n> **MANDATORY.**\n> \n> ```bash\n> npm test path/to/test.test.ts\n> ```\n> \n> Confirm:\n> - Test passes\n> - Other tests still pass\n> - Output pristine (no errors, warnings)\n> \n> **Test fails?** Fix code, not test.\n> \n> **Other tests fail?** Fix now.\n> \n> **\"Other tests\" means the project's suite, not just your file.** A\n> green run of the test you wrote is not a green suite. Before you call\n> the change done, run the project's test command (bare `pytest`,\n> `npm test`, `cargo test` — whatever the repo uses) even when your task\n> named only one test file. A scope statement in your task bounds the\n> deliverable, not your verification. Any failure that run shows —\n> including one you didn't cause — goes in your report by name; a red\n> test you watched scroll past and didn't mention is a report falsified\n> by omission.\n> \n> ### REFACTOR - Clean Up\n> \n> After green only:\n> - Remove duplication\n> - Improve names\n> - Extract helpers\n> \n> Keep tests green. Don't add behavior.\n> \n> ### Repeat\n> \n> Next failing test for next feature.\n> \n> ## Good Tests\n> \n> | Quality | Good | Bad |\n> |---------|------|-----|\n> | **Minimal** | One thing. \"and\" in name? Split it. | `test('validates email and domain and whitespace')` |\n> | **Clear** | Name describes behavior | `test('test1')` |\n> | **Shows intent** | Demonstrates desired API | Obscures what code should do |\n> \n> When writing or changing any test, read [writing-good-tests.md](writing-good-tests.md) for the rules that keep tests honest:\n> - Name the production change that would make the test fail — before writing it\n> - Assert on real behavior, never on mock behavior\n> - Keep test-only code in test utilities, out of production classes\n> - Understand a dependency's side effects before mocking it\n> \n> ## Common Rationalizations\n> \n> | Excuse | Reality |\n> |--------|---------|\n> | \"Too simple to test\" | Simple code breaks. Test takes 30 seconds. |\n> | \"I'll test after\" | Tests written after pass immediately — which proves nothing. They may test the wrong thing, test the implementation instead of the behavior, or miss the edge case you forgot. You never watched it fail, so you never proved it can catch the bug. Test-first forces that failure. |\n> | \"Tests after achieve same goals (spirit not ritual)\" | Tests-after answer \"what does this do?\"; tests-first answer \"what should this do?\" Tests written after are biased by the code you already wrote — you verify the cases you remembered, not the ones you'd have discovered. Coverage without proof the tests work. |\n> | \"Already manually tested\" | Manual testing is ad-hoc: no record of what you covered, no way to re-run it when the code changes, easy to forget cases under pressure. \"Worked when I tried it\" ≠ comprehensive. Automated tests run the same way every time. |\n> | \"Deleting X hours is wasteful\" | Sunk cost fallacy — that time is already spent either way. The real choice: rewrite with TDD (high confidence) vs. keep it and bolt tests on after (low confidence, likely bugs). Keeping code you can't trust is the waste. |\n> | \"Keep as reference, write tests first\" | You'll adapt it. That's testing after. Delete means delete. |\n> | \"Need to explore first\" | Fine. Throw away exploration, start with TDD. |\n> | \"Test hard = design unclear\" | Listen to test. Hard to test = hard to use. |\n> | \"TDD will slow me down\" | TDD IS the pragmatic path: catches bugs before commit, prevents regressions, lets you refactor without fear. \"Pragmatic\" shortcuts mean debugging in production — slower, not faster. |\n> | \"Manual test faster\" | Manual doesn't prove edge cases. You'll re-test every change. |\n> | \"Existing code has no tests\" | You're improving it. Add tests for existing code. |\n> \n> ## Red Flags - STOP and Start Over\n> \n> - Code before test\n> - Test after implementation\n> - Test passes immediately\n> - Can't explain why test failed\n> - Tests added \"later\"\n> - Rationalizing \"just this once\"\n> - \"I already manually tested it\"\n> - \"Tests after achieve the same purpose\"\n> - \"It's about spirit not ritual\"\n> - \"Keep as reference\" or \"adapt existing code\"\n> - \"Already spent X hours, deleting is wasteful\"\n> - \"TDD is dogmatic, I'm being pragmatic\"\n> - \"This is different because...\"\n> \n> **All of these mean: Delete code. Start over with TDD.**\n> \n> ## Example: Bug Fix\n> \n> **Bug:** Empty email accepted\n> \n> **RED**\n> ```typescript\n> test('rejects empty email', async () => {\n>   const result = await submitForm({ email: '' });\n>   expect(result.error).toBe('Email required');\n> });\n> ```\n> \n> **Verify RED**\n> ```bash\n> $ npm test\n> FAIL: expected 'Email required', got undefined\n> ```\n> \n> **GREEN**\n> ```typescript\n> function submitForm(data: FormData) {\n>   if (!data.email?.trim()) {\n>     return { error: 'Email required' };\n>   }\n>   // ...\n> }\n> ```\n> \n> **Verify GREEN**\n> ```bash\n> $ npm test\n> PASS\n> ```\n> \n> **REFACTOR**\n> Extract validation for multiple fields if needed.\n> \n> ## Verification Checklist\n> \n> Before marking work complete:\n> \n> - [ ] Every new function/method has a test\n> - [ ] Watched each test fail before implementing\n> - [ ] Each test failed for expected reason (feature missing, not typo)\n> - [ ] Wrote minimal code to pass each test\n> - [ ] All tests pass\n> - [ ] Output pristine (no errors, warnings)\n> - [ ] Tests use real code (mocks only if unavoidable)\n> - [ ] Edge cases and errors covered\n> \n> Can't check all boxes? You skipped TDD. Start over.\n> \n> ## When Stuck\n> \n> | Problem | Solution |\n> |---------|----------|\n> | Don't know how to test | Write wished-for API. Write assertion first. Ask your human partner. |\n> | Test too complicated | Design too complicated. Simplify interface. |\n> | Must mock everything | Code too coupled. Use dependency injection. |\n> | Test setup huge | Extract helpers. Still complex? Simplify design. |\n> \n> ## Debugging Integration\n> \n> Bug found? Write failing test reproducing it. Follow TDD cycle. Test proves fix and prevents regression.\n> \n> Never fix bugs without a test.\n> \n> ## Final Rule\n> \n> ```\n> Production code → test exists and failed first\n> Otherwise → not TDD\n> ```\n> \n> No exceptions without your human partner's permission."},"directory-12":{"body":"# skills/using-git-worktrees\n\n## 本目录来源 / Local sources\n\n- skills/using-git-worktrees/SKILL.md · 0 条已整理规则\n\n\n## 上级指令来源 / Ancestor instructions\n\n- AGENTS.md · 1 条已整理规则\n  技能行为修改需要评估证据：修改技能行为内容；其中 PR 评测交付要求仅在准备提交 PR 时触发。（conditional）\n- GEMINI.md · 0 条已整理规则\n\n\n## 生效边界 / Applicability boundary\n\n上级指令是继承审查的候选依据，不代表其中每条规则都无条件生效。结合当前工具、任务条件、显式覆盖和冲突审查判断。目录包含关系本身不证明覆盖。Skills 与引用文档按调用和引用关系判断，不以存放目录推断作用域。仅展示已采集来源；没有来源不等于没有约束。\n\n已整理 1 条规则，来自 1 份来源。仅审查当前 Designify skill refine 任务直接适用的 AGENTS.md 技能修改规则；未审查的工作流细则与其他贡献者要求保留为覆盖缺口。。其他来源尚未逐条提炼；这不是整个仓库的合规审计。"},"directory-source-12":{"body":"# skills/using-git-worktrees/SKILL.md\n\n类型：skill\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> ---\n> name: using-git-worktrees\n> description: Use when starting feature work that needs isolation from current workspace or before executing implementation plans - ensures an isolated workspace exists via native tools or git worktree fallback\n> ---\n> \n> # Using Git Worktrees\n> \n> ## Overview\n> \n> Ensure work happens in an isolated workspace. Prefer your platform's native worktree tools. Fall back to manual git worktrees only when no native tool is available.\n> \n> **Core principle:** Detect existing isolation first. Then use native tools. Then fall back to git. Never fight the harness.\n> \n> **Announce at start:** \"I'm using the using-git-worktrees skill to set up an isolated workspace.\"\n> \n> ## Step 0: Detect Existing Isolation\n> \n> **Before creating anything, check if you are already in an isolated workspace.**\n> \n> ```bash\n> GIT_DIR=$(cd \"$(git rev-parse --git-dir)\" 2>/dev/null && pwd -P)\n> GIT_COMMON=$(cd \"$(git rev-parse --git-common-dir)\" 2>/dev/null && pwd -P)\n> BRANCH=$(git branch --show-current)\n> ```\n> \n> **Submodule guard:** `GIT_DIR != GIT_COMMON` is also true inside git submodules. Before concluding \"already in a worktree,\" verify you are not in a submodule:\n> \n> ```bash\n> # If this returns a path, you're in a submodule, not a worktree — treat as normal repo\n> git rev-parse --show-superproject-working-tree 2>/dev/null\n> ```\n> \n> **If `GIT_DIR != GIT_COMMON` (and not a submodule):** You are already in a linked worktree. Skip to Step 2 (Project Setup). Do NOT create another worktree.\n> \n> Report with branch state:\n> - On a branch: \"Already in isolated workspace at `\u003cpath>` on branch `\u003cname>`.\"\n> - Detached HEAD: \"Already in isolated workspace at `\u003cpath>` (detached HEAD, externally managed). Branch creation needed at finish time.\"\n> \n> **If `GIT_DIR == GIT_COMMON` (or in a submodule):** You are in a normal repo checkout.\n> \n> Has the user already indicated their worktree preference in your instructions? If not, ask for consent before creating a worktree:\n> \n> > \"Would you like me to set up an isolated worktree? It protects your current branch from changes.\"\n> \n> Honor any existing declared preference without asking. If the user declines consent, work in place and skip to Step 2.\n> \n> ## Step 1: Create Isolated Workspace\n> \n> **You have two mechanisms. Try them in this order.**\n> \n> ### 1a. Native Worktree Tools (preferred)\n> \n> The user has asked for an isolated workspace (Step 0 consent). Do you already have a way to create a worktree? It might be a tool with a name like `EnterWorktree`, `WorktreeCreate`, a `/worktree` command, or a `--worktree` flag. If you do, use it and skip to Step 2.\n> \n> Native tools handle directory placement, branch creation, and cleanup automatically. Using `git worktree add` when you have a native tool creates phantom state your harness can't see or manage.\n> \n> Only proceed to Step 1b if you have no native worktree tool available.\n> \n> ### 1b. Git Worktree Fallback\n> \n> **Only use this if Step 1a does not apply** — you have no native worktree tool available. Create a worktree manually using git.\n> \n> #### Directory Selection\n> \n> Follow this priority order. Explicit user preference always beats observed filesystem state.\n> \n> 1. **Check your instructions for a declared worktree directory preference.** If the user has already specified one, use it without asking.\n> \n> 2. **Check for an existing project-local worktree directory:**\n>    ```bash\n>    ls -d .worktrees 2>/dev/null     # Preferred (hidden)\n>    ls -d worktrees 2>/dev/null      # Alternative\n>    ```\n>    If found, use it. If both exist, `.worktrees` wins.\n> \n> 3. **If there is no other guidance available**, default to `.worktrees/` at the project root.\n> \n> #### Safety Verification (project-local directories only)\n> \n> **MUST verify directory is ignored before creating worktree:**\n> \n> ```bash\n> git check-ignore -q .worktrees 2>/dev/null || git check-ignore -q worktrees 2>/dev/null\n> ```\n> \n> **If NOT ignored:** Add to .gitignore, commit the change, then proceed.\n> \n> **Why critical:** Prevents accidentally committing worktree contents to repository.\n> \n> #### Create the Worktree\n> \n> ```bash\n> # Determine path based on chosen location\n> path=\"$LOCATION/$BRANCH_NAME\"\n> \n> git worktree add \"$path\" -b \"$BRANCH_NAME\"\n> cd \"$path\"\n> ```\n> \n> **Sandbox fallback:** If `git worktree add` fails with a permission error (sandbox denial), tell the user the sandbox blocked worktree creation and you're working in the current directory instead. Then run setup and baseline tests in place.\n> \n> ## Step 2: Project Setup\n> \n> Auto-detect and run appropriate setup:\n> \n> ```bash\n> # Node.js\n> if [ -f package.json ]; then npm install; fi\n> \n> # Rust\n> if [ -f Cargo.toml ]; then cargo build; fi\n> \n> # Python\n> if [ -f requirements.txt ]; then pip install -r requirements.txt; fi\n> if [ -f pyproject.toml ]; then poetry install; fi\n> \n> # Go\n> if [ -f go.mod ]; then go mod download; fi\n> ```\n> \n> ## Step 3: Verify Clean Baseline\n> \n> Run tests to ensure workspace starts clean:\n> \n> ```bash\n> # Use project-appropriate command\n> npm test / cargo test / pytest / go test ./...\n> ```\n> \n> **If tests fail:** Report failures, ask whether to proceed or investigate.\n> \n> **If tests pass:** Report ready.\n> \n> ### Report\n> \n> ```\n> Worktree ready at \u003cfull-path>\n> Tests passing (\u003cN> tests, 0 failures)\n> Ready to implement \u003cfeature-name>\n> ```\n> \n> ## Quick Reference\n> \n> | Situation | Action |\n> |-----------|--------|\n> | Already in linked worktree | Skip creation (Step 0) |\n> | In a submodule | Treat as normal repo (Step 0 guard) |\n> | Native worktree tool available | Use it (Step 1a) |\n> | No native tool | Git worktree fallback (Step 1b) |\n> | `.worktrees/` exists | Use it (verify ignored) |\n> | `worktrees/` exists | Use it (verify ignored) |\n> | Both exist | Use `.worktrees/` |\n> | Neither exists | Check instruction file, then default `.worktrees/` |\n> | Directory not ignored | Add to .gitignore + commit |\n> | Permission error on create | Sandbox fallback, work in place |\n> | Tests fail during baseline | Report failures + ask |\n> | No package.json/Cargo.toml | Skip dependency install |\n> \n> ## Common Rationalizations\n> \n> | Excuse | Reality |\n> |--------|---------|\n> | \"I'm obviously not in a worktree — no need to check\" | Run Step 0. Harness-created isolation and submodules both fool eyeballing; the detection commands settle it. |\n> | \"`git worktree add` is quicker than hunting for a native tool\" | A native tool (e.g. `EnterWorktree`) owns placement, branching, and cleanup. Bypassing it is the #1 mistake — it creates phantom state your harness can't see or manage. |\n> | \"The worktree directory is surely ignored already\" | Run `git check-ignore`. An unignored worktree directory commits the whole tree into the repo. |\n> | \"Any directory name works\" | Explicit instructions beat an existing project-local directory, which beats the `.worktrees/` default. |\n> | \"The workspace is fresh — baseline tests can wait\" | A dirty baseline makes every later failure ambiguous. Run the tests now; proceeding past failures is your human partner's call. |"},"directory-13":{"body":"# skills/using-superpowers\n\n## 本目录来源 / Local sources\n\n- skills/using-superpowers/SKILL.md · 0 条已整理规则\n\n\n## 上级指令来源 / Ancestor instructions\n\n- AGENTS.md · 1 条已整理规则\n  技能行为修改需要评估证据：修改技能行为内容；其中 PR 评测交付要求仅在准备提交 PR 时触发。（conditional）\n- GEMINI.md · 0 条已整理规则\n\n\n## 生效边界 / Applicability boundary\n\n上级指令是继承审查的候选依据，不代表其中每条规则都无条件生效。结合当前工具、任务条件、显式覆盖和冲突审查判断。目录包含关系本身不证明覆盖。Skills 与引用文档按调用和引用关系判断，不以存放目录推断作用域。仅展示已采集来源；没有来源不等于没有约束。\n\n已整理 1 条规则，来自 1 份来源。仅审查当前 Designify skill refine 任务直接适用的 AGENTS.md 技能修改规则；未审查的工作流细则与其他贡献者要求保留为覆盖缺口。。其他来源尚未逐条提炼；这不是整个仓库的合规审计。"},"directory-source-13":{"body":"# skills/using-superpowers/SKILL.md\n\n类型：skill\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> ---\n> name: using-superpowers\n> description: Use when starting any conversation - establishes how to find and use skills, requiring skill invocation before ANY response including clarifying questions\n> ---\n> \n> \u003cSUBAGENT-STOP>\n> If you were dispatched as a subagent to execute a specific task, ignore this skill.\n> \u003c/SUBAGENT-STOP>\n> \n> \u003cEXTREMELY-IMPORTANT>\n> If you think there is even a 1% chance a skill might apply to what you are doing, you ABSOLUTELY MUST invoke the skill.\n> \n> IF A SKILL APPLIES TO YOUR TASK, YOU DO NOT HAVE A CHOICE. YOU MUST USE IT.\n> \n> This is not negotiable. You cannot rationalize your way out of this.\n> \u003c/EXTREMELY-IMPORTANT>\n> \n> ## The Rule\n> \n> **Invoke relevant or requested skills BEFORE any response or action** — including clarifying questions, exploring the codebase, or checking files. If it turns out wrong for the situation, you don't have to use it.\n> \n> **Before entering plan mode:** if you haven't already brainstormed, invoke the brainstorming skill first.\n> \n> Then announce \"Using [skill] to [purpose]\" and follow the skill exactly. If it has a checklist, create a todo per item.\n> \n> ## Skill Priority\n> \n> When multiple skills apply, process skills come first — they set the approach, then implementation skills (frontend-design, etc.) carry it out. Brainstorming and systematic-debugging are Superpowers' most common process skills, but the rule holds for any of them.\n> \n> - \"Let's build X\" → superpowers:brainstorming first, then implementation skills.\n> - \"Fix this bug\" → superpowers:systematic-debugging first, then domain skills.\n> \n> ## Red Flags\n> \n> These thoughts mean STOP—you're rationalizing:\n> \n> | Thought | Reality |\n> |---------|---------|\n> | \"This is just a simple question\" | Questions are tasks. Check for skills. |\n> | \"I need more context first\" | Skill check comes BEFORE clarifying questions. |\n> | \"Let me explore the codebase first\" | Skills tell you HOW to explore. Check first. |\n> | \"I can check git/files quickly\" | Files lack conversation context. Check for skills. |\n> | \"Let me gather information first\" | Skills tell you HOW to gather information. |\n> | \"This doesn't need a formal skill\" | If a skill exists, use it. |\n> | \"I remember this skill\" | Skills evolve. Read current version. |\n> | \"This doesn't count as a task\" | Action = task. Check for skills. |\n> | \"The skill is overkill\" | Simple things become complex. Use it. |\n> | \"I'll just do this one thing first\" | Check BEFORE doing anything. |\n> | \"This feels productive\" | Undisciplined action wastes time. Skills prevent this. |\n> | \"I know what that means\" | Knowing the concept ≠ using the skill. Invoke it. |\n> \n> ## Platform Adaptation\n> \n> If your harness appears here, read its reference file for special instructions:\n> \n> - Claude Code: `references/claude-code-tools.md`\n> - Codex: `references/codex-tools.md`\n> - Pi: `references/pi-tools.md`\n> - Antigravity: `references/antigravity-tools.md`\n> - Hermes Agent: `references/hermes-tools.md`\n> - Muse: `references/muse-tools.md`\n> \n> ## User Instructions\n> \n> User instructions (C
