 | Request (one line) | Events |\n> |---|---|---|---|---|\n> \n> ## 6. Findings (REQUIRED, one subsection per dimension)\n> \n> Each finding:\n> ```\n> - finding: \u003cone sentence>\n>   evidence: \u003cpath:line> — \"\u003cshort quote>\"\n>   turns: \u003cfirst>–\u003clast>\n>   confidence: high | medium | low\n> ```\n> A dimension with nothing to report says `none found — checked: \u003cwhat was checked>`.\n> \n> ### 6.1 Skill timeline\n> ### 6.2 Plan adherence\n> ### 6.3 Repeated work\n> ### 6.4 Stumbles\n> ### 6.5 Quality evidence\n> ### 6.6 Request conflicts\n> ### 6.7 Cost and time\n> ### 6.8 Other plugins and skills used\n> \n> ## 7. Superpowers involvement (REQUIRED)\n> \n> not indicated | possible | likely\n> \n> Evidence lines: \u003cpath:line list>. This section states involvement only. It\n> does not name a defect and does not propose a change.\n> \n> ## 8. Coverage notes (REQUIRED)\n> \n> - Not read: \u003cranges, files, and why>\n> - Harness features unavailable: \u003clist or none>\n> - Session was in progress at read time: yes/no\n> - For your human partner to double-check: \u003clist or none>\n> \n> ## 9. Similar sessions (only when requested)\n> \n> | Session id | Path | Date | Harness | Matched | Did not match |\n> |---|---|---|---|---|---|"},"directory-source-23":{"body":"# skills/diagnosing-superpowers/references/github-issues.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> # GitHub issues\n> \n> Use `gh` when it is installed and authenticated; it handles auth, rate\n> limits, and JSON. Fall back to the public API with curl, then to a URL\n> your partner opens.\n> \n> ## Search\n> \n> ```bash\n> gh search issues --repo obra/superpowers --limit 10 \"\u003cterms>\" \\\n>   --json number,state,title --jq '.[] | \"\\(.number)\\t\\(.state)\\t\\(.title)\"'\n> ```\n> \n> Without `gh` (unauthenticated, 10 requests a minute):\n> \n> ```bash\n> curl -s -H \"Accept: application/vnd.github+json\" \\\n>   \"https://api.github.com/search/issues?q=repo:obra/superpowers+is:issue+\u003curl-encoded terms>&per_page=10\" \\\n>   | jq -r '.items[] | \"\\(.number)\\t\\(.state)\\t\\(.title)\"'\n> ```\n> \n> Without curl, hand over `https://github.com/obra/superpowers/issues?q=\u003cterms>`.\n> \n> ## File\n> \n> Write the filled `templates/issue.md` to the workspace and show the exact\n> text. After approval:\n> \n> ```bash\n> gh issue create --repo obra/superpowers --title \"\u003ctitle>\" --body-file \u003cpath> \\\n>   --label bug --label automated-issue-report\n> ```\n> \n> GitHub drops labels silently when the reporter lacks push access, so the\n> labels land only for collaborators; the template footer still marks the\n> issue as skill-filed. `gh` cannot attach files: give your partner the\n> bundle path to attach through the browser after the issue exists.\n> \n> Without `gh`, hand over a prefilled link on the `diagnosis_report.md`\n> template, which applies both labels for any reporter:\n> \n> ```\n> https://github.com/obra/superpowers/issues/new?template=diagnosis_report.md&title=\u003curl-encoded title>&body=\u003curl-encoded body>\n> ```\n> \n> GitHub rejects URLs over about 8,000 characters; past that, send the link\n> with the title only and tell your partner to paste the body from the file."},"directory-source-24":{"body":"# skills/diagnosing-superpowers/templates/issue.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> Title: \u003cskill or symptom>: \u003cone-line observable> (\u003charness>)\n> \n> - [x] I searched existing issues and this is not a duplicate (searched: \u003cquery terms>; closest: \u003c#n title, or \"none\">)\n> \n> ## Environment (required)\n> \n> | Field | Value | Provenance / supporting evidence |\n> |-------|-------|-------------------------------|\n> | Superpowers version | \u003cversion> (\u003csha or \"not a checkout\">) | \u003chistorical evidence / unverified snapshot / current observation / unknown>; \u003clocation> |\n> | Harness (Claude Code, Cursor, etc.) | \u003charness> | \u003clabel>; \u003clocation> |\n> | Harness version | \u003cversion> | \u003clabel>; \u003clocation> |\n> | Your model + version | \u003cmodel ids seen> | \u003clabel>; \u003clocation> |\n> | All plugins installed | \u003clist> | \u003clabel>; \u003clocation> |\n> | OS + shell | \u003cos version>, \u003cshell> | \u003clabel>; \u003clocation> |\n> \n> ## Is this a Superpowers issue or a platform issue?\n> \n> - [ ] I confirmed this issue does not occur without Superpowers installed\n> \n> The reporter has not tried reproducing without superpowers. Evidence for\n> involvement is below; it does not establish cause.\n> \n> ## What happened?\n> \n> \u003cProblem statement, then the triage verdict, with `path:line` citations\n> rewritten as `transcript line \u003cn>`.>\n> \n> ## Steps to reproduce\n> \n> 1. \u003cfirst human prompt, scrubbed>\n> 2. \u003cthe turns leading to the problem, one line each>\n> 3. \u003cthe observable>\n> \n> ## Expected behavior\n> \n> \u003cfrom the problem statement>\n> \n> ## Actual behavior\n> \n> \u003cfrom the triage verdict>\n> \n> ## Debug log or conversation transcript\n> \n> Session id(s): \u003cids>. Delivered local archive: \u003cpath, redaction level \u003clevel>\n> | none built>. Attached bundle: \u003cno claim; attach only after approval>.\n> Superpowers involvement per the diagnosis report: \u003cpossible | likely>, with\n> evidence at \u003ctranscript lines>. This report does not propose a fix.\n> \n> ---\n> Filed with the `diagnosing-superpowers` skill. Model, harness, harness\n> version, and installed plugins are listed above."},"directory-source-25":{"body":"# skills/diagnosing-superpowers/templates/bundle-README.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> # Superpowers session diagnosis bundle\n> \n> Session: \u003csession-id>\n> Harness: \u003cname> \u003cversion> (\u003cprovenance label>)    Superpowers: \u003cversion> (\u003csha or \"not a checkout\">; \u003cprovenance label>)\n> Redaction level: skeleton | evidence | full\n> Built: \u003cISO timestamp>\n> \n> Qualify header version fields as historical evidence, unverified snapshot,\n> current observation, or unknown. `environment.json` carries the same\n> provenance distinctions for every environment field and its supporting\n> location.\n> \n> ## What this is\n> \n> A scrubbed record of a coding-agent session that had superpowers installed\n> and went wrong. It lets an agent or person who was not present decide\n> whether superpowers contributed and, if so, what to change. The report\n> inside states what happened with `path:line` evidence. By design it\n> contains no diagnosis of superpowers and no proposed fix; that is the\n> reader's job.\n> \n> ## Files\n> \n> - `report.md` — the diagnosis report (problem statement, verdict,\n>   environment, sessions, timeline, findings, involvement, coverage notes).\n> - `case.md` — the case file the analysts worked from.\n> - `environment.json` — machine-readable copy of the environment section.\n> - `timeline.md` — the per-turn timeline.\n> - `findings/\u003cdimension>.md` — raw analyst findings per dimension.\n> - `transcripts/\u003csession-id>.md` — condensed per-turn rendering of each\n>   examined session (never the raw JSONL). Tool-result bodies by level:\n> \n>   | Level | Tool-result bodies |\n>   |---|---|\n>   | skeleton | intentionally limited; replaced by `[tool result: \u003ctool>, \u003cbytes> bytes, exit \u003ccode>]` |\n>   | evidence | kept for cited events, including the commands and results needed to support findings |\n>   | full | all kept |\n> - `scrub-log.md` — every placeholder used and its category (never the\n>   original value).\n> \n> ## How to read it\n> \n> Start with `report.md` §1–2, then §7 (involvement) and the evidence lines\n> it cites, then the matching turns in `transcripts/`. `path:line` references\n> point at the original files on the reporter's machine; the same line\n> numbers are preserved in the condensed transcripts as `[L\u003cn>]` markers.\n> \n> ## Redaction\n> \n> Placeholders look like `\u003cEMAIL-1>`, `\u003cPERSON-2>`, `\u003cSECRET-3>`, `\u003cHOST-4>`,\n> `\u003cREPO-5>`, `\u003cORG-6>`, `\u003cPROPRIETARY-7>`; home paths are rewritten to `~/…`. The same placeholder\n> always refers to the same original value within this bundle.\n> \n> ## Producer instructions\n> \n> Completed bundles replace these instructions with actual results.\n> \n> After scrubbing, check every material exported finding using only this bundle:\n> resolve its citation to an included transcript/source marker, read the cited\n> command/result or quotation, and verify that it supports the claim. Path and\n> line existence alone are insufficient. Record specific limitations when the\n> redaction level or necessary withholding removes support.\n> \n> Reconcile report, case, environment, findings, README and any local issue\n> draft. Refresh scrub-log counts against final files excluding the log itself.\n> Remove stale export statements; distinguish bundle preparation from archive\n> delivery. Retain a mapping from historical anchors to included evidence.\n> \n> Record the independent privacy audit separately from evidence usefulness:\n> - Privacy audit: CLEAN or unresolved misses.\n> - Evidence support: supported or limited, with affected findings and reasons.\n> \n> If content changes after checking, repeat the affected checks. Present the\n> final log, file list and both outcomes for the existing archive approval.\n> Archive the reviewed files and verify the delivered archive matches them.\n> Record archive delivery outside the reviewed bundle rather than changing its\n> contents after approval. Scrubbing is not exhaustive privacy certification."},"directory-source-26":{"body":"# skills/diagnosing-superpowers/prompts/scrub.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> Read and follow `references/redaction-policy.md` before processing any file.\n> Use its categories and the supplied lists for every redaction decision.\n> \n> You are the scrubber. You rewrite every file under BUNDLE (a directory path\n> from your dispatcher) so it can leave this machine, and you write\n> BUNDLE/scrub-log.md. You never touch anything outside BUNDLE.\n> \n> Inputs:\n> - BUNDLE: absolute path of the bundle directory.\n> - PUBLIC_REPOS: list of repository names or URLs your human partner said are\n>   public (may be empty).\n> - PROPRIETARY: list of terms your human partner named as proprietary (may be\n>   empty).\n> \n> The shared policy defines the categories and stable placeholders. Keep the\n> same original value mapped to the same placeholder across every file, with\n> numbers assigned in order of first appearance. Preserve the policy's safe\n> identity, linkage, quotation and evidence rules.\n> \n> Procedure:\n> 1. `find BUNDLE -type f` and process every file, including\n>    `environment.json` and `findings/*.md`.\n> 2. Build the replacement map as you go and apply it to every file so a value\n>    first seen in `report.md` is also replaced in `transcripts/`.\n> 3. After rewriting, recount occurrences in all final non-log bundle files,\n>    excluding `scrub-log.md`. Write `BUNDLE/scrub-log.md` as a table of\n>    placeholder → category → count. Never write a plaintext replacement map or\n>    an original value into the log.\n> 4. Return the scrub-log table and the list of files rewritten. Nothing else."},"directory-source-27":{"body":"# skills/diagnosing-superpowers/prompts/scrub-audit.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> Read and follow `references/redaction-policy.md` before inspecting any file.\n> Use its categories and the supplied lists for every audit decision.\n> \n> You are the scrub auditor. Another agent has already scrubbed every file\n> under BUNDLE. Your only job is to find what it missed. You do not fix\n> anything; you report.\n> \n> Inputs:\n> - BUNDLE: absolute path of the bundle directory.\n> - PUBLIC_REPOS: list of repository names or URLs your human partner said are\n>   public (may be empty).\n> - PROPRIETARY: list of terms your human partner named as proprietary (may be\n>   empty).\n> \n> Read every file under BUNDLE in full (these are condensed files, not raw\n> transcripts; still check `wc -c` first and read in chunks if a file is larger\n> than 200 KB). Apply the shared policy to every file, including quoted\n> transcript text, commit messages, git author lines, and encrypted payloads.\n> Check that safe command, result, source and session-line structure remains\n> available for the findings.\n> \n> Return CLEAN only if no policy misses or unresolved classifications remain.\n> Otherwise return:\n> \n> ```\n> MISSED\n> - \u003cfile>:\u003cline> — \u003ccategory> — \u003cnon-sensitive description or classification question>\n> ...\n> ```\n> \n> Never include the original sensitive value. CLEAN addresses privacy only; it\n> does not establish that exported findings remain supported. Do not comment on\n> the scrub's quality. Do not suggest fixes."},"directory-source-28":{"body":"# skills/diagnosing-superpowers/prompts/similar-session.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> You are a matcher. You decide whether one candidate session shows the same\n> behavior as a diagnosed session. You do not modify any file.\n> \n> Inputs:\n> - CASE: absolute path of the diagnosed session's case file. Read it first\n>   for the context-safety rules, discovered record meanings, and extraction\n>   commands to use.\n> - CANDIDATE: absolute path of one session transcript to examine.\n> - SIGNATURE: a list of markers. Each marker is one of:\n>   - `skill-sequence: \u003cskill A> then \u003cskill B> within \u003cn> turns`\n>   - `error-string: \"\u003ctext>\"`\n>   - `repeated-command: \"\u003ccommand>\" ≥ \u003cn> times`\n>   - `repeated-file: \u003cpath pattern> read ≥ \u003cn> times`\n>   - `compaction-then: \u003cbehavior described in one line>`\n>   - `missed-trigger: \u003cskill> for requests matching \"\u003ctext>\"`\n>   - `free: \u003cone-line description>` (use only the transcript to judge)\n> \n> Procedure:\n> 1. Apply `references/context-safety.md` to CANDIDATE. Extract its identity\n>    with the commands recorded in CASE: session id, cwd, first human prompt,\n>    first timestamp, harness version, and models.\n> 2. For each marker, locate evidence with line-number-first commands; then\n>    extract trimmed fields from the specific lines. A marker is `hit` when\n>    you have a `path:line`; `miss` when you searched and found nothing;\n>    `unknown` when the transcript lacks the field needed (say which).\n> 3. Return exactly:\n> \n> ```\n> candidate: \u003csession id> — \u003cabsolute path>\n> identity: \u003charness> \u003cversion>, \u003cfirst timestamp>, \"\u003cfirst prompt, 100 chars>\"\n> match: yes | partial | no\n> markers:\n> - \u003cmarker>: hit — \u003cpath>:\u003cline> — \"\u003cquote ≤ 120 chars>\"\n> - \u003cmarker>: miss — checked \u003cwhat>\n> - \u003cmarker>: unknown — \u003cmissing field>\n> ```\n> \n> `yes` = every marker hit; `partial` = at least one hit; `no` = none."},"directory-source-29":{"body":"# skills/diagnosing-superpowers/references/context-safety.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> # Context safety for session transcripts\n> \n> One transcript record can exceed a megabyte or embed a whole history. Printing\n> one whole record can overflow the context of the session doing the diagnosis.\n> Every reader of a session file, controller or subagent, follows these rules for\n> every file, every time.\n> \n> 1. **Measure before reading.**\n> \n>    ```bash\n>    wc -lc \"$F\"\n>    awk '{ if (length($0) > 100000) print NR, length($0) }' \"$F\"   # long lines\n>    ```\n> \n> 2. **Never `cat` or `grep` for content.** Get line numbers and counts\n>    first (`grep -n … | cut -d: -f1`, `jq -r '.type' | sort | uniq -c`),\n>    then small fields from specific lines (`sed -n Np | jq -c '{…}'` or\n>    `| cut -c1-500`). Use the field-extraction commands established during\n>    discovery for the source in front of you.\n> 3. **Narrow anything over 500 characters.** If a command returns more than\n>    500 characters for one record, tighten the field or the slice.\n> 4. **Read-only.** Never modify, move, or delete a session file."},"directory-source-30":{"body":"# skills/requesting-code-review/code-reviewer.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> # Code Reviewer Prompt Template\n> \n> Use this template when dispatching a code reviewer subagent.\n> \n> **Purpose:** Review completed work against requirements and code quality standards before it cascades into more work.\n> \n> ```\n> Subagent (general-purpose):\n>   description: \"Review code changes\"\n>   prompt: |\n>     You are a Senior Code Reviewer with expertise in software architecture,\n>     design patterns, and best practices. Your job is to review completed work\n>     against its plan or requirements and identify issues before they cascade.\n> \n>     ## What Was Implemented\n> \n>     [DESCRIPTION]\n> \n>     ## Requirements / Plan\n> \n>     [PLAN_OR_REQUIREMENTS]\n> \n>     ## Git Range to Review\n> \n>     **Base:** [BASE_SHA]\n>     **Head:** [HEAD_SHA]\n> \n>     ```bash\n>     git diff --stat [BASE_SHA]..[HEAD_SHA]\n>     git diff [BASE_SHA]..[HEAD_SHA]\n>     ```\n> \n>     ## The spec is a vision document\n> \n>     The spec says what the software must do. It does not enumerate every\n>     input, environment, or condition the software will meet. For behavior\n>     the spec is silent on, judge by what a reasonable person using this\n>     software would expect: a reasonable person's expectation is a\n>     requirement, and a spec's silence is not permission. Grade such\n>     findings by their effect on that person, not by whether the spec\n>     mentions the trigger.\n> \n>     ## Declined to judge\n> \n>     Before your verdict, list every behavior you considered and set aside\n>     as outside the plan or spec, one line each, with the reason. The\n>     executor rules on each line; nothing you set aside is dropped\n>     silently. An empty list means you set nothing aside.\n> \n>     ## Read-Only Review\n> \n>     Your review is read-only on this checkout. Do not mutate the working tree, the index, HEAD, or branch state in any way. Use tools like `git show`, `git diff`, and `git log` to inspect history. If you need a working copy of a different revision, check it out into a separate temporary directory (e.g. `git worktree add /tmp/review-[SHA] [SHA]`) — never move HEAD on this checkout.\n> \n>     ## You Do Not Dispatch Subagents\n> \n>     Do all of this review yourself. Never spawn a subagent to review part\n>     of the diff, and never spawn another reviewer for a second opinion.\n>     This process already provides every review seat the work gets; a\n>     reviewer you spawn duplicates one of them at full cost, and its\n>     verdict counts for nothing. If the diff feels too large for one\n>     pass, review it in passes yourself and say so in your report.\n> \n>     ## What to Check\n> \n>     **Plan alignment:**\n>     - Does the implementation match the plan / requirements?\n>     - Are deviations justified improvements, or problematic departures?\n>     - Is all planned functionality present?\n> \n>     **Code quality:**\n>     - Clean separation of concerns?\n>     - Proper error handling?\n>     - Type safety where applicable?\n>     - DRY without premature abstraction?\n>     - Edge cases handled?\n> \n>     **Architecture:**\n>     - Sound design decisions?\n>     - Reasonable scalability and performance?\n>     - Security concerns?\n>     - Integrates cleanly with surrounding code?\n> \n>     **Testing:**\n>     - Tests verify real behavior, not mocks?\n>     - Edge cases covered?\n>     - Integration tests where they matter?\n>     - All tests passing?\n> \n>     **Production readiness:**\n>     - Migration strategy if schema changed?\n>     - Backward compatibility considered?\n>     - Documentation complete?\n>     - No obvious bugs?\n> \n>     ## Calibration\n> \n>     Categorize issues by actual severity. Not everything is Critical.\n>     Acknowledge what was done well before listing issues — accurate praise\n>     helps the implementer trust the rest of the feedback.\n> \n>     If you find significant deviations from the plan, flag them specifically\n>     so the implementer can confirm whether the deviation was intentional.\n>     If you find issues with the plan itself rather than the implementation,\n>     say so.\n> \n>     ## Output Format\n> \n>     ### Strengths\n>     [What's well done? Be specific.]\n> \n>     ### Issues\n> \n>     #### Critical (Must Fix)\n>     [Bugs, security issues, data loss risks, broken functionality]\n> \n>     #### Important (Should Fix)\n>     [Architecture problems, missing features, poor error handling, test gaps]\n> \n>     #### Minor (Nice to Have)\n>     [Code style, optimization opportunities, documentation polish]\n> \n>     For each issue:\n>     - File:line reference\n>     - What's wrong\n>     - Why it matters\n>     - How to fix (if not obvious)\n> \n>     ### Recommendations\n>     [Improvements for code quality, architecture, or process]\n> \n>     ### Assessment\n> \n>     **Ready to merge?** [Yes | No | With fixes]\n> \n>     **Reasoning:** [1-2 sentence technical assessment]\n> \n>     ## Critical Rules\n> \n>     **DO:**\n>     - Categorize by actual severity\n>     - Be specific (file:line, not vague)\n>     - Explain WHY each issue matters\n>     - Acknowledge strengths\n>     - Give a clear verdict\n> \n>     **DON'T:**\n>     - Say \"looks good\" without checking\n>     - Mark nitpicks as Critical\n>     - Give feedback on code you didn't actually read\n>     - Be vague (\"improve error handling\")\n>     - Avoid giving a clear verdict\n> ```\n> \n> **Placeholders:**\n> - `[DESCRIPTION]` — brief summary of what was built\n> - `[PLAN_OR_REQUIREMENTS]` — what it should do (plan file path, task text, or requirements)\n> - `[BASE_SHA]` — starting commit\n> - `[HEAD_SHA]` — ending commit\n> \n> **Reviewer returns:** Strengths, Issues (Critical / Important / Minor), Recommendations, Assessment\n> \n> ## Example Output\n> \n> ```\n> ### Strengths\n> - Clean database schema with proper migrations (db.ts:15-42)\n> - Comprehensive test coverage (18 tests, all edge cases)\n> - Good error handling with fallbacks (summarizer.ts:85-92)\n> \n> ### Issues\n> \n> #### Important\n> 1. **Missing help text in CLI wrapper**\n>    - File: index-conversations:1-31\n>    - Issue: No --help flag, users won't discover --concurrency\n>    - Fix: Add --help case with usage examples\n> \n> 2. **Date validation missing**\n>    - File: search.ts:25-27\n>    - Issue: Invalid dates silently return no results\n>    - Fix: Validate ISO format, throw error with example\n> \n> #### Minor\n> 1. **Progress indicators**\n>    - File: indexer.ts:130\n>    - Issue: No \"X of Y\" counter for long operations\n>    - Impact: Users don't know how long to wait\n> \n> ### Recommendations\n> - Add progress reporting for user experience\n> - Consider config file for excluded projects (portability)\n> \n> ### Assessment\n> \n> **Ready to merge: With fixes**\n> \n> **Reasoning:** Core implementation is solid with good architecture and tests. Important issues (help text, date validation) are easily fixed and don't affect core functionality.\n> ```"},"directory-source-31":{"body":"# skills/subagent-driven-development/implementer-prompt.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> # Implementer Subagent Prompt Template\n> \n> Use this template when dispatching an implementer subagent.\n> \n> ```\n> Subagent (general-purpose):\n>   description: \"Implement Task N: [task name]\"\n>   model: [MODEL — REQUIRED: choose per SKILL.md Model Selection; an omitted\n>          model silently inherits the session's most expensive one]\n>   prompt: |\n>     You are implementing Task N: [task name]\n> \n>     ## Task Description\n> \n>     Read your task brief first: [BRIEF_FILE]\n>     It contains the full task text from the plan.\n> \n>     ## Context\n> \n>     [Scene-setting: where this fits, dependencies, architectural context]\n> \n>     ## Before You Begin\n> \n>     If you have questions about:\n>     - The requirements or acceptance criteria\n>     - The approach or implementation strategy\n>     - Dependencies or assumptions\n>     - Anything unclear in the task description\n> \n>     **Ask them now.** Raise any concerns before starting work.\n> \n>     ## Your Job\n> \n>     Once you're clear on requirements:\n>     1. Implement exactly what the task specifies\n>     2. Write tests (following TDD if task says to)\n>     3. Verify implementation works\n>     4. Commit your work\n>     5. Self-review (see below)\n>     6. Report back\n> \n>     Work from: [directory]\n> \n>     **While you work:** If you encounter something unexpected or unclear, **ask questions**.\n>     It's always OK to pause and clarify. Don't guess or make assumptions.\n> \n>     While iterating, run the focused test for what you're changing; run the\n>     full suite once before committing, not after every edit.\n> \n>     ## You Do Not Dispatch Subagents\n> \n>     Do all of this task's work yourself. Never spawn a subagent to\n>     implement part of the task, and above all never spawn a reviewer to\n>     check your work. Self-review (below) means reading your own diff.\n>     Review is the controller's job: after you report, it dispatches a\n>     fresh reviewer against your diff. A reviewer you spawn duplicates\n>     that review at full cost, and its approval counts for nothing in\n>     the process. If you catch yourself thinking \"an independent review\n>     would strengthen my report\" — that review is already scheduled.\n>     Report instead.\n> \n>     ## Code Organization\n> \n>     You reason best about code you can hold in context at once, and your edits are more\n>     reliable when files are focused. Keep this in mind:\n>     - Follow the file structure defined in the plan\n>     - Each file should have one clear responsibility with a well-defined interface\n>     - If a file you're creating is growing beyond the plan's intent, stop and report\n>       it as DONE_WITH_CONCERNS — don't split files on your own without plan guidance\n>     - If an existing file you're modifying is already large or tangled, work carefully\n>       and note it as a concern in your report\n>     - In existing codebases, follow established patterns. Improve code you're touching\n>       the way a good developer would, but don't restructure things outside your task.\n> \n>     ## When You're in Over Your Head\n> \n>     It is always OK to stop and say \"this is too hard for me.\" Bad work is worse than\n>     no work. You will not be penalized for escalating.\n> \n>     **STOP and escalate when:**\n>     - The task requires architectural decisions with multiple valid approaches\n>     - You need to understand code beyond what was provided and can't find clarity\n>     - You feel uncertain about whether your approach is correct\n>     - The task involves restructuring existing code in ways the plan didn't anticipate\n>     - You've been reading file after file trying to understand the system without progress\n> \n>     **How to escalate:** Report back with status BLOCKED or NEEDS_CONTEXT. Describe\n>     specifically what you're stuck on, what you've tried, and what kind of help you need.\n>     The controller can provide more context, re-dispatch with a more capable model,\n>     or break the task into smaller pieces.\n> \n>     ## Before Reporting Back: Self-Review\n> \n>     Review your work with fresh eyes. Ask yourself:\n> \n>     **Completeness:**\n>     - Did I fully implement everything in the spec?\n>     - Did I miss any requirements?\n>     - Are there edge cases I didn't handle?\n> \n>     **Quality:**\n>     - Is this my best work?\n>     - Are names clear and accurate (match what things do, not how they work)?\n>     - Is the code clean and maintainable?\n> \n>     **Discipline:**\n>     - Did I avoid overbuilding (YAGNI)?\n>     - Did I only build what was requested?\n>     - Did I follow existing patterns in the codebase?\n> \n>     **Testing:**\n>     - Do tests actually verify behavior (not just mock behavior)?\n>     - Did I follow TDD if required?\n>     - Are tests comprehensive?\n>     - Is the test output pristine (no stray warnings or noise)?\n> \n>     If you find issues during self-review, fix them now before reporting.\n> \n>     ## After Review Findings\n> \n>     If the task review finds issues, you will be resumed with the findings.\n>     Fix them, re-run the tests that cover the amended code, and append a fix\n>     report to your report file: what you changed, the covering tests you\n>     ran, the command, and the output. Reviewers will not re-run tests for\n>     you — your report is the test evidence. Then reply with the same short\n>     status contract as your first report.\n> \n>     ## Report Format\n> \n>     Write your full report to [REPORT_FILE]:\n>     - What you implemented (or what you attempted, if blocked)\n>     - What you tested and test results\n>     - **TDD Evidence** (if TDD was required for this task):\n>       - RED: command run, relevant failing output before implementation, and why the failure was expected\n>       - GREEN: command run and relevant passing output after implementation\n>     - Files changed\n>     - Self-review findings (if any)\n>     - Any issues or concerns\n> \n>     Then report back with ONLY (under 15 lines — the detail lives in the\n>     report file):\n>     - **Status:** DONE | DONE_WITH_CONCERNS | BLOCKED | NEEDS_CONTEXT\n>     - Commits created (short SHA + subject)\n>     - One-line test summary (e.g. \"14/14 passing, output pristine\")\n>     - Your concerns, if any\n>     - The report file path\n> \n>     If BLOCKED or NEEDS_CONTEXT, put the specifics in the final message\n>     itself — the controller acts on it directly.\n> \n>     Use DONE_WITH_CONCERNS if you completed the work but have doubts about correctness.\n>     Use BLOCKED if you cannot complete the task. Use NEEDS_CONTEXT if you need\n>     information that wasn't provided. Never silently produce work you're unsure about.\n> ```"},"directory-source-32":{"body":"# skills/subagent-driven-development/task-reviewer-prompt.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> # Task Reviewer Prompt Template\n> \n> Use this template when dispatching a task reviewer subagent. The reviewer\n> reads the task's diff once and returns two verdicts: spec compliance and\n> code quality.\n> \n> **Purpose:** Verify one task's implementation matches its requirements (nothing\n> more, nothing less) and is well-built (clean, tested, maintainable)\n> \n> ```\n> Subagent (general-purpose):\n>   description: \"Review Task N (spec + quality)\"\n>   model: [MODEL — REQUIRED: choose per SKILL.md Model Selection; an omitted\n>          model silently inherits the session's most expensive one]\n>   prompt: |\n>     You are reviewing one task's implementation: first whether it matches its\n>     requirements, then whether it is well-built. This is a task-scoped gate,\n>     not a merge review — a broad whole-branch review happens separately after\n>     all tasks are complete.\n> \n>     ## What Was Requested\n> \n>     Read the task brief: [BRIEF_FILE]\n> \n>     Global constraints from the spec/design that bind this task:\n>     [GLOBAL_CONSTRAINTS]\n> \n>     ## What the Implementer Claims They Built\n> \n>     Read the implementer's report: [REPORT_FILE]\n> \n>     ## Diff Under Review\n> \n>     **Base:** [BASE_SHA]\n>     **Head:** [HEAD_SHA]\n>     **Diff file:** [DIFF_FILE]\n> \n>     Read the diff file once — it contains the commit list, a stat summary,\n>     and the full diff with surrounding context, and it is your view of the\n>     change. The diff's context lines ARE the changed files: do not Read a\n>     changed file separately unless a hunk you must judge is cut off\n>     mid-function — and say so in your report. Do not re-run git commands.\n>     If the diff file is missing, fetch the diff yourself:\n>     `git diff --stat [BASE_SHA]..[HEAD_SHA]` and `git diff [BASE_SHA]..[HEAD_SHA]`.\n>     Do not crawl the broader codebase. Inspect code outside the diff only\n>     to evaluate a concrete risk you can name — one focused check per named\n>     risk, and name both the risk and what you checked in your report.\n>     Cross-cutting changes are legitimate named risks: if the diff changes\n>     lock ordering, a function or API contract, or shared mutable state,\n>     checking the call sites is the right method.\n> \n>     Your review is read-only on this checkout. Do not mutate the working\n>     tree, the index, HEAD, or branch state in any way.\n> \n>     ## You Do Not Dispatch Subagents\n> \n>     Do all of this review yourself. Never spawn a subagent to review part\n>     of the diff, and never spawn another reviewer for a second opinion.\n>     This process already provides every review seat the work gets; a\n>     reviewer you spawn duplicates one of them at full cost, and its\n>     verdict counts for nothing. If the diff feels too large for one\n>     pass, review it in passes yourself and say so in your report.\n> \n>     ## Do Not Trust the Report\n> \n>     Treat the implementer's report as unverified claims about the code. It\n>     may be incomplete, inaccurate, or optimistic. Verify the claims against\n>     the diff. Design rationales in the report are claims too: \"left it per\n>     YAGNI,\" \"kept it simple deliberately,\" or any other justification is the\n>     implementer grading their own work. Judge the code on its merits — a\n>     stated rationale never downgrades a finding's severity.\n> \n>     ## Tests\n> \n>     The implementer already ran the tests and reported results with TDD\n>     evidence for exactly this code. Do not re-run the suite to confirm their\n>     report. Run a test only when reading the code raises a specific doubt\n>     that no existing run answers — and then a focused test, never a\n>     package-wide suite, race detector run, or repeated/high-count loop. If\n>     heavy validation seems warranted, recommend it in your report instead of\n>     running it. If you cannot run commands in this environment, name the\n>     test you would run.\n> \n>     Warnings or other noise in the implementer's reported test output are\n>     findings — test output should be pristine.\n> \n>     Evidence you cannot see is not evidence that doesn't exist. If the\n>     report or its test evidence looks truncated, or you cannot locate the\n>     results it claims, re-read the file at its stated path — and if it is\n>     genuinely missing or garbled, report that as a gap for the controller.\n>     Re-running the suite to regenerate what you failed to read is not\n>     verification; illegibility of the evidence is not invalidation of it.\n> \n>     ## Part 1: Spec Compliance\n> \n>     Compare the diff against What Was Requested:\n> \n>     - **Missing:** requirements they skipped, missed, or claimed without\n>       implementing\n>     - **Extra:** features that weren't requested, over-engineering, unneeded\n>       \"nice to haves\"\n>     - **Misunderstood:** right feature built the wrong way, wrong problem\n>       solved\n> \n>     If the brief lists several files each with its own change (a batched\n>     dispatch), check the diff against that list file by file: every listed\n>     file must have its corresponding hunk. A listed file the diff never\n>     touches is a Missing finding, no matter how clean the rest of the\n>     batch looks.\n> \n>     If a requirement cannot be verified from this diff alone (it lives in\n>     unchanged code or spans tasks), report it as a ⚠️ item instead of\n>     broadening your search.\n> \n>     ## Part 2: Code Quality\n> \n>     **Code quality:**\n>     - Clean separation of concerns?\n>     - Proper error handling?\n>     - DRY without premature abstraction?\n>     - Edge cases handled?\n> \n>     **Tests:**\n>     - Do the new and changed tests verify real behavior, not mocks?\n>     - Are the task's edge cases covered?\n> \n>     **Structure:**\n>     - Does each file have one clear responsibility with a well-defined interface?\n>     - Are units decomposed so they can be understood and tested independently?\n>     - Is the implementation following the file structure from the plan?\n>     - Did this change create new files that are already large, or\n>       significantly grow existing files? (Don't flag pre-existing file\n>       sizes — focus on what this change contributed.)\n> \n>     Your report should point at evidence: file:line references for every\n>     finding and for any check you would otherwise answer with a bare\n>     \"yes.\" A tight report that cites lines gives the controller everything\n>     it needs.\n> \n>     Your final message is the report itself: begin directly with the\n>     spec-compliance verdict. Every line is a verdict, a finding with\n>     file:line, or a check you ran — no preamble, no process narration,\n>     no closing summary.\n> \n>     ## Calibration\n> \n>     Categorize issues by actual severity. Not everything is Critical.\n>     Important means this task cannot be trusted until it is fixed: incorrect\n>     or fragile behavior, a missed requirement, or maintainability damage you\n>     would block a merge over — verbatim duplication of a logic block,\n>     swallowed errors, tests that assert nothing. \"Coverage could be broader\"\n>     and polish suggestions are Minor.\n>     If the plan or brief explicitly mandates something this rubric calls a\n>     defect (a test that asserts nothing, verbatim duplication of a logic\n>     block), that IS a finding — report it as Important, labeled\n>     plan-mandated. The plan's authorship does not grade its own work; the\n>     human decides.\n>     Acknowledge what was done well before listing issues — accurate praise\n>     helps the implementer trust the rest of the feedback.\n> \n>     ## Output Format\n> \n>     ### Spec Compliance\n> \n>     - ✅ Spec compliant | ❌ Issues found: [what's missing/extra/misunderstood,\n>       with file:line references]\n>     - ⚠️ Cannot verify from diff: [requirements you could not verify from the\n>       diff alone, and what the controller should check — report alongside the\n>       ✅/❌ verdict for everything you could verify]\n> \n>     ### Strengths\n>     [What's well done? Be specific.]\n> \n>     ### Issues\n> \n>     #### Critical (Must Fix)\n>     #### Important (Should Fix)\n>     #### Minor (Nice to Have)\n> \n>     For each issue: file:line, what's wrong, why it matters, how to fix\n>     (if not obvious).\n> \n>     ### Assessment\n> \n>     **Task quality:** [Approved | Needs fixes]\n> \n>     **Reasoning:** [1-2 sentence technical assessment]\n> ```\n> \n> **Placeholders:**\n> - `[MODEL]` — REQUIRED: reviewer model per SKILL.md Model Selection\n> - `[BRIEF_FILE]` — REQUIRED: the task brief file (`bash scripts/task-brief PLAN N`\n>   prints the path; same file the implementer worked from)\n> - `[GLOBAL_CONSTRAINTS]` — the binding requirements copied verbatim from\n>   the plan's Global Constraints section or the spec: exact values, formats,\n>   and stated relationships between components (not process rules — those\n>   are already in this template)\n> - `[REPORT_FILE]` — REQUIRED: the file the implementer wrote its detailed\n>   report to\n> - `[BASE_SHA]` — commit before this task\n> - `[HEAD_SHA]` — current commit\n> - `[DIFF_FILE]` — REQUIRED: the path the controller wrote the review\n>   package to (`bash scripts/review-package PLAN_FILE BASE HEAD` prints the unique\n>   path it wrote; the package never enters the controller's context)\n> \n> **Reviewer returns:** Spec Compliance verdict (✅/❌/⚠️), Strengths, Issues\n> (Critical/Important/Minor), Task quality verdict"},"directory-source-33":{"body":"# skills/subagent-driven-development/re-review-prompt.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> # Scoped Re-Review Prompt Template\n> \n> Use this template when dispatching a re-review after a fix round. The\n> re-reviewer verifies the findings were addressed and checks the fix diff for\n> new breakage. It is not a fresh review — the full review already happened.\n> \n> **Purpose:** Verify each finding from the previous review was addressed, and\n> that the fix itself broke nothing.\n> \n> ```\n> Subagent (general-purpose):\n>   description: \"Re-review Task N fix round R\"\n>   model: [MODEL — REQUIRED: choose per SKILL.md Model Selection; an omitted\n>          model silently inherits the session's most expensive one]\n>   prompt: |\n>     You are re-reviewing one task's fix round. A previous review produced\n>     findings; an implementer has attempted to fix them. Your job is to\n>     verdict each finding and inspect the fix diff — nothing else.\n> \n>     ## The Task\n> \n>     Read the task brief: [BRIEF_FILE]\n> \n>     ## The Findings Under Verification\n> \n>     [FINDINGS]\n> \n>     ## The Fix\n> \n>     Read the implementer's report (fix reports are appended at the end):\n>     [REPORT_FILE]\n> \n>     **Fix base:** [FIX_BASE_SHA] (the head the previous review saw)\n>     **Head:** [HEAD_SHA]\n>     **Diff file:** [DIFF_FILE]\n> \n>     Read the diff file once — it contains the fix commits, a stat summary,\n>     and the fix diff with surrounding context. Do not re-run git commands.\n>     If the diff file is missing, fetch the diff yourself:\n>     `git diff --stat [FIX_BASE_SHA]..[HEAD_SHA]` and\n>     `git diff [FIX_BASE_SHA]..[HEAD_SHA]`.\n> \n>     Your review is read-only on this checkout. Do not mutate the working\n>     tree, the index, HEAD, or branch state in any way.\n> \n>     ## You Do Not Dispatch Subagents\n> \n>     Do all of this review yourself. Never spawn a subagent to review part\n>     of the diff, and never spawn another reviewer for a second opinion.\n>     This process already provides every review seat the work gets; a\n>     reviewer you spawn duplicates one of them at full cost, and its\n>     verdict counts for nothing. If the diff feels too large for one\n>     pass, review it in passes yourself and say so in your report.\n> \n>     ## Scope\n> \n>     Your scope is the findings list and the fix diff. Verdict every finding.\n>     Inspect the fix diff for new problems the fix itself introduced. Do NOT\n>     re-review code the fix did not touch: if you notice an issue entirely\n>     outside the fix diff, report it under Out-of-Scope Observations — it\n>     does not block this task and does not extend the loop. A broad\n>     whole-branch review happens after all tasks are complete.\n> \n>     ## Tests\n> \n>     The implementer re-ran the tests covering the amended code and appended\n>     the results to the report file. Treat the report as unverified claims:\n>     confirm the fix report names the covering tests and shows their output,\n>     and verify the claims against the diff. Do not re-run the suite to\n>     confirm their report. Run a test only when reading the code raises a\n>     specific doubt that no existing run answers — and then a focused test,\n>     never a package-wide suite.\n> \n>     ## Output Format\n> \n>     Your final message is the report itself: begin directly with the first\n>     finding's verdict. Every line is a verdict, a finding with file:line,\n>     or a check you ran — no preamble, no process narration.\n> \n>     ### Finding Verdicts\n> \n>     For each finding in The Findings Under Verification, in order:\n>     - **[finding one-liner]** — ADDRESSED | NOT ADDRESSED, with file:line\n>       evidence. \"Attempted\" is not addressed: the specific defect must no\n>       longer exist.\n> \n>     ### New Breakage in the Fix Diff\n> \n>     Anything the fix itself broke or introduced, with severity\n>     (Critical/Important/Minor) and file:line. \"None\" if clean.\n> \n>     ### Out-of-Scope Observations\n> \n>     Issues you noticed entirely outside the fix diff. Non-blocking; the\n>     controller ledgers these for the final review. \"None\" if none.\n> \n>     ### Verdict\n> \n>     **Fix round:** [All findings addressed, no new Critical/Important\n>     breakage | Findings remain open] — list the open ones.\n> ```\n> \n> **Placeholders:**\n> - `[MODEL]` — REQUIRED: reviewer model per SKILL.md Model Selection; scoped\n>   re-reviews of small fix diffs take a cheap-to-mid tier\n> - `[BRIEF_FILE]` — the task brief file (same file the implementer worked from)\n> - `[FINDINGS]` — the Critical/Important findings and spec gaps from the\n>   previous review, copied verbatim, one per bullet\n> - `[REPORT_FILE]` — the implementer's report file (fix reports appended)\n> - `[FIX_BASE_SHA]` — the head the previous review saw\n> - `[HEAD_SHA]` — current commit\n> - `[DIFF_FILE]` — the path `bash scripts/review-package PLAN_FILE FIX_BASE HEAD` printed\n> \n> **Re-reviewer returns:** per-finding verdicts (ADDRESSED / NOT ADDRESSED),\n> new breakage in the fix diff, out-of-scope observations, and a round verdict."},"directory-source-34":{"body":"# skills/systematic-debugging/root-cause-tracing.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> # Root Cause Tracing\n> \n> ## Overview\n> \n> Bugs often manifest deep in the call stack (git init in wrong directory, file created in wrong location, database opened with wrong path). Your instinct is to fix where the error appears, but that's treating a symptom.\n> \n> **Core principle:** Trace backward through the call chain until you find the original trigger, then fix at the source.\n> \n> ## When to Use\n> \n> ```dot\n> digraph when_to_use {\n>     \"Bug appears deep in stack?\" [shape=diamond];\n>     \"Can trace backwards?\" [shape=diamond];\n>     \"Fix at symptom point\" [shape=box];\n>     \"Trace to original trigger\" [shape=box];\n>     \"BETTER: Also add defense-in-depth\" [shape=box];\n> \n>     \"Bug appears deep in stack?\" -> \"Can trace backwards?\" [label=\"yes\"];\n>     \"Can trace backwards?\" -> \"Trace to original trigger\" [label=\"yes\"];\n>     \"Can trace backwards?\" -> \"Fix at symptom point\" [label=\"no - dead end\"];\n>     \"Trace to original trigger\" -> \"BETTER: Also add defense-in-depth\";\n> }\n> ```\n> \n> **Use when:**\n> - Error happens deep in execution (not at entry point)\n> - Stack trace shows long call chain\n> - Unclear where invalid data originated\n> - Need to find which test/code triggers the problem\n> \n> ## The Tracing Process\n> \n> ### 1. Observe the Symptom\n> ```\n> Error: git init failed in ~/project/packages/core\n> ```\n> \n> ### 2. Find Immediate Cause\n> **What code directly causes this?**\n> ```typescript\n> await execFileAsync('git', ['init'], { cwd: projectDir });\n> ```\n> \n> ### 3. Ask: What Called This?\n> ```typescript\n> WorktreeManager.createSessionWorktree(projectDir, sessionId)\n>   → called by Session.initializeWorkspace()\n>   → called by Session.create()\n>   → called by test at Project.create()\n> ```\n> \n> ### 4. Keep Tracing Up\n> **What value was passed?**\n> - `projectDir = ''` (empty string!)\n> - Empty string as `cwd` resolves to `process.cwd()`\n> - That's the source code directory!\n> \n> ### 5. Find Original Trigger\n> **Where did empty string come from?**\n> ```typescript\n> const context = setupCoreTest(); // Returns { tempDir: '' }\n> Project.create('name', context.tempDir); // Accessed before beforeEach!\n> ```\n> \n> ## Adding Stack Traces\n> \n> When you can't trace manually, add instrumentation:\n> \n> ```typescript\n> // Before the problematic operation\n> async function gitInit(directory: string) {\n>   const stack = new Error().stack;\n>   console.error('DEBUG git init:', {\n>     directory,\n>     cwd: process.cwd(),\n>     nodeEnv: process.env.NODE_ENV,\n>     stack,\n>   });\n> \n>   await execFileAsync('git', ['init'], { cwd: directory });\n> }\n> ```\n> \n> **Critical:** Use `console.error()` in tests (not logger - may not show)\n> \n> **Run and capture:**\n> ```bash\n> npm test 2>&1 | grep 'DEBUG git init'\n> ```\n> \n> **Analyze stack traces:**\n> - Look for test file names\n> - Find the line number triggering the call\n> - Identify the pattern (same test? same parameter?)\n> \n> ## Finding Which Test Causes Pollution\n> \n> If something appears during tests but you don't know which test:\n> \n> Use the bisection script `find-polluter.sh` in this directory:\n> \n> ```bash\n> bash ./find-polluter.sh '.git' 'src/**/*.test.ts'\n> ```\n> \n> Runs tests one-by-one, stops at first polluter. See script for usage.\n> \n> ## Real Example: Empty projectDir\n> \n> **Symptom:** `.git` created in `packages/core/` (source code)\n> \n> **Trace chain:**\n> 1. `git init` runs in `process.cwd()` ← empty cwd parameter\n> 2. WorktreeManager called with empty projectDir\n> 3. Session.create() passed empty string\n> 4. Test accessed `context.tempDir` before beforeEach\n> 5. setupCoreTest() returns `{ tempDir: '' }` initially\n> \n> **Root cause:** Top-level variable initialization accessing empty value\n> \n> **Fix:** Made tempDir a getter that throws if accessed before beforeEach\n> \n> **Also added defense-in-depth:**\n> - Layer 1: Project.create() validates directory\n> - Layer 2: WorkspaceManager validates not empty\n> - Layer 3: NODE_ENV guard refuses git init outside tmpdir\n> - Layer 4: Stack trace logging before git init\n> \n> ## Key Principle\n> \n> ```dot\n> digraph principle {\n>     \"Found immediate cause\" [shape=ellipse];\n>     \"Can trace one level up?\" [shape=diamond];\n>     \"Trace backwards\" [shape=box];\n>     \"Is this the source?\" [shape=diamond];\n>     \"Fix at source\" [shape=box];\n>     \"Add validation at each layer\" [shape=box];\n>     \"Bug impossible\" [shape=doublecircle];\n>     \"NEVER fix just the symptom\" [shape=octagon, style=filled, fillcolor=red, fontcolor=white];\n> \n>     \"Found immediate cause\" -> \"Can trace one level up?\";\n>     \"Can trace one level up?\" -> \"Trace backwards\" [label=\"yes\"];\n>     \"Can trace one level up?\" -> \"NEVER fix just the symptom\" [label=\"no\"];\n>     \"Trace backwards\" -> \"Is this the source?\";\n>     \"Is this the source?\" -> \"Trace backwards\" [label=\"no - keeps going\"];\n>     \"Is this the source?\" -> \"Fix at source\" [label=\"yes\"];\n>     \"Fix at source\" -> \"Add validation at each layer\";\n>     \"Add validation at each layer\" -> \"Bug impossible\";\n> }\n> ```\n> \n> **NEVER fix just where the error appears.** Trace back to find the original trigger.\n> \n> ## Stack Trace Tips\n> \n> **In tests:** Use `console.error()` not logger - logger may be suppressed\n> **Before operation:** Log before the dangerous operation, not after it fails\n> **Include context:** Directory, cwd, environment variables, timestamps\n> **Capture stack:** `new Error().stack` shows complete call chain\n> \n> ## Real-World Impact\n> \n> From debugging session (2025-10-03):\n> - Found root cause through 5-level trace\n> - Fixed at source (getter validation)\n> - Added 4 layers of defense\n> - 1847 tests passed, zero pollution"},"directory-source-35":{"body":"# skills/systematic-debugging/defense-in-depth.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> # Defense-in-Depth Validation\n> \n> ## Overview\n> \n> When you fix a bug caused by invalid data, adding validation at one place feels sufficient. But that single check can be bypassed by different code paths, refactoring, or mocks.\n> \n> **Core principle:** Validate at EVERY layer data passes through. Make the bug structurally impossible.\n> \n> ## Why Multiple Layers\n> \n> Single validation: \"We fixed the bug\"\n> Multiple layers: \"We made the bug impossible\"\n> \n> Different layers catch different cases:\n> - Entry validation catches most bugs\n> - Business logic catches edge cases\n> - Environment guards prevent context-specific dangers\n> - Debug logging helps when other layers fail\n> \n> ## The Four Layers\n> \n> ### Layer 1: Entry Point Validation\n> **Purpose:** Reject obviously invalid input at API boundary\n> \n> ```typescript\n> function createProject(name: string, workingDirectory: string) {\n>   if (!workingDirectory || workingDirectory.trim() === '') {\n>     throw new Error('workingDirectory cannot be empty');\n>   }\n>   if (!existsSync(workingDirectory)) {\n>     throw new Error(`workingDirectory does not exist: ${workingDirectory}`);\n>   }\n>   if (!statSync(workingDirectory).isDirectory()) {\n>     throw new Error(`workingDirectory is not a directory: ${workingDirectory}`);\n>   }\n>   // ... proceed\n> }\n> ```\n> \n> ### Layer 2: Business Logic Validation\n> **Purpose:** Ensure data makes sense for this operation\n> \n> ```typescript\n> function initializeWorkspace(projectDir: string, sessionId: string) {\n>   if (!projectDir) {\n>     throw new Error('projectDir required for workspace initialization');\n>   }\n>   // ... proceed\n> }\n> ```\n> \n> ### Layer 3: Environment Guards\n> **Purpose:** Prevent dangerous operations in specific contexts\n> \n> ```typescript\n> async function gitInit(directory: string) {\n>   // In tests, refuse git init outside temp directories\n>   if (process.env.NODE_ENV === 'test') {\n>     const normalized = normalize(resolve(directory));\n>     const tmpDir = normalize(resolve(tmpdir()));\n> \n>     if (!normalized.startsWith(tmpDir)) {\n>       throw new Error(\n>         `Refusing git init outside temp dir during tests: ${directory}`\n>       );\n>     }\n>   }\n>   // ... proceed\n> }\n> ```\n> \n> ### Layer 4: Debug Instrumentation\n> **Purpose:** Capture context for forensics\n> \n> ```typescript\n> async function gitInit(directory: string) {\n>   const stack = new Error().stack;\n>   logger.debug('About to git init', {\n>     directory,\n>     cwd: process.cwd(),\n>     stack,\n>   });\n>   // ... proceed\n> }\n> ```\n> \n> ## Applying the Pattern\n> \n> When you find a bug:\n> \n> 1. **Trace the data flow** - Where does bad value originate? Where used?\n> 2. **Map all checkpoints** - List every point data passes through\n> 3. **Add validation at each layer** - Entry, business, environment, debug\n> 4. **Test each layer** - Try to bypass layer 1, verify layer 2 catches it\n> \n> ## Example from Session\n> \n> Bug: Empty `projectDir` caused `git init` in source code\n> \n> **Data flow:**\n> 1. Test setup → empty string\n> 2. `Project.create(name, '')`\n> 3. `WorkspaceManager.createWorkspace('')`\n> 4. `git init` runs in `process.cwd()`\n> \n> **Four layers added:**\n> - Layer 1: `Project.create()` validates not empty/exists/writable\n> - Layer 2: `WorkspaceManager` validates projectDir not empty\n> - Layer 3: `WorktreeManager` refuses git init outside tmpdir in tests\n> - Layer 4: Stack trace logging before git init\n> \n> **Result:** All 1847 tests passed, bug impossible to reproduce\n> \n> ## Key Insight\n> \n> All four layers were necessary. During testing, each layer caught bugs the others missed:\n> - Different code paths bypassed entry validation\n> - Mocks bypassed business logic checks\n> - Edge cases on different platforms needed environment guards\n> - Debug logging identified structural misuse\n> \n> **Don't stop at one validation point.** Add checks at every layer."},"directory-source-36":{"body":"# skills/systematic-debugging/condition-based-waiting.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> # Condition-Based Waiting\n> \n> ## Overview\n> \n> Flaky tests often guess at timing with arbitrary delays. This creates race conditions where tests pass on fast machines but fail under load or in CI.\n> \n> **Core principle:** Wait for the actual condition you care about, not a guess about how long it takes.\n> \n> ## When to Use\n> \n> ```dot\n> digraph when_to_use {\n>     \"Test uses setTimeout/sleep?\" [shape=diamond];\n>     \"Testing timing behavior?\" [shape=diamond];\n>     \"Document WHY timeout needed\" [shape=box];\n>     \"Use condition-based waiting\" [shape=box];\n> \n>     \"Test uses setTimeout/sleep?\" -> \"Testing timing behavior?\" [label=\"yes\"];\n>     \"Testing timing behavior?\" -> \"Document WHY timeout needed\" [label=\"yes\"];\n>     \"Testing timing behavior?\" -> \"Use condition-based waiting\" [label=\"no\"];\n> }\n> ```\n> \n> **Use when:**\n> - Tests have arbitrary delays (`setTimeout`, `sleep`, `time.sleep()`)\n> - Tests are flaky (pass sometimes, fail under load)\n> - Tests timeout when run in parallel\n> - Waiting for async operations to complete\n> \n> **Don't use when:**\n> - Testing actual timing behavior (debounce, throttle intervals)\n> - Always document WHY if using arbitrary timeout\n> \n> ## Core Pattern\n> \n> ```typescript\n> // ❌ BEFORE: Guessing at timing\n> await new Promise(r => setTimeout(r, 50));\n> const result = getResult();\n> expect(result).toBeDefined();\n> \n> // ✅ AFTER: Waiting for condition\n> await waitFor(() => getResult() !== undefined);\n> const result = getResult();\n> expect(result).toBeDefined();\n> ```\n> \n> ## Quick Patterns\n> \n> | Scenario | Pattern |\n> |----------|---------|\n> | Wait for event | `waitFor(() => events.find(e => e.type === 'DONE'))` |\n> | Wait for state | `waitFor(() => machine.state === 'ready')` |\n> | Wait for count | `waitFor(() => items.length >= 5)` |\n> | Wait for file | `waitFor(() => fs.existsSync(path))` |\n> | Complex condition | `waitFor(() => obj.ready && obj.value > 10)` |\n> \n> ## Implementation\n> \n> Generic polling function:\n> ```typescript\n> async function waitFor\u003cT>(\n>   condition: () => T | undefined | null | false,\n>   description: string,\n>   timeoutMs = 5000\n> ): Promise\u003cT> {\n>   const startTime = Date.now();\n> \n>   while (true) {\n>     const result = condition();\n>     if (result) return result;\n> \n>     if (Date.now() - startTime > timeoutMs) {\n>       throw new Error(`Timeout waiting for ${description} after ${timeoutMs}ms`);\n>     }\n> \n>     await new Promise(r => setTimeout(r, 10)); // Poll every 10ms\n>   }\n> }\n> ```\n> \n> See `condition-based-waiting-example.ts` in this directory for complete implementation with domain-specific helpers (`waitForEvent`, `waitForEventCount`, `waitForEventMatch`) from actual debugging session.\n> \n> ## Common Mistakes\n> \n> **❌ Polling too fast:** `setTimeout(check, 1)` - wastes CPU\n> **✅ Fix:** Poll every 10ms\n> \n> **❌ No timeout:** Loop forever if condition never met\n> **✅ Fix:** Always include timeout with clear error\n> \n> **❌ Stale data:** Cache state before loop\n> **✅ Fix:** Call getter inside loop for fresh data\n> \n> ## When Arbitrary Timeout IS Correct\n> \n> ```typescript\n> // Tool ticks every 100ms - need 2 ticks to verify partial output\n> await waitForEvent(manager, 'TOOL_STARTED'); // First: wait for condition\n> await new Promise(r => setTimeout(r, 200));   // Then: wait for timed behavior\n> // 200ms = 2 ticks at 100ms intervals - documented and justified\n> ```\n> \n> **Requirements:**\n> 1. First wait for triggering condition\n> 2. Based on known timing (not guessing)\n> 3. Comment explaining WHY\n> \n> ## Real-World Impact\n> \n> From debugging session (2025-10-03):\n> - Fixed 15 flaky tests across 3 files\n> - Pass rate: 60% → 100%\n> - Execution time: 40% faster\n> - No more race conditions"},"directory-source-37":{"body":"# skills/test-driven-development/writing-good-tests.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> # Writing Good Tests\n> \n> **Load this reference when:** writing or changing tests, adding mocks, or\n> adding cleanup/helper methods for tests.\n> \n> ## Overview\n> \n> A test exists to catch a specific break. Two principles govern everything\n> here:\n> \n> ```\n> 1. Every test names the break it catches\n> 2. Every test exercises the real thing\n> ```\n> \n> Strict TDD produces both naturally: a test written first and watched\n> failing against real code has already proven it can fail, and only earns\n> a mock when the real dependency proves slow or external.\n> \n> ## Principle 1: Name the Break\n> \n> Before writing the test body, answer: **what production change should\n> make this test fail — and is that change a bug or a decision?** A test\n> earns its place by catching a wrong branch, missing side effect, wrong\n> argument, boundary case, or broken contract.\n> \n> **Derive expectations independently.** Use literals and hand-checked\n> fixtures; table-driven tests with literal `want` values are the preferred\n> shape. An expectation computed by the code under test — or its helpers —\n> passes no matter what that code does:\n> \n> ```typescript\n> // ❌ Mirror assertion: the same builder computes both sides — always true\n> const expected = buildSearchQuery({ tag: 'urgent' });\n> expect(buildSearchQuery({ tag: 'urgent' })).toBe(expected);\n> \n> // ✅ Hand-derived literal\n> expect(buildSearchQuery({ tag: 'urgent' })).toBe('tag:\"urgent\"');\n> ```\n> \n> **No change detectors.** If only intentional decisions can fail a test —\n> a constant's value, exact message wording, private structure — it fires\n> on redesign and sleeps through bugs. Test the behavior that depends on\n> the decision: not `expect(MAX_RETRIES).toBe(5)` but \"a failing call is\n> retried 5 times and the 6th attempt never happens.\"\n> \n> **Behavior, not text.** Asserting that a script, skill, or config\n> contains an exact line proves only that the source is the source. Run\n> scripts against controlled inputs and assert outputs, side effects, or\n> exit codes. Documents that instruct agents are tested by the consuming\n> agent's behavior (superpowers:writing-skills); prose for humans earns no\n> test at all.\n> \n> **Your code, not the framework.** Test the contract your code makes at\n> its boundaries — the route you register, the query you emit, the payload\n> you produce. Upstream mechanics are their maintainers' tests to write\n> (the classic: asserting your router invokes a registered handler — that\n> is the framework's test, not yours). When upstream behavior genuinely\n> surprised you, write one narrow characterization test naming the\n> assumption. The same boundary applies inside your code: constructors,\n> getters, constants, and trivial forwarding earn tests only when they\n> validate, normalize, default, derive, enforce, or cause side effects —\n> otherwise assert the first consumer-visible result that depends on them.\n> \n> ### Gate Function\n> \n> ```\n> BEFORE writing the test body:\n>   Name the production change that would make this test fail.\n> \n>   Cannot name one            → redesign around an observable behavior\n>   \"The source text changed\"  → run the artifact and assert its effects\n>   Only intentional decisions → change detector; test the behavior\n>                                that depends on the decision\n> \n>   Confirm the expected value is derived without the code under test.\n>   IF it reuses the code's logic or helpers:\n>     Replace it with a literal or hand-checked fixture\n> ```\n> \n> ## Principle 2: Exercise the Real Thing\n> \n> **The mock earns no assertions.** A mock assertion passes when the mock\n> is present and fails when it is absent — it says nothing about the\n> component. Assert the real component's behavior; if the mock is what you\n> are checking, unmock it or delete the assertion.\n> \n> ```typescript\n> // ✅ Real behavior\n> expect(screen.getByRole('navigation')).toBeInTheDocument();\n> \n> // ❌ Mock existence\n> expect(screen.getByTestId('sidebar-mock')).toBeInTheDocument();\n> ```\n> \n> **your human partner's correction:** \"Are we testing the behavior of a\n> mock?\"\n> \n> **Mock at the right level.** Learn every side effect of the real method\n> before replacing it; mock the slow or external operation and keep what\n> the test depends on real. When unsure, run the test against the real\n> implementation first and observe what actually needs to happen.\n> \n> ```typescript\n> // ❌ The mock swallows the config write that duplicate detection reads\n> vi.mock('ToolCatalog', () => ({\n>   discoverAndCacheTools: vi.fn().mockResolvedValue(undefined)\n> }));\n> \n> // ✅ Mock only the slow server startup; the config write stays real\n> vi.mock('MCPServerManager');\n> ```\n> \n> **Make doubles specific.** When arguments, call counts, or ordering are\n> part of the contract, assert them — a fake that accepts anything verifies\n> nothing. Give each branch (success, error, malformed) its own fixture or\n> spy, so the wrong branch cannot satisfy the expectation.\n> \n> **Mirror real data completely.** Mock the complete structure as it exists\n> in reality — all documented fields — not just the ones your test reads.\n> Partial mocks fail silently when downstream code reads an omitted field:\n> the test passes while integration breaks.\n> \n> **Production classes carry production methods only.** Cleanup that only\n> tests need lives in test utilities, never as a `destroy()` on the\n> production class. Ask: is this method called only from tests? Does this\n> class own this resource's lifecycle? Wrong answers → test utility.\n> \n> **Prefer real components over complex mocks.** When mock setup outgrows\n> the test logic, mocks miss methods the real components have, or tests\n> break when the mock changes, switch to an integration test with real\n> components. **your human partner's question:** \"Do we need to be using a\n> mock here?\"\n> \n> ### Gate Function\n> \n> ```\n> BEFORE adding a mock or test helper:\n>   List the real method's side effects; keep the ones the test\n>   depends on real — mock the slow/external level below them.\n> \n>   Mock responses mirror the complete real structure.\n> \n>   A method only tests call lives in test utilities, not production.\n> \n>   About to assert on the mock itself?\n>     Unmock it or delete the assertion.\n> ```\n> \n> ## Tests Ship With the Implementation\n> \n> The TDD cycle — failing test, minimal implementation, refactor — is what\n> \"complete\" means. Ship the tests the behavior needs and only those:\n> trivial code and human prose earn none, and a test written to satisfy\n> process costs maintenance forever.\n> \n> ## The Mutation Check\n> \n> Before finishing, mentally mutate the production code; at least one test\n> should fail for each realistic mutation:\n> \n> - Wrong constant or argument\n> - Wrong branch handler\n> - Missing state change or side effect\n> - Empty or default return\n> - Missing validation for zero, empty, nil, unauthorized, or malformed input\n> \n> A mutation nothing catches marks the behavior as unprotected — or the\n> test as tautological.\n> \n> ## Quick Reference\n> \n> | When you... | Do |\n> |-------------|-----|\n> | Write any test | Name the break it catches — a bug, not a decision |\n> | Build an expected value | Derive it by hand; never with the code under test |\n> | Test a script or document | Run it / pressure-test its consumer; never grep its text |\n> | Reach for a dependency test | Test your boundary contract, not their documented mechanics |\n> | Want to assert on a mocked element | Test the real component, or unmock it |\n> | Are about to mock a method | Learn its side effects; mock the slow/external level |\n> | Build a mock response | Mirror the real structure completely |\n> | Need cleanup only tests use | Put it in test utilities |\n> | Watch mock setup balloon | Switch to an integration test with real components |\n> | Finish a test file | Run the mutation check |\n> \n> ## Warning Signs\n> \n> - Setup and assertion share the same object, guaranteeing equality\n> - The test can fail only through a panic, crash, or missing selector\n> - The test fails on every intentional change, never on accidental breakage\n> - Expected values are hidden behind loops, builders, or helpers\n> - The test greps source text, or asserts a removed symbol stays removed\n> - The test would still matter if only the framework remained\n> - The test exists for coverage, checking no side effect or outcome\n> - An assertion checks a `*-mock` test ID, or fails if you remove the mock\n> - A method is called only from test files\n> - Mock setup is more than half the test, or you can't explain why the mock is needed\n> - Mocking \"just to be safe\""},"directory-21":{"body":"# skills/using-superpowers/references\n\n## 本目录来源 / Local sources\n\n- skills/using-superpowers/references/claude-code-tools.md · 0 条已整理规则\n\n- skills/using-superpowers/references/codex-tools.md · 0 条已整理规则\n\n- skills/using-superpowers/references/pi-tools.md · 0 条已整理规则\n\n- skills/using-superpowers/references/antigravity-tools.md · 0 条已整理规则\n\n- skills/using-superpowers/references/hermes-tools.md · 0 条已整理规则\n\n- skills/using-superpowers/references/muse-tools.md · 0 条已整理规则\n\n- skills/using-superpowers/references/gemini-tools.md · 0 条已整理规则\n\n\n## 上级指令来源 / Ancestor instructions\n\n- AGENTS.md · 1 条已整理规则\n  技能行为修改需要评估证据：修改技能行为内容；其中 PR 评测交付要求仅在准备提交 PR 时触发。（conditional）\n- GEMINI.md · 0 条已整理规则\n\n\n## 生效边界 / Applicability boundary\n\n上级指令是继承审查的候选依据，不代表其中每条规则都无条件生效。结合当前工具、任务条件、显式覆盖和冲突审查判断。目录包含关系本身不证明覆盖。Skills 与引用文档按调用和引用关系判断，不以存放目录推断作用域。仅展示已采集来源；没有来源不等于没有约束。\n\n已整理 1 条规则，来自 1 份来源。仅审查当前 Designify skill refine 任务直接适用的 AGENTS.md 技能修改规则；未审查的工作流细则与其他贡献者要求保留为覆盖缺口。。其他来源尚未逐条提炼；这不是整个仓库的合规审计。"},"directory-source-38":{"body":"# skills/using-superpowers/references/claude-code-tools.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> # Claude Code Tool Notes\n> \n> Claude Code is the reference harness: skills speak its vocabulary\n> (`Agent` for a subagent dispatch, todos, `Skill`). These notes cover the\n> one place Claude Code can run a plan cheaper than the skills' default\n> shape. It is opt-in by your human partner and changes nothing the skills\n> require.\n> \n> ## Cheaper orchestration for subagent-driven development\n> \n> The controller session is the most expensive seat in a\n> superpowers:subagent-driven-development run: it reads every dispatch\n> result and every report, and it usually runs on the session's most\n> capable model. Claude Code supports nested subagents (three layers below\n> the main conversation by default; `CLAUDE_CODE_MAX_SUBAGENT_SPAWN_DEPTH`\n> adjusts it), so the whole loop can run one layer down.\n> \n> When your human partner asks for it — or has said the session model is\n> too expensive to spend on coordination — dispatch ONE orchestrator\n> subagent on a mid-tier model with the plan path and the instruction to\n> use superpowers:subagent-driven-development end to end. The orchestrator\n> dispatches its own implementers and reviewers per that skill's Model\n> Selection; the workspace and ledger live on disk, so nothing is lost to\n> the extra layer. Its final message must carry the \"Rulings I made\" list\n> verbatim — that list is how the decisions reach your human partner, and\n> you relay it, not summarize it.\n> \n> Do this only for a whole plan. Nesting a single task's dispatch buys\n> nothing and adds a seat."},"directory-source-39":{"body":"# skills/using-superpowers/references/codex-tools.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> ## Subagent dispatch requires multi-agent support\n> \n> Add to your Codex config (`~/.codex/config.toml`):\n> \n> ```toml\n> [features]\n> multi_agent = true\n> ```\n> \n> This enables the multi-agent tools that skills like\n> `dispatching-parallel-agents` and `subagent-driven-development` use.\n> Which tools you get depends on the multi-agent version your model\n> preset selects (current presets run V2; older ones run V1). Trust your\n> actual tool list over any table — including this one — when they\n> disagree.\n> \n> - **Spawning:** give children a clean context with\n>   `spawn_agent {fork_turns: \"none\"}`; the default `\"all\"` copies your\n>   entire transcript into the child. On Codex 0.145+, role files under\n>   `~/.codex/agents/` attach to isolated forks via `agent_type`.\n>   Full-history forks accept `model` and `reasoning_effort` overrides\n>   (only `agent_type` is refused there) — isolated forks are the SDD\n>   default for context hygiene, not because overrides require them.\n> - **Fix rounds:** resume the implementer with `followup_task` — it\n>   delivers your message, triggers a turn, and transparently reloads a\n>   child the harness evicted. Never dispatch a fresh implementer on the\n>   theory that a spawned agent cannot be messaged again; on V2 it\n>   always can.\n> - **Lifecycle:** V2 has no `close_agent`. Finished children are\n>   evicted automatically when slots are needed; leaving them unclosed\n>   costs nothing. Only V1 sessions have `close_agent` — there, close\n>   reviewers when their review returns, and close each implementer\n>   after its task's review passes.\n> - **Model names:** never copy a model name from a skill, table, or old\n>   session into `spawn_agent` without checking it against your current\n>   spawn allowlist — V2 accepts only V2-capable presets and hard-errors\n>   on the rest.\n> \n> ## Waiting on children\n> \n> `wait_agent` is an event subscription, not a poll: a long wait wakes\n> the moment a child produces mailbox activity, with the same latency as\n> a short one. Short-timeout polling buys nothing and costs a tool call —\n> and a context rebill — per poll. In measured sessions, roughly\n> two-thirds of all wait calls were short polls that timed out.\n> \n> - While you still have local work, do not wait at all. A completed\n>   child's final answer is pushed into your mailbox and arrives with\n>   your next turn.\n> - When you are genuinely idle with children outstanding, wait in\n>   bounded stretches: `wait_agent` with `timeout_ms` 300000-600000\n>   (5-10 minutes). After each stretch — wake or timeout — post one\n>   status line, run `list_agents`, and chase any child that finished\n>   without reporting. Never stack polls shorter than five minutes; the\n>   event subscription wakes a bounded stretch just as fast as a short\n>   one.\n> - Completion mail cannot wake an idle controller (it is delivered\n>   without triggering a turn); covering that idle window is\n>   `wait_agent`'s only job. A stretch that times out with no activity\n>   is your cue to reconcile, not to shorten the next stretch.\n> \n> ## Model routing on spawns\n> \n> Every `spawn_agent` you issue — including when you are yourself a\n> spawned child running a fan-out — sets `model` AND `reasoning_effort`\n> explicitly, per the Model Selection rules of the skill you are\n> executing. Setting `model` alone is a trap: the child's effort\n> silently resets to that model's default, not to yours.\n> \n> Ask your human partner to add a machine-level backstop to\n> `~/.codex/config.toml` so any spawn that slips through still routes to\n> a deliberate tier instead of silently inheriting the session's most\n> expensive model:\n> \n> ```toml\n> [agents]\n> default_subagent_model = \"\u003ca mid-tier model from your spawn allowlist>\"\n> default_subagent_reasoning_effort = \"medium\"\n> ```\n> \n> ## Environment Detection\n> \n> Skills that create worktrees or finish branches should detect their\n> environment with read-only git commands before proceeding:\n> \n> ```bash\n> GIT_DIR=$(cd \"$(git rev-parse --git-dir)\" 2>/dev/null && pwd -P)\n> GIT_COMMON=$(cd \"$(git rev-parse --git-common-dir)\" 2>/dev/null && pwd -P)\n> BRANCH=$(git branch --show-current)\n> ```\n> \n> - `GIT_DIR != GIT_COMMON` → already in a linked worktree (skip creation)\n> - `BRANCH` empty → detached HEAD (cannot branch/push/PR from sandbox)\n> \n> See `using-git-worktrees` Step 0 and `finishing-a-development-branch`\n> Step 1 for how each skill uses these signals.\n> \n> ## Codex App Finishing\n> \n> When the sandbox blocks branch/push operations (detached HEAD in an\n> externally managed worktree), the agent commits all work and informs\n> the user to use the App's native controls:\n> \n> - **\"Create branch\"** — names the branch, then commit/push/PR via App UI\n> - **\"Hand off to local\"** — transfers work to the user's local checkout\n> \n> The agent can still run tests, stage files, and output suggested branch\n> names, commit messages, and PR descriptions for the user to copy."},"directory-source-40":{"body":"# skills/using-superpowers/references/pi-tools.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> # Pi Tool Mapping\n> \n> Skills speak in actions (\"dispatch a subagent\", \"create a todo\", \"read a file\"). On Pi these resolve to the tools below.\n> \n> | Action skills request | Pi equivalent |\n> | --- | --- |\n> | Dispatch a subagent (`Subagent (general-purpose):` template) | Use an installed subagent tool such as `subagent` from `pi-subagents` if available |\n> | Task tracking (\"create a todo\", \"mark complete\") | Use an installed todo/task tool if available, otherwise track tasks in the plan or `TODO.md` |\n> \n> ## Subagents\n> \n> Pi core does not ship a standard subagent tool. The `pi-subagents` package is a strong optional companion and provides a `subagent` tool with single-agent, chain, parallel, async, forked-context, and resume/status workflows. If no subagent tool is available, do not fabricate `Task` calls; execute sequentially in the current session or explain that the optional subagent capability is not installed.\n> \n> ## Task lists\n> \n> Pi core does not ship a standard task-list tool. If a todo/task extension is installed, use its documented tool. Otherwise use Superpowers plan files, checklists in Markdown, or a repo-local `TODO.md` for task tracking. Older Superpowers docs may refer to `TodoWrite`; treat that as the task-tracking action above."},"directory-source-41":{"body":"# skills/using-superpowers/references/antigravity-tools.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> # Antigravity CLI (`agy`) Tool Mapping\n> \n> Skills speak in actions (\"dispatch a subagent\", \"create a todo\", \"read a file\"). On the Antigravity CLI (`agy`) these resolve to the tools below.\n> \n> | Action skills request | Antigravity CLI equivalent |\n> |----------------------|----------------------|\n> | Dispatch a subagent (`Subagent (general-purpose):` template) | `invoke_subagent` with a built-in `TypeName` — `self` for full-capability work, `research` for read-only |\n> | Task tracking (\"create a todo\", \"mark complete\") | a **task artifact** — `write_to_file` with `IsArtifact: true` and `ArtifactType: \"task\"` (see [Task tracking](#task-tracking)). **Not** `manage_task`, which manages background processes. |\n> \n> ## Task tracking\n> \n> Antigravity has **no todo tool** (`manage_task` manages background\n> processes — `list`/`kill`/`status`/`send_input` — it is *not* a checklist). When a\n> skill says to create a todo list or track tasks, maintain a **task artifact**: a\n> markdown checklist saved with `write_to_file` (`IsArtifact: true`,\n> `
