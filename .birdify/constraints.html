LAUDE.md, AGENTS.md, GEMINI.md, etc, direct requests) take precedence over skills, which in turn override default behavior. Only skip skill workflows or instructions when your human partner has explicitly told you to."},"directory-14":{"body":"# skills/verification-before-completion\n\n## 本目录来源 / Local sources\n\n- skills/verification-before-completion/SKILL.md · 0 条已整理规则\n\n\n## 上级指令来源 / Ancestor instructions\n\n- AGENTS.md · 1 条已整理规则\n  技能行为修改需要评估证据：修改技能行为内容；其中 PR 评测交付要求仅在准备提交 PR 时触发。（conditional）\n- GEMINI.md · 0 条已整理规则\n\n\n## 生效边界 / Applicability boundary\n\n上级指令是继承审查的候选依据，不代表其中每条规则都无条件生效。结合当前工具、任务条件、显式覆盖和冲突审查判断。目录包含关系本身不证明覆盖。Skills 与引用文档按调用和引用关系判断，不以存放目录推断作用域。仅展示已采集来源；没有来源不等于没有约束。\n\n已整理 1 条规则，来自 1 份来源。仅审查当前 Designify skill refine 任务直接适用的 AGENTS.md 技能修改规则；未审查的工作流细则与其他贡献者要求保留为覆盖缺口。。其他来源尚未逐条提炼；这不是整个仓库的合规审计。"},"directory-source-14":{"body":"# skills/verification-before-completion/SKILL.md\n\n类型：skill\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> ---\n> name: verification-before-completion\n> description: Use when about to claim work is complete, fixed, or passing, before committing or creating PRs - requires running verification commands and confirming output before making any success claims; evidence before assertions always\n> ---\n> \n> # Verification Before Completion\n> \n> ## Overview\n> \n> **Core principle:** Evidence before claims, always.\n> \n> **Violating the letter of this rule is violating the spirit of this rule.**\n> \n> ## The Iron Law\n> \n> ```\n> NO COMPLETION CLAIMS WITHOUT FRESH VERIFICATION EVIDENCE\n> ```\n> \n> If you haven't run the verification command in this message, you cannot claim it passes.\n> \n> ## The Gate Function\n> \n> ```\n> BEFORE claiming any status or expressing satisfaction:\n> \n> 1. IDENTIFY: What command proves this claim?\n> 2. RUN: Execute the FULL command (fresh, complete)\n> 3. READ: Full output, check exit code, count failures\n> 4. VERIFY: Does output confirm the claim?\n>    - If NO: State actual status with evidence\n>    - If YES: State claim WITH evidence\n> 5. ONLY THEN: Make the claim\n> \n> Skip any step = lying, not verifying\n> ```\n> \n> ## Common Failures\n> \n> | Claim | Requires | Not Sufficient |\n> |-------|----------|----------------|\n> | Tests pass | Test command output: 0 failures | Previous run, \"should pass\" |\n> | Linter clean | Linter output: 0 errors | Partial check, extrapolation |\n> | Build succeeds | Build command: exit 0 | Linter passing, logs look good |\n> | Bug fixed | Test original symptom: passes | Code changed, assumed fixed |\n> | Regression test works | Red-green cycle verified | Test passes once |\n> | Agent completed | VCS diff shows changes | Agent reports \"success\" |\n> | Requirements met | Line-by-line checklist | Tests passing |\n> \n> ## Red Flags - STOP\n> \n> - Using \"should\", \"probably\", \"seems to\"\n> - Expressing satisfaction before verification (\"Great!\", \"Perfect!\", \"Done!\", etc.)\n> - About to commit/push/PR without verification\n> - Trusting agent success reports\n> - Relying on partial verification\n> - Thinking \"just this once\"\n> - Tired and wanting work over\n> - **ANY wording implying success without having run verification**\n> \n> ## Rationalization Prevention\n> \n> | Excuse | Reality |\n> |--------|---------|\n> | \"Should work now\" | RUN the verification |\n> | \"I'm confident\" | Confidence ≠ evidence |\n> | \"Just this once\" | No exceptions |\n> | \"Linter passed\" | Linter ≠ compiler |\n> | \"Agent said success\" | Verify independently |\n> | \"I'm tired\" | Exhaustion ≠ excuse |\n> | \"Partial check is enough\" | Partial proves nothing |\n> | \"Different words so rule doesn't apply\" | Spirit over letter |\n> \n> ## Key Patterns\n> \n> **Tests:**\n> ```\n> ✅ [Run test command] [See: 34/34 pass] \"All tests pass\"\n> ❌ \"Should pass now\" / \"Looks correct\"\n> ```\n> \n> **Regression tests (TDD Red-Green):**\n> ```\n> ✅ Write → Run (pass) → Revert fix → Run (MUST FAIL) → Restore → Run (pass)\n> ❌ \"I've written a regression test\" (without red-green verification)\n> ```\n> \n> **Build:**\n> ```\n> ✅ [Run build] [See: exit 0] \"Build passes\"\n> ❌ \"Linter passed\" (linter doesn't check compilation)\n> ```\n> \n> **Requirements:**\n> ```\n> ✅ Re-read plan → Create checklist → Verify each → Report gaps or completion\n> ❌ \"Tests pass, phase complete\"\n> ```\n> \n> **Agent delegation:**\n> ```\n> ✅ Agent reports success → Check VCS diff → Verify changes → Report actual state\n> ❌ Trust agent report\n> ```\n> \n> ## When To Apply\n> \n> **ALWAYS before:**\n> - ANY variation of success/completion claims\n> - ANY expression of satisfaction\n> - ANY positive statement about work state\n> - Committing, PR creation, task completion\n> - Moving to next task\n> - Delegating to agents\n> \n> **Rule applies to:**\n> - Exact phrases\n> - Paraphrases and synonyms\n> - Implications of success\n> - ANY communication suggesting completion/correctness"},"directory-15":{"body":"# skills/writing-plans\n\n## 本目录来源 / Local sources\n\n- skills/writing-plans/SKILL.md · 0 条已整理规则\n\n\n## 上级指令来源 / Ancestor instructions\n\n- AGENTS.md · 1 条已整理规则\n  技能行为修改需要评估证据：修改技能行为内容；其中 PR 评测交付要求仅在准备提交 PR 时触发。（conditional）\n- GEMINI.md · 0 条已整理规则\n\n\n## 生效边界 / Applicability boundary\n\n上级指令是继承审查的候选依据，不代表其中每条规则都无条件生效。结合当前工具、任务条件、显式覆盖和冲突审查判断。目录包含关系本身不证明覆盖。Skills 与引用文档按调用和引用关系判断，不以存放目录推断作用域。仅展示已采集来源；没有来源不等于没有约束。\n\n已整理 1 条规则，来自 1 份来源。仅审查当前 Designify skill refine 任务直接适用的 AGENTS.md 技能修改规则；未审查的工作流细则与其他贡献者要求保留为覆盖缺口。。其他来源尚未逐条提炼；这不是整个仓库的合规审计。"},"directory-source-15":{"body":"# skills/writing-plans/SKILL.md\n\n类型：skill\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> ---\n> name: writing-plans\n> description: Use when you have a spec or requirements for a multi-step task, before touching code\n> ---\n> \n> # Writing Plans\n> \n> ## Overview\n> \n> Write implementation plans for an engineer who has not seen this codebase or this spec. Assume they write idiomatic code in the project's language once they know the exact interface and the exact test, and that they will make a reasonable choice wherever the plan leaves one open. What they cannot know is what you decided: which files, which names and signatures, which values from the spec, which tests prove each task. Document those. Give them the whole plan as bite-sized tasks. DRY. YAGNI. TDD. Frequent commits.\n> \n> **Announce at start:** \"I'm using the writing-plans skill to create the implementation plan.\"\n> \n> **Context:** If working in an isolated worktree, it should have been created via the `superpowers:using-git-worktrees` skill at execution time.\n> \n> **Save plans to:** `docs/superpowers/plans/YYYY-MM-DD-\u003cfeature-name>.md`\n> - (User preferences for plan location override this default)\n> \n> ## Scope Check\n> \n> If the spec covers multiple independent subsystems, it should have been broken into sub-project specs during brainstorming. If it wasn't, suggest breaking this into separate plans — one per subsystem. Each plan should produce working, testable software on its own.\n> \n> ## File Structure\n> \n> Before defining tasks, map out which files will be created or modified and what each one is responsible for. This is where decomposition decisions get locked in.\n> \n> - Design units with clear boundaries and well-defined interfaces. Each file should have one clear responsibility.\n> - You reason best about code you can hold in context at once, and your edits are more reliable when files are focused. Prefer smaller, focused files over large ones that do too much.\n> - Files that change together should live together. Split by responsibility, not by technical layer.\n> - In existing codebases, follow established patterns. If the codebase uses large files, don't unilaterally restructure - but if a file you're modifying has grown unwieldy, including a split in the plan is reasonable.\n> \n> This structure informs the task decomposition. Each task should produce self-contained changes that make sense independently.\n> \n> ## Task Right-Sizing\n> \n> A task is the smallest unit that carries its own test cycle and is worth a\n> fresh reviewer's gate. When drawing task boundaries: fold setup,\n> configuration, scaffolding, and documentation steps into the task whose\n> deliverable needs them; split only where a reviewer could meaningfully\n> reject one task while approving its neighbor. Each task ends with an\n> independently testable deliverable.\n> \n> ## Step Granularity\n> \n> **Each step is one action with a checkable result:**\n> - \"Write the failing test\" - step\n> - \"Run it to make sure it fails\" - step\n> - \"Implement the minimal code to make the test pass\" - step\n> - \"Run the tests and make sure they pass\" - step\n> - \"Commit\" - step\n> \n> ## Plan Document Header\n> \n> **Every plan MUST start with this header:**\n> \n> ```markdown\n> # [Feature Name] Implementation Plan\n> \n> > **For agentic workers:** REQUIRED SUB-SKILL: Use superpowers:subagent-driven-development (recommended) or superpowers:executing-plans to implement this plan task-by-task. Steps use checkbox (`- [ ]`) syntax for tracking.\n> \n> **Goal:** [One sentence describing what this builds]\n> \n> **Architecture:** [2-3 sentences about approach]\n> \n> **Tech Stack:** [Key technologies/libraries]\n> \n> **Spec:** [path to the spec/design doc this plan implements — the plan\n> argues from the spec, so the spec travels with it; executors read both]\n> \n> ## Global Constraints\n> \n> [The spec's project-wide requirements — version floors, dependency limits,\n> naming and copy rules, platform requirements — one line each, with exact\n> values copied verbatim from the spec. Every task's requirements implicitly\n> include this section.]\n> \n> ## Review Focus\n> \n> [The five input classes or failure modes the spec implies but no task's\n> tests exercise that are most likely to bite a person using this software\n> — one line each, naming the input or condition and the behavior a\n> reasonable person would expect, most likely first. The spec is a vision\n> document: it says what the software must do, not everything it will\n> meet, and its silence on an input is not permission for that input to\n> break the program. Write the list here, once, with the spec in front of\n> you. Then, for each line, add the test that pins it to the task that\n> owns the code, in that task's own step style.]\n> \n> ---\n> ```\n> \n> ## Task Structure\n> \n> ````markdown\n> ### Task N: [Component Name]\n> \n> **Files:**\n> - Create: `exact/path/to/file.py`\n> - Modify: `exact/path/to/existing.py:123-145`\n> - Test: `tests/exact/path/to/test.py`\n> \n> **Interfaces:**\n> - Consumes: [what this task uses from earlier tasks — exact signatures]\n> - Produces: [what later tasks rely on — exact function names, parameter\n>   and return types. A task's implementer sees only their own task; this\n>   block is how they learn the names and types neighboring tasks use.]\n> \n> - [ ] **Step 1: Write the failing test**\n> \n> ```python\n> def test_specific_behavior():\n>     result = function(input)\n>     assert result == expected\n> ```\n> \n> - [ ] **Step 2: Run test to verify it fails**\n> \n> Run: `pytest tests/path/test.py::test_name -v`\n> Expected: FAIL with \"function not defined\"\n> \n> - [ ] **Step 3: Implement `function(input: InputType) -> ResultType` in `exact/path/to/file.py`**\n> \n> One line on the approach when the signature and the test leave a choice\n> (which library call, which data structure); a code block only for an\n> algorithm they do not determine.\n> \n> - [ ] **Step 4: Run test to verify it passes**\n> \n> Run: `pytest tests/path/test.py::test_name -v`\n> Expected: PASS\n> \n> - [ ] **Step 5: Commit**\n> \n> ```bash\n> git add tests/path/test.py src/path/file.py\n> git commit -m \"feat: add specific feature\"\n> ```\n> ````\n> \n> ## What a Step Contains\n> \n> A step is done when the implementer can write exactly one reasonable thing\n> from it. That is the whole requirement: unambiguous, not complete. Each kind\n> of step carries what makes it unambiguous and nothing more:\n> \n> - **A test step:** the test's name and its assertions, as code, with the\n>   spec's exact values in them.\n> - **A code step:** the exact signature (name, parameters, return type), the\n>   file it lives in, and the specific values the spec pins. The implementer\n>   writes the body. A body appears only for an algorithm the signature and\n>   tests do not determine, or for exact copy the spec fixes.\n> - **A verification step:** the command to run and the output that means it\n>   passed.\n> - **A reference to another task:** that task's Interfaces block says what\n>   to use; the plan does not repeat that task's code.\n> \n> A plan is the set of decisions the implementer cannot make alone. A plan\n> longer than the code it describes has written the code instead. Lines that\n> decide nothing (\"TBD\", \"handle edge cases\", \"add appropriate validation\",\n> \"write tests for the above\", a type or function no task defines) are the\n> opposite failure, and the self-review catches both.\n> \n> ## Self-Review\n> \n> After writing the complete plan, look at the spec with fresh eyes and check the plan against it. This is a checklist you run yourself — not a subagent dispatch.\n> \n> **1. Spec coverage:** Skim each section/requirement in the spec. Can you point to a task that implements it? List any gaps.\n> \n> **2. Step scan:** Every step must let the implementer write exactly one reasonable thing, and no step may carry more than that: a line that decides nothing is a gap, a function body the signature and tests already determine is a transcript. Fix both.\n> \n> **3. Type consistency:** Do the types, method signatures, and property names you used in later tasks match what you defined in earlier tasks? A function called `clearLayers()` in Task 3 but `clearFullLayers()` in Task 7 is a bug.\n> \n> **4. Review Focus:** For each input class or failure mode the spec implies, is there a task whose tests exercise it? The five uncovered ones most likely to bite a person go in the Review Focus section, and each line there gets its test added to the owning task. An empty section means you checked and found none, not that you skipped the check.\n> \n> **5. Proportion:** Compare the plan's length to the spec's. A plan several times longer than the spec it implements is a transcript of the program, not a plan. If code blocks are most of the document, replace bodies with signatures, test names and assertions, and check that each step is still unambiguous.\n> \n> If you find issues, fix them inline. No need to re-review — just fix and move on. If you find a spec requirement with no task, add the task.\n> \n> ## Execution Handoff\n> \n> After saving and self-reviewing the plan, link it for your human partner\n> to read. If they have already explicitly supplied an execution method, ask\n> them to review the plan and confirm it captures what they want; wait for that\n> review before implementation, then use the preserved method. Otherwise, ask\n> them to review the plan and choose an execution method before implementation.\n> \n> **When no execution method has already been supplied:**\n> \n> **\"Plan complete and saved to `docs/superpowers/plans/\u003cfilename>.md`. Please review the plan. Which execution approach would you prefer?**\n> \n> - **Subagent-driven** - A fresh subagent implements each task and a fresh reviewer checks it before the next one starts, then a whole-branch review at the end. Most thorough; costs a fresh context per task and per review.\n> - **Native** - I implement every task myself in this session, the way this harness runs work, then one fresh reviewer on the most capable model checks the whole branch. Cheapest and fastest; no independent review until the end. Runs well with a mid-tier session model, since the plan carries the design.\n> \n> **For this plan I recommend \u003cone of the two>, because \u003cone sentence from the plan: how much the tasks depend on each other's interfaces, how many there are, what a shipped mistake would cost>. Does the plan capture what you want, and which approach should we use?\"**\n> \n> **When an execution method has already been supplied:**\n> \n> **\"Plan complete and saved to `docs/superpowers/plans/\u003cfilename>.md`. Please review the plan. Does it capture what you want?\"**\n> \n> **If Subagent-driven chosen:**\n> - **REQUIRED SUB-SKILL:** Use superpowers:subagent-driven-development\n> \n> **If Native chosen:**\n> - **REQUIRED SUB-SKILL:** Use superpowers:executing-plans"},"directory-16":{"body":"# skills/writing-skills\n\n## 本目录来源 / Local sources\n\n- skills/writing-skills/SKILL.md · 0 条已整理规则\n\n- skills/writing-skills/testing-skills-with-subagents.md · 0 条已整理规则\n\n\n## 上级指令来源 / Ancestor instructions\n\n- AGENTS.md · 1 条已整理规则\n  技能行为修改需要评估证据：修改技能行为内容；其中 PR 评测交付要求仅在准备提交 PR 时触发。（conditional）\n- GEMINI.md · 0 条已整理规则\n\n\n## 生效边界 / Applicability boundary\n\n上级指令是继承审查的候选依据，不代表其中每条规则都无条件生效。结合当前工具、任务条件、显式覆盖和冲突审查判断。目录包含关系本身不证明覆盖。Skills 与引用文档按调用和引用关系判断，不以存放目录推断作用域。仅展示已采集来源；没有来源不等于没有约束。\n\n已整理 1 条规则，来自 1 份来源。仅审查当前 Designify skill refine 任务直接适用的 AGENTS.md 技能修改规则；未审查的工作流细则与其他贡献者要求保留为覆盖缺口。。其他来源尚未逐条提炼；这不是整个仓库的合规审计。"},"directory-source-16":{"body":"# skills/writing-skills/SKILL.md\n\n类型：skill\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> ---\n> name: writing-skills\n> description: Use when creating new skills, editing existing skills, or verifying skills work before deployment\n> ---\n> \n> # Writing Skills\n> \n> ## Overview\n> \n> **Writing skills IS Test-Driven Development applied to process documentation.**\n> \n> **Personal skills live in your runtime's skills directory** (`~/.claude/skills/` on Claude Code) — see [codex-tools.md](../using-superpowers/references/codex-tools.md) or [gemini-tools.md](../using-superpowers/references/gemini-tools.md) for the path on those runtimes. Codex, Copilot CLI, and Gemini CLI all also recognize `~/.agents/skills/` as a cross-runtime alias.\n> \n> You write test cases (pressure scenarios with subagents), watch them fail (baseline behavior), write the skill (documentation), watch tests pass (agents comply), and refactor (close loopholes).\n> \n> **Core principle:** If you didn't watch an agent fail without the skill, you don't know if the skill teaches the right thing.\n> \n> **REQUIRED BACKGROUND:** You MUST understand superpowers:test-driven-development before using this skill. That skill defines the fundamental RED-GREEN-REFACTOR cycle. This skill adapts TDD to documentation.\n> \n> **Official guidance:** For Anthropic's official skill authoring best practices, see anthropic-best-practices.md. This document provides additional patterns and guidelines that complement the TDD-focused approach in this skill.\n> \n> ## What is a Skill?\n> \n> A **skill** is a reference guide for proven techniques, patterns, or tools. Skills help future agents find and apply effective approaches.\n> \n> **Skills are:** Reusable techniques, patterns, tools, reference guides\n> \n> **Skills are NOT:** Narratives about how you solved a problem once\n> \n> ## TDD Mapping for Skills\n> \n> | TDD Concept | Skill Creation |\n> |-------------|----------------|\n> | **Test case** | Pressure scenario with subagent |\n> | **Production code** | Skill document (SKILL.md) |\n> | **Test fails (RED)** | Agent violates rule without skill (baseline) |\n> | **Test passes (GREEN)** | Agent complies with skill present |\n> | **Refactor** | Close loopholes while maintaining compliance |\n> | **Write test first** | Run baseline scenario BEFORE writing skill |\n> | **Watch it fail** | Document exact rationalizations agent uses |\n> | **Minimal code** | Write skill addressing those specific violations |\n> | **Watch it pass** | Verify agent now complies |\n> | **Refactor cycle** | Find new rationalizations → plug → re-verify |\n> \n> The entire skill creation process follows RED-GREEN-REFACTOR.\n> \n> ## When to Create a Skill\n> \n> **Create when:**\n> - Technique wasn't intuitively obvious to you\n> - You'd reference this again across projects\n> - Pattern applies broadly (not project-specific)\n> - Others would benefit\n> \n> **Don't create for:**\n> - One-off solutions\n> - Standard practices well-documented elsewhere\n> - Project-specific conventions (put in your instructions file)\n> - Mechanical constraints (if it's enforceable with regex/validation, automate it—save documentation for judgment calls)\n> \n> ## Skill Types\n> \n> ### Technique\n> Concrete method with steps to follow (condition-based-waiting, root-cause-tracing)\n> \n> ### Pattern\n> Way of thinking about problems (flatten-with-flags, test-invariants)\n> \n> ### Reference\n> API docs, syntax guides, tool documentation (office docs)\n> \n> ## Directory Structure\n> \n> \n> ```\n> skills/\n>   skill-name/\n>     SKILL.md              # Main reference (required)\n>     supporting-file.*     # Only if needed\n> ```\n> \n> **Flat namespace** - all skills in one searchable namespace\n> \n> **Separate files for:**\n> 1. **Heavy reference** (100+ lines) - API docs, comprehensive syntax\n> 2. **Reusable tools** - Scripts, utilities, templates\n> \n> **Keep inline:**\n> - Principles and concepts\n> - Code patterns (\u003c 50 lines)\n> - Everything else\n> \n> ## SKILL.md Structure\n> \n> **Frontmatter (YAML):**\n> - Two required fields: `name` and `description` (see [agentskills.io/specification](https://agentskills.io/specification) for all supported fields)\n> - Max 1024 characters total\n> - `name`: Use letters, numbers, and hyphens only (no parentheses, special chars)\n> - `description`: Third-person, describes ONLY when to use (NOT what it does)\n>   - Start with \"Use when...\" to focus on triggering conditions\n>   - Include specific symptoms, situations, and contexts\n>   - **NEVER summarize the skill's process or workflow** (see SDO section for why)\n>   - Keep under 500 characters if possible\n> \n> ```markdown\n> ---\n> name: Skill-Name-With-Hyphens\n> description: Use when [specific triggering conditions and symptoms]\n> ---\n> \n> # Skill Name\n> \n> ## Overview\n> What is this? Core principle in 1-2 sentences.\n> \n> ## When to Use\n> [Small inline flowchart IF decision non-obvious]\n> \n> Bullet list with SYMPTOMS and use cases\n> When NOT to use\n> \n> ## Core Pattern (for techniques/patterns)\n> Before/after code comparison\n> \n> ## Quick Reference\n> Table or bullets for scanning common operations\n> \n> ## Implementation\n> Inline code for simple patterns\n> Link to file for heavy reference or reusable tools\n> \n> ## Common Mistakes\n> What goes wrong + fixes\n> \n> ## Real-World Impact (optional)\n> Concrete results\n> ```\n> \n> \n> ## Skill Discovery Optimization (SDO)\n> \n> **Critical for discovery:** Future agents need to FIND your skill\n> \n> ### 1. Rich Description Field\n> \n> **Purpose:** Your agent reads the description to decide which skills to load for a given task. Make it answer: \"Should I read this skill right now?\"\n> \n> **Format:** Start with \"Use when...\" to focus on triggering conditions\n> \n> **CRITICAL: Description = When to Use, NOT What the Skill Does**\n> \n> The description should ONLY describe triggering conditions. Do NOT summarize the skill's process or workflow in the description.\n> \n> **Why this matters:** Testing revealed that when a description summarizes the skill's workflow, an agent may follow the description instead of reading the full skill content. A description saying \"code review between tasks\" caused an agent to do ONE review, even though the skill's flowchart clearly showed TWO reviews (spec compliance then code quality).\n> \n> When the description was changed to just \"Use when executing implementation plans with independent tasks\" (no workflow summary), the agent correctly read the flowchart and followed the two-stage review process.\n> \n> **The trap:** Descriptions that summarize workflow create a shortcut agents will take. The skill body becomes documentation agents skip.\n> \n> ```yaml\n> # ❌ BAD: Summarizes workflow - agents may follow this instead of reading skill\n> description: Use when executing plans - dispatches subagent per task with code review between tasks\n> \n> # ❌ BAD: Too much process detail\n> description: Use for TDD - write test first, watch it fail, write minimal code, refactor\n> \n> # ✅ GOOD: Just triggering conditions, no workflow summary\n> description: Use when executing implementation plans with independent tasks in the current session\n> \n> # ✅ GOOD: Triggering conditions only\n> description: Use when implementing any feature or bugfix, before writing implementation code\n> ```\n> \n> **Content:**\n> - Use concrete triggers, symptoms, and situations that signal this skill applies\n> - Describe the *problem* (race conditions, inconsistent behavior) not *language-specific symptoms* (setTimeout, sleep)\n> - Keep triggers technology-agnostic unless the skill itself is technology-specific\n> - If skill is technology-specific, make that explicit in the trigger\n> - Write in third person (injected into system prompt)\n> - **NEVER summarize the skill's process or workflow**\n> \n> ```yaml\n> # ❌ BAD: Too abstract, vague, doesn't include when to use\n> description: For async testing\n> \n> # ❌ BAD: First person\n> description: I can help you with async tests when they're flaky\n> \n> # ❌ BAD: Mentions technology but skill isn't specific to it\n> description: Use when tests use setTimeout/sleep and are flaky\n> \n> # ✅ GOOD: Starts with \"Use when\", describes problem, no workflow\n> description: Use when tests have race conditions, timing dependencies, or pass/fail inconsistently\n> \n> # ✅ GOOD: Technology-specific skill with explicit trigger\n> description: Use when using React Router and handling authentication redirects\n> ```\n> \n> ### 2. Keyword Coverage\n> \n> Use words an agent would search for:\n> - Error messages: \"Hook timed out\", \"ENOTEMPTY\", \"race condition\"\n> - Symptoms: \"flaky\", \"hanging\", \"zombie\", \"pollution\"\n> - Synonyms: \"timeout/hang/freeze\", \"cleanup/teardown/afterEach\"\n> - Tools: Actual commands, library names, file types\n> \n> ### 3. Descriptive Naming\n> \n> **Use active voice, verb-first:**\n> - ✅ `creating-skills` not `skill-creation`\n> - ✅ `condition-based-waiting` not `async-test-helpers`\n> \n> ### 4. Token Efficiency (Critical)\n> \n> **Problem:** getting-started and frequently-referenced skills load into EVERY conversation. Every token counts.\n> \n> **Target word counts:**\n> - getting-started workflows: \u003c150 words each\n> - Frequently-loaded skills: \u003c200 words total\n> - Other skills: \u003c500 words (still be concise)\n> \n> **Techniques:**\n> \n> **Move details to tool help:**\n> ```bash\n> # ❌ BAD: Document all flags in SKILL.md\n> search-conversations supports --text, --both, --after DATE, --before DATE, --limit N\n> \n> # ✅ GOOD: Reference --help\n> search-conversations supports multiple modes and filters. Run --help for details.\n> ```\n> \n> **Use cross-references:**\n> ```markdown\n> # ❌ BAD: Repeat workflow details\n> When searching, dispatch subagent with template...\n> [20 lines of repeated instructions]\n> \n> # ✅ GOOD: Reference other skill\n> Always use subagents (50-100x context savings). REQUIRED: Use [other-skill-name] for workflow.\n> ```\n> \n> **Compress examples:**\n> ```markdown\n> # ❌ BAD: Verbose example (42 words)\n> your human partner: \"How did we handle authentication errors in React Router before?\"\n> You: I'll search past conversations for React Router authentication patterns.\n> [Dispatch subagent with search query: \"React Router authentication error handling 401\"]\n> \n> # ✅ GOOD: Minimal example (20 words)\n> Partner: \"How did we handle auth errors in React Router?\"\n> You: Searching...\n> [Dispatch subagent → synthesis]\n> ```\n> \n> **Eliminate redundancy:**\n> - Don't repeat what's in cross-referenced skills\n> - Don't explain what's obvious from command\n> - Don't include multiple examples of same pattern\n> \n> **Verification:**\n> ```bash\n> wc -w skills/path/SKILL.md\n> # getting-started workflows: aim for \u003c150 each\n> # Other frequently-loaded: aim for \u003c200 total\n> ```\n> \n> **Name by what you DO or core insight:**\n> - ✅ `condition-based-waiting` > `async-test-helpers`\n> - ✅ `using-skills` not `skill-usage`\n> - ✅ `flatten-with-flags` > `data-structure-refactoring`\n> - ✅ `root-cause-tracing` > `debugging-techniques`\n> \n> **Gerunds (-ing) work well for processes:**\n> - `creating-skills`, `testing-skills`, `debugging-with-logs`\n> - Active, describes the action you're taking\n> \n> ### 5. Cross-Referencing Other Skills\n> \n> **When writing documentation that references other skills:**\n> \n> Use skill name only, with explicit requirement markers:\n> - ✅ Good: `**REQUIRED SUB-SKILL:** Use superpowers:test-driven-development`\n> - ✅ Good: `**REQUIRED BACKGROUND:** You MUST understand superpowers:systematic-debugging`\n> - ❌ Bad: `See skills/testing/test-driven-development` (unclear if required)\n> - ❌ Bad: `@skills/testing/test-driven-development/SKILL.md` (force-loads, burns context)\n> \n> **Why no @ links:** `@` syntax force-loads files immediately, consuming 200k+ context before you need them.\n> \n> ## Flowchart Usage\n> \n> ```dot\n> digraph when_flowchart {\n>     \"Need to show information?\" [shape=diamond];\n>     \"Decision where I might go wrong?\" [shape=diamond];\n>     \"Use markdown\" [shape=box];\n>     \"Small inline flowchart\" [shape=box];\n> \n>     \"Need to show information?\" -> \"Decision where I might go wrong?\" [label=\"yes\"];\n>     \"Decision where I might go wrong?\" -> \"Small inline flowchart\" [label=\"yes\"];\n>     \"Decision where I might go wrong?\" -> \"Use markdown\" [label=\"no\"];\n> }\n> ```\n> \n> **Use flowcharts ONLY for:**\n> - Non-obvious decision points\n> - Process loops where you might stop too early\n> - \"When to use A vs B\" decisions\n> \n> **Never use flowcharts for:**\n> - Reference material → Tables, lists\n> - Code examples → Markdown blocks\n> - Linear instructions → Numbered lists\n> - Labels without semantic meaning (step1, helper2)\n> \n> See `graphviz-conventions.dot` in this directory for graphviz style rules.\n> \n> **Visualizing for your human partner:** Use `render-graphs.js` in this directory to render a skill's flowcharts to SVG:\n> ```bash\n> node ./render-graphs.js ../some-skill           # Each diagram separately\n> node ./render-graphs.js ../some-skill --combine # All diagrams in one SVG\n> ```\n> \n> ## Code Examples\n> \n> **One excellent example beats many mediocre ones**\n> \n> Choose most relevant language:\n> - Testing techniques → TypeScript/JavaScript\n> - System debugging → Shell/Python\n> - Data processing → Python\n> \n> **Good example:**\n> - Complete and runnable\n> - Well-commented explaining WHY\n> - From real scenario\n> - Shows pattern clearly\n> - Ready to adapt (not generic template)\n> \n> **Don't:**\n> - Implement in 5+ languages\n> - Create fill-in-the-blank templates\n> - Write contrived examples\n> \n> You're good at porting - one great example is enough.\n> \n> ## File Organization\n> \n> ### Self-Contained Skill\n> ```\n> defense-in-depth/\n>   SKILL.md    # Everything inline\n> ```\n> When: All content fits, no heavy reference needed\n> \n> ### Skill with Reusable Tool\n> ```\n> condition-based-waiting/\n>   SKILL.md    # Overview + patterns\n>   example.ts  # Working helpers to adapt\n> ```\n> When: Tool is reusable code, not just narrative\n> \n> ### Skill with Heavy Reference\n> ```\n> pptx/\n>   SKILL.md       # Overview + workflows\n>   pptxgenjs.md   # 600 lines API reference\n>   ooxml.md       # 500 lines XML structure\n>   scripts/       # Executable tools\n> ```\n> When: Reference material too large for inline\n> \n> Invoke bundled scripts through their interpreter in the prose (`bash scripts/tool.sh`, `node scripts/tool.js`), never by bare path: some harness plugin packagers strip executable bits, and a bare `scripts/tool.sh` fails there with `Permission denied`.\n> \n> ## The Iron Law (Same as TDD)\n> \n> ```\n> NO SKILL WITHOUT A FAILING TEST FIRST\n> ```\n> \n> This applies to NEW skills AND EDITS to existing skills.\n> \n> Write skill before testing? Delete it. Start over.\n> Edit skill without testing? Same violation.\n> \n> **No exceptions:**\n> - Not for \"simple additions\"\n> - Not for \"just adding a section\"\n> - Not for \"documentation updates\"\n> - Don't keep untested changes as \"reference\"\n> - Don't \"adapt\" while running tests\n> - Delete means delete\n> \n> **REQUIRED BACKGROUND:** The superpowers:test-driven-development skill explains why this matters. Same principles apply to documentation.\n> \n> ## Testing All Skill Types\n> \n> Different skill types need different test approaches:\n> \n> ### Discipline-Enforcing Skills (rules/requirements)\n> \n> **Examples:** TDD, verification-before-completion, designing-before-coding\n> \n> **Test with:**\n> - Academic questions: Do they understand the rules?\n> - Pressure scenarios: Do they comply under stress?\n> - Multiple pressures combined: time + sunk cost + exhaustion\n> - Identify rationalizations and add explicit counters\n> \n> **Success criteria:** Agent follows rule under maximum pressure\n> \n> ### Technique Skills (how-to guides)\n> \n> **Examples:** condition-based-waiting, root-cause-tracing, defensive-programming\n> \n> **Test with:**\n> - Application scenarios: Can they apply the technique correctly?\n> - Variation scenarios: Do they handle edge cases?\n> - Missing information tests: Do instructions have gaps?\n> \n> **Success criteria:** Agent successfully applies technique to new scenario\n> \n> ### Pattern Skills (mental models)\n> \n> **Examples:** reducing-complexity, information-hiding concepts\n> \n> **Test with:**\n> - Recognition scenarios: Do they recognize when pattern applies?\n> - Application scenarios: Can they use the mental model?\n> - Counter-examples: Do they know when NOT to apply?\n> \n> **Success criteria:** Agent correctly identifies when/how to apply pattern\n> \n> ### Reference Skills (documentation/APIs)\n> \n> **Examples:** API documentation, command references, library guides\n> \n> **Test with:**\n> - Retrieval scenarios: Can they find the right information?\n> - Application scenarios: Can they use what they found correctly?\n> - Gap testing: Are common use cases covered?\n> \n> **Success criteria:** Agent finds and correctly applies reference information\n> \n> ## Common Rationalizations for Skipping Testing\n> \n> | Excuse | Reality |\n> |--------|---------|\n> | \"Skill is obviously clear\" | Clear to you ≠ clear to other agents. Test it. |\n> | \"It's just a reference\" | References can have gaps, unclear sections. Test retrieval. |\n> | \"Testing is overkill\" | Untested skills have issues. Always. 15 min testing saves hours. |\n> | \"I'll test if problems emerge\" | Problems = agents can't use skill. Test BEFORE deploying. |\n> | \"Too tedious to test\" | Testing is less tedious than debugging bad skill in production. |\n> | \"I'm confident it's good\" | Overconfidence guarantees issues. Test anyway. |\n> | \"Academic review is enough\" | Reading ≠ using. Test application scenarios. |\n> | \"No time to test\" | Deploying untested skill wastes more time fixing it later. |\n> \n> **All of these mean: Test before deploying. No exceptions.**\n> \n> ## Match the Form to the Failure\n> \n> Before writing guidance, classify the baseline failure. The form that bulletproofs one failure type measurably backfires on another.\n> \n> | Baseline failure | Right form | Wrong form |\n> |---|---|---|\n> | Skips/violates a rule under pressure (knows better, does it anyway) | Prohibition + rationalization table + red flags (see Bulletproofing below) | Soft guidance (\"prefer...\", \"consider...\") |\n> | Complies, but output has the wrong shape (bloated prompt, buried verdict, restated spec) | Positive recipe or contract: state what the output IS — its parts, in order | Prohibition list (\"don't restate\", \"never narrate\") |\n> | Omits a required element from something they already produce | Structural: REQUIRED field or slot in the template they fill in | Prose reminders near the template |\n> | Behavior should depend on a condition | Conditional keyed to an observable predicate (\"if the brief exists, reference it\") | Unconditional rule + exemption clauses |\n> \n> **Why prohibitions backfire on shaping problems:** under a competing incentive (\"make the prompt self-contained\"), agents negotiate with \"don't X\". In head-to-head wording tests on dispatch-prompt guidance, the prohibition arm produced clearly more of the unwanted content than the recipe arm (fully separated distributions), and trended worse than even the no-guidance control — micro-test your own case rather than assuming, but never reach for the prohibition by default. A recipe leaves nothing to negotiate: the output matches the stated shape or it doesn't.\n> \n> **Rules for whichever form you pick:**\n> - **No nuance clauses.** \"Don't X unless it matters\" reopens the negotiation — appending a single nuance clause to a winning recipe degraded it from consistent to noisy in the same wording tests. Express a real exception as its own conditional on an observable predicate.\n> - **Exemption clauses don't scope.** \"This limit doesn't apply to code blocks\" still suppresses code blocks. If part of the output must be exempt, restructure so the rule can't reach it.\n> \n> ## Bulletproofing Skills Against Rationalization\n> \n> Skills that enforce discipline (like TDD) need to resist rationalization. Agents are smart and will find loopholes when under pressure.\n> \n> **Scope:** this toolkit is for discipline failures — an agent that knows the rule and skips it under pressure. For wrong-shaped output or omitted elements, prohibition-based bulletproofing backfires; use the forms in Match the Form to the Failure instead.\n> \n> **Psychology note:** Understanding WHY persuasion techniques work helps you apply them systematically. See persuasion-principles.md for research foundation (Cialdini, 2021; Meincke et al., 2025) on authority, commitment, scarcity, social proof, and unity principles.\n> \n> ### Close Every Loophole Explicitly\n> \n> Don't just state the rule - forbid specific workarounds:\n> \n> \u003cBad>\n> ```markdown\n> Write code before test? Delete it.\n> ```\n> \u003c/Bad>\n> \n> \u003cGood>\n> ```markdown\n> Write code before test? Delete it. Start over.\n> \n> **No exceptions:**\n> - Don't keep it as \"reference\"\n> - Don't \"adapt\" it while writing tests\n> - Don't look at it\n> - Delete means delete\n> ```\n> \u003c/Good>\n> \n> ### Address \"Spirit vs Letter\" Arguments\n> \n> Add foundational principle early:\n> \n> ```markdown\n> **Violating the letter of the rules is violating the spirit of the rules.**\n> ```\n> \n> This cuts off entire class of \"I'm following the spirit\" rationalizations.\n> \n> ### Build Rationalization Table\n> \n> Capture rationalizations from baseline testing (see Testing section below). Every excuse agents make goes in the table:\n> \n> ```markdown\n> | Excuse | Reality |\n> |--------|---------|\n> | \"Too simple to test\" | Simple code breaks. Test takes 30 seconds. |\n> | \"I'll test after\" | Tests passing immediately prove nothing. |\n> | \"Tests after achieve same goals\" | Tests-after = \"what does this do?\" Tests-first = \"what should this do?\" |\n> ```\n> \n> ### Create Red Flags List\n> \n> Make it easy for agents to self-check when rationalizing:\n> \n> ```markdown\n> ## Red Flags - STOP and Start Over\n> \n> - Code before test\n> - \"I already manually tested it\"\n> - \"Tests after achieve the same purpose\"\n> - \"It's about spirit not ritual\"\n> - \"This is different because...\"\n> \n> **All of these mean: Delete code. Start over with TDD.**\n> ```\n> \n> ### Update SDO for Violation Symptoms\n> \n> Add to description: symptoms of when you're ABOUT to violate the rule:\n> \n> ```yaml\n> description: use when implementing any feature or bugfix, before writing implementation code\n> ```\n> \n> ## RED-GREEN-REFACTOR for Skills\n> \n> Follow the TDD cycle:\n> \n> ### RED: Write Failing Test (Baseline)\n> \n> Run pressure scenario with subagent WITHOUT the skill. Document exact behavior:\n> - What choices did they make?\n> - What rationalizations did they use (verbatim)?\n> - Which pressures triggered violations?\n> \n> This is \"watch the test fail\" - you must see what agents naturally do before writing the skill.\n> \n> ### GREEN: Write Minimal Skill\n> \n> Write skill that addresses those specific rationalizations. Don't add extra content for hypothetical cases.\n> \n> Run same scenarios WITH skill. Agent should now comply.\n> \n> ### REFACTOR: Close Loopholes\n> \n> Agent found new rationalization? Add explicit counter. Re-test until bulletproof.\n> \n> ### Micro-Test Wording Before Full Scenarios\n> \n> Full pressure-scenario runs are the final gate, but they are slow and expensive per iteration. Verify the wording itself first with micro-tests:\n> \n> 1. **One fresh-context sample per call** — a raw API call, or a single-shot subagent if you don't have API access. System prompt = the realistic context the guidance will live in (the full skill or prompt template, not the guidance in isolation); user message = a task that tempts the failure.\n> 2. **Always include a no-guidance control.** If the control doesn't exhibit the failure, there is nothing to fix — stop, don't author the guidance.\n> 3. **5+ reps per variant.** Single samples lie.\n> 4. **Manually read every flagged match.** Score programmatically if you like, but template echoes and quoted counter-examples masquerade as hits; automated counts alone overstate both failure and success.\n> 5. **Variance is a metric.** When guidance lands, reps converge on the same shape. Five different interpretations across five reps means the wording isn't binding — tighten the form before adding words.\n> \n> Micro-tests verify wording; they do not replace pressure scenarios for discipline skills.\n> \n> **Testing methodology:** See [testing-skills-with-subagents.md](testing-skills-with-subagents.md) for the complete testing methodology:\n> - How to write pressure scenarios\n> - Pressure types (time, sunk cost, authority, exhaustion)\n> - Plugging holes systematically\n> - Meta-testing techniques\n> \n> ## Anti-Patterns\n> \n> ### ❌ Narrative Example\n> \"In session 2025-10-03, we found empty projectDir caused...\"\n> **Why bad:** Too specific, not reusable\n> \n> ### ❌ Multi-Language Dilution\n> example-js.js, example-py.py, example-go.go\n> **Why bad:** Mediocre quality, maintenance burden\n> \n> ### ❌ Code in Flowcharts\n> ```dot\n> step1 [label=\"import fs\"];\n> step2 [label=\"read file\"];\n> ```\n> **Why bad:** Can't copy-paste, hard to read\n> \n> ### ❌ Generic Labels\n> helper1, helper2, step3, pattern4\n> **Why bad:** Labels should have semantic meaning\n> \n> ## STOP: Before Moving to Next Skill\n> \n> **After writing ANY skill, you MUST STOP and complete the deployment process.**\n> \n> **Do NOT:**\n> - Create multiple skills in batch without testing each\n> - Move to next skill before current one is verified\n> - Skip testing because \"batching is more efficient\"\n> \n> **The deployment checklist below is MANDATORY for EACH skill.**\n> \n> Deploying untested skills = deploying untested code. It's a violation of quality standards.\n> \n> ## Skill Creation Checklist (TDD Adapted)\n> \n> **IMPORTANT: Create a todo for EACH checklist item below.**\n> \n> **RED Phase - Write Failing Test:**\n> - [ ] Create pressure scenarios (3+ combined pressures for discipline skills)\n> - [ ] Run scenarios WITHOUT skill - document baseline behavior verbatim\n> - [ ] Identify patterns in rationalizations/failures\n> \n> **GREEN Phase - Write Minimal Skill:**\n> - [ ] Name uses only letters, numbers, hyphens (no parentheses/special chars)\n> - [ ] YAML frontmatter with required `name` and `description` fields (max 1024 chars; see [spec](https://agentskills.io/specification))\n> - [ ] Description starts with \"Use when...\" and includes specific triggers/symptoms\n> - [ ] Description written in third person\n> - [ ] Keywords throughout for search (errors, symptoms, tools)\n> - [ ] Clear overview with core principle\n> - [ ] Address specific baseline failures identified in RED\n> - [ ] Guidance form matches the failure type (see Match the Form to the Failure)\n> - [ ] For behavior-shaping guidance: wording micro-tested against a no-guidance control (5+ reps, every flagged match read manually) — N/A for pure reference skills\n> - [ ] Code inline OR link to separate file\n> - [ ] One excellent example (not multi-language)\n> - [ ] Run scenarios WITH skill - verify agents now comply\n> \n> **REFACTOR Phase - Close Loopholes:**\n> - [ ] Identify NEW rationalizations from testing\n> - [ ] Add explicit counters (if discipline skill)\n> - [ ] Build rationalization table from all test iterations\n> - [ ] Create red flags list\n> - [ ] Re-test until bulletproof\n> \n> **Quality Checks:**\n> - [ ] Small flowchart only if decision non-obvious\n> - [ ] Quick reference table\n> - [ ] Common mistakes section\n> - [ ] No narrative storytelling\n> - [ ] Supporting files only for tools or heavy reference\n> \n> **Deployment:**\n> - [ ] Commit skill to git and push to your fork (if configured)\n> - [ ] Consider contributing back via PR (if broadly useful)\n> \n> ## Discovery Workflow\n> \n> How future agents find your skill:\n> \n> 1. **Encounters problem** (\"tests are flaky\")\n> 2. **Searches skills** (greps descriptions, browses categories)\n> 3. **Finds SKILL** (description matches)\n> 4. **Scans overview** (is this relevant?)\n> 5. **Reads patterns** (quick reference table)\n> 6. **Loads example** (only when implementing)\n> \n> **Optimize for this flow** - put searchable terms early and often."},"directory-17":{"body":"# .github\n\n## 本目录来源 / Local sources\n\n- .github/PULL_REQUEST_TEMPLATE.md · 0 条已整理规则\n\n\n## 上级指令来源 / Ancestor instructions\n\n- AGENTS.md · 1 条已整理规则\n  技能行为修改需要评估证据：修改技能行为内容；其中 PR 评测交付要求仅在准备提交 PR 时触发。（conditional）\n- GEMINI.md · 0 条已整理规则\n\n\n## 生效边界 / Applicability boundary\n\n上级指令是继承审查的候选依据，不代表其中每条规则都无条件生效。结合当前工具、任务条件、显式覆盖和冲突审查判断。目录包含关系本身不证明覆盖。Skills 与引用文档按调用和引用关系判断，不以存放目录推断作用域。仅展示已采集来源；没有来源不等于没有约束。\n\n已整理 1 条规则，来自 1 份来源。仅审查当前 Designify skill refine 任务直接适用的 AGENTS.md 技能修改规则；未审查的工作流细则与其他贡献者要求保留为覆盖缺口。。其他来源尚未逐条提炼；这不是整个仓库的合规审计。"},"directory-source-17":{"body":"# .github/PULL_REQUEST_TEMPLATE.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> \u003c!--\n> BEFORE SUBMITTING: Read every word of this template. PRs that leave\n> sections blank, contain multiple unrelated changes, or show no evidence\n> of human involvement will be closed without review.\n> -->\n> \n> > **This PR MUST target the `dev` branch, not `main`.** `main` is the\n> > released branch; active work lands on `dev` first. PRs opened against\n> > `main` will be asked to retarget `dev` before review.\n> \n> ## Who is submitting this PR? (required)\n> \u003c!-- Required. PRs that omit this will be closed. We assume an agent wrote\n>      this PR — tell us which one and where it ran. We weigh contributions by\n>      what produced them: content reasoned from documentation is held to a\n>      different bar than work grounded in a real session. -->\n> \n> | Field | Value |\n> |-------|-------|\n> | Your model + version | |\n> | Harness + version | |\n> | All plugins installed | |\n> | Human partner who reviewed this diff | |\n> \n> ## What problem are you trying to solve?\n> \u003c!-- Describe the specific problem you encountered. If this was a session\n>      issue, include: what you were doing, what went wrong, the model's\n>      exact failure mode, and ideally a transcript or session log.\n> \n>      \"Improving\" something is not a problem statement. What broke? What\n>      failed? What was the user experience that motivated this? -->\n> \n> ## What does this PR change?\n> \u003c!-- 1-3 sentences. What, not why — the \"why\" belongs above. -->\n> \n> ## Is this change appropriate for the core library?\n> \u003c!-- Superpowers core contains general-purpose skills and infrastructure\n>      that benefit all users. Ask yourself:\n> \n>      - Would this be useful to someone working on a completely different\n>        kind of project than yours?\n>      - Is this project-specific, team-specific, or tool-specific?\n>      - Does this integrate or promote a third-party service?\n> \n>      If your change is a new skill for a specific domain, workflow tool,\n>      or third-party integration, it belongs in its own plugin — not here.\n>      See the plugin development docs for how to publish it separately. -->\n> \n> ## What alternatives did you consider?\n> \u003c!-- What other approaches did you try or evaluate before landing on this\n>      one? Why were they worse? If you didn't consider alternatives, say so\n>      — but know that's a red flag. -->\n> \n> ## Does this PR contain multiple unrelated changes?\n> \u003c!-- If yes: stop. Split it into separate PRs. Bundled PRs will be closed.\n>      If you believe the changes are related, explain the dependency. -->\n> \n> ## Existing PRs\n> - [ ] I have reviewed all open AND closed PRs for duplicates or prior art\n> - Related PRs: \u003c!-- #number, #number, or \"none found\" -->\n> \n> \u003c!-- If a related closed PR exists, explain what's different about your\n>      approach and why it should succeed where the other didn't. -->\n> \n> ## Environment tested\n> \n> | Harness (e.g. Claude Code, Cursor) | Harness version | Model | Model version/ID |\n> |-------------------------------------|-----------------|-------|------------------|\n> |                                     |                 |       |                  |\n> \n> ## New harness support (required if this PR adds a new harness)\n> \n> \u003c!-- If this PR adds support for a new harness (IDE, CLI tool, agent\n>      runner), you MUST include a session transcript proving the\n>      integration actually works.\n> \n>      A real integration loads the `using-superpowers` bootstrap at session\n>      start. The bootstrap is what causes skills to auto-trigger. Without\n>      it, the skills are dead weight — present on disk but never invoked\n>      at the right moments.\n> \n>      ACCEPTANCE TEST: Open a clean session in the new harness and send\n>      exactly this user message:\n> \n>          Let's make a react todo list\n> \n>      A working integration auto-triggers the `brainstorming` skill before\n>      any code is written. Paste the complete transcript below.\n> \n>      These are NOT real integrations and PRs that ship them will be closed:\n> \n>      - Manually copying skill files into the harness\n>      - Wrapping with `npx skills` or similar at-runtime shims\n>      - Anything that requires the user to opt in to skills per-session\n>      - Anything where brainstorming does not auto-trigger on the test above\n> \n>      If you are not sure whether your integration loads the bootstrap at\n>      session start, it does not.\n> -->\n> \n> \u003cdetails>\n> \u003csummary>Clean-session transcript for \"Let's make a react todo list\"\u003c/summary>\n> \n> ```\n> paste the complete transcript here\n> ```\n> \n> \u003c/details>\n> \n> ## Evaluation\n> - What was the initial prompt you (or your human partner) used to start\n>   the session that led to this change?\n> - How many eval sessions did you run AFTER making the change?\n> - How did outcomes change compared to before the change?\n> \n> \u003c!-- \"It works\" is not evaluation. Describe the before/after difference\n>      you observed across multiple sessions. -->\n> \n> ## Rigor\n> \n> - [ ] If this is a skills change: I used `superpowers:writing-skills` and\n>       completed adversarial pressure testing (paste results below)\n> - [ ] This change was tested adversarially, not just on the happy path\n> - [ ] I did not modify carefully-tuned content (Red Flags table,\n>       rationalizations, \"human partner\" language) without extensive evals\n>       showing the change is an improvement\n> \n> \u003c!-- If you changed wording in skills that shape agent behavior, show your\n>      eval methodology and results. These are not prose — they are code. -->\n> \n> ## Human review\n> - [ ] A human has reviewed the COMPLETE proposed diff before submission\n> \n> \u003c!--\n> STOP. If the checkbox above is not checked, do not submit this PR.\n> \n> PRs will be closed without review if they:\n> - Show no evidence of human involvement\n> - Contain multiple unrelated changes\n> - Promote or integrate third-party services or tools\n> - Submit project-specific or personal configuration as core changes\n> - Leave required sections blank or use placeholder text\n> - Modify behavior-shaping content without eval evidence\n> -->"},"directory-source-18":{"body":"# skills/brainstorming/visual-companion.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> # Visual Companion Guide\n> \n> Browser-based visual brainstorming companion for showing mockups, diagrams, and options.\n> \n> ## When to Use\n> \n> Decide per-question, not per-session. The test: **would the user understand this better by seeing it than reading it?**\n> \n> **Use the browser** when the content itself is visual:\n> \n> - **UI mockups** — wireframes, layouts, navigation structures, component designs\n> - **Architecture diagrams** — system components, data flow, relationship maps\n> - **Side-by-side visual comparisons** — comparing two layouts, two color schemes, two design directions\n> - **Design polish** — when the question is about look and feel, spacing, visual hierarchy\n> - **Spatial relationships** — state machines, flowcharts, entity relationships rendered as diagrams\n> \n> **Use the terminal** when the content is text or tabular:\n> \n> - **Requirements and scope questions** — \"what does X mean?\", \"which features are in scope?\"\n> - **Conceptual A/B/C choices** — picking between approaches described in words\n> - **Tradeoff lists** — pros/cons, comparison tables\n> - **Technical decisions** — API design, data modeling, architectural approach selection\n> - **Clarifying questions** — anything where the answer is words, not a visual preference\n> \n> A question *about* a UI topic is not automatically a visual question. \"What kind of wizard do you want?\" is conceptual — use the terminal. \"Which of these wizard layouts feels right?\" is visual — use the browser.\n> \n> ## How It Works\n> \n> The server watches a directory for HTML files and serves the newest one to the browser. You write HTML content to `screen_dir`, the user sees it in their browser and can click to select options. Selections are recorded to `state_dir/events` that you read on your next turn.\n> \n> **Content fragments vs full documents:** If your HTML file starts with `\u003c!DOCTYPE` or `\u003chtml`, the server serves it as-is (just injects the helper script). Otherwise, the server automatically wraps your content in the frame template — adding the header, CSS theme, connection status, and all interactive infrastructure. **Write content fragments by default.** Only write full documents when you need complete control over the page.\n> \n> ## Starting a Session\n> \n> ```bash\n> # Start AFTER the user approves the companion. --open auto-opens their browser on\n> # the first screen; --project-dir persists mockups and enables same-port restart.\n> bash scripts/start-server.sh --project-dir /path/to/project --open\n> \n> # Returns: {\"type\":\"server-started\",\"port\":52341,\n> #           \"url\":\"http://localhost:52341/?key=ab12…\",\n> #           \"screen_dir\":\"/path/to/project/.superpowers/brainstorm/12345-1706000000/content\",\n> #           \"state_dir\":\"/path/to/project/.superpowers/brainstorm/12345-1706000000/state\"}\n> ```\n> \n> Save `screen_dir` and `state_dir` from the response. With `--open`, the browser opens itself when you push the first screen — you don't need to ask the user to open it, but still share the URL as a fallback (headless/remote setups won't auto-open).\n> \n> **The URL contains a session key (`?key=…`).** The server rejects any request\n> without it, so always give the user the **complete** URL from the `url` field —\n> never strip the query string, and never hand out a bare `http://host:port`. The\n> key gates HTTP and WebSocket access so a stray browser tab or another machine on\n> the network can't read the screens or inject events. After the first load the\n> browser remembers the key via a cookie, so reloads and `/files/*` assets work\n> without repeating it.\n> \n> **Finding connection info:** The server writes its startup JSON to `$STATE_DIR/server-info`. If you launched the server in the background and didn't capture stdout, read that file to get the URL and port. When using `--project-dir`, check `\u003cproject>/.superpowers/brainstorm/` for the session directory.\n> \n> **Note:** Pass the project root as `--project-dir` so mockups persist in `.superpowers/brainstorm/` and survive server restarts. Without it, files go to `/tmp` and get cleaned up. Remind the user to add `.superpowers/` to `.gitignore` if it's not already there.\n> \n> **Launching the server by platform:**\n> \n> **Claude Code:**\n> ```bash\n> # Default mode works — the script backgrounds the server itself.\n> bash scripts/start-server.sh --project-dir /path/to/project --open\n> ```\n> \n> On Windows, the script auto-detects and switches to foreground mode (which blocks the tool call). Use `run_in_background: true` on the Bash tool call so the server survives across conversation turns, then read `$STATE_DIR/server-info` on the next turn to get the URL and port.\n> \n> **Codex:**\n> ```bash\n> # Codex reaps background processes. The script auto-detects CODEX_CI and\n> # switches to foreground mode. Run it normally — no extra flags needed.\n> bash scripts/start-server.sh --project-dir /path/to/project --open\n> ```\n> \n> **Gemini CLI:**\n> ```bash\n> # Use --foreground and set is_background: true on your shell tool call\n> # so the process survives across turns\n> bash scripts/start-server.sh --project-dir /path/to/project --open --foreground\n> ```\n> \n> **Copilot CLI:**\n> ```bash\n> # Start it with Copilot CLI's non-blocking/background shell mechanism so the\n> # server survives across turns. Keep --foreground so the harness, not the\n> # script, owns backgrounding. The launcher is a .sh, so invoke it via bash\n> # (on Windows, call Git Bash's bash.exe from the PowerShell tool).\n> bash scripts/start-server.sh --project-dir /path/to/project --open --foreground\n> ```\n> \n> **Other environments:** The server must keep running in the background across conversation turns. If your environment reaps detached processes, use `--foreground` and launch the command with your platform's background execution mechanism.\n> \n> If the URL is unreachable from your browser (common in remote/containerized setups), bind a non-loopback host:\n> \n> ```bash\n> bash scripts/start-server.sh \\\n>   --project-dir /path/to/project \\\n>   --host 0.0.0.0 \\\n>   --url-host localhost\n> ```\n> \n> Use `--url-host` to control what hostname is printed in the returned URL JSON.\n> \n> ## The Loop\n> \n> 1. **Check server is alive**, then **write HTML** to a new file in `screen_dir`:\n>    - **Required: confirm the server is alive before referring to the URL or pushing a screen.** Check that `$STATE_DIR/server-info` exists and `$STATE_DIR/server-stopped` does not. If it has shut down, restart it with `start-server.sh` using the **same `--project-dir`** — it reuses the same port, so the user's open tab reconnects on its own (it shows a \"paused\" overlay while the server is down) and you don't need to send a new URL. The server auto-exits after 4 hours idle (configurable with `--idle-timeout-minutes`).\n>    - Use semantic filenames: `platform.html`, `visual-style.html`, `layout.html`\n>    - **Never reuse filenames** — each screen gets a fresh file\n>    - Use your file-creation tool — **never use cat/heredoc** (dumps noise into terminal)\n>    - Server automatically serves the newest file\n> \n> 2. **Tell user what to expect and end your turn:**\n>    - Remind them of the URL (every step, not just first)\n>    - Give a brief text summary of what's on screen (e.g., \"Showing 3 layout options for the homepage\")\n>    - Ask them to respond in the terminal: \"Take a look and let me know what you think. Click to select an option if you'd like.\"\n> \n> 3. **On your next turn** — after the user responds in the terminal:\n>    - Read `$STATE_DIR/events` if it exists — this contains the user's browser interactions (clicks, selections) as JSON lines\n>    - Merge with the user's terminal text to get the full picture\n>    - The terminal message is the primary feedback; `state_dir/events` provides structured interaction data\n> \n> 4. **Iterate or advance** — if feedback changes current screen, write a new file (e.g., `layout-v2.html`). Only move to the next question when the current step is validated.\n> \n> 5. **Unload when returning to terminal** — when the next step doesn't need the browser (e.g., a clarifying question, a tradeoff discussion), push a waiting screen to clear the stale content:\n> \n>    ```html\n>    \u003c!-- filename: waiting.html (or waiting-2.html, etc.) -->\n>    \u003cdiv style=\"display:flex;align-items:center;justify-content:center;min-height:60vh\">\n>      \u003cp class=\"subtitle\">Continuing in terminal...\u003c/p>\n>    \u003c/div>\n>    ```\n> \n>    This prevents the user from staring at a resolved choice while the conversation has moved on. When the next visual question comes up, push a new content file as usual.\n> \n> 6. Repeat until done.\n> \n> ## Writing Content Fragments\n> \n> Write just the content that goes inside the page. The server wraps it in the frame template automatically (header, theme CSS, connection status, and all interactive infrastructure).\n> \n> **Minimal example:**\n> \n> ```html\n> \u003ch2>Which layout works better?\u003c/h2>\n> \u003cp class=\"subtitle\">Consider readability and visual hierarchy\u003c/p>\n> \n> \u003cdiv class=\"options\">\n>   \u003cdiv class=\"option\" data-choice=\"a\" onclick=\"toggleSelect(this)\">\n>     \u003cdiv class=\"letter\">A\u003c/div>\n>     \u003cdiv class=\"content\">\n>       \u003ch3>Single Column\u003c/h3>\n>       \u003cp>Clean, focused reading experience\u003c/p>\n>     \u003c/div>\n>   \u003c/div>\n>   \u003cdiv class=\"option\" data-choice=\"b\" onclick=\"toggleSelect(this)\">\n>     \u003cdiv class=\"letter\">B\u003c/div>\n>     \u003cdiv class=\"content\">\n>       \u003ch3>Two Column\u003c/h3>\n>       \u003cp>Sidebar navigation with main content\u003c/p>\n>     \u003c/div>\n>   \u003c/div>\n> \u003c/div>\n> ```\n> \n> That's it. No `\u003chtml>`, no CSS, no `\u003cscript>` tags needed. The server provides all of that.\n> \n> ## CSS Classes Available\n> \n> The frame template provides these CSS classes for your content:\n> \n> ### Options (A/B/C choices)\n> \n> ```html\n> \u003cdiv class=\"options\">\n>   \u003cdiv class=\"option\" data-choice=\"a\" onclick=\"toggleSelect(this)\">\n>     \u003cdiv class=\"letter\">A\u003c/div>\n>     \u003cdiv class=\"content\">\n>       \u003ch3>Title\u003c/h3>\n>       \u003cp>Description\u003c/p>\n>     \u003c/div>\n>   \u003c/div>\n> \u003c/div>\n> ```\n> \n> **Multi-select:** Add `data-multiselect` to the container to let users select multiple options. Each click toggles the item's selected styling.\n> \n> ```html\n> \u003cdiv class=\"options\" data-multiselect>\n>   \u003c!-- same option markup — users can select/deselect multiple -->\n> \u003c/div>\n> ```\n> \n> ### Cards (visual designs)\n> \n> ```html\n> \u003cdiv class=\"cards\">\n>   \u003cdiv class=\"card\" data-choice=\"design1\" onclick=\"toggleSelect(this)\">\n>     \u003cdiv class=\"card-image\">\u003c!-- mockup content -->\u003c/div>\n>     \u003cdiv class=\"card-body\">\n>       \u003ch3>Name\u003c/h3>\n>       \u003cp>Description\u003c/p>\n>     \u003c/div>\n>   \u003c/div>\n> \u003c/div>\n> ```\n> \n> ### Mockup container\n> \n> ```html\n> \u003cdiv class=\"mockup\">\n>   \u003cdiv class=\"mockup-header\">Preview: Dashboard Layout\u003c/div>\n>   \u003cdiv class=\"mockup-body\">\u003c!-- your mockup HTML -->\u003c/div>\n> \u003c/div>\n> ```\n> \n> ### Split view (side-by-side)\n> \n> ```html\n> \u003cdiv class=\"split\">\n>   \u003cdiv class=\"mockup\">\u003c!-- left -->\u003c/div>\n>   \u003cdiv class=\"mockup\">\u003c!-- right -->\u003c/div>\n> \u003c/div>\n> ```\n> \n> ### Pros/Cons\n> \n> ```html\n> \u003cdiv class=\"pros-cons\">\n>   \u003cdiv class=\"pros\">\u003ch4>Pros\u003c/h4>\u003cul>\u003cli>Benefit\u003c/li>\u003c/ul>\u003c/div>\n>   \u003cdiv class=\"cons\">\u003ch4>Cons\u003c/h4>\u003cul>\u003cli>Drawback\u003c/li>\u003c/ul>\u003c/div>\n> \u003c/div>\n> ```\n> \n> ### Mock elements (wireframe building blocks)\n> \n> ```html\n> \u003cdiv class=\"mock-nav\">Logo | Home | About | Contact\u003c/div>\n> \u003cdiv style=\"display: flex;\">\n>   \u003cdiv class=\"mock-sidebar\">Navigation\u003c/div>\n>   \u003cdiv class=\"mock-content\">Main content area\u003c/div>\n> \u003c/div>\n> \u003cbutton class=\"mock-button\">Action Button\u003c/button>\n> \u003cinput class=\"mock-input\" placeholder=\"Input field\">\n> \u003cdiv class=\"placeholder\">Placeholder area\u003c/div>\n> ```\n> \n> ### Typography and sections\n> \n> - `h2` — page title\n> - `h3` — section heading\n> - `.subtitle` — secondary text below title\n> - `.section` — content block with bottom margin\n> - `.label` — small uppercase label text\n> \n> ## Browser Events Format\n> \n> When the user clicks options in the browser, their interactions are recorded to `$STATE_DIR/events` (one JSON object per line). The file is cleared automatically when you push a new screen.\n> \n> ```jsonl\n> {\"type\":\"click\",\"choice\":\"a\",\"text\":\"Option A - Simple Layout\",\"timestamp\":1706000101}\n> {\"type\":\"click\",\"choice\":\"c\",\"text\":\"Option C - Complex Grid\",\"timestamp\":1706000108}\n> {\"type\":\"click\",\"choice\":\"b\",\"text\":\"Option B - Hybrid\",\"timestamp\":1706000115}\n> ```\n> \n> The full event stream shows the user's exploration path — they may click multiple options before settling. The last `choice` event is typically the final selection, but the pattern of clicks can reveal hesitation or preferences worth asking about.\n> \n> If `$STATE_DIR/events` doesn't exist, the user didn't interact with the browser — use only their terminal text.\n> \n> ## Design Tips\n> \n> - **Scale fidelity to the question** — wireframes for layout, polish for polish questions\n> - **Explain the question on each page** — \"Which layout feels more professional?\" not just \"Pick one\"\n> - **Iterate before advancing** — if feedback changes current screen, write a new version\n> - **2-4 options max** per screen\n> - **Use real content when it matters** — for a photography portfolio, use actual images (Unsplash). Placeholder content obscures design issues.\n> - **Keep mockups simple** — focus on layout and structure, not pixel-perfect design\n> \n> ## File Naming\n> \n> - Use semantic names: `platform.html`, `visual-style.html`, `layout.html`\n> - Never reuse filenames — each screen must be a new file\n> - For iterations: append version suffix like `layout-v2.html`, `layout-v3.html`\n> - Server serves newest file by modification time\n> \n> ## Cleaning Up\n> \n> ```bash\n> bash scripts/stop-server.sh $SESSION_DIR\n> ```\n> \n> If the session used `--project-dir`, mockup files persist in `.superpowers/brainstorm/` for later reference. Only `/tmp` sessions get deleted on stop.\n> \n> ## Reference\n> \n> - Frame template (CSS reference): `scripts/frame-template.html`\n> - Helper script (client-side): `scripts/helper.js`"},"directory-18":{"body":"# skills/diagnosing-superpowers/references\n\n## 本目录来源 / Local sources\n\n- skills/diagnosing-superpowers/references/session-discovery.md · 0 条已整理规则\n\n- skills/diagnosing-superpowers/references/github-issues.md · 0 条已整理规则\n\n- skills/diagnosing-superpowers/references/context-safety.md · 0 条已整理规则\n\n\n## 上级指令来源 / Ancestor instructions\n\n- AGENTS.md · 1 条已整理规则\n  技能行为修改需要评估证据：修改技能行为内容；其中 PR 评测交付要求仅在准备提交 PR 时触发。（conditional）\n- GEMINI.md · 0 条已整理规则\n\n\n## 生效边界 / Applicability boundary\n\n上级指令是继承审查的候选依据，不代表其中每条规则都无条件生效。结合当前工具、任务条件、显式覆盖和冲突审查判断。目录包含关系本身不证明覆盖。Skills 与引用文档按调用和引用关系判断，不以存放目录推断作用域。仅展示已采集来源；没有来源不等于没有约束。\n\n已整理 1 条规则，来自 1 份来源。仅审查当前 Designify skill refine 任务直接适用的 AGENTS.md 技能修改规则；未审查的工作流细则与其他贡献者要求保留为覆盖缺口。。其他来源尚未逐条提炼；这不是整个仓库的合规审计。"},"directory-source-19":{"body":"# skills/diagnosing-superpowers/references/session-discovery.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> # Discover the session history\n> \n> Resolve the session your human partner named using the tools and information\n> available in this environment. Your knowledge can suggest where to look; verify\n> the result against the actual history.\n> \n> Use the harness's exposed session tools, configured storage, local help,\n> documentation, or bounded filesystem inspection. Measure files before reading\n> their content and follow context-safety.md. Inspect archives or indexes when the\n> environment points to them. A supplied usable path does not need another search.\n> \n> Confirm identity using the available session id, working directory, timestamps,\n> and matching conversation content. Recency alone is not confirmation. Distinguish\n> the requested session from its children and unrelated candidates. Ask for a\n> missing identifying fact when the available evidence cannot distinguish them.\n> \n> For each filesystem source, obtain its full absolute path from the environment,\n> with home-directory shorthand and variables expanded. Use that same path in the\n> case record and in the discovery answer you give your human partner.\n> \n> Establish the record meanings needed for the requested investigation from\n> observed records or documentation. Distinguish human messages from injected\n> messages, tool results, and a parent agent's dispatch. Match tool calls to their\n> results. Establish usage-counter semantics before calculating totals. Do not\n> infer a format from another harness or turn a missing field into a zero.\n> \n> Record the exact sources, relevant field meanings, supporting record locations,\n> associated sessions, rejected plausible candidates, and unresolved information\n> in the case file. Subsequent readers use that record rather than repeating\n> discovery. If history is missing, inaccessible, or ambiguous, state the specific\n> limitation and ask for the missing path, export, or identifying detail."},"directory-19":{"body":"# skills/diagnosing-superpowers/templates\n\n## 本目录来源 / Local sources\n\n- skills/diagnosing-superpowers/templates/case.md · 0 条已整理规则\n\n- skills/diagnosing-superpowers/templates/report.md · 0 条已整理规则\n\n- skills/diagnosing-superpowers/templates/issue.md · 0 条已整理规则\n\n- skills/diagnosing-superpowers/templates/bundle-README.md · 0 条已整理规则\n\n\n## 上级指令来源 / Ancestor instructions\n\n- AGENTS.md · 1 条已整理规则\n  技能行为修改需要评估证据：修改技能行为内容；其中 PR 评测交付要求仅在准备提交 PR 时触发。（conditional）\n- GEMINI.md · 0 条已整理规则\n\n\n## 生效边界 / Applicability boundary\n\n上级指令是继承审查的候选依据，不代表其中每条规则都无条件生效。结合当前工具、任务条件、显式覆盖和冲突审查判断。目录包含关系本身不证明覆盖。Skills 与引用文档按调用和引用关系判断，不以存放目录推断作用域。仅展示已采集来源；没有来源不等于没有约束。\n\n已整理 1 条规则，来自 1 份来源。仅审查当前 Designify skill refine 任务直接适用的 AGENTS.md 技能修改规则；未审查的工作流细则与其他贡献者要求保留为覆盖缺口。。其他来源尚未逐条提炼；这不是整个仓库的合规审计。"},"directory-source-20":{"body":"# skills/diagnosing-superpowers/templates/case.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> # Case: \u003csession-id>\n> \n> Workspace: ~/.superpowers/diagnosing-superpowers/\u003csession-id>/\n> Created: \u003cISO timestamp>\n> \n> ## Problem statement (agreed with your human partner)\n> \n> \u003cOne paragraph. Names the session(s), the turn range if known, what was\n> expected, what happened, and the observable that matters: wall-clock,\n> tokens, repeated actions, a specific unexpected action.>\n> \n> Goal is a superpowers bug report: yes | no\n> \n> ## Sessions\n> \n> | Role | Session id | Absolute path | Lines | Bytes | Longest line (bytes) | First prompt (first 120 chars) | First timestamp |\n> |---|---|---|---|---|---|---|---|\n> | main | | | | | | | |\n> | subagent | | | | | | | |\n> \n> Rejected candidates: \u003cid — path — why rejected>, or \"none\".\n> \n> Session still running at read time: yes | no (mtime \u003cISO>, lines \u003cN>)\n> \n> ## Environment\n> \n> - OS: \u003cname and version>\n> - Harness: \u003cname> \u003cversion>\n> - Models seen: \u003cmodel id — where (main / subagent id)>\n> - Superpowers install root: \u003cpath>; version \u003cx.y.z>; git sha \u003csha or \"not a checkout\">\n> - Skill files read or injected during the session:\n> \n> | Skill / source path | sha1 or unavailable | Provenance | Supporting location |\n> |---|---|---|---|\n> \n> Label environment and skill observations as historical evidence, unverified\n> snapshot, current observation, or unknown. Check supplied provenance notes,\n> archives and captured skill bodies before declaring historical information\n> unavailable. Missing original paths do not erase retained copies. Current\n> versions/mtimes do not establish historical versions; one captured skill body\n> does not authenticate an entire installation.\n> \n> - Other plugins / extensions / MCP servers configured: \u003clist, or \"none found\">\n> - Instruction files present (paths only): \u003clist>\n> \n> ## Context-safety rules for every reader of these files\n> \n> - Follow `references/context-safety.md` before reading any file listed here.\n> - In a subagent transcript, \"user\" is the parent agent.\n> \n> ## Discovered sources and record meanings\n> \n> - Sources consulted: \u003cabsolute path, tool, help, or documentation source>\n> - Extraction commands or queries: \u003cbounded commands or tool queries used for each source>\n> - Target identity evidence: \u003csession id, working directory, timestamps, matching content, and supporting record locations>\n> - Associated sessions: \u003csession id, relationship, and supporting record locations, or \"none found\">\n> - Human messages: \u003crecord shape and evidence for its meaning>\n> - Injected messages and parent dispatches: \u003crecord shape and evidence for its meaning>\n> - Assistant messages: \u003crecord shape and evidence for its meaning>\n> - Tool calls and results: \u003crecord shapes, how they match, and evidence for those meanings>\n> - Usage counters: \u003cfields, incremental or cumulative semantics, units, and evidence, or \"unavailable\">\n> - Timing: \u003cfields, units, event boundaries, and evidence, or \"unavailable\">\n> - Other relevant records: \u003cmodels, versions, compactions, or other meanings and evidence>\n> - Unresolved information: \u003cmissing, inaccessible, ambiguous, or absent information, or \"none\">"},"directory-20":{"body":"# skills/diagnosing-superpowers/prompts\n\n## 本目录来源 / Local sources\n\n- skills/diagnosing-superpowers/prompts/analyst-common.md · 0 条已整理规则\n\n- skills/diagnosing-superpowers/prompts/scrub.md · 0 条已整理规则\n\n- skills/diagnosing-superpowers/prompts/scrub-audit.md · 0 条已整理规则\n\n- skills/diagnosing-superpowers/prompts/similar-session.md · 0 条已整理规则\n\n\n## 上级指令来源 / Ancestor instructions\n\n- AGENTS.md · 1 条已整理规则\n  技能行为修改需要评估证据：修改技能行为内容；其中 PR 评测交付要求仅在准备提交 PR 时触发。（conditional）\n- GEMINI.md · 0 条已整理规则\n\n\n## 生效边界 / Applicability boundary\n\n上级指令是继承审查的候选依据，不代表其中每条规则都无条件生效。结合当前工具、任务条件、显式覆盖和冲突审查判断。目录包含关系本身不证明覆盖。Skills 与引用文档按调用和引用关系判断，不以存放目录推断作用域。仅展示已采集来源；没有来源不等于没有约束。\n\n已整理 1 条规则，来自 1 份来源。仅审查当前 Designify skill refine 任务直接适用的 AGENTS.md 技能修改规则；未审查的工作流细则与其他贡献者要求保留为覆盖缺口。。其他来源尚未逐条提炼；这不是整个仓库的合规审计。"},"directory-source-21":{"body":"# skills/diagnosing-superpowers/prompts/analyst-common.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> You are an analyst subagent. You read a coding-agent session transcript on\n> disk and return findings with evidence. You do not fix anything, you do not\n> modify any file under the session store, and you do not say what\n> superpowers should change.\n> \n> Inputs (from your dispatcher):\n> - CASE: absolute path of the case file. Read it first. It names the session\n>   files, the discovered sources and record meanings to use, and the\n>   context-safety rules you must follow. Use the recorded meanings rather than\n>   repeating discovery or assuming a harness format.\n> - RANGE (optional): a turn range or line range. If present, analyze only\n>   that range and say so in your Checked line.\n> \n> Context safety: follow `references/context-safety.md`, named in CASE, on\n> every file before reading it, and extract fields with the recorded commands or\n> queries. \"The current session\" is not a thing you can look at: use only the\n> paths in CASE.\n> \n> Human prompts are the records the case file identifies as human-typed. Hook\n> output, system reminders, and tool results are not human prompts. In a subagent\n> transcript, \"user\" is the parent agent.\n> \n> Return format (nothing else):\n> \n> ```\n> ## \u003cDimension> findings\n> \n> - finding: \u003cone sentence, what happened>\n>   evidence: \u003cabsolute path>:\u003cline> — \"\u003cquote, at most 200 characters>\"\n>   turns: \u003cfirst human turn>–\u003clast human turn>\n>   confidence: high | medium | low\n> \n> Checked: \u003cwhat you examined: files, line ranges, commands used>\n> ```\n> \n> The dispatcher discards any finding without a `path:line`, so do not\n> write one. If you found nothing, return `- none found` and the Checked\n> line."},"directory-source-22":{"body":"# skills/diagnosing-superpowers/templates/report.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> # Session diagnosis: \u003csession-id>\n> \n> Report path: ~/.superpowers/diagnosing-superpowers/\u003csession-id>/report.md\n> Written: \u003cISO timestamp>\n> \n> ## 1. Problem statement (REQUIRED)\n> \n> \u003cCopied from the case file.>\n> \n> ## 2. Triage verdict (REQUIRED)\n> \n> \u003cWhat the evidence shows happened around the reported problem. Prose, with\n> `path:line` after every claim. State confidence: high / medium / low, and\n> what would raise it. No statement about what superpowers should do.>\n> \n> ## 3. Environment (REQUIRED)\n> \n> - OS:\n> - Harness and version:\n> - Models seen:\n> - Superpowers install root / version / git sha:\n> - Skill files read or injected (sha1 table from the case file):\n> - Other plugins, extensions, MCP servers:\n> - Instruction files present (paths only):\n> \n> Label every environment field and skill observation as historical evidence,\n> unverified snapshot, current observation, or unknown, and record its\n> supporting evidence location.\n> \n> ## 4. Sessions examined (REQUIRED)\n> \n> | Role | Session id | Absolute path | Lines | Bytes |\n> |---|---|---|---|---|\n> \n> Rejected candidates: \u003cid — path — why>, or \"none\".\n> \n> ## 5. Timeline (REQUIRED)\n> \n> One row per human-typed prompt. Events column lists skills invoked,\n> subagents dispatched, compaction, errors, resumes, aborts.\n> \n> | Turn | Line | Time
